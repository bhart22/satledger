                    </div>
                    {vaultError && <div style={{color:'var(--red)',fontSize:'.8125rem',fontWeight:600,marginTop:'1rem'}}>{vaultError}</div>}
                  </div>
                )}

                {vault && vaultUnlocked && !vaultEmergencyMode && (
                  <>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:'1rem',flexWrap:'wrap',marginBottom:'1rem'}}>
                      <div style={{fontSize:'.8125rem',color:'var(--text-secondary)'}}>
                        Unlocked only for this session. Reload or use Lock Vault to clear decrypted contents from memory.
                      </div>
                      <div style={{display:'flex',gap:'.5rem',flexWrap:'wrap'}}>
                        <button className="btn btn-secondary btn-sm" onClick={()=>setVaultEmergencyMode(true)}>Emergency Read View</button>
                        <button className="btn btn-secondary btn-sm" onClick={lockVault}>{Icon.Lock({width:12,height:12})} Lock Vault</button>
                      </div>
                    </div>
                    {vaultSectionDefs.map(section => (
                      <div key={section.key} className="form-group" style={{marginBottom:'1rem'}}>
                        <label className="form-label" htmlFor={`vault-edit-${section.key}`}>{section.title}</label>
                        <textarea id={`vault-edit-${section.key}`}
                          className="form-input"
                          rows={section.key==='recoverySteps' ? 6 : 4}
                          placeholder={section.placeholder}
                          value={vaultDraft[section.key]}
                          onChange={e=>setVaultDraft(prev => ({...prev, [section.key]: e.target.value}))}
                          style={{width:'100%',resize:'vertical',minHeight:section.key==='recoverySteps'?140:110,lineHeight:1.6}}
                        />
                      </div>
                    ))}
                    <div className="card" style={{marginTop:'1.25rem',marginBottom:'1rem',borderStyle:'dashed'}}>
                      <div className="card-header"><div className="card-title">Change Vault Passphrase</div></div>
                      <div className="card-body" style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:'1rem'}}>
                        <div className="form-group" style={{marginBottom:0}}>
                          <label className="form-label" htmlFor="vault-current-pass">Current Passphrase</label>
                          <input id="vault-current-pass" type="password" autoComplete="off" className="form-input" value={vaultCurrentPassphrase} onChange={e=>setVaultCurrentPassphrase(e.target.value)} placeholder="Current passphrase"/>
                        </div>
                        <div className="form-group" style={{marginBottom:0}}>
                          <label className="form-label" htmlFor="vault-new-pass">New Passphrase</label>
                          <input id="vault-new-pass" type="password" autoComplete="off" className="form-input" value={vaultNewPassphrase} onChange={e=>setVaultNewPassphrase(e.target.value)} placeholder="New passphrase"/>
                        </div>
                        <div className="form-group" style={{marginBottom:0}}>
                          <label className="form-label" htmlFor="vault-new-confirm">Confirm New Passphrase</label>
                          <input id="vault-new-confirm" type="password" autoComplete="off" className="form-input" value={vaultNewPassphraseConfirm} onChange={e=>setVaultNewPassphraseConfirm(e.target.value)} placeholder="Re-enter new passphrase"/>
                        </div>
                      </div>
                      <div className="modal-footer" style={{borderTop:'1px solid var(--border-color)'}}>
                        <button className="btn btn-secondary" onClick={handleChangeVaultPassphrase} disabled={vaultBusy}>Change Passphrase</button>
                      </div>
                    </div>
                    {vaultError && <div style={{color:'var(--red)',fontSize:'.8125rem',fontWeight:600,marginBottom:'1rem'}}>{vaultError}</div>}
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:'1rem',flexWrap:'wrap'}}>
                      <button className="btn btn-primary" onClick={handleSaveVault} disabled={vaultBusy}>
                        {vaultBusy ? 'Saving…' : 'Save Encrypted Vault'}
                      </button>
                      <button className="btn btn-danger" onClick={handleDeleteVault}>
                        {Icon.Trash({width:13,height:13})} Delete Vault
                      </button>
                    </div>
                  </>
                )}

                {vault && vaultUnlocked && vaultEmergencyMode && (
                  <>
                    <div style={{background:'rgba(217,119,6,.08)',border:'1px solid #d97706',borderRadius:12,padding:'1rem 1.25rem',marginBottom:'1rem',display:'flex',justifyContent:'space-between',alignItems:'center',gap:'1rem',flexWrap:'wrap'}}>
                      <div>
                        <div style={{fontWeight:700,color:'#d97706',marginBottom:'.25rem'}}>Emergency Mode</div>
                        <div style={{fontSize:'.8125rem',color:'var(--text-secondary)',lineHeight:1.7}}>
                          Read-only inheritance view. Use this when someone needs the instructions without editing them.
                        </div>
                      </div>
                      <div style={{display:'flex',gap:'.5rem',flexWrap:'wrap'}}>
                        <button className="btn btn-secondary btn-sm" onClick={()=>setVaultEmergencyMode(false)}>Back to Edit View</button>
                        <button className="btn btn-secondary btn-sm" onClick={lockVault}>{Icon.Lock({width:12,height:12})} Lock Vault</button>
                      </div>
                    </div>
                    {vaultSectionDefs.filter(section => String(vaultDraft[section.key]||'').trim()).map(section => (
                      <div key={section.key} className="card" style={section.key==='warnings'?{borderColor:'#d97706'}:{}}>
                        <div className="card-header">
                          <div className="card-title" style={section.key==='warnings'?{color:'#d97706'}:{}}>{section.title}</div>
                        </div>
                        <div className="card-body" style={{whiteSpace:'pre-wrap',lineHeight:1.8,fontSize:'.9375rem'}}>
                          {vaultDraft[section.key]}
                        </div>
                      </div>
                    ))}
                  </>
                )}
              </div>
            </div>
          </>
        )}

        {/* ── HARVEST ── */}
        {tab==='harvest' && (() => {
          const names = wallets.map(w => w.name);
          // '' is the overview of every wallet; picking a wallet drills into its lots
          const wallet = names.includes(harvestWalletPick) ? harvestWalletPick : '';
          const priceText = harvestPricePick !== null ? harvestPricePick : (btcPrice ? String(Math.round(btcPrice*100)/100) : '');
          const price = numOr(priceText, 0);
          const nowMs = Date.now();
          const built = buildLots(transactions, { prices: historicalPrices, methodFor: w => lotMethodFor(wallets, w) });
          const all = harvestSummaryAll(built.lots, { price, nowMs, methodFor: w => lotMethodFor(wallets, w) });
          const { rows, summary } = wallet ? harvestLots(built.lots, { wallet, price, nowMs }) : { rows: [], summary: null };
          const fmtLotAt = ms => { const iso = new Date(ms).toISOString(); return fmtTxDate({ date: iso.slice(0,10), datetimeUtc: iso }); };
          const exportList = () => {
            const csv = harvestCsv(rows, { wallet, price, generatedAtMs: Date.now() });
            downloadBlob(new Blob([csv], {type:'text/csv'}), `harvest-${String(wallet).replace(/[^\w-]+/g,'_')}-${todayLocal()}.csv`);
            showToast(`Exported ${rows.length} lot${rows.length===1?'':'s'}`);
          };
          const exportSummary = () => {
            downloadBlob(new Blob([harvestSummaryCsv(all, { price, generatedAtMs: Date.now() })], {type:'text/csv'}), `harvest-summary-all-wallets-${todayLocal()}.csv`);
            showToast('Exported the total summary');
          };
          const lossColor = v => v > 0 ? 'var(--red)' : undefined;
          const stat = s => (
            <div className="stats-grid">
              <div className="stat-card"><div className="stat-label">Lots to sell</div><div className="stat-value" style={{fontSize:'1.375rem'}}>{s.lotCount}</div>
                <div className="stat-sub">{s.estimatedLots ? `${s.estimatedLots} with an estimated basis` : 'no estimated lots'}</div></div>
              <div className="stat-card"><div className="stat-label">BTC to sell</div><div className="stat-value btc" style={{fontSize:'1.375rem'}}>{(s.totalSats/1e8).toFixed(8)}</div>
                <div className="stat-sub">{s.totalSats.toLocaleString('en-US')} sats</div></div>
              <div className="stat-card"><div className="stat-label">Total basis</div><div className="stat-value" style={{fontSize:'1.375rem'}}>{fmtUSD(s.totalBasisUsd)}</div></div>
              <div className="stat-card"><div className="stat-label">Est. loss</div><div className="stat-value" style={{fontSize:'1.375rem',color:lossColor(s.totalLossUsd)}}>{fmtUSD(s.totalLossUsd)}</div>
                <div className="stat-sub">LT {fmtUSD(s.ltLossUsd)} · ST {fmtUSD(s.stLossUsd)}</div></div>
            </div>
          );
          return (<>
            <div className="card">
              <div className="card-header"><div className="card-title">Tax-loss harvest</div></div>
              <div className="card-body">
                <div className="form-grid">
                  <div className="form-group">
                    <label className="form-label" htmlFor="harvest-wallet">View</label>
                    <select id="harvest-wallet" className="form-select" value={wallet} onChange={e=>setHarvestWalletPick(e.target.value)}>
                      <option value="">All wallets — summary</option>
                      {wallets.map(w => <option key={w.id||w.name} value={w.name}>{w.name}{w.archived?' (archived)':''}</option>)}
                    </select>
                  </div>
                  <div className="form-group">
                    <label className="form-label" htmlFor="harvest-price">BTC price (USD)</label>
                    <input id="harvest-price" className="form-input" type="number" min="0" step="any" value={priceText} onChange={e=>setHarvestPricePick(e.target.value)}/>
                    {harvestPricePick !== null && btcPrice ? <button type="button" className="btn btn-secondary btn-sm" style={{marginTop:'.375rem'}} onClick={()=>setHarvestPricePick(null)}>Use current price</button> : null}
                  </div>
                </div>
                <div style={{fontSize:'.75rem',color:'var(--text-secondary)',lineHeight:1.6,marginTop:'.5rem'}}>
                  {wallet
                    ? <>Lots in {wallet} that cost more per BTC than the price above, highest cost first. Lots with no known basis are left out. {wallet} disposes lots {lotMethodFor(wallets, wallet)}. Long term means held more than one year from the acquisition time, as of now.</>
                    : <>Every wallet at the price above. Pick a wallet to see its lots and export an identification list. Lots with no known basis are left out; long term means held more than one year, as of now.</>}
                </div>
              </div>
            </div>

            {!wallet ? (<>
              {stat(all.total)}
              <div className="card">
                <div className="card-header">
                  <div className="card-title">Total summary — all wallets</div>
                  <button className="btn btn-secondary btn-sm" disabled={!all.wallets.length || !price} onClick={exportSummary} style={{display:'inline-flex',alignItems:'center',gap:'.375rem'}}>
                    {Icon.Download({width:13,height:13})} Export summary
                  </button>
                </div>
                <div className="card-body" style={{padding:0}}>
                  {!price ? <div style={{padding:'1.5rem',color:'var(--text-secondary)'}}>Enter a BTC price to see the summary.</div>
                  : !all.wallets.length ? <div style={{padding:'1.5rem',color:'var(--text-secondary)'}}>No wallet holds any BTC.</div>
                  : (
                    <div className="table-wrap" id="harvest-total-table">
                      <table>
                        <thead><tr>
                          <th>Wallet</th><th>Method</th><th>Held BTC</th><th>Lots under water</th><th>BTC to sell</th><th>Basis</th><th>Est. loss</th><th>LT loss</th><th>ST loss</th><th></th>
                        </tr></thead>
                        <tbody>
                          {all.wallets.map(w => (
                            <tr key={w.wallet} onClick={()=>setHarvestWalletPick(w.wallet)} style={{cursor:'pointer',opacity:w.lotCount?1:.6}}>
                              <td style={{fontWeight:600}}>{w.wallet}</td><td>{w.method}</td>
                              <td className="mono">{(w.heldSats/1e8).toFixed(8)}</td>
                              <td className="mono">{w.lotCount}</td>
                              <td className="mono">{(w.totalSats/1e8).toFixed(8)}</td>
                              <td className="mono">{fmtUSD(w.totalBasisUsd)}</td>
                              <td className="mono" style={{color:lossColor(w.totalLossUsd)}}>{fmtUSD(w.totalLossUsd)}</td>
                              <td className="mono">{fmtUSD(w.ltLossUsd)}</td>
                              <td className="mono">{fmtUSD(w.stLossUsd)}</td>
                              <td><button type="button" className="btn btn-secondary btn-sm" onClick={e=>{e.stopPropagation();setHarvestWalletPick(w.wallet);}}>View lots</button></td>
                            </tr>
                          ))}
                          <tr style={{fontWeight:700}}>
                            <td>Total</td><td></td>
                            <td className="mono">{(all.total.heldSats/1e8).toFixed(8)}</td>
                            <td className="mono">{all.total.lotCount}</td>
                            <td className="mono">{(all.total.totalSats/1e8).toFixed(8)}</td>
                            <td className="mono">{fmtUSD(all.total.totalBasisUsd)}</td>
                            <td className="mono" style={{color:lossColor(all.total.totalLossUsd)}}>{fmtUSD(all.total.totalLossUsd)}</td>
                            <td className="mono">{fmtUSD(all.total.ltLossUsd)}</td>
                            <td className="mono">{fmtUSD(all.total.stLossUsd)}</td>
                            <td></td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  )}
                  <div style={{fontSize:'.75rem',color:'var(--text-secondary)',lineHeight:1.6,padding:'.75rem 1rem'}}>
                    Lots are tracked per wallet, so each row uses its own wallet's method; this is a summary, not one combined pool.
                    {all.total.noBasisSats > 0 ? ` ${(all.total.noBasisSats/1e8).toFixed(8)} BTC across all wallets has no known basis and is never counted as a loss.` : ''}
                  </div>
                </div>
              </div>
            </>) : (<>
              <div>
                <button type="button" id="harvest-back" className="btn btn-secondary btn-sm" onClick={()=>setHarvestWalletPick('')}>← All wallets</button>
              </div>
              {stat({ ...summary, totalBasisUsd: summary.totalBasisUsd, totalLossUsd: summary.totalLossUsd, ltLossUsd: summary.longTerm.lossUsd, stLossUsd: summary.shortTerm.lossUsd })}
              <div className="card">
                <div className="card-header">
                  <div className="card-title">Lots in {wallet}</div>
                  <button className="btn btn-primary btn-sm" disabled={!rows.length} onClick={exportList} style={{display:'inline-flex',alignItems:'center',gap:'.375rem'}}>
                    {Icon.Download({width:13,height:13})} Export identification list
                  </button>
                </div>
                <div className="card-body" style={{padding:0}}>
                  {!price ? <div style={{padding:'1.5rem',color:'var(--text-secondary)'}}>Enter a BTC price to see which lots are under water.</div>
                  : !rows.length ? <div style={{padding:'1.5rem',color:'var(--text-secondary)'}}>No lots in {wallet} cost more than {fmtUSD(price)} per BTC.</div>
                  : (
                    <div className="table-wrap" id="harvest-lots-table">
                      <table>
                        <thead><tr>
                          <th>Acquired</th><th>Platform</th><th>Lot</th><th>BTC</th><th>Sats</th><th>Basis / BTC</th><th>Basis</th><th>Est. loss</th><th>Term</th><th>Running BTC</th><th></th>
                        </tr></thead>
                        <tbody>
                          {rows.map(r => (
                            <tr key={r.lotId}>
                              <td style={{whiteSpace:'nowrap',fontSize:'.8125rem'}}>{fmtLotAt(r.acquiredAt)}</td>
                              <td>{r.platform||'—'}</td>
                              <td><span className={`badge badge-${r.type.toLowerCase()}`}>{r.type}</span></td>
                              <td className="mono">{r.btc.toFixed(8)}</td>
                              <td className="mono">{r.sats.toLocaleString('en-US')}</td>
                              <td className="mono">{fmtUSD(r.basisPerBtc)}</td>
                              <td className="mono">{fmtUSD(r.basisUsd)}</td>
                              <td className="mono" style={{color:lossColor(r.lossUsd)}}>{fmtUSD(r.lossUsd)}</td>
                              <td>{r.longTerm ? 'LT' : 'ST'}</td>
                              <td className="mono">{r.runningBtc.toFixed(8)}</td>
                              <td>{r.estimated && <span title="Basis is estimated: from a daily close rather than a value you entered" style={{fontSize:'.5625rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em',padding:'.1rem .3rem',borderRadius:3,background:'var(--bg-tertiary)',color:'var(--text-secondary)'}}>est.</span>}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              </div>
            </>)}
          </>);
        })()}

        {/* ── EXPORT ── */}
        {tab==='export' && (
          <>
            {/* Backup & Restore */}
            <div className="card">
              <div className="card-header">
                <div className="card-title">Backup & Restore</div>
              </div>
              <div className="card-body">
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'1rem'}}>
                  <div style={{flex:1,minWidth:200}}>
                    <div style={{fontSize:'.9375rem',fontWeight:600,marginBottom:'.25rem'}}>Download Tracker Backup</div>
                    <div style={{fontSize:'.8125rem',color:'var(--text-secondary)',lineHeight:1.6}}>
                      Export a full encrypted backup including transactions, wallets, settings, and your encrypted vault. Use this file to restore everything via Settings → Import.
                    </div>
                  </div>
                  <button className="btn btn-primary" onClick={exportBackupJSON} style={{display:'inline-flex',alignItems:'center',gap:'.5rem'}}>
                    {Icon.Download({width:14,height:14})} Download Full Backup
                  </button>
                </div>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'1rem',marginTop:'1.25rem',paddingTop:'1.25rem',borderTop:'1px solid var(--border-color)'}}>
                  <div style={{flex:1,minWidth:200}}>
                    <div style={{fontSize:'.9375rem',fontWeight:600,marginBottom:'.25rem'}}>Backfill Reward USD Values</div>
                    <div style={{fontSize:'.8125rem',color:'var(--text-secondary)',lineHeight:1.6}}>
                      Fill the USD value at receipt on rewards that have none, from the daily close, marked as estimated. Shows a summary first. Values you entered are never overwritten.
                    </div>
                  </div>
                  <button className="btn btn-secondary" onClick={handleBackfillRewards}>Backfill…</button>
                </div>
              </div>
            </div>

            {/* Recovery snapshot — kept automatically before anything replaces local data */}
            {preSyncSnapshot && (
              <div className="card" style={{borderColor:'var(--bitcoin-orange)'}}>
                <div className="card-header">
                  <div className="card-title" style={{color:'var(--bitcoin-orange)'}}>Recovery Snapshot</div>
                </div>
                <div className="card-body">
                  <div style={{fontSize:'.8125rem',color:'var(--text-secondary)',lineHeight:1.6,marginBottom:'.875rem'}}>
                    Kept automatically just before a Google Drive pull, a backup restore, or a reset
                    replaced your local data. Contains <strong>{preSyncSnapshot.transactions.length} transaction{preSyncSnapshot.transactions.length===1?'':'s'}</strong>
                    {' '}and <strong>{(preSyncSnapshot.wallets||[]).length} wallet{(preSyncSnapshot.wallets||[]).length===1?'':'s'}</strong>
                    {preSyncSnapshot.savedAt ? <> · saved {new Date(preSyncSnapshot.savedAt).toLocaleString()}</> : null}.
                  </div>
                  <div style={{display:'flex',gap:'.625rem',flexWrap:'wrap'}}>
                    <button className="btn btn-secondary btn-sm" onClick={()=>{
                      const payload = {
                        version: BACKUP_SCHEMA_VERSION,
                        exportedAt: new Date().toISOString(),
                        transactions: preSyncSnapshot.transactions,
                        wallets: preSyncSnapshot.wallets||[],
                        settings: preSyncSnapshot.settings||{},
                        vault: preSyncSnapshot.vault||null,
                        lastModified: preSyncSnapshot.lastModified || new Date().toISOString(),
                      };
                      downloadBlob(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}), `satledger-snapshot-${todayLocal()}.json`);
                    }} style={{display:'inline-flex',alignItems:'center',gap:'.375rem'}}>
                      {Icon.Download({width:12,height:12})} Download Snapshot
                    </button>
                    <button className="btn btn-secondary btn-sm" onClick={()=>setConfirmDialog({
                      title: 'Restore Snapshot',
                      message: `Replace your current ${transactions.length} transaction${transactions.length===1?'':'s'} with the ${preSyncSnapshot.transactions.length} in this snapshot? Your current data will be overwritten.`,
                      confirmLabel: 'Restore Snapshot',
                      danger: true,
                      onConfirm: () => { restorePreSyncSnapshot(); setConfirmDialog(null); },
                    })} style={{display:'inline-flex',alignItems:'center',gap:'.375rem',color:'var(--bitcoin-orange)'}}>
                      {Icon.Refresh({width:12,height:12})} Restore Snapshot
                    </button>
                    <button className="btn btn-secondary btn-sm" onClick={()=>setConfirmDialog({
                      title: 'Discard Snapshot',
                      message: 'Delete this recovery snapshot? It cannot be recovered afterwards.',
                      confirmLabel: 'Discard',
                      danger: true,
                      onConfirm: () => {
                        localStorage.removeItem('btc-presync-backup');
                        setSnapshotNonce(n => n+1);
                        setConfirmDialog(null);
                        showToast('Snapshot discarded');
                      },
                    })} style={{display:'inline-flex',alignItems:'center',gap:'.375rem'}}>
                      {Icon.Trash({width:12,height:12})} Discard
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Tax Export */}
            <div className="card">
              <div className="card-header"><div className="card-title">Tax Export — CoinLedger</div></div>
              <div className="card-body">
                <div className="info-banner">
                  <span style={{display:'flex',color:'var(--bitcoin-orange)'}}>{Icon.Link()}</span>
                  <div>Export as CSV in CoinLedger's Universal Manual Import format. <strong>Tip:</strong> Import directly without opening in Excel to avoid formatting issues.</div>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:'1rem',marginTop:'.75rem'}}>
                  <div className="stat-card" style={{cursor:'pointer',transition:'border-color .15s'}} onClick={()=>exportCSV(null)}
                    onMouseEnter={e=>e.currentTarget.style.borderColor='var(--bitcoin-orange)'}
                    onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border-color)'}>
                    <div className="stat-label" style={{display:'flex',alignItems:'center',gap:'.375rem'}}>
                      {Icon.Download({width:11,height:11})} All Years
                    </div>
                    <div className="stat-value" style={{fontSize:'1.5rem'}}>{transactions.length}</div>
                    <div className="stat-sub">CoinLedger format</div>
                  </div>
                  {years.map(y=>{
                    const yearTxs = transactions.filter(t=>t.date.startsWith(y));
                    const count = yearTxs.length;
                    const dates = yearTxs.map(t=>t.date).sort();
                    const rangeStr = dates.length ? `${fmtDate(dates[0])} — ${fmtDate(dates[dates.length-1])}` : '';
                    return (
                      <div key={y} className="stat-card" style={{cursor:'pointer',transition:'border-color .15s'}} onClick={()=>exportCSV(y)}
                        onMouseEnter={e=>e.currentTarget.style.borderColor='var(--bitcoin-orange)'}
                        onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border-color)'}>
                        <div className="stat-label" style={{display:'flex',alignItems:'center',gap:'.375rem'}}>
                          {Icon.Download({width:11,height:11})} {y}
                        </div>
                        <div className="stat-value" style={{fontSize:'1.5rem'}}>{count}</div>
                        <div className="stat-sub">{rangeStr}</div>
                      </div>
                    );
                  })}
                </div>

                {/* Collapsible type mapping */}
                <div style={{marginTop:'1.5rem',borderTop:'1px solid var(--border-color)',paddingTop:'1rem'}}>
                  <button
                    onClick={()=>setShowTypeMapping(s=>!s)}
                    style={{display:'flex',alignItems:'center',gap:'.5rem',background:'none',border:'none',cursor:'pointer',fontFamily:'inherit',fontSize:'.8125rem',fontWeight:600,color:'var(--text-secondary)',padding:0,transition:'color .15s'}}
                    onMouseEnter={e=>e.currentTarget.style.color='var(--text-primary)'}
                    onMouseLeave={e=>e.currentTarget.style.color='var(--text-secondary)'}
                  >
                    {showTypeMapping ? Icon.ChevronDown({width:13,height:13}) : Icon.ChevronRight({width:13,height:13})}
                    TYPE MAPPING
                  </button>
                  {showTypeMapping && (
                    <table style={{width:'100%',fontSize:'.8125rem',marginTop:'.75rem'}}>
                      <thead>
                        <tr><th style={{textAlign:'left',padding:'.5rem',background:'var(--bg-tertiary)'}}>Your Type</th><th style={{textAlign:'left',padding:'.5rem',background:'var(--bg-tertiary)'}}>CoinLedger Type</th><th style={{textAlign:'left',padding:'.5rem',background:'var(--bg-tertiary)'}}>Notes</th></tr>
                      </thead>
                      <tbody>
                        <tr><td style={{padding:'.5rem'}}><span className="badge badge-buy">Buy</span></td><td style={{padding:'.5rem',fontFamily:'monospace'}}>Trade</td><td style={{padding:'.5rem',color:'var(--text-secondary)'}}>USD → BTC, price computed</td></tr>

          <div className="settings-grid">
            {/* Cloud Sync */}

              <div className="card-header">
                <div className="card-title">Cloud Sync</div>
                {syncState!=='disconnected' && (

              <div className="card-body">
                {syncState==='disconnected' ? (

                    <div style={{display:'flex',alignItems:'center',gap:'1rem',marginBottom:'1rem'}}>

                      </div>
                      <div>
                        <div style={{fontSize:'.9375rem',fontWeight:600}}>Sync with Google Drive</div>
                        <div style={{fontSize:'.8125rem',color:'var(--text-secondary)'}}>Sign in to automatically back up and sync your data across devices. Vault contents are synced only as encrypted ciphertext.</div>

                        {Icon.Check({width:20,height:20,style:{color:'var(--green)'}})}

                        {lastSync && <div style={{fontSize:'.75rem',color:'var(--text-tertiary)',marginTop:'.125rem'}}>Last synced {lastSync.toLocaleTimeString()}</div>}
                      </div>
                    </div>
                    <div style={{display:'flex',gap:'.625rem',flexWrap:'wrap'}}>
                      <button className="btn btn-secondary btn-sm" onClick={()=>{
                        // Overwrites the Drive copy with local — the mirror image of Force Pull,
                        // and the same data loss in the other direction. Confirm it.
                        setConfirmDialog({
                          title: 'Overwrite Google Drive',
                          message: `Replace whatever is in Google Drive with your local ${transactions.length} transaction${transactions.length===1?'':'s'} and ${wallets.length} wallet${wallets.length===1?'':'s'}? Any data in Drive that isn't on this device will be lost.`,
                          confirmLabel: 'Overwrite Drive',
                          danger: true,
                          onConfirm: async()=>{
                            setConfirmDialog(null);
                            setSyncState('syncing');
                            try {
                              await pushLocalToDrive('Pushed to Google Drive');
                              setSyncState('synced'); setLastSync(new Date());
                            } catch { setSyncState('error'); showToast('Push failed'); }
                          },
                        });
                      }} style={{display:'inline-flex',alignItems:'center',gap:'.375rem'}}>
                        {Icon.Cloud({width:12,height:12})} Force Push
                      </button>
                      <button className="btn btn-secondary btn-sm" onClick={async()=>{
                        // Pull FIRST so the confirmation can name real counts, and so an
                        // unreadable payload bails out before anything local is touched.
                        setSyncState('syncing');
                        let remote;
                        try { remote = await GDriveSync.pull(); }
                        catch { setSyncState('error'); showToast('Pull failed'); return; }
                        if(!remote || !(Array.isArray(remote.transactions) || remote.vault)) {
                          setSyncState('synced'); showToast('No remote data found'); return;
                        }
                        const remoteCount = Array.isArray(remote.transactions) ? remote.transactions.length : null;
                        setSyncState('synced');
                        setConfirmDialog({
                          title: 'Replace Local Data',
                          message: remoteCount === null
                            ? `This Drive file contains a vault but no transaction list. Only the vault will be replaced. Continue?`
                            : `Replace your local ${transactions.length} transaction${transactions.length===1?'':'s'} with the ${remoteCount} in Google Drive? A recovery snapshot will be kept, available under Export → Backup & Restore.`,
                          confirmLabel: 'Replace Local Data',
                          danger: true,
                          onConfirm: ()=>{
                            setConfirmDialog(null);
                            applyRemotePayload(remote, { stash: true });

                            showToast('Pulled from Google Drive');

                { key:'monthly', label:'Monthly Summary', desc:'Monthly buy volume as bar chart' },

              const defMap = {};
              chartDefs.forEach(c => defMap[c.key] = c);

              const orderedCharts = [...order.filter(k => defMap[k]), ...DEFAULT_CHART_ORDER.filter(k => !order.includes(k))].map(k => defMap[k]);
              const moveChart = (key, dir) => {
                const o = orderedCharts.map(c => c.key);
                const idx = o.indexOf(key);
                const swap = idx + dir;
                if(swap < 0 || swap >= o.length) return;
                [o[idx], o[swap]] = [o[swap], o[idx]];
                updateSettings({ chartOrder: o });
              };

                { key:'ma50d', label:'50-Day MA', color:'#ef4444' },
                { key:'ma200d', label:'200-Day MA', color:'#a855f7' },

                      <button className="btn btn-secondary btn-sm" style={{fontSize:'.75rem',whiteSpace:'nowrap'}} onClick={() => updateSettings({ chartOrder: DEFAULT_CHART_ORDER, hiddenCharts: {}, maLines: {} })}>Reset to default</button>

                          </div>
                          <div style={{display:'flex',alignItems:'center',gap:'.125rem',flexShrink:0}}>
                            <button onClick={()=>moveChart(chart.key,-1)} disabled={i===0} title="Move up"

                              {Icon.ChevronUp({width:16,height:16})}

                            <input type="checkbox" aria-label={`Show ${chart.label} chart`} checked={!effectiveHiddenCharts[chart.key]} onChange={e=>{
                              const hc = {...(settings.hiddenCharts||{})};
                              hc[chart.key] = e.target.checked ? false : true;
                              updateSettings({hiddenCharts:hc});
                            }} />
                            <span className="theme-slider"></span>
                          </label>
                        </div>
                        {chart.key === 'movingAvg' && !effectiveHiddenCharts.movingAvg && (

                            {maLineDefs.map((ma, mi) => (

                                      ml[ma.key] = e.target.checked ? true : false;
                                      updateSettings({maLines:ml});
                                    }} />
                                    <span className="theme-slider"></span>
                                  </label>
                                </div>
                                {ma.key === 'rsi14' && (
                                  <div style={{marginTop:'.625rem',padding:'.75rem',border:'1px solid var(--border-color)',borderRadius:'10px',background:'var(--bg-tertiary)'}}>

                                        <input
                                          className="form-input"
                                          type="number"
                                          min="0"
                                          max="100"
                                          step="1"
                                          value={rsiThresholdDraft.overbought}

                                          aria-label="RSI overbought threshold"
                                          style={rsiThresholdError ? {borderColor:'var(--red)'} : undefined}
                                        />
                                      </label>
                                      <label style={{display:'flex',flexDirection:'column',gap:'.375rem'}}>
                                        <span style={{fontSize:'.75rem',fontWeight:600,color:'var(--text-secondary)',textTransform:'uppercase',letterSpacing:'.04em'}}>Oversold</span>

                                    </div>
                                    {rsiThresholdError && (
                                      <div style={{fontSize:'.75rem',color:'var(--red)',marginTop:'.5rem',fontWeight:600}}>
                                        {rsiThresholdError}
                                      </div>
                                    )}
                                  </div>
                                )}
                              </div>
                            ))}
                          </div>
                        )}
                      </React.Fragment>
                    ))}
                  </div>
                </div>
              );

                      {Icon.Trash({width:13,height:13})} Reset Data…
                    </button>

              </div>

              <div className="card-header"><div className="card-title">About</div></div>

                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:'1rem'}}>
                  {[
                    ['Transactions',transactions.length],
                    ['Wallets',wallets.length],
                    ['Storage', syncState === 'synced' ? 'Local + Google Drive' : syncState === 'syncing' ? 'Local + Google Drive (syncing)' : 'Local only'],

                  <div>GitHub: <a href="https://github.com/bhart22/satledger" target="_blank" rel="noreferrer" style={{color:'var(--bitcoin-orange)',fontWeight:600,textDecoration:'none'}}>github.com/bhart22/satledger</a></div>

                    {Icon.FileText({width:13,height:13})} Privacy Policy

      </div>{/* end app-body */}

      {/* ── Add/Edit Transaction Modal ── */}
      {showModal && (

            <div>
              <div className="modal-body">
                <div className="form-grid">
                  <div className="form-group">
                    <label className="form-label" htmlFor="tx-date">Date</label>

                    <label className="form-label" htmlFor="tx-time">Time (local)</label>

                  <div className="form-group">
                    <label className="form-label" htmlFor="tx-seq">Sequence</label>
                    <input id="tx-seq" type="number" min="0" step="1" className="form-input" placeholder="auto" value={form.sequence??''} onChange={e=>setForm({...form,sequence:e.target.value})}/>

                  <div className="form-group">
                    <label className="form-label" htmlFor="tx-type">Type</label>
                    <select id="tx-type" className="form-select" value={form.type} onChange={e=>setForm({...form,type:e.target.value})}>

                  <div className="form-group">

                    <datalist id="wallet-list">{wallets.map(w=><option key={w.id} value={w.name}/>)}</datalist>
                  </div>
                  {form.type==='Transfer' && (
                    <div className="form-group">
                      <label className="form-label" htmlFor="tx-wallet2">To Wallet</label>
                      <input id="tx-wallet2" list="wallet-list" className="form-input" placeholder="e.g. Bitkey" value={form.wallet2} onChange={e=>setForm({...form,wallet2:e.target.value})}/>
                    </div>
                  )}
                  <div className="form-group">
                    <label className="form-label" htmlFor="tx-amount">{form.type==='Consolidation'?`Amount Consolidated (${btcUnit()}, optional)`:`Amount (${btcUnit()})`}</label>
                    <input id="tx-amount" type="number" min="0" inputMode="decimal" step={satsMode?'1':'0.00000001'} className="form-input" placeholder={satsMode?'0':'0.00000000'} value={btcToUnitInput(form.amount)} onChange={e=>{
                      const btc = unitInputToBtc(e.target.value);
                      const price = numOr(form.price, null);
                      const btcN = numOr(btc, null);
                      const newTotal = (btcN !== null && price !== null) ? (btcN*price).toFixed(2) : form.totalUsd;
                      setForm({...form, amount:btc, totalUsd:newTotal});
                    }} required={form.type!=='Consolidation'}/>
                  </div>
                  {(form.type==='Buy'||form.type==='Sell') && (
                    <div className="form-group">
                      <label className="form-label" htmlFor="tx-price">Price per BTC</label>
                      <div className="price-wrap">
                        <input id="tx-price" type="number" min="0" inputMode="decimal" step="0.01" className="form-input" placeholder={btcPrice?btcPrice.toFixed(2):"0.00"} value={form.price} onChange={e=>{
                          const p = e.target.value;
                          const amt = numOr(form.amount, null);
                          const pN = numOr(p, null);
                          const newTotal = (pN !== null && amt !== null) ? (pN*amt).toFixed(2) : '';
                          setForm({...form, price:p, totalUsd:newTotal});
                        }}/>
                        <button type="button" className="price-refresh" onClick={async()=>{
                          const p=await fetchPrice();
                          if(p) {
                            const amt = numOr(form.amount, null);
                            const newTotal = amt !== null ? (p*amt).toFixed(2) : '';
                            setForm(f=>({...f, price:p.toFixed(2), totalUsd:newTotal}));
                          }
                        }} title="Use live price">{Icon.Refresh({width:13,height:13})}</button>
                      </div>
                    </div>
                  )}
                  {(form.type==='Buy'||form.type==='Sell') && (
                    <div className="form-group">
                      <label className="form-label" htmlFor="tx-total-usd">Total USD</label>
                      <input id="tx-total-usd" type="number" min="0" inputMode="decimal" step="0.01" className="form-input" placeholder="0.00" value={form.totalUsd} onChange={e=>{
                        const usd = e.target.value;
                        const amt = numOr(form.amount, null);
                        const usdN = numOr(usd, null);
                        // amt must be > 0, not merely truthy — "0" here used to yield price "Infinity"
                        const newPrice = (usdN !== null && amt !== null && amt > 0) ? (usdN/amt).toFixed(2) : '';
                        setForm({...form, totalUsd:usd, price:newPrice});
                      }}/>
                    </div>
                  )}
                  <div className="form-group">
                    <label className="form-label" htmlFor="tx-fee">Fee {form.type==='Transfer'||form.type==='Consolidation'?`(${btcUnit()})`:'(USD)'}</label>
                    <input id="tx-fee" type="number" min="0" inputMode="decimal" step={form.type==='Transfer'||form.type==='Consolidation'?(satsMode?'1':'0.00000001'):'0.01'} className="form-input" placeholder="0" value={form.type==='Transfer'||form.type==='Consolidation'?btcToUnitInput(form.fee):form.fee} onChange={e=>{
                      const isBtcFee = form.type==='Transfer'||form.type==='Consolidation';
                      setForm({...form, fee: isBtcFee ? unitInputToBtc(e.target.value) : e.target.value});
                    }}/>
                  </div>
                  {form.type==='Consolidation' && (
                    <div className="form-group full" style={{marginTop:'-.25rem'}}>

                      <label className="form-label" htmlFor="tx-reward-cat">Reward category</label>

                      </select>

                  <div className="form-group full">
                    <label className="form-label" htmlFor="tx-hash">TxHash (optional)</label>
                    <input id="tx-hash" className="form-input" placeholder="On-chain transaction hash" value={form.txhash} onChange={e=>setForm({...form,txhash:e.target.value})} style={{fontFamily:'JetBrains Mono',fontSize:'.75rem'}}/>
                  </div>
                  <div className="form-group full">
                    <label className="form-label" htmlFor="tx-notes">Notes</label>

                  <div className="form-group full">
                    <label style={{display:'flex',alignItems:'center',gap:'.5rem',fontSize:'.8125rem',color:'var(--text-secondary)',cursor:'pointer'}}>
