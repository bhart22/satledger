  // ── Marker aggregation (§9) ──
  // One marker per (bucket, marker group): { t, category, count, sats, ids, estimated, price }.
  // `price` is the member's resolved price when the marker holds exactly one row (for exact-price
  // placement), else null. A date-only row on an intraday chart attaches to the first candle of
  // its UTC day. When more than maxMarkers fall in [fromSec, toSec), the bucket widens to k × the
  // interval, k doubling until they fit; widened buckets stay aligned to the interval's grid.
  const aggregateMarkers = (rows, { interval = '1d', filters = null, maxMarkers = DEFAULT_MAX_MARKERS, fromSec = null, toSec = null } = {}) => {
    const s = Candles.intervalSeconds(interval);
    const anchor = Candles.bucketStart(0, interval);
    const cap = Number.isInteger(maxMarkers) && maxMarkers > 0 ? maxMarkers : DEFAULT_MAX_MARKERS;
    const lo = isFiniteNum(fromSec) ? fromSec : -Infinity, hi = isFiniteNum(toSec) ? toSec : Infinity;
    const placed = applyFilters(rows, filters).map(r => {
      const at = r.dateOnly && s < DAY ? dayStart(r.tSec) : r.tSec;
      return { r, b: Candles.bucketStart(at, interval) };
    }).filter(x => x.b + s > lo && x.b < hi);
    const build = k => {
      const span = k * s;
      const byKey = new Map();
      for(const { r, b } of placed) {
        const t = k === 1 ? b : b - (((b - anchor) % span) + span) % span;
        const group = MARKER_GROUP[r.category];
        const key = t + '|' + group;
        let m = byKey.get(key);
        if(!m) { m = { t, category: group, count: 0, sats: 0, ids: [], estimated: false, price: null, _p: null }; byKey.set(key, m); }
        m.count++; m.sats += r.sats; m.ids.push(r.id); m._p = r.price;
        if(r.priceSource === PRICE_SOURCE.HISTORICAL_MARKET_LOOKUP || r.priceSource === PRICE_SOURCE.UNKNOWN) m.estimated = true;
      }
      return [...byKey.values()];
    };
    let k = 1, markers = build(1);
    // Each doubling at least halves the distinct buckets once they span more than one, so this
    // ends; the guard stops at a single bucket per group whatever the cap.
    for(let i = 0; markers.length > cap && i < 64; i++) {
      const next = build(k * 2);
      k *= 2; markers = next;
      if(markers.length <= MARKER_GROUP_ORDER.length && new Set(markers.map(m => m.t)).size <= 1) break;
    }
    return markers
      .map(({ _p, ...m }) => ({ ...m, price: m.count === 1 ? _p : null }))
      .sort((a, b) => a.t - b.t || MARKER_GROUP_ORDER.indexOf(a.category) - MARKER_GROUP_ORDER.indexOf(b.category));
  };

  return Object.freeze({
    PRICE_SOURCE, CATEGORY, MARKER_GROUP, AVG_PRESETS, DEFAULT_FILTERS, DEFAULT_MAX_MARKERS,
    toChartTransactions, priceSourceLabel, allInLabel,
    normalizeFilters, applyFilters,
    balanceHistory, balanceBefore, balanceAtBuckets,
    avgAcquisition, avgAcquisitionSeries, rangeSummary, aggregateMarkers,
  });
})();

const DEFAULT_RSI_THRESHOLDS = { overbought: 70, oversold: 30 };
const RSI_ZONE_COLORS = {
  neutral: '#ec4899',
  overbought: '#dc2626',
  oversold: '#16a34a',
};

function normalizeRsiThresholds(thresholds) {
  if(thresholds === undefined) return { ...DEFAULT_RSI_THRESHOLDS };
  const rawOverbought = Number(thresholds?.overbought);
  const rawOversold = Number(thresholds?.oversold);
  const overbought = Number.isFinite(rawOverbought) && rawOverbought > 0 && rawOverbought <= 100
    ? rawOverbought
    : null;
  const oversold = Number.isFinite(rawOversold) && rawOversold > 0 && rawOversold <= 100
    ? rawOversold
    : null;
  if(overbought != null && oversold != null && oversold >= overbought) return { ...DEFAULT_RSI_THRESHOLDS };
  return { overbought, oversold };
}

// Per-device view state. Stored in btc-settings with everything else, but changing one is not
// a data edit (no commit stamp, no push), a pull never overwrites this device's values, and
// the sync conflict dialog ignores them.
const DEVICE_VIEW_SETTING_KEYS = ['chartRange', 'chartRangeCustom', 'hideValues', 'dashboardWalletFilter', 'market'];
const withoutViewSettings = (s) => {
  const out = {...(s && typeof s === 'object' ? s : {})};
  DEVICE_VIEW_SETTING_KEYS.forEach(k => { delete out[k]; });
  return out;
};
const keepLocalViewSettings = (remoteSettings, localSettings) => {
  const out = {...remoteSettings};
  DEVICE_VIEW_SETTING_KEYS.forEach(k => {
    if(localSettings && Object.prototype.hasOwnProperty.call(localSettings, k)) out[k] = localSettings[k];
  });
  return out;
};

// Settings arrive from backups and from Drive, i.e. from files anyone can hand-edit. A value of
// the wrong type — `chartOrder: "x"` — threw on every render, and because settings sync, it
// bricked every device at once. Wrong-typed keys are dropped so each consumer's default applies.
const SETTINGS_TYPE_GUARDS = {
  chartOrder: v => Array.isArray(v) && v.every(k => typeof k === 'string'),
  hiddenCharts: v => v && typeof v === 'object' && !Array.isArray(v),
  hiddenStats: v => v && typeof v === 'object' && !Array.isArray(v),
  maLines: v => v && typeof v === 'object' && !Array.isArray(v),
  dashboardWalletFilter: v => v === null || (Array.isArray(v) && v.every(k => typeof k === 'string')),
  chartRange: v => typeof v === 'string',
  chartRangeCustom: v => typeof v === 'string',
  defaultTxType: v => VALID_TX_TYPES.includes(v),
  hideValues: v => typeof v === 'boolean',
  bgDots: v => typeof v === 'boolean',
  showVault: v => typeof v === 'boolean',
  // Only the outer type is checked here; MarketView runs normalizeMarketPrefs over the contents.
  market: v => v && typeof v === 'object' && !Array.isArray(v),
};
function normalizeSettings(nextSettings) {
  const raw = nextSettings && typeof nextSettings === 'object' && !Array.isArray(nextSettings) ? nextSettings : {};
  const base = {...raw};
  for(const [k, valid] of Object.entries(SETTINGS_TYPE_GUARDS)) {
    if(Object.prototype.hasOwnProperty.call(base, k) && base[k] !== undefined && !valid(base[k])) delete base[k];
  }
  return {
    defaultTxType: 'Buy',
    // Defaulted here so every chart agrees. Leaving it undefined meant each consumer applied
    // its own fallback, and the moving-average chart disagreed with the rest of the dashboard.
    chartRange: 'All',
    ...base,
    displayUnit: base.displayUnit === 'sats' ? 'sats' : 'btc',
    rsiThresholds: normalizeRsiThresholds(base.rsiThresholds),
  };
}

function getRsiState(value, thresholds = DEFAULT_RSI_THRESHOLDS) {
  if(value == null || !Number.isFinite(Number(value))) return 'neutral';
  if(thresholds.overbought != null && value >= thresholds.overbought) return 'overbought';
  if(thresholds.oversold != null && value <= thresholds.oversold) return 'oversold';
  return 'neutral';
}

function getRsiColor(value, thresholds = DEFAULT_RSI_THRESHOLDS) {
  return RSI_ZONE_COLORS[getRsiState(value, thresholds)] || RSI_ZONE_COLORS.neutral;
}

function validateRsiThresholdDraft(draft) {
  const rawOverbought = String(draft.overbought ?? '').trim();
  const rawOversold = String(draft.oversold ?? '').trim();
  const overbought = rawOverbought === '' ? null : Number(rawOverbought);
  const oversold = rawOversold === '' ? null : Number(rawOversold);
  if((overbought != null && !Number.isFinite(overbought)) || (oversold != null && !Number.isFinite(oversold))) {
    return { error: 'RSI thresholds must be numeric values.' };
  }
  if((overbought != null && (overbought < 0 || overbought > 100)) || (oversold != null && (oversold < 0 || oversold > 100))) {
    return { error: 'RSI thresholds must stay between 0 and 100.' };
  }
  const normalizedOverbought = overbought && overbought > 0 ? overbought : null;
  const normalizedOversold = oversold && oversold > 0 ? oversold : null;
  if(normalizedOverbought != null && normalizedOversold != null && normalizedOversold >= normalizedOverbought) {
    return { error: 'Oversold must be lower than overbought.' };
  }
  if(normalizedOverbought == null && normalizedOversold == null) {
    return { overbought: null, oversold: null, error: '' };
  }
  if(normalizedOverbought == null || normalizedOversold == null) {
    return { overbought: normalizedOverbought, oversold: normalizedOversold, error: '' };
  }
  return { overbought: normalizedOverbought, oversold: normalizedOversold, error: '' };
}

// Catches a render throw so malformed stored data shows a page with an export button instead
// of a blank screen. Recovery goes through window.__satRescue (which reads localStorage
// directly) rather than the app's own exporter — App state is exactly what's broken here.
// Inline styles only, so it survives a stylesheet failure too.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) {
    // Always log — swallowing this would make the app undebuggable
    console.error('Render error caught by boundary:', error, info?.componentStack);
  }
  render() {
    if(!this.state.error) return this.props.children;
    const wrap = {maxWidth:640,margin:'12vh auto',padding:'2rem',fontFamily:'system-ui,-apple-system,sans-serif',lineHeight:1.6};
    const btn = {padding:'.6rem 1rem',borderRadius:999,border:0,background:'#f7931a',color:'#fff',fontWeight:600,cursor:'pointer'};
    const btn2 = {padding:'.6rem 1rem',borderRadius:999,border:'1px solid #ccc',background:'transparent',cursor:'pointer'};
    return (
      <div style={wrap}>
        <h1 style={{fontSize:'1.25rem',marginBottom:'.75rem'}}>Something went wrong</h1>
        <p style={{marginBottom:'1rem',opacity:.75}}>
          Your data is still saved in this browser. Download a copy before trying anything else.
        </p>
        <div style={{display:'flex',gap:'.5rem',flexWrap:'wrap',marginBottom:'1.25rem'}}>
          <button style={btn} onClick={()=>window.__satRescue && window.__satRescue()}>Download my data</button>
          <button style={btn2} onClick={()=>location.reload()}>Reload</button>
          <button style={btn2} onClick={()=>{ try{localStorage.removeItem(HISTORICAL_PRICE_CACHE_KEY);}catch(e){} location.reload(); }}>
            Clear cached prices &amp; reload
          </button>
        </div>
        <details style={{fontSize:'.8125rem',opacity:.7}}>
          <summary style={{cursor:'pointer'}}>Technical details</summary>
          <pre style={{whiteSpace:'pre-wrap',marginTop:'.5rem',fontSize:'.75rem'}}>
            {String(this.state.error?.stack || this.state.error)}
          </pre>
        </details>
      </div>
    );
  }
}

// Rolling sums instead of a fresh inner loop per window. The 200-week average alone was
// ~4,200 × 1,400 ≈ 6M additions per rebuild; this is ~3 additions per day instead.
// Float note: subtracting the departing element drifts vs. re-summing, but over ~4,200 prices
// in the 1e4–1e5 range the drift is ~1e-9 — invisible after .toFixed(2). Not worth Kahan.
// ─── Modal accessibility ─────────────────────────────────────────────────────
// One implementation for every overlay in the app: dialog semantics, a Tab trap, Escape to
// close, body scroll lock, and focus restored to whatever opened it. Attach the returned ref
// to the .modal element.
//
// The keydown listener is bound to the DIALOG NODE, not window, on purpose: TransferWizard
// already has a window-level Escape handler, and a node-scoped listener plus stopPropagation
// keeps a stacked confirm dialog from also closing the modal underneath it.
// Body scroll is reference-counted, NOT saved and restored per modal. With save/restore, a
// confirm dialog stacked on the transaction form would capture 'hidden' as the value to put
// back, and whichever cleanup ran last won — leaving the page permanently unscrollable after
// closing both. Only the last modal to close unlocks.
let modalScrollLocks = 0;
let modalScrollPrevious = '';
const lockBodyScroll = () => {
  if(modalScrollLocks === 0) {
    modalScrollPrevious = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
  }
  modalScrollLocks++;
};
const unlockBodyScroll = () => {
  modalScrollLocks = Math.max(0, modalScrollLocks - 1);
  if(modalScrollLocks === 0) document.body.style.overflow = modalScrollPrevious;
};

function useModalA11y(onClose) {
  const ref = React.useRef(null);
  const onCloseRef = React.useRef(onClose);
  onCloseRef.current = onClose;
  React.useEffect(() => {
    const node = ref.current;
    if(!node) return;
    const previouslyFocused = document.activeElement;
    lockBodyScroll();

    const focusables = () => Array.from(node.querySelectorAll(
      'a[href],button:not([disabled]),input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'
    )).filter(el => el.offsetParent !== null || el === document.activeElement);

    // A field marked data-autofocus wins over the header's Close button, which is otherwise
    // first in the DOM. Dialogs without one keep the old behaviour.
    (node.querySelector('[data-autofocus]') || focusables()[0] || node).focus();

    const onKeyDown = (e) => {
      if(e.key === 'Escape') {
        e.stopPropagation();
        if(onCloseRef.current) { e.preventDefault(); onCloseRef.current(); }
        return;
      }
      if(e.key !== 'Tab') return;
      const items = focusables();
      if(!items.length) { e.preventDefault(); return; }
      const i = items.indexOf(document.activeElement);
      if(e.shiftKey && i <= 0) { e.preventDefault(); items[items.length-1].focus(); }
      else if(!e.shiftKey && i === items.length-1) { e.preventDefault(); items[0].focus(); }
    };
    node.addEventListener('keydown', onKeyDown);
    return () => {
      node.removeEventListener('keydown', onKeyDown);
      unlockBodyScroll();
      if(previouslyFocused && typeof previouslyFocused.focus === 'function') previouslyFocused.focus();
    };
  }, []);
  return ref;
}

// Backdrop dismissal on mouseDOWN, not click: with onClick, a text selection that starts
// inside the modal and ends on the backdrop counts as a backdrop click and throws the form away.
function backdropHandler(onClose) {
  return (e) => { if(e.target === e.currentTarget) onClose(); };
}

// Wraps a modal body with dialog semantics + the hook above. Children render inside .modal.
function Modal({ onClose, title, titleStyle, headerStyle, maxWidth, showClose = true, closeLabel = 'Close dialog', dismissible = true, children, modalStyle, headerExtra }) {
  const titleId = React.useMemo(() => 'modal-title-' + Math.random().toString(36).slice(2,9), []);
  const ref = useModalA11y(dismissible ? onClose : null);
  return (
    <div className="overlay" onMouseDown={dismissible ? backdropHandler(onClose) : undefined}>
      <div
        className="modal"
        ref={ref}
        role="dialog"
        aria-modal="true"
        aria-labelledby={titleId}
        tabIndex={-1}
        style={{...(maxWidth ? {maxWidth} : {}), ...(modalStyle||{})}}
        onMouseDown={e=>e.stopPropagation()}
        onClick={e=>e.stopPropagation()}
      >
        <div className="modal-header" style={headerStyle}>
          <div style={{display:'flex',alignItems:'center',gap:'.625rem'}}>
            {headerExtra}
            <div className="modal-title" id={titleId} style={titleStyle}>{title}</div>
          </div>
          {showClose && (
            <button className="btn-icon" onClick={onClose} aria-label={closeLabel} type="button">{Icon.X()}</button>
          )}
        </div>
        {children}
      </div>
    </div>
  );
}

// Expanded-chart modal shell. Its own component so useModalA11y can run on mount/unmount —
// the charts render it conditionally, and hooks can't be called conditionally.
function ExpandedChartOverlay({ onClose, title, children, maxWidth = 960 }) {
  const titleId = React.useMemo(() => 'chart-modal-' + Math.random().toString(36).slice(2,9), []);
  const ref = useModalA11y(onClose);
  return ReactDOM.createPortal(
    <div
      style={{position:'fixed',inset:0,zIndex:9999,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(0,0,0,.5)',backdropFilter:'blur(4px)'}}
      onMouseDown={backdropHandler(onClose)}
    >
      <div
        ref={ref}
        role="dialog"
        aria-modal="true"
        aria-labelledby={titleId}
        tabIndex={-1}
        onMouseDown={e=>e.stopPropagation()}
        style={{background:'var(--bg-primary)',borderRadius:'16px',width:'calc(100vw - 2rem)',maxWidth:maxWidth+'px',maxHeight:'calc(100vh - 2rem)',overflow:'auto',boxShadow:'0 25px 50px rgba(0,0,0,.25)',outline:'none'}}
      >
        {typeof children === 'function' ? children(titleId) : children}
      </div>
    </div>,
    document.body
  );
}

function buildMovingAverageSeries(allDays) {
  if(!allDays.length) return [];
  const result = [];
  let avgGain = 0;
  let avgLoss = 0;
  let sum50 = 0, sum200 = 0, sum1400 = 0;
  for(let i = 0; i < allDays.length; i++) {
    const [date, price] = allDays[i];
    const pt = { date, price };
    sum50 += price;   if(i >= 50)   sum50   -= allDays[i - 50][1];
    sum200 += price;  if(i >= 200)  sum200  -= allDays[i - 200][1];
    sum1400 += price; if(i >= 1400) sum1400 -= allDays[i - 1400][1];
    if(i >= 49)   pt.ma50d  = +(sum50 / 50).toFixed(2);
    if(i >= 199)  pt.ma200d = +(sum200 / 200).toFixed(2);
    if(i >= 1399) pt.ma200w = +(sum1400 / 1400).toFixed(2);
    if(i === 14) {
      let gains = 0;
      let losses = 0;
      for(let j = 1; j <= 14; j++) {
        const delta = allDays[j][1] - allDays[j-1][1];
        if(delta >= 0) gains += delta;
        else losses += Math.abs(delta);
      }
      avgGain = gains / 14;
      avgLoss = losses / 14;
      const rs = avgLoss === 0 ? Infinity : avgGain / avgLoss;
      pt.rsi14 = +(100 - (100 / (1 + rs))).toFixed(1);
    } else if(i > 14) {
      const delta = allDays[i][1] - allDays[i-1][1];
      const gain = Math.max(delta, 0);
      const loss = Math.max(-delta, 0);
      avgGain = ((avgGain * 13) + gain) / 14;
      avgLoss = ((avgLoss * 13) + loss) / 14;
      const rs = avgLoss === 0 ? Infinity : avgGain / avgLoss;
      pt.rsi14 = +(100 - (100 / (1 + rs))).toFixed(1);
    }
    result.push(pt);
  }
  return result;
}

// ─── Dashboard Charts ─────────────────────────────────────────────────────────
function DashboardCharts({ transactions, wallets, btcPrice, historicalPrices, historicalPriceLoading, settings, updateSettings, selectedWallets }) {
  const activeWallets = React.useMemo(() => wallets.filter(w => !w.archived), [wallets]);
  const selectedWalletSet = React.useMemo(() => new Set(selectedWallets || []), [selectedWallets]);
  const hasWalletFilter = selectedWalletSet.size > 0;
  const filteredScopeLabel = hasWalletFilter ? 'Selected wallets' : null;
  const globalScopeLabel = hasWalletFilter ? 'Portfolio-wide' : null;
  const { chartData, accumulatedData, dcaData, feeBurnData, rewardData, plData } = React.useMemo(() => {
    const sorted = transactions
      .map(tx => ({ ...tx, normalizedDate: normalizeDate(tx.date) }))
      .filter(tx => tx.normalizedDate)
      .sort(compareTx);
    let totalCost = 0;
    const points = [];
    const accumulatedPoints = [];
    const dcaMap = {};
    let runningBTC = 0;
    let filteredRunningBTC = 0;
    let runningBTCForCost = 0;
    let cumulativeFees = 0;
    let cumulativeRewards = 0;
    let realizedPL = 0;
    const feePoints = [], rewardPoints = [], plPoints = [];
    sorted.forEach(tx => {
      const amt = numOr(tx.amount);
      const fee = numOr(tx.fee);
      const price = numOr(tx.price);
      const w1 = tx.wallet;
      const w2 = tx.wallet2;
      const matchesSelected = !hasWalletFilter || selectedWalletSet.has(w1) || selectedWalletSet.has(w2);

      // Always track BTC balance (all transactions, including excluded)
      runningBTC += txPortfolioDelta(tx);

      // Cost basis — only non-excluded transactions
      if(!tx.excludeStats) {
        const r = applyTxToCostPool({ btc: runningBTCForCost, cost: totalCost }, tx, historicalPrices);
        runningBTCForCost = r.btc; totalCost = r.cost; realizedPL += r.realized;
      }

      // DCA tracking — Buy transactions only
      if(tx.type==='Buy' && !tx.excludeStats && matchesSelected) {
        const buyUsd = numOr(tx.totalUsd, amt * price);
        if(buyUsd > 0) {
          dcaMap[tx.normalizedDate] = (dcaMap[tx.normalizedDate]||0) + buyUsd;
        }
      }

      // Fee burn tracking — only Transfer/Consolidation fees (actual BTC lost to network)
      // Buy/Sell fees are USD-denominated exchange fees, not BTC burn
      if(fee > 0 && !tx.excludeStats && matchesSelected && (tx.type==='Transfer'||tx.type==='Consolidation')) {
        cumulativeFees += fee;
        const lastFee = feePoints[feePoints.length-1];
        if(lastFee && lastFee.date===tx.normalizedDate) feePoints[feePoints.length-1] = { date:tx.normalizedDate, fees:+cumulativeFees.toFixed(8) };
        else feePoints.push({ date:tx.normalizedDate, fees:+cumulativeFees.toFixed(8) });
      }

      // Reward income tracking
      if(tx.type==='Reward' && !tx.excludeStats && matchesSelected) {
        cumulativeRewards += amt;
        const lastRew = rewardPoints[rewardPoints.length-1];
        if(lastRew && lastRew.date===tx.normalizedDate) rewardPoints[rewardPoints.length-1] = { date:tx.normalizedDate, rewards:+cumulativeRewards.toFixed(8) };
        else rewardPoints.push({ date:tx.normalizedDate, rewards:+cumulativeRewards.toFixed(8) });
      }

      // P&L tracking — record realized P&L and cost snapshot at each transaction date
      // Also track totalBtc (all holdings incl. excluded) for portfolio value chart
      if(tx.type==='Buy'||tx.type==='Sell'||tx.type==='Reward'||tx.type==='Transfer'||tx.type==='Consolidation') {
        const lastPL = plPoints[plPoints.length-1];
        const plPt = { date:tx.normalizedDate, realized:+realizedPL.toFixed(2), btcHeld:+runningBTCForCost.toFixed(8), totalBtc:+runningBTC.toFixed(8), costBasis:+totalCost.toFixed(2) };
        if(lastPL && lastPL.date===tx.normalizedDate) plPoints[plPoints.length-1] = plPt;
        else plPoints.push(plPt);
      }

      // (Monthly summary is bucketed separately below, after the range cutoff is applied —
      // see monthlySummary. Bucketing here and filtering afterwards meant a month was kept or
      // dropped wholesale based on whether its synthetic mid-month date passed the cutoff.)

      // Running BTC for the wallet-filtered holdings series. (Per-wallet balance maps used to
      // be accumulated here too, across ~35 lines, but were never read — walletHoldings in App
      // is the real source for those. Removed so this block stops advertising a total it
      // doesn't actually produce.)
      if(matchesSelected) {
        for(const [w, delta] of txWalletDeltas(tx)) if(selectedWalletSet.has(w)) filteredRunningBTC += delta;
      }
      const totalBTC = runningBTC;
      const avgCost = runningBTCForCost>0.00000001 ? totalCost/runningBTCForCost : null;
      const pt = { date:tx.normalizedDate, btc:+totalBTC.toFixed(8), avgCost:avgCost!==null ? +avgCost.toFixed(2) : null };
      const accumulatedPt = { date:tx.normalizedDate, btc:+(hasWalletFilter ? filteredRunningBTC : totalBTC).toFixed(8) };
      const last = points[points.length-1];
      if(last && last.date===tx.normalizedDate) points[points.length-1]=pt;
      else points.push(pt);
      const lastAccumulated = accumulatedPoints[accumulatedPoints.length-1];
      if(lastAccumulated && lastAccumulated.date===tx.normalizedDate) accumulatedPoints[accumulatedPoints.length-1]=accumulatedPt;
      else accumulatedPoints.push(accumulatedPt);
    });
    // Trim leading zero-BTC points
    while(points.length > 1 && points[0].btc < 0.00000001) {
      points.shift();
    }
    while(accumulatedPoints.length > 1 && accumulatedPoints[0].btc < 0.00000001) {
      accumulatedPoints.shift();
    }
    const dcaPts = Object.entries(dcaMap).sort((a,b)=>a[0].localeCompare(b[0])).map(([date,buyUsd])=>({date,buyUsd:+buyUsd.toFixed(2)}));
    return { chartData: points, accumulatedData: accumulatedPoints, dcaData: dcaPts, feeBurnData: feePoints, rewardData: rewardPoints, plData: plPoints };
  }, [transactions, wallets, hasWalletFilter, selectedWalletSet, historicalPrices]); // historicalPrices: reward basis

  const chartCutoff = React.useMemo(
    () => rangeCutoff(settings.chartRange, settings.chartRangeCustom),
    [settings.chartRange, settings.chartRangeCustom]
  );

  // Monthly summary — bucketed AFTER the range cutoff, so each bar totals only the activity
  // actually inside the selected range, exactly like every other chart.
  //
  // This used to be bucketed over all transactions and then filtered by the bucket's synthetic
  // mid-month date, which meant a month was kept or dropped as a whole depending on which side
  // of the cutoff its 15th fell: with a 3M range ending 25 Apr, the April bar disappeared
  // entirely even though 25-30 Apr were in range.
  const monthlySummary = React.useMemo(() => {
    const monthlyMap = {};
    transactions.forEach(tx => {
      if(tx.excludeStats) return;
      const nd = normalizeDate(tx.date);
      if(!nd || (chartCutoff && nd < chartCutoff)) return;
      if(hasWalletFilter && !selectedWalletSet.has(tx.wallet) && !selectedWalletSet.has(tx.wallet2)) return;
      const month = nd.slice(0,7); // YYYY-MM
      if(!monthlyMap[month]) monthlyMap[month] = { buys:0, sells:0, rewards:0, fees:0 };
      const amt = numOr(tx.amount);
      const fee = numOr(tx.fee);
      const usd = numOr(tx.totalUsd, amt*numOr(tx.price));
      if(tx.type==='Buy') monthlyMap[month].buys += usd;
      else if(tx.type==='Sell') monthlyMap[month].sells += usd;
      if(tx.type==='Reward') monthlyMap[month].rewards += amt;
      if(fee > 0) monthlyMap[month].fees += fee;
    });
    return Object.entries(monthlyMap).sort((a,b)=>a[0].localeCompare(b[0])).map(([month, d])=>({
      // `date` positions the bar at mid-month (the visual centre of the bucket); `label` is what
      // the tooltip and axis show, so the synthetic day never reaches the user.
      date: month+'-15', month, label: fmtMonthLabel(month),
      buys:+d.buys.toFixed(2), sells:+d.sells.toFixed(2), rewards:+d.rewards.toFixed(8), fees:+d.fees.toFixed(8),
    }));
  }, [transactions, chartCutoff, hasWalletFilter, selectedWalletSet]);

  // Time-range filtering
  const rangeFiltered = React.useMemo(() => {
    const cutoff = chartCutoff;
    if(!cutoff) return { chart: chartData, accumulated: accumulatedData, dca: dcaData, fees: feeBurnData, rewards: rewardData, pl: plData, monthly: monthlySummary };
    return {
      chart: chartData.filter(d => d.date >= cutoff),
      accumulated: accumulatedData.filter(d => d.date >= cutoff),
      dca: dcaData.filter(d => d.date >= cutoff),
      fees: feeBurnData.filter(d => d.date >= cutoff),
      rewards: rewardData.filter(d => d.date >= cutoff),
      pl: plData.filter(d => d.date >= cutoff),
      monthly: monthlySummary, // already cutoff-aware
    };
  }, [chartData, accumulatedData, dcaData, feeBurnData, rewardData, plData, monthlySummary, chartCutoff]);

  const costData = React.useMemo(() => rangeFiltered.chart.filter(d=>d.avgCost!==null), [rangeFiltered.chart]);
  // P&L chart data — compute unrealized using historical prices for accuracy
  const plChartData = React.useMemo(() => {
    if(!rangeFiltered.pl.length || !Object.keys(historicalPrices).length) return [];
    // For each date with a historical price, interpolate the realized/cost/holdings from plPoints.
    // NOTE: toISOString() below is CORRECT here — these compare against historicalPrices keys,
    // which are genuine UTC day buckets from dayKeyUTC. Do not "fix" it to a local date.
    const plPts = rangeFiltered.pl;
    const sortedDates = Object.keys(historicalPrices).filter(d => {
      return plPts.length && d >= plPts[0].date && d <= (plPts[plPts.length-1].date > new Date().toISOString().slice(0,10) ? plPts[plPts.length-1].date : new Date().toISOString().slice(0,10));
    }).sort();
    if(!sortedDates.length) return [];
    let pi = 0;
    return sortedDates.map(date => {
      while(pi < plPts.length-1 && plPts[pi+1].date <= date) pi++;
      const snap = plPts[pi];
      if(!snap || date < snap.date) return null;
      const mktPrice = historicalPrices[date];
      const unrealized = snap.btcHeld > 0.00000001 ? +(snap.btcHeld * mktPrice - snap.costBasis).toFixed(2) : 0;
      return { date, realized: snap.realized, unrealized, totalPL: +(snap.realized + unrealized).toFixed(2) };
    }).filter(Boolean);
  }, [rangeFiltered.pl, historicalPrices]);

  // Portfolio Value vs Cost Basis chart data
  const valueBasisData = React.useMemo(() => {
    if(!rangeFiltered.pl.length || !Object.keys(historicalPrices).length) return [];
    const plPts = rangeFiltered.pl;
    const sortedDates = Object.keys(historicalPrices).filter(d => {
      return plPts.length && d >= plPts[0].date && d <= (plPts[plPts.length-1].date > new Date().toISOString().slice(0,10) ? plPts[plPts.length-1].date : new Date().toISOString().slice(0,10));
    }).sort();
    if(!sortedDates.length) return [];
    let pi = 0;
    return sortedDates.map(date => {
      while(pi < plPts.length-1 && plPts[pi+1].date <= date) pi++;
      const snap = plPts[pi];
      if(!snap || date < snap.date) return null;
      const mktPrice = historicalPrices[date];
      const marketValue = +((snap.totalBtc != null ? snap.totalBtc : snap.btcHeld) * mktPrice).toFixed(2);
      return { date, marketValue, costBasis: +snap.costBasis.toFixed(2) };
    }).filter(Boolean);
  }, [rangeFiltered.pl, historicalPrices]);

  // Waterfall data for BTC flow chart
  const waterfallData = React.useMemo(() => {
    const cutoff = rangeCutoff(settings.chartRange, settings.chartRangeCustom) || '1900-01-01';
    const sorted = transactions
      .map(tx => ({ ...tx, normalizedDate: normalizeDate(tx.date) }))
      .filter(tx => tx.normalizedDate)
      .sort(compareTx);
    // Compute starting BTC (all transactions before cutoff)
    let startBTC = 0;
    let buys = 0, rewards = 0, sells = 0, fees = 0, received = 0, sentOut = 0;
    sorted.forEach(tx => {
      const amt = numOr(tx.amount);
      const fee = numOr(tx.fee);
      if(tx.normalizedDate < cutoff) {
        // Before range — accumulate into starting balance
        startBTC += txPortfolioDelta(tx);
      } else {
        // In range — track each category. Transfers to or from an untracked wallet move the
        // total too (see txPortfolioDelta), so they get bars of their own.
        if(tx.type==='Buy') buys += amt;
        else if(tx.type==='Reward') rewards += amt;
        else if(tx.type==='Sell') sells += amt;
        else if(tx.type==='Transfer' && tx.wallet && !tx.wallet2) sentOut += amt;
        else if(tx.type==='Transfer' && !tx.wallet && tx.wallet2) received += amt;
        const paysFee = tx.type==='Consolidation' || (tx.type==='Transfer' && (tx.wallet || !tx.wallet2));
        if(fee > 0 && paysFee) fees += fee;
      }
    });
    const endBTC = startBTC + buys + rewards + received - sells - sentOut - fees;
    return { startBTC: +startBTC.toFixed(8), buys: +buys.toFixed(8), rewards: +rewards.toFixed(8), received: +received.toFixed(8), sells: +sells.toFixed(8), sentOut: +sentOut.toFixed(8), fees: +fees.toFixed(8), endBTC: +endBTC.toFixed(8) };
  }, [transactions, settings.chartRange, settings.chartRangeCustom]);

  // Price overlay data for Accumulated BTC chart
  const priceOverlayData = React.useMemo(() => {
    if(!historicalPrices || !Object.keys(historicalPrices).length) return [];
    const chartDates = rangeFiltered.accumulated;
    if(!chartDates.length) return [];
    const minDate = chartDates[0].date;
    const maxDate = chartDates[chartDates.length-1].date;
    return Object.entries(historicalPrices)
      .filter(([d]) => d >= minDate && d <= maxDate)
      .sort((a,b) => a[0].localeCompare(b[0]))
      .map(([date, price]) => ({ date, price }));
  }, [historicalPrices, rangeFiltered.accumulated]);

  // BTC Price with 200D & 200W Moving Averages.
  // Split in two on purpose: the series (a sort over ~4,200 keys plus the full MA/RSI build) now
  // depends only on the price data, so switching 1Y→3M just re-filters instead of rebuilding it.
  const maSeries = React.useMemo(() => {
    if(!historicalPrices || !Object.keys(historicalPrices).length) return [];
    const allDays = Object.entries(historicalPrices).sort((a,b)=>a[0].localeCompare(b[0]));
    if(allDays.length < 200) return [];
    return buildMovingAverageSeries(allDays);
  }, [historicalPrices]);
  const maChartData = React.useMemo(() => {
    const cutoff = rangeCutoff(settings.chartRange, settings.chartRangeCustom);
    return cutoff ? maSeries.filter(d => d.date >= cutoff) : maSeries;
  }, [maSeries, settings.chartRange, settings.chartRangeCustom]);

  // Sample data for empty state
  const isSample = !chartData.length;
  const sampleChartData = React.useMemo(() => {
    if(!isSample) return {};
    const today = new Date();
    const pts = [], dcaPts = [], feePts = [], rewardPts = [], plPts = [], monthlyPts = [], priceOverlayPts = [], valueBasisPts = [];
    const samplePriceForMonth = (idx) => {
      const trend = 18000 + (24 - idx) * 2200;
      const cycle = Math.sin(idx * 0.55) * 11000;
      const noise = Math.cos(idx * 0.18) * 4500;
      return +(trend + cycle + noise).toFixed(2);
    };
    let btc = 0, cost = 0, fees = 0, rewards = 0, realized = 0;
    for(let i = 24; i >= 0; i--) {
      const d = new Date(today.getFullYear(), today.getMonth() - i, 15);
      const date = localDateKey(d);
      const month = date.slice(0,7);
      const price = samplePriceForMonth(i);
      const buyAmt = 0.01 + Math.random()*0.04;
      const buyUsd = +(buyAmt * price).toFixed(2);
      btc += buyAmt;
      cost += buyUsd;
      const fee = +(Math.random()*0.00005).toFixed(8);
      fees += fee;
      if(i % 4 === 0) { const r = +(0.0001+Math.random()*0.0003).toFixed(8); rewards += r; btc += r; }
      if(i === 8) { const sellAmt = 0.05; const sellUsd = +(sellAmt*price).toFixed(2); const avgCost = cost/btc; realized += sellUsd - sellAmt*avgCost; cost -= avgCost*sellAmt; btc -= sellAmt; }
      const avgCost = btc > 0 ? +(cost/btc).toFixed(2) : null;
      const mktVal = btc * price;
      const unrealized = +(mktVal - cost).toFixed(2);
      pts.push({ date, btc:+btc.toFixed(8), avgCost });
      priceOverlayPts.push({ date, price });
      dcaPts.push({ date, buyUsd });
      feePts.push({ date, fees: +fees.toFixed(8) });
      rewardPts.push({ date, rewards: +rewards.toFixed(8) });
      plPts.push({ date, realized: +realized.toFixed(2), unrealized, totalPL: +(realized+unrealized).toFixed(2) });
      valueBasisPts.push({ date, marketValue: +mktVal.toFixed(2), costBasis: +cost.toFixed(2) });
      monthlyPts.push({ date, month, label: fmtMonthLabel(month), buys: buyUsd, sells: 0, rewards: 0, fees: 0 });
    }
    const totalDays = 1700;
    const start = new Date(today);
    start.setDate(start.getDate() - (totalDays - 1));
    const dailyPrices = [];
    for(let i = 0; i < totalDays; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const date = localDateKey(d);
      const trend = 14000 + i * 34;
      const longCycle = Math.sin(i / 82) * 10500;
      const shortCycle = Math.cos(i / 19) * 2200;
      const price = +(trend + longCycle + shortCycle).toFixed(2);
      dailyPrices.push([date, price]);
    }
    const movingAvgPts = buildMovingAverageSeries(dailyPrices);
    return {
      chart: pts,
      dca: dcaPts,
      fees: feePts,
      rewards: rewardPts,
      pl: plPts,
      monthly: monthlyPts,
      priceOverlay: priceOverlayPts,
      movingAvg: movingAvgPts,
      valueBasis: valueBasisPts,
      waterfall: { startBTC: +(pts[0]?.btc||0).toFixed(8), buys: 0.65, rewards: 0.003, sells: 0.05, fees: 0.0002, endBTC: +(pts[pts.length-1]?.btc||0).toFixed(8) },
    };
  }, [isSample]);

  const sc = isSample ? sampleChartData : null;

  const fmtCompactUSD = (v) => {
    const abs = Math.abs(v);
    if(abs >= 1000000) return '$'+(v/1000000).toFixed(1).replace(/\.0$/,'')+'M';
    if(abs >= 1000) return '$'+(v/1000).toFixed(0)+'k';
    return '$'+Math.round(v);
  };

  const visibleChart = isSample ? sc.chart : rangeFiltered.accumulated;
  const chartRangeVal = settings.chartRange || 'All';
  const hc = settings.hiddenCharts || {};
  const effectiveHiddenCharts = isSample && hc.monthly === undefined ? { ...hc, monthly: true } : hc;
  const ml = settings.maLines || {};
  const effectiveMaLines = isSample && ml.rsi14 === undefined ? { ...ml, rsi14: false } : ml;
  const rsiThresholds = normalizeRsiThresholds(settings.rsiThresholds);
  const _costData = isSample ? sc.chart.filter(d=>d.avgCost!==null) : costData;
  const _dca = isSample ? sc.dca : rangeFiltered.dca;
  const _fees = isSample ? sc.fees : rangeFiltered.fees;
  const _rewards = isSample ? sc.rewards : rangeFiltered.rewards;
  const _pl = isSample ? sc.pl : plChartData;
  const _monthly = isSample ? sc.monthly : rangeFiltered.monthly;
  const _valueBasis = isSample ? sc.valueBasis : valueBasisData;
  const _waterfall = isSample ? sc.waterfall : waterfallData;
  const _priceOverlay = isSample ? sc.priceOverlay : priceOverlayData;
  const hasLiveMovingAvg = maChartData.length > 0;
  const _movingAvg = hasLiveMovingAvg ? maChartData : (isSample ? sc.movingAvg : maChartData);
  const walletFilterSelection = (settings.dashboardWalletFilter || []).filter(name => activeWallets.some(w => w.name === name));
  const noFilteredData = hasWalletFilter && !visibleChart.length && !_dca.length && !_fees.length && !_rewards.length && !_monthly.length;
  const S = isSample || undefined; // sampleData prop
  const toggleWalletFilter = (name) => {
    const current = new Set(walletFilterSelection);
    if(current.has(name)) current.delete(name);
    else current.add(name);
    updateSettings({ dashboardWalletFilter: [...current] });
  };
  const renderFilteredEmptyCard = (title) => (
    <div className="card">
      <div className="card-header" style={{alignItems:'center'}}>
        <div style={{display:'flex',alignItems:'center',gap:'.5rem',flexWrap:'wrap'}}>
          <div className="card-title">{title}</div>
          <span className="scope-badge">Selected wallets</span>
        </div>
      </div>
      <div className="card-body" style={{color:'var(--text-secondary)',fontSize:'.875rem'}}>
        No activity for the selected wallets in this time range.
      </div>
    </div>
  );

  return (
    <>
    {isSample && (
      <div style={{background:'var(--bg-secondary)',border:'1px solid var(--border-color)',borderRadius:12,padding:'1rem 1.25rem',marginBottom:'1rem',display:'flex',alignItems:'center',gap:'.75rem',flexWrap:'wrap'}}>
        <span style={{color:'var(--text-tertiary)',display:'flex'}}>{Icon.Info({width:20,height:20})}</span>
        <div>
          <div style={{fontWeight:600,fontSize:'.9375rem',color:'var(--text-primary)'}}>Sample Charts</div>
          <div style={{fontSize:'.8125rem',color:'var(--text-secondary)',marginTop:'.125rem'}}>These charts use sample data to preview available visualizations. Add your first transaction to see your real portfolio.</div>
        </div>
      </div>
    )}
    {!isSample && <>
      <div className="dashboard-filter-row">
        <div className="dashboard-filter-label">
          <strong>Dashboard Wallets</strong>
          <span>{hasWalletFilter ? `${walletFilterSelection.length} selected` : 'All active wallets'}</span>
        </div>
        <div className="dashboard-filter-actions">
          <button className={hasWalletFilter ? 'btn btn-secondary btn-sm' : 'btn btn-primary btn-sm'} onClick={() => updateSettings({ dashboardWalletFilter: [] })}>All</button>
        </div>
        <div className="dashboard-wallet-chips">
          {activeWallets.map(wallet => (
            <button
              key={wallet.id}
              className={`wallet-chip ${walletFilterSelection.includes(wallet.name) ? 'active' : ''}`}
              onClick={() => toggleWalletFilter(wallet.name)}
              title={wallet.type}
            >
              <span>{wallet.name}</span>
            </button>
          ))}
        </div>
      </div>
      <div className="dashboard-range-row">
        {['3M','6M','1Y','5Y','YTD','All','Custom'].map(r => (
          <button key={r} onClick={() => updateSettings({ chartRange: r })}
            className={chartRangeVal===r ? 'btn btn-primary' : 'btn btn-secondary'}
            style={{padding:'.25rem .75rem',fontSize:'.75rem'}}>
            {r}
          </button>
        ))}
        {chartRangeVal === 'Custom' && (
          <input type="date"
            value={settings.chartRangeCustom || ''}
            onChange={e => updateSettings({ chartRangeCustom: e.target.value })}
            style={{padding:'.25rem .5rem',fontSize:'.75rem',borderRadius:'8px',
              border:'1px solid var(--border-color)',background:'var(--bg-secondary)',
              color:'var(--text-primary)',fontFamily:'inherit'}}
          />
        )}
      </div>
      {noFilteredData && (
        <div style={{background:'var(--bg-secondary)',border:'1px solid var(--border-color)',borderRadius:12,padding:'1rem 1.25rem',marginBottom:'1rem',fontSize:'.8125rem',color:'var(--text-secondary)'}}>
          No dashboard activity for the selected wallets in this date range.
        </div>
      )}
    </>}
    {(() => {
      const chartRenderers = {
        accumulatedBtc: () => visibleChart.length > 0 ? <SVGChart sampleData={S}
          data={visibleChart} dataKey="btc" title="Accumulated BTC"
          subtitle={visibleChart[visibleChart.length-1]?.btc.toFixed(8)+' BTC total'}
          scopeLabel={filteredScopeLabel}
          color="#f7931a" formatY={v=>v.toFixed(2)}
          formatTooltip={(v)=>{ const usd = btcPrice ? ' · $'+Math.round(v*btcPrice).toLocaleString() : ''; return v.toFixed(8)+' BTC'+usd; }}
          fillGradient={true}
          overlay={_priceOverlay.length > 0 ? { data: _priceOverlay, dataKey: 'price', color: '#6b7280', formatY: fmtCompactUSD, formatTooltip: v => '$'+Math.round(v).toLocaleString(), label: 'BTC Price' } : undefined}
        /> : (hasWalletFilter ? renderFilteredEmptyCard('Accumulated BTC') : null),
        costBasis: () => _costData.length > 1 ? <SVGChart sampleData={S}
          data={_costData} dataKey="avgCost" title="Average Cost Basis"
          subtitle={fmtUSD(_costData[_costData.length-1]?.avgCost||0)+' / BTC'}
          scopeLabel={globalScopeLabel}
          color="#2563eb" formatY={v=>'$'+Math.round(v/1000)+'k'}
          formatTooltip={(v)=>'$'+Math.round(v).toLocaleString()+' avg cost'}
          refLine={isSample?undefined:btcPrice} refLineColor="#16a34a" refLineLabel={isSample?undefined:'Now $'+Math.round(btcPrice||0).toLocaleString()}
        /> : null,
        valueBasis: () => _valueBasis.length > 1 ? <SVGChart sampleData={S}
          data={_valueBasis} dataKey="marketValue" title="Portfolio Value vs Cost Basis"
          subtitle={(() => { const last = _valueBasis[_valueBasis.length-1]; if(!last) return ''; const diff = last.marketValue - last.costBasis; return fmtUSD(last.marketValue) + ' value · ' + (diff>=0?'+':'') + fmtUSD(diff) + ' P&L'; })()}
          scopeLabel={globalScopeLabel}
          color="#16a34a" formatY={fmtCompactUSD}
          formatTooltip={v => fmtUSD(v) + ' market value'}
          fillGradient={true}
          lines={[{ dataKey:'costBasis', color:'#2563eb', label:'Cost Basis', dashed: true, formatTooltip: v => fmtUSD(v) + ' invested' }]}
        /> : (historicalPriceLoading ? <div className="card"><div className="card-header"><div className="card-title">Portfolio Value vs Cost Basis</div><div style={{fontSize:'.8125rem',color:'var(--text-secondary)',fontFamily:'JetBrains Mono'}}>Loading…</div></div></div> : null),
        dca: () => _dca.length > 0 ? <SVGChart sampleData={S}
          data={_dca} dataKey="buyUsd" title="DCA Tracker"
          subtitle={fmtUSD(_dca.reduce((s,d)=>s+d.buyUsd,0))+' total invested'}
          scopeLabel={filteredScopeLabel}
          color="#10b981" chartType="bar" formatY={fmtCompactUSD}
          formatTooltip={v => '$'+Math.round(v).toLocaleString()+' bought'}
        /> : (hasWalletFilter ? renderFilteredEmptyCard('DCA Tracker') : null),
        pl: () => _pl.length > 1 ? <SVGChart sampleData={S}
          data={_pl} dataKey="totalPL" title="Realized vs Unrealized P&L"
          subtitle={(_pl[_pl.length-1]?.totalPL>=0?'+':'')+fmtUSD(_pl[_pl.length-1]?.totalPL||0)+' total P&L'}
          scopeLabel={globalScopeLabel}
          color={_pl[_pl.length-1]?.totalPL>=0 ? '#16a34a' : '#dc2626'}
          formatY={v => { const sign=v>0?'+':v<0?'-':''; const abs=Math.abs(v); if(abs>=1000000) return sign+'$'+(abs/1000000).toFixed(1).replace(/\.0$/,'')+'M'; if(abs>=1000) return sign+'$'+Math.round(abs/1000)+'k'; if(abs>=1) return sign+'$'+Math.round(abs); return '$0'; }}
          formatTooltip={v => (v>=0?'+':'-')+'$'+Math.round(Math.abs(v)).toLocaleString()}
          refLine={0} refLineColor="var(--text-tertiary)" refLineLabel="Break even"
        /> : null,
        waterfall: () => (_waterfall.buys > 0 || _waterfall.rewards > 0 || _waterfall.sells > 0 || _waterfall.fees > 0 || _waterfall.received > 0 || _waterfall.sentOut > 0 || _waterfall.startBTC > 0) ? <WaterfallChart data={_waterfall} btcPrice={btcPrice} sampleData={S} scopeLabel={globalScopeLabel} /> : null,
        feeBurn: () => _fees.length > 0 ? <SVGChart sampleData={S}
          data={_fees} dataKey="fees" title="Cumulative Fee Burn"
          subtitle={_fees[_fees.length-1]?.fees.toFixed(8)+' BTC in fees'}
          scopeLabel={filteredScopeLabel}
          color="#ef4444" formatY={v=>v.toFixed(4)} formatTooltip={v => v.toFixed(8)+' BTC lost to fees'} fillGradient={true}
        /> : (hasWalletFilter ? renderFilteredEmptyCard('Cumulative Fee Burn') : null),
        rewards: () => _rewards.length > 0 ? <SVGChart sampleData={S}
          data={_rewards} dataKey="rewards" title="Reward Income"
          subtitle={_rewards[_rewards.length-1]?.rewards.toFixed(8)+' BTC earned'}
          scopeLabel={filteredScopeLabel}
          color="#8b5cf6" formatY={v=>v.toFixed(4)}
          formatTooltip={v => { const usd = btcPrice ? ' · $'+Math.round(v*btcPrice).toLocaleString() : ''; return v.toFixed(8)+' BTC'+usd; }}
          fillGradient={true}
        /> : (hasWalletFilter ? renderFilteredEmptyCard('Reward Income') : null),
        monthly: () => _monthly.length > 0 ? <SVGChart sampleData={S}
          data={_monthly} dataKey="buys" title="Monthly Summary"
          subtitle={_monthly.length+' months of activity'}
          scopeLabel={filteredScopeLabel}
          color="#0ea5e9" chartType="bar" formatY={fmtCompactUSD}
          formatTooltip={v => '$'+Math.round(v).toLocaleString()+' bought'}
        /> : (hasWalletFilter ? renderFilteredEmptyCard('Monthly Summary') : null),
        movingAvg: () => _movingAvg.length > 0 ? <SVGChart sampleData={isSample && !hasLiveMovingAvg ? S : undefined}
          data={_movingAvg} dataKey="price" title="BTC Price & Moving Averages"
          subtitle={fmtUSD(_movingAvg[_movingAvg.length-1]?.price||0)+' current'}
          scopeLabel={globalScopeLabel}
          color="#f7931a" formatY={fmtCompactUSD} formatTooltip={v => '$'+Math.round(v).toLocaleString()} publicData
          overlay={(() => {
            if((effectiveMaLines.rsi14===false) || !_movingAvg.some(d=>d.rsi14!=null)) return undefined;
            const rsiData = _movingAvg.filter(d=>d.rsi14!=null);
            const latestRsi = rsiData[rsiData.length-1]?.rsi14 ?? null;
            const activeRefLines = [
              ...(rsiThresholds.overbought != null ? [{ value: rsiThresholds.overbought, color: RSI_ZONE_COLORS.overbought, label: 'RSI Overbought' }] : []),
              ...(rsiThresholds.oversold != null ? [{ value: rsiThresholds.oversold, color: RSI_ZONE_COLORS.oversold, label: 'RSI Oversold' }] : []),
            ];
            return {
              data: rsiData,
              dataKey: 'rsi14',
              color: getRsiColor(latestRsi, rsiThresholds),
              formatY: v => Math.round(v),
              formatTooltip: v => 'RSI: '+v.toFixed(1),
              label: 'RSI (14)',
              getValueColor: v => getRsiColor(v, rsiThresholds),
              getLegendColor: () => getRsiColor(latestRsi, rsiThresholds),
              refLines: activeRefLines,
            };
          })()}
          lines={[
            ...((effectiveMaLines.ma50d!==false) && _movingAvg.some(d=>d.ma50d!=null) ? [{ dataKey:'ma50d', color:'#ef4444', label:'50D MA', dashed:false, formatTooltip:v=>'50D: $'+Math.round(v).toLocaleString() }] : []),
            ...((effectiveMaLines.ma200d!==false) && _movingAvg.some(d=>d.ma200d!=null) ? [{ dataKey:'ma200d', color:'#a855f7', label:'200D MA', dashed:false, formatTooltip:v=>'200D: $'+Math.round(v).toLocaleString() }] : []),
            ...((effectiveMaLines.ma200w!==false) && _movingAvg.some(d=>d.ma200w!=null) ? [{ dataKey:'ma200w', color:'#06b6d4', label:'200W MA', dashed:false, formatTooltip:v=>'200W: $'+Math.round(v).toLocaleString() }] : []),
          ]}
        /> : null,
      };
      const order = settings.chartOrder || DEFAULT_CHART_ORDER;
      const reconciledOrder = [...order.filter(k => DEFAULT_CHART_ORDER.includes(k)), ...DEFAULT_CHART_ORDER.filter(k => !order.includes(k))];
      return (
        <div className="charts-grid" style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(340px,1fr))',gridAutoFlow:'dense',gap:'1rem'}}>
          {reconciledOrder.map(key => !effectiveHiddenCharts[key] && chartRenderers[key] ? <React.Fragment key={key}>{chartRenderers[key]()}</React.Fragment> : null)}
        </div>
      );
    })()}
    </>
  );
}

function WaterfallChart({ data, btcPrice, sampleData, scopeLabel }) {
  const [hover, setHover] = React.useState(null);
  const [mouse, setMouse] = React.useState({x:0,y:0});
  const [expanded, setExpanded] = React.useState(false);
  const handleMove = useThrottledCallback((e) => setMouse({x:e.clientX,y:e.clientY}), 32);
  const { startBTC, buys, rewards, sells, fees, endBTC } = data;
  const received = data.received || 0, sentOut = data.sentOut || 0;
  const bars = [
    { key:'start', label:'Start', value: startBTC, color:'#6b7280', isTotal: true },
    { key:'buys', label:'Buys', value: buys, color:'#16a34a', direction: 1 },
    { key:'rewards', label:'Rewards', value: rewards, color:'#8b5cf6', direction: 1 },
    // Transfers to/from untracked wallets: only shown when there are any
    ...(received > 0 ? [{ key:'received', label:'Received', value: received, color:'#0891b2', direction: 1 }] : []),
    { key:'sells', label:'Sells', value: sells, color:'#dc2626', direction: -1 },
    ...(sentOut > 0 ? [{ key:'sentOut', label:'Sent out', value: sentOut, color:'#b45309', direction: -1 }] : []),
    { key:'fees', label:'Fees', value: fees, color:'#ef4444', direction: -1 },
    { key:'end', label:'End', value: endBTC, color:'#f7931a', isTotal: true },
  ];
  let running = startBTC;
  const positioned = bars.map(bar => {
    if(bar.isTotal) {
      const r = { ...bar, bottom: 0, top: bar.value };
      if(bar.key === 'end') running = endBTC;
      return r;
    }
    const bottom = bar.direction > 0 ? running : running - bar.value;
    const top = bar.direction > 0 ? running + bar.value : running;
    running = bar.direction > 0 ? running + bar.value : running - bar.value;
    return { ...bar, bottom, top };
  });
  const maxVal = Math.max(...positioned.map(b => b.top), 0.00000001);
  const netChange = endBTC - startBTC;
  const netPct = startBTC > 0.00000001 ? ((netChange / startBTC) * 100).toFixed(1) : '—';
  const subtitle = (netChange >= 0 ? '+' : '') + netChange.toFixed(8) + ' BTC (' + (netChange >= 0 ? '+' : '') + netPct + '%)';
  const niceStep = (range, count) => { if(!range||range<=0) return 0.01; const rough=range/count; const mag=Math.pow(10,Math.floor(Math.log10(rough))); const norm=rough/mag; const nice=norm<=1.5?1:norm<=3?2:norm<=7?5:10; return nice*mag; };

  const renderSVG = (isExp) => {
    const W = isExp?960:480, H = isExp?400:180, PL = isExp?64:58, PR = isExp?20:16, PT = isExp?12:8, PB = isExp?36:32;
    const iW = W-PL-PR, iH = H-PT-PB;
    const barCount = positioned.length;
    const gap = iW * 0.08 / (barCount - 1 || 1);
    const barW = (iW - gap * (barCount - 1)) / barCount;
    const yScale = v => PT + iH - (v / maxVal) * iH;
    const step = niceStep(maxVal, isExp?8:4);
    const ticks = [];
    for(let v = 0; v <= maxVal + step * 0.01 && ticks.length < (isExp?16:12); v += step) ticks.push(+v.toPrecision(10));
    const fontSize = isExp ? 11 : 9;
    const valFontSize = isExp ? 10 : 8;
    const rx = isExp ? 4 : 3;
    return (
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:'block',overflow:'visible'}}
        role="img" aria-label={`BTC Flow Waterfall — ${subtitle}`}
        onMouseLeave={() => setHover(null)}>
        {ticks.map(v => (
          <React.Fragment key={v}>
            <line x1={PL} x2={W-PR} y1={yScale(v)} y2={yScale(v)} stroke="var(--border-color)" strokeWidth="0.5" strokeDasharray="3,3"/>
            <text x={PL-6} y={yScale(v)+3} textAnchor="end" fontSize={fontSize} fill="var(--text-tertiary)" fontFamily="JetBrains Mono">{v.toFixed(v>=0.01?2:4)}</text>
          </React.Fragment>
        ))}
        {positioned.map((bar, i) => {
          const x = PL + i * (barW + gap);
          const yTop = yScale(bar.top);
          const yBot = yScale(bar.bottom);
          const barH = Math.max(yBot - yTop, 1);
          return (
            <React.Fragment key={bar.key}>
              <rect x={x} y={yTop} width={barW} height={barH} rx={rx} fill={bar.color} opacity={hover===i?1:0.85}
                onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)} style={{cursor:'default'}}/>
              {i < positioned.length - 1 && (
                <line x1={x + barW} x2={x + barW + gap} y1={yScale(bar.isTotal ? bar.top : (bar.direction > 0 ? bar.top : bar.bottom))} y2={yScale(bar.isTotal ? bar.top : (bar.direction > 0 ? bar.top : bar.bottom))}
                  stroke="var(--text-tertiary)" strokeWidth="1" strokeDasharray="3,2" opacity="0.5"/>
              )}
              <text x={x + barW/2} y={H - PB + (isExp?18:14)} textAnchor="middle" fontSize={fontSize} fill="var(--text-secondary)" fontFamily="JetBrains Mono">{bar.label}</text>
              <text x={x + barW/2} y={yTop - (isExp?6:4)} textAnchor="middle" fontSize={valFontSize} fill="var(--text-tertiary)" fontFamily="JetBrains Mono">
                {bar.isTotal ? bar.value.toFixed(isExp?8:4) : (bar.direction > 0 ? '+' : '-') + bar.value.toFixed(isExp?8:4)}
              </text>
            </React.Fragment>
          );
        })}
      </svg>
    );
  };

  const renderTooltip = () => hover !== null ? (
    <div style={{position:'fixed',left:mouse.x+12,top:mouse.y-10,background:'var(--bg-primary)',border:'1px solid var(--border-color)',borderRadius:8,padding:'.375rem .625rem',fontSize:'.75rem',fontFamily:'JetBrains Mono',pointerEvents:'none',zIndex:9999,boxShadow:'0 4px 12px rgba(0,0,0,.15)'}}>
      <div style={{fontWeight:600,color:positioned[hover].color}}>{positioned[hover].label}</div>
      <div style={{color:'var(--text-primary)'}}>{positioned[hover].value.toFixed(8)} BTC</div>
      {btcPrice > 0 && <div style={{color:'var(--text-secondary)'}}>${Math.round(positioned[hover].value * btcPrice).toLocaleString()}</div>}
    </div>
  ) : null;

  return (
    <div className="card" style={sampleData?{opacity:.7}:{}}>
      <div className="card-header" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between'}}>
        <div>
          <div style={{display:'flex',alignItems:'center',gap:'.5rem',flexWrap:'wrap'}}>
            <div className="card-title">BTC Flow Waterfall</div>
            {scopeLabel && <span className="scope-badge">{scopeLabel}</span>}
          </div>
          <div style={{fontSize:'.8125rem',color:netChange>=0?'#16a34a':'#dc2626',fontFamily:'JetBrains Mono'}}>{subtitle}</div>
        </div>
        {sampleData && <span className="sample-badge">Sample</span>}
        {!sampleData && <button onClick={()=>{setHover(null);setExpanded(true);}} title="Expand chart" aria-label="Expand chart"
          style={{background:'none',border:'none',cursor:'pointer',padding:'6px',color:'var(--text-tertiary)',flexShrink:0,marginTop:'2px'}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
          </svg>
        </button>}
      </div>
      <div className="card-body" style={{paddingTop:'.25rem',paddingBottom:'.5rem'}} onMouseMove={handleMove}>
        {renderSVG(false)}
        {!expanded && renderTooltip()}
      </div>
      {expanded && (
        <ExpandedChartOverlay onClose={()=>{setExpanded(false);setHover(null);}}>
          {(titleId)=>(<>
            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',padding:'1.25rem 1.5rem .5rem'}}>
              <div>
                <div style={{display:'flex',alignItems:'center',gap:'.5rem',flexWrap:'wrap'}}>
                  <div id={titleId} style={{fontSize:'1.125rem',fontWeight:700,color:'var(--text-primary)'}}>BTC Flow Waterfall</div>
                  {scopeLabel && <span className="scope-badge">{scopeLabel}</span>}
                </div>
                <div style={{fontSize:'.875rem',color:netChange>=0?'#16a34a':'#dc2626',fontFamily:'JetBrains Mono'}}>{subtitle}</div>
              </div>
              <button type="button" onClick={()=>{setExpanded(false);setHover(null);}} title="Close" aria-label="Close expanded chart"
                style={{background:'none',border:'none',cursor:'pointer',padding:'4px',color:'var(--text-secondary)',fontSize:'1.25rem',lineHeight:1}}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
              </button>
            </div>
            <div style={{padding:'0 1.5rem 1.25rem'}} onMouseMove={handleMove}>
              {renderSVG(true)}
              {renderTooltip()}
            </div>
          </>)}
        </ExpandedChartOverlay>
      )}
    </div>
  );
}

function PieChart({ segments, totalBTC, btcPrice }) {
  const [hover, setHover] = React.useState(null);
  const [mouse, setMouse] = React.useState({x:0,y:0});
  const R = 90, SIZE = R * 2 + 4, CENTER = SIZE / 2;
  const handleMove = useThrottledCallback((e) => setMouse({x:e.clientX,y:e.clientY}), 32);
  // Build pie wedge paths
  let angle = -Math.PI / 2;
  const wedges = segments.map((seg, i) => {
    const sweep = seg.pct * 2 * Math.PI;
    const x1 = CENTER + R * Math.cos(angle);
    const y1 = CENTER + R * Math.sin(angle);
    const x2 = CENTER + R * Math.cos(angle + sweep);
    const y2 = CENTER + R * Math.sin(angle + sweep);
    const largeArc = sweep > Math.PI ? 1 : 0;
    const d = `M${CENTER},${CENTER} L${x1},${y1} A${R},${R} 0 ${largeArc} 1 ${x2},${y2} Z`;
    angle += sweep;
    return { ...seg, d, idx: i };
  });
  return (
    <div className="donut-chart-container" onMouseMove={handleMove}>
      <div className="donut-chart-wrap" style={{width:SIZE,height:SIZE}}>
        <svg viewBox={`0 0 ${SIZE} ${SIZE}`} width={SIZE} height={SIZE}
          role="img" aria-label={`Holdings by wallet: ${segments.map(s=>`${s.name} ${fmtBTC(s.btc)} ${btcUnit()}`).join(', ')}`}>
          {wedges.map((w,i) => (
            <path key={w.name} d={w.d} fill={w.color}
              className="donut-segment"
              style={{opacity:hover!==null&&hover!==i?.4:1}}
              onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)}
            />
          ))}
        </svg>
      </div>
      <div className="donut-legend">
        {segments.map((seg,i) => (
          <div key={seg.name} className="donut-legend-item"
            onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)}
            style={{fontWeight:hover===i?600:'normal'}}>
            <span className="donut-legend-dot" style={{background:seg.color}} />
            {seg.name}
          </div>
        ))}
      </div>
      <div className="pie-total" style={{textAlign:'center',fontFamily:'JetBrains Mono,monospace',fontWeight:700,fontSize:'1rem',color:'var(--bitcoin-orange)'}}>
        {fmtBTC(totalBTC)} {btcUnit()}
      </div>
      {hover !== null && segments[hover] && ReactDOM.createPortal(
        <div className="donut-tooltip" style={{left:mouse.x+12,top:mouse.y-10}}>
          <div className="dt-name">{segments[hover].name}</div>
          <div className="dt-type">{segments[hover].type}</div>
          <div className="dt-row"><span className="dt-label">{btcUnit()}</span><span className="dt-value">{fmtBTC(segments[hover].amount)}</span></div>
          {btcPrice && <div className="dt-row"><span className="dt-label">USD</span><span className="dt-value">{fmtUSD(segments[hover].amount*btcPrice)}</span></div>}
          <div className="dt-row"><span className="dt-label">Share</span><span className="dt-value dt-pct">{(segments[hover].pct*100).toFixed(1)}%</span></div>
        </div>,
        document.body
      )}
    </div>
  );
}

function InfoTip({ text, position }) {
  const [show, setShow] = React.useState(false);
  const ref = React.useRef(null);
  const [pos, setPos] = React.useState('bottom');
  React.useEffect(() => {
    if(show && ref.current && !position) {
      const r = ref.current.getBoundingClientRect();
      setPos(r.top < 80 ? 'bottom' : 'top');
    }
  }, [show, position]);
  // The trigger is a real <button>, not a styled <span>: it was previously mouse-only, so
  // keyboard and touch users could not read any of these explanations — including the
  // "holdings only include active wallets" note that explains a genuinely confusing number.
  const tipId = React.useMemo(() => 'infotip-' + Math.random().toString(36).slice(2,9), []);
  return (
    <span ref={ref} style={{position:'relative',display:'inline-flex',lineHeight:0,flexShrink:0}}
      onMouseEnter={()=>setShow(true)} onMouseLeave={()=>setShow(false)}>
      <button
        type="button"
        aria-label="More information"
        aria-describedby={show ? tipId : undefined}
        aria-expanded={show}
        onFocus={()=>setShow(true)}
        onBlur={()=>setShow(false)}
        onClick={(e)=>{ e.preventDefault(); setShow(s=>!s); }}
        onKeyDown={(e)=>{ if(e.key==='Escape' && show) { e.stopPropagation(); setShow(false); } }}
        className="info-tip-btn"
        style={{background:'none',border:'none',padding:0,margin:0,lineHeight:0,color:'var(--text-tertiary)',cursor:'help',display:'inline-flex'}}
      >
        {Icon.Info({width:14,height:14})}
      </button>
      {show && <div id={tipId} role="tooltip" style={{
        position:'absolute',left:'50%',transform:'translateX(-50%)',
        [(position||pos)==='top'?'bottom':'top']:'calc(100% + 6px)',
        background:'var(--bg-secondary)',color:'var(--text-secondary)',
        fontSize:'.75rem',lineHeight:'1.4',padding:'.5rem .625rem',borderRadius:'8px',
        border:'1px solid var(--border-color)',boxShadow:'0 4px 12px rgba(0,0,0,.15)',
        width:'max-content',maxWidth:'220px',zIndex:10,pointerEvents:'none',
        whiteSpace:'normal',fontWeight:400,
      }}>{text}</div>}
    </span>
  );
}

function SVGChart({ data, dataKey, title, subtitle, color, formatY, formatTooltip, fillGradient, refLine, refLineColor, refLineLabel, chartType, overlay, lines, publicData, sampleData, scopeLabel }) {
  const [tooltip, setTooltip] = React.useState(null);
  const [expanded, setExpanded] = React.useState(false);
  const svgRef = React.useRef(null);
  const expandedSvgRef = React.useRef(null);
  const isBar = chartType === 'bar';
  const hasOverlay = overlay && overlay.data && overlay.data.length > 0;
  const overlayGetValueColor = hasOverlay && typeof overlay.getValueColor === 'function'
    ? overlay.getValueColor
    : () => overlay?.color;
  const overlayLegendColor = hasOverlay && typeof overlay.getLegendColor === 'function'
    ? overlay.getLegendColor()
    : overlay?.color;
  const W=480, H=180, PL=58, PR=hasOverlay?52:16, PT=8, PB=32;
  const iW=W-PL-PR, iH=H-PT-PB;

  const hasLines = lines && lines.length > 0;
  const vals = data.map(d=>d[dataKey]);
  // Include line values in Y scale
  let minV = isBar ? 0 : Math.min(...vals);
  let maxV = Math.max(...vals);
  if(hasLines) {
    lines.forEach(ln => {
      data.forEach(d => { if(d[ln.dataKey]!=null) { minV=Math.min(minV,d[ln.dataKey]); maxV=Math.max(maxV,d[ln.dataKey]); } });
    });
  }

  // include refLine in Y scale if present
  const yMin = refLine!=null ? Math.min(minV, refLine-(Math.abs(refLine)*0.03||maxV*0.03)) : minV;
  const yMax = refLine!=null ? Math.max(maxV, refLine+(Math.abs(refLine)*0.03||maxV*0.03)) : maxV;
  const yRange = yMax-yMin || 1;

  // Nice tick step helper
  const niceStep = (range, count) => {
    if(!range || !isFinite(range) || range<=0) return 1;
    const rough = range / count;
    if(!rough || !isFinite(rough) || rough<=0) return 1;
    const mag = Math.pow(10, Math.floor(Math.log10(rough)));
    const norm = rough / mag;
    const nice = norm<=1.5?1:norm<=3?2:norm<=7?5:10;
    return nice * mag;
  };

  // Time-based X scale. Memoized because it allocates a Date per data point — the price/MA
  // chart carries ~4,000 of them, and every throttled tooltip frame re-rendered this component.
  // Noon-LOCAL is load-bearing for the tick labels; don't switch this to UTC parsing.
  const timestamps = React.useMemo(() => data.map(d=>new Date(d.date+'T12:00:00').getTime()), [data]);
  const tMin = timestamps[0], tMax = timestamps[timestamps.length-1];
  const tRange = tMax - tMin || 1;
  const xScale = i => PL + ((timestamps[i]-tMin)/tRange)*iW;
  const yScale = v => PT + iH - ((v-yMin)/yRange)*iH;

  // Overlay scales
  const oTimestamps = React.useMemo(
    () => hasOverlay ? overlay.data.map(d=>new Date(d.date+'T12:00:00').getTime()) : [],
    [hasOverlay, overlay?.data]
  );
  const oVals = hasOverlay ? overlay.data.map(d=>d[overlay.dataKey]) : [];
  const overlayRefLines = hasOverlay && Array.isArray(overlay.refLines) ? overlay.refLines : [];
  const overlayRefVals = overlayRefLines.map(ln => ln.value).filter(v => Number.isFinite(v));
  const oMin = hasOverlay ? Math.min(...oVals, ...overlayRefVals) : 0;
  const oMax = hasOverlay ? Math.max(...oVals, ...overlayRefVals) : 1;
  const oRange = oMax-oMin || 1;
  const oXScale = i => hasOverlay ? PL + ((oTimestamps[i]-tMin)/tRange)*iW : 0;
  const oYScale = v => PT + iH - ((v-oMin)/oRange)*iH;
  const oStep = hasOverlay ? niceStep(oRange, 4) : 1;
  const oTickStart = hasOverlay ? Math.ceil(oMin / oStep) * oStep : 0;
  const oTicks = [];
  if(hasOverlay) { for(let v=oTickStart; v<=oMax+oStep*0.01 && oTicks.length<12; v+=oStep) oTicks.push(+v.toPrecision(10)); }

  // Memoized: these build a path string per data point, and setTooltip re-renders this whole
  // component on every throttled hover frame. Rebuilding a 4,000-point path twice per frame is
  // the cost users actually feel when moving the pointer across the price chart.
  const { pathD, areaD, oPathD } = React.useMemo(() => {
    const p = !isBar ? data.map((d,i)=>`${i===0?'M':'L'}${xScale(i).toFixed(1)},${yScale(d[dataKey]).toFixed(1)}`).join(' ') : '';
    return {
      pathD: p,
      areaD: !isBar ? p+` L${xScale(data.length-1).toFixed(1)},${(PT+iH).toFixed(1)} L${xScale(0).toFixed(1)},${(PT+iH).toFixed(1)} Z` : '',
      oPathD: hasOverlay ? overlay.data.map((d,i)=>`${i===0?'M':'L'}${oXScale(i).toFixed(1)},${oYScale(d[overlay.dataKey]).toFixed(1)}`).join(' ') : '',
    };
  }, [data, dataKey, isBar, hasOverlay, overlay?.data, overlay?.dataKey,
      timestamps, oTimestamps, yMin, yRange, oMin, oRange, iW, iH, PL, PT]);
  const buildOverlaySegments = (xsFn, ysFn) => {
    if(!hasOverlay || typeof overlay.getValueColor !== 'function' || overlay.data.length < 2) return [];
    const segments = [];
    const refLines = Array.isArray(overlay.refLines) ? overlay.refLines : [];
    const thresholds = refLines.map(r => r.value).filter(v => Number.isFinite(v)).sort((a,b) => a - b);
    for(let i=1;i<overlay.data.length;i++) {
      const prevVal = overlay.data[i-1]?.[overlay.dataKey];
      const currVal = overlay.data[i]?.[overlay.dataKey];
      if(prevVal == null || currVal == null) continue;
      const x1 = xsFn(i-1), y1 = ysFn(prevVal), x2 = xsFn(i), y2 = ysFn(currVal);
      // Find threshold crossings between prevVal and currVal
      const crossings = [];
      thresholds.forEach(th => {
        if((prevVal < th && currVal > th) || (prevVal > th && currVal < th)) {
          const t = (th - prevVal) / (currVal - prevVal);
          crossings.push({ t, val: th });
        }
      });
      crossings.sort((a,b) => a.t - b.t);
      if(!crossings.length) {
        segments.push({ d: `M${x1.toFixed(1)},${y1.toFixed(1)} L${x2.toFixed(1)},${y2.toFixed(1)}`, color: overlayGetValueColor(currVal) || overlay.color });
      } else {
        let lastX = x1, lastY = y1, lastVal = prevVal;
        crossings.forEach(cr => {
          const mx = x1 + (x2 - x1) * cr.t, my = y1 + (y2 - y1) * cr.t;
          const midVal = (lastVal + cr.val) / 2;
          segments.push({ d: `M${lastX.toFixed(1)},${lastY.toFixed(1)} L${mx.toFixed(1)},${my.toFixed(1)}`, color: overlayGetValueColor(midVal) || overlay.color });
          lastX = mx; lastY = my; lastVal = cr.val;
        });
        segments.push({ d: `M${lastX.toFixed(1)},${lastY.toFixed(1)} L${x2.toFixed(1)},${y2.toFixed(1)}`, color: overlayGetValueColor(currVal) || overlay.color });
      }
    }
    return segments;
  };
  // Threshold-segmented overlay (RSI colouring) — one entry per data point pair, so memoized
  // for the same reason as the paths above.
  const oSegments = React.useMemo(() => buildOverlaySegments(oXScale, oYScale),
    [hasOverlay, overlay?.data, overlay?.dataKey, overlay?.refLines, overlay?.color,
     timestamps, oTimestamps, tMin, tRange, oMin, oRange, iW, iH, PL, PT]);

  // Additional same-scale lines
  const buildLinePath = (ln, xsFn, ysFn) => {
    let started = false;
    return data.map((d,i) => {
      if(d[ln.dataKey]==null) return '';
      const cmd = started ? 'L' : 'M';
      started = true;
      return `${cmd}${xsFn(i).toFixed(1)},${ysFn(d[ln.dataKey]).toFixed(1)}`;
    }).join(' ');
  };
  const linePaths = React.useMemo(
    () => hasLines ? lines.map(ln => buildLinePath(ln, xScale, yScale)) : [],
    [hasLines, lines, data, timestamps, yMin, yRange, iW, iH, PL, PT]
  );

  // Bar dimensions
  const barW = isBar && data.length > 1 ? Math.max(2, Math.min(12, (iW / data.length) * 0.5)) : 10;

  // Y axis ticks
  const yStep = niceStep(yRange, 4);
  const yTickStart = Math.ceil(yMin / yStep) * yStep;
  const yTicks = [];
  for(let v=yTickStart; v<=yMax+yStep*0.01 && yTicks.length<12; v+=yStep) yTicks.push(+v.toPrecision(10));
  if(!yTicks.length) yTicks.push(yMin, yMax);
  // For a line chart, interpolating tick timestamps across the range is fine — the line is
  // continuous, so any date is a meaningful position. For a BAR chart it is not: bars sit at
  // discrete positions, and an interpolated timestamp lands between them, so the label ends up
  // naming a period that has no bar there. On the monthly chart that read as bars being shifted
  // into the neighbouring month. Bars therefore tick on real data points only.
  const buildTimeTicks = (count, width, leftPad, scaleFn) => {
    if(count <= 1 || !isFinite(tRange) || tRange <= 0) {
      return [{ x:leftPad + width/2, t:tMin, label: data[0]?.label }];
    }
    if(isBar && data.length) {
      const wanted = Math.min(count, data.length);
      const step = data.length <= wanted ? 1 : (data.length - 1) / (wanted - 1);
      const idxs = wanted === 1 ? [0]
        : Array.from({ length: wanted }, (_, k) => Math.round(k * step));
      const seen = new Set();
      return idxs.filter(i => !seen.has(i) && seen.add(i)).map(i => ({
        x: scaleFn ? scaleFn(i) : leftPad + ((timestamps[i]-tMin)/tRange) * width,
        t: timestamps[i],
        label: data[i]?.label,
      }));
    }
    return Array.from({ length: count }, (_, idx) => {
      const pct = idx / (count - 1);
      return {
        x: leftPad + pct * width,
        t: tMin + pct * tRange,
      };
    });
  };
  const xTicks = buildTimeTicks(isBar ? 4 : 3, iW, PL, xScale);

  const gradId = 'grad_'+dataKey.replace(/[^a-z]/g,'');

  const handleMouseMove = useThrottledCallback((e) => {
    if(!svgRef.current) return;
    const rect = svgRef.current.getBoundingClientRect();
    const scaleX = W / rect.width;
    const mx = (e.clientX - rect.left) * scaleX;
    const hoverT = tMin + ((mx-PL)/iW)*tRange;
    let closest = 0, closestDist = Infinity;
    for(let i=0;i<timestamps.length;i++) {
      const dist = Math.abs(timestamps[i]-hoverT);
      if(dist<closestDist) { closestDist=dist; closest=i; }
    }
    const d = data[closest];
    // Find closest overlay point
    let oVal = null;
    if(hasOverlay) {
      let oc=0, od=Infinity;
      for(let i=0;i<oTimestamps.length;i++) {
        const dist = Math.abs(oTimestamps[i]-timestamps[closest]);
        if(dist<od) { od=dist; oc=i; }
      }
      oVal = overlay.data[oc]?.[overlay.dataKey] ?? null;
    }
    const lineVals = hasLines ? lines.map(ln => d[ln.dataKey] ?? null) : [];
    setTooltip({ x: xScale(closest), y: yScale(d[dataKey]), val: d[dataKey], date: d.date, label: d.label, oVal, lineVals, isExpanded: false });
  }, 32);

  const fmtTickDate = input => {
    const dt = typeof input === 'number' ? new Date(input) : new Date(input+'T12:00:00');
    const options = tRange < 1000 * 60 * 60 * 24 * 120
      ? { month:'short', day:'numeric' }
      : { month:'short', year:'2-digit' };
    return dt.toLocaleDateString('en-US', options);
  };

  // Expanded chart dimensions
  const EW=960, EH=400, EPL=64, EPR=hasOverlay?58:20, EPT=12, EPB=36;
  const eIW=EW-EPL-EPR, eIH=EH-EPT-EPB;
  const exScale = i => EPL + ((timestamps[i]-tMin)/tRange)*eIW;
  const eyScale = v => EPT + eIH - ((v-yMin)/yRange)*eIH;
  const eoXScale = i => hasOverlay ? EPL + ((oTimestamps[i]-tMin)/tRange)*eIW : 0;
  const eoYScale = v => EPT + eIH - ((v-oMin)/oRange)*eIH;
  const eBarW = isBar && data.length > 1 ? Math.max(3, Math.min(18, (eIW / data.length) * 0.5)) : 12;
  const eGradId = 'egrad_'+dataKey.replace(/[^a-z]/g,'');
  // All of the expanded-chart geometry used to be computed unconditionally — including the
  // 4,000-point path strings and the threshold-segmented overlay — even while the chart was
  // collapsed, across every chart on the dashboard, on every tooltip frame. Now it's built only
  // when actually expanded. The scale functions above stay outside: they're O(1) and the
  // expanded mouse handler needs them.
  const expandedGeom = React.useMemo(() => {
    if(!expanded) return null;
    const ePathD = !isBar ? data.map((d,i)=>`${i===0?'M':'L'}${exScale(i).toFixed(1)},${eyScale(d[dataKey]).toFixed(1)}`).join(' ') : '';
    const eAreaD = !isBar ? ePathD+` L${exScale(data.length-1).toFixed(1)},${(EPT+eIH).toFixed(1)} L${exScale(0).toFixed(1)},${(EPT+eIH).toFixed(1)} Z` : '';
    const eoPathD = hasOverlay ? overlay.data.map((d,i)=>`${i===0?'M':'L'}${eoXScale(i).toFixed(1)},${eoYScale(d[overlay.dataKey]).toFixed(1)}`).join(' ') : '';
    const eyStep = niceStep(yRange, 8);
    const eyTickStart = Math.ceil(yMin / eyStep) * eyStep;
    const eyTicks = [];
    for(let v=eyTickStart; v<=yMax+eyStep*0.01 && eyTicks.length<16; v+=eyStep) eyTicks.push(+v.toPrecision(10));
    const eoStep = hasOverlay ? niceStep(oRange, 8) : 1;
    const eoTickStart = hasOverlay ? Math.ceil(oMin / eoStep) * eoStep : 0;
    const eoTicks = [];
    if(hasOverlay) { for(let v=eoTickStart; v<=oMax+eoStep*0.01 && eoTicks.length<16; v+=eoStep) eoTicks.push(+v.toPrecision(10)); }
    return {
      ePathD, eAreaD, eoPathD, eyTicks, eoTicks,
      eXTicks: buildTimeTicks(isBar ? 6 : 5, eIW, EPL, exScale),
      eoSegments: buildOverlaySegments(eoXScale, eoYScale),
      eLinePaths: hasLines ? lines.map(ln => buildLinePath(ln, exScale, eyScale)) : [],
    };
  }, [expanded, data, dataKey, isBar, hasOverlay, overlay?.data, overlay?.dataKey, overlay?.refLines,
      yMin, yMax, yRange, oMin, oMax, oRange, hasLines, lines, timestamps, oTimestamps]);
  const ePathD = expandedGeom?.ePathD ?? '';
  const eAreaD = expandedGeom?.eAreaD ?? '';
  const eoPathD = expandedGeom?.eoPathD ?? '';
  const eyTicks = expandedGeom?.eyTicks ?? [];
  const eoTicks = expandedGeom?.eoTicks ?? [];
  const eXTicks = expandedGeom?.eXTicks ?? [];
  const eoSegments = expandedGeom?.eoSegments ?? [];

  const handleExpandedMouseMove = useThrottledCallback((e) => {
    if(!expandedSvgRef.current) return;
    const rect = expandedSvgRef.current.getBoundingClientRect();
    const scaleX = EW / rect.width;
    const mx = (e.clientX - rect.left) * scaleX;
    const hoverT = tMin + ((mx-EPL)/eIW)*tRange;
    let closest = 0, closestDist = Infinity;
    for(let i=0;i<timestamps.length;i++) {
      const dist = Math.abs(timestamps[i]-hoverT);
      if(dist<closestDist) { closestDist=dist; closest=i; }
    }
    const d = data[closest];
    let oVal = null;
    if(hasOverlay) {
      let oc=0, od=Infinity;
      for(let i=0;i<oTimestamps.length;i++) {
        const dist = Math.abs(oTimestamps[i]-timestamps[closest]);
        if(dist<od) { od=dist; oc=i; }
      }
      oVal = overlay.data[oc]?.[overlay.dataKey] ?? null;
    }
    const lineVals = hasLines ? lines.map(ln => d[ln.dataKey] ?? null) : [];
