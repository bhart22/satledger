    if(h < o) return 'high_below_open';
    if(h < c) return 'high_below_close';
    if(l > o) return 'low_above_open';
    if(l > c) return 'low_above_close';
    return null;
  };
  const overLimit = (rejected, total) => total > 0 && rejected > REJECT_LIMIT * total;

  // → { valid: Candle[] strictly ascending, rejected: [{ row, reason }], overRejectLimit }.
  // Nothing is repaired: a bad candle is dropped and reported. For a repeated t the last
  // occurrence in input order wins and the earlier ones are rejected as 'duplicate'. Valid
  // candles are fresh { t, o, h, l, c, v } objects; the input is never mutated.
  const validate = (candles, interval) => {
    spec(interval);
    const list = Array.isArray(candles) ? candles : [];
    const rejected = [];
    const byT = new Map();
    for(const row of list) {
      const reason = candleReason(row, interval);
      if(reason) { rejected.push({ row, reason }); continue; }
      const prev = byT.get(row.t);
      if(prev) rejected.push({ row: prev.row, reason: 'duplicate' });
      byT.set(row.t, { row, candle: { t: row.t, o: row.o, h: row.h, l: row.l, c: row.c, v: row.v ?? null } });
    }
    const valid = [...byT.values()].map(e => e.candle).sort((a, b) => a.t - b.t);
    return { valid, rejected, overRejectLimit: overLimit(rejected.length, list.length) };
  };

  // Raw provider rows → normalize each, then validate; same result shape, and the reject limit
  // is measured against the raw row count.
  const parseRows = (rows, interval, order = ROW_ORDER) => {
    const list = Array.isArray(rows) ? rows : [];
    const rejected = [], candles = [];
    for(const row of list) {
      const r = normalizeRow(row, interval, order);
      if(r.candle) candles.push(r.candle); else rejected.push({ row, reason: r.reason });
    }
    const v = validate(candles, interval);
    rejected.push(...v.rejected);
    return { valid: v.valid, rejected, overRejectLimit: overLimit(rejected.length, list.length) };
  };

  // ── Aggregation (§11) ──
  // Validated source candles → target-interval candles, ascending. A completed bucket holding
  // fewer source candles than it should carries partial: true; so does a forming bucket (end
  // after nowSec) that is missing source candles which should already exist. Without nowSec
  // every bucket is judged as completed. Refuses to build a smaller interval from a larger one.
  const aggregate = (candles, targetInterval, sourceInterval, { nowSec = null } = {}) => {
    const ts = spec(targetInterval).seconds, ss = spec(sourceInterval).seconds;
    if(ts <= ss) throw new Error(`Candles.aggregate: cannot build ${targetInterval} from ${sourceInterval}; the target must be larger`);
    if(ts % ss !== 0) throw new Error(`Candles.aggregate: ${targetInterval} is not a whole multiple of ${sourceInterval}`);
    const expected = b => {
      const until = nowSec == null ? b + ts : Math.min(b + ts, nowSec);
      return until <= b ? 0 : Math.ceil((until - b) / ss);
    };
    const out = [];
    let cur = null, count = 0, srcPartial = false;
    const flush = () => {
      if(!cur) return;
      if(srcPartial || count < expected(cur.t)) cur.partial = true;
      out.push(cur);
    };
    for(const x of [...(Array.isArray(candles) ? candles : [])].sort((a, b) => a.t - b.t)) {
      const b = bucketStart(x.t, targetInterval);
      if(!cur || cur.t !== b) {
        flush();
        cur = { t: b, o: x.o, h: x.h, l: x.l, c: x.c, v: x.v ?? null };
        count = 1; srcPartial = !!x.partial;
      } else {
        if(x.h > cur.h) cur.h = x.h;
        if(x.l < cur.l) cur.l = x.l;
        cur.c = x.c;
        if(x.v != null) cur.v = (cur.v ?? 0) + x.v;
        count++; srcPartial = srcPartial || !!x.partial;
      }
    }
    flush();
    return out;
  };

  // ── Gaps (§12) ──
  // Runs of expected bucket starts with no candle, over the buckets that intersect
  // [fromSec, toSec) (default: first to last candle). isFetched(bucketT), when given, says
  // whether the page holding that bucket was fetched successfully: a missing bucket in a
  // fetched page is a 'provider' gap, otherwise 'not_fetched'. A price jump between adjacent
  // candles is not a gap. Nothing is filled in.
  const findGaps = (candles, interval, { fromSec = null, toSec = null, isFetched = null } = {}) => {
    const s = spec(interval).seconds;
    const list = Array.isArray(candles) ? candles : [];
    const present = new Set(list.map(x => x.t));
    let lo = Infinity, hi = -Infinity;
    for(const t of present) { if(t < lo) lo = t; if(t > hi) hi = t; }
    if(fromSec == null) fromSec = list.length ? lo : null;
    if(toSec == null) toSec = list.length ? hi + s : null;
    if(fromSec == null || toSec == null || !(toSec > fromSec)) return [];
    const first = bucketStart(fromSec, interval);
    if((toSec - first) / s > MAX_STEPS) throw new RangeError('Candles.findGaps: window too large for this interval');
    const gaps = [];
    let run = null;
    for(let t = first; t < toSec; t += s) {
      if(present.has(t)) { run = null; continue; }
      const kind = isFetched && !isFetched(t) ? 'not_fetched' : 'provider';
      if(run && run.kind === kind) { run.toSec = t + s; run.missing++; }
      else { run = { fromSec: t, toSec: t + s, missing: 1, kind }; gaps.push(run); }
    }
    return gaps;
  };

  // ── Range and interval rules (§9–10) ──
  const RANGE_SPAN = { '1D': { sec: DAY_SEC }, '1W': { sec: 7 * DAY_SEC },
    '1M': { months: 1 }, '3M': { months: 3 }, '6M': { months: 6 },
    '1Y': { months: 12 }, '3Y': { months: 36 }, '5Y': { months: 60 } };
  // Same day-of-month and time of day N calendar months back (UTC), clamped to the month's length.
  const monthsBack = (sec, months) => {
    const d = new Date(sec * 1000);
    const y = d.getUTCFullYear(), m = d.getUTCMonth() - months;
    const monthLength = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    return Date.UTC(y, m, Math.min(d.getUTCDate(), monthLength), d.getUTCHours(), d.getUTCMinutes(), d.getUTCSeconds()) / 1000;
  };
  // Range start in UTC seconds. ALL is the provider-discovered earliest candle (§8): null until
  // it is known. No product date constant is consulted.
  const rangeStart = (range, nowSec, earliestSec = null) => {
    const now = checkNow(nowSec);
    if(range === 'ALL') return typeof earliestSec === 'number' && Number.isFinite(earliestSec) ? earliestSec : null;
    if(range === 'YTD') return Date.UTC(new Date(now * 1000).getUTCFullYear(), 0, 1) / 1000;
    const r = typeof range === 'string' && Object.prototype.hasOwnProperty.call(RANGE_SPAN, range) ? RANGE_SPAN[range] : null;
    if(!r) throw new Error(`Candles: unknown range ${JSON.stringify(range)}`);
    return r.sec ? now - r.sec : monthsBack(now, r.months);
  };
  const defaultInterval = range => {
    if(typeof range !== 'string' || !Object.prototype.hasOwnProperty.call(DEFAULT_INTERVAL, range)) {
      throw new Error(`Candles: unknown range ${JSON.stringify(range)}`);
    }
    return DEFAULT_INTERVAL[range];
  };
  // Intervals offered for a range, ascending. Each must be shorter than the range and pass both
  // caps; '1d' is exempt from the caps (not from the shorter-than-the-range rule) because full
  // daily history is needed anyway. ALL before its earliest candle is known offers only '1d'
  // and '1w', the two intervals that full daily history serves.
  const allowedIntervals = (range, nowSec, earliestSec = null) => {
    const start = rangeStart(range, nowSec, earliestSec);
    if(start === null) return ['1d', '1w'];
    const rangeSec = checkNow(nowSec) - start;
    return INTERVAL_KEYS.filter(iv => {
      const sp = INTERVALS[iv];
      if(!(sp.seconds < rangeSec)) return false;
      if(iv === '1d') return true;
      const nativeSec = sp.native ? sp.seconds : INTERVALS[sp.from].seconds;
      return Math.ceil(rangeSec / sp.seconds) <= MAX_VIEW_CANDLES
          && Math.ceil(rangeSec / nativeSec) <= MAX_NATIVE_CANDLES;
    });
  };
  // A stored or URL-supplied interval, if allowed; otherwise the range default. If even the
  // default is impossible (YTD in the first hours of 1 January), the largest allowed interval
  // below it.
  const resolveInterval = (range, requested, nowSec, earliestSec = null) => {
    const allowed = allowedIntervals(range, nowSec, earliestSec);
    if(allowed.includes(requested)) return requested;
    const def = defaultInterval(range);
    if(allowed.includes(def)) return def;
    const below = allowed.filter(iv => INTERVALS[iv].seconds < INTERVALS[def].seconds);
    return below.length ? below[below.length - 1] : def;
  };

  // ── Paging (§7) ──
  // Fixed, epoch-aligned pages of perPage (the provider's maxCandlesPerRequest) native candles,
  // so a request window reveals nothing about any transaction time. endSec is exclusive.
  const pageSpan = (interval, perPage) => {
    const sp = spec(interval);
    if(!sp.native) throw new Error(`Candles: ${interval} is derived and is never requested`);
    if(!Number.isInteger(perPage) || perPage <= 0) throw new Error('Candles: perPage must be a positive integer');
    return perPage * sp.seconds;
  };
  const pageIndex = (tSec, interval, perPage) => Math.floor(tSec / pageSpan(interval, perPage));
  const pageBounds = (index, interval, perPage) => {
    if(!Number.isInteger(index)) throw new Error('Candles: page index must be an integer');
    const span = pageSpan(interval, perPage);
    return { index, startSec: index * span, endSec: (index + 1) * span };
  };
  // Every page intersecting [fromSec, toSec), newest first so the right edge fills in first.
  const pagesFor = (fromSec, toSec, interval, perPage) => {
    const span = pageSpan(interval, perPage);
    if(!(toSec > fromSec)) return [];
    const first = Math.floor(fromSec / span), last = Math.ceil(toSec / span) - 1;
    if(last - first + 1 > MAX_STEPS) throw new RangeError('Candles.pagesFor: window too large');
    const pages = [];
    for(let i = last; i >= first; i--) pages.push(pageBounds(i, interval, perPage));
    return pages;
  };

  return Object.freeze({
    INTERVALS, INTERVAL_KEYS, RANGES, DEFAULT_INTERVAL, MAX_VIEW_CANDLES, MAX_NATIVE_CANDLES,
    REJECT_LIMIT, ROW_ORDER,
    intervalSeconds, bucketStart, isComplete,
    normalizeRow, validate, parseRows,
    aggregate, findGaps,
    rangeStart, defaultInterval, allowedIntervals, resolveInterval,
    pageSpan, pageIndex, pageBounds, pagesFor,
  });
})();

// ─── Market: Data ────────────────────────────────────────────────────────────
// Where candles come from: the provider (Coinbase), the cache-store interface with its in-memory
// implementation, and the service that pages, caches, retries, supersedes and backfills. All I/O
// goes through injected dependencies (fetchImpl, store, now, sleep), so Node tests drive it with
// fakes. What leaves the browser is a symbol, a granularity and a fixed page-aligned window —
// never anything derived from transactions, which nothing here can reach. Spec:
// docs/market-data.md §3–4, §7–8, §14–19. The IndexedDB store is MarketCandleStore (component zone).
const MarketData = (() => {
  const DAY_SEC = 86400;
  const EARLIEST_MAX_AGE_SEC = 90 * DAY_SEC; // re-verify a discovered earliest candle after this
  const BACKFILL_MAX_FAILURES = 3;

  const hasOwn = (o, k) => typeof k === 'string' && Object.prototype.hasOwnProperty.call(o, k);
  const codeError = (code, message = code, extra = {}) => Object.assign(new Error(`MarketData: ${message}`), { code }, extra);
  const abortError = () => Object.assign(new Error('MarketData: aborted'), { name: 'AbortError' });
  const isAbort = e => e?.name === 'AbortError';
  const throwIfAborted = signal => { if(signal?.aborted) throw abortError(); };
  // Network failures, timeouts, 429 and 5xx are worth another attempt; a real 4xx, a malformed
  // response or a page over the reject limit is not.
  const retryable = e => e?.code === 'http' ? (e.status === 429 || e.status >= 500)
    : !['bad_response', 'rejected', 'bad_window', 'unsupported_interval'].includes(e?.code);
  const defaultNow = () => Date.now() / 1000;
  const defaultSleep = (ms, signal) => new Promise((resolve, reject) => {
    if(signal?.aborted) { reject(abortError()); return; }
    const onAbort = () => { clearTimeout(timer); reject(abortError()); };
    const timer = setTimeout(() => { signal?.removeEventListener('abort', onAbort); resolve(); }, ms);
    signal?.addEventListener('abort', onAbort, { once: true });
  });
  // Plain numbers from the provider's strings, without letting blanks or null become 0.
  const toNum = x => (typeof x === 'number' || (typeof x === 'string' && x.trim() !== '')) ? Number(x) : NaN;
  const isPrice = x => Number.isFinite(x) && x > 0;
  const retryAfterOf = r => {
    const h = r?.headers?.get?.('Retry-After');
    const n = h == null || String(h).trim() === '' ? NaN : Number(h);
    return Number.isFinite(n) && n >= 0 ? n : null;
  };

  // ── Coinbase Exchange provider (§4) ──
  // Converts responses into the candle model and nothing else: paging, caching, retry and
  // aggregation are the service's. Verified behaviour it relies on: rows arrive newest first as
  // [time, low, high, open, close, volume]; `end` is inclusive and rows may precede `start`, so
  // only rows inside the requested half-open page are kept; responses are publicly cacheable for
  // five minutes, so requests bypass the HTTP cache (IndexedDB is the only cache).
  const COINBASE_GRANULARITY = Object.freeze({ '1m': 60, '5m': 300, '15m': 900, '1h': 3600, '1d': 86400 });
  const createCoinbaseProvider = ({ fetchImpl, now = defaultNow } = {}) => {
    if(typeof fetchImpl !== 'function') throw new Error('MarketData: createCoinbaseProvider needs fetchImpl');
    const EXCHANGE = 'https://api.exchange.coinbase.com/products/BTC-USD';
    const SPOT = 'https://api.coinbase.com/v2/prices/BTC-USD/spot';
    const PER_REQUEST = 300;
    const iso = sec => new Date(sec * 1000).toISOString().replace('.000Z', 'Z');
    const getJson = async (url, signal) => {
      const r = await fetchImpl(url, { signal, cache: 'no-store', credentials: 'omit' });
      if(!r || !r.ok) throw codeError('http', `HTTP ${r?.status ?? 0}`, { status: r?.status ?? 0, retryAfterSec: retryAfterOf(r) });
      try { return await r.json(); }
      catch(e) { if(isAbort(e)) throw e; throw codeError('bad_response', 'response is not JSON'); }
    };
    const getCandles = async ({ interval, startSec, endSec, signal } = {}) => {
      if(!hasOwn(COINBASE_GRANULARITY, interval)) throw codeError('unsupported_interval', `Coinbase has no native ${interval}`);
      const g = COINBASE_GRANULARITY[interval];
      if(!Number.isInteger(startSec) || !Number.isInteger(endSec) || startSec % g || endSec % g
        || endSec <= startSec || (endSec - startSec) / g > PER_REQUEST) {
        throw codeError('bad_window', 'candle window must be interval-aligned and at most one page');
      }
      const rows = await getJson(`${EXCHANGE}/candles?granularity=${g}&start=${iso(startSec)}&end=${iso(endSec)}`, signal);
      if(!Array.isArray(rows)) throw codeError('bad_response', 'candles response is not an array');
      // Rows outside the page belong to its neighbours. A row whose time is unreadable stays in,
      // to be counted as rejected rather than silently dropped.
      const inPage = rows.filter(row => {
        const t = Array.isArray(row) ? toNum(row[Candles.ROW_ORDER.t]) : NaN;
        return !(t < startSec || t >= endSec);
      });
      const r = Candles.parseRows(inPage, interval);
      if(r.rejected.length) {
        const reasons = {};
        for(const x of r.rejected) reasons[x.reason] = (reasons[x.reason] || 0) + 1;
        console.warn(`MarketData: Coinbase ${interval} page dropped ${r.rejected.length} of ${inPage.length} rows`, reasons);
      }
      if(r.overRejectLimit) throw codeError('rejected', 'too many malformed candles in the page');
      return r.valid;
    };
    const getCurrentPrice = async ({ signal } = {}) => {
      const j = await getJson(SPOT, signal);
      const price = toNum(j?.data?.amount);
      if(!isPrice(price)) throw codeError('bad_response', 'spot price missing');
      return { price, at: Math.floor(now()) };
    };
    // Coinbase's 24 h figures are a rolling window and carry no timestamp; `at` is receipt time.
    const get24HourStats = async ({ signal } = {}) => {
      const j = await getJson(`${EXCHANGE}/stats`, signal);
      const s = { open: toNum(j?.open), high: toNum(j?.high), low: toNum(j?.low), last: toNum(j?.last), volume: toNum(j?.volume) };
      if(![s.open, s.high, s.low, s.last].every(isPrice) || !(Number.isFinite(s.volume) && s.volume >= 0)) {
        throw codeError('bad_response', '24h stats malformed');
      }
      return { ...s, at: Math.floor(now()) };
    };
    // The earliest candle is discovered, never assumed (§8). The first-day constant the Dashboard
    // uses is offered only as a hint.
    const getHistoricalRange = () => ({ earliestSec: null, hintSec: Date.parse(`${BTC_USD_FIRST_CANDLE_DAY}T00:00:00Z`) / 1000 });
    return Object.freeze({
      id: 'coinbase', label: 'Coinbase', symbol: 'BTC-USD',
      maxCandlesPerRequest: PER_REQUEST,
      getAvailableIntervals: () => Object.keys(COINBASE_GRANULARITY),
      getCandles, getCurrentPrice, get24HourStats, getHistoricalRange,
    });
  };

  const providers = Object.freeze({
    coinbase: Object.freeze({ id: 'coinbase', label: 'Coinbase', create: createCoinbaseProvider }),
  });

  // ── In-memory store (§14 interface) ──
  // Used by tests, and by MarketCandleStore when IndexedDB is unavailable. Every method resolves.
  const createMemoryStore = () => {
    const candles = new Map(), coverage = new Map(), meta = new Map();
    const key = (provider, symbol, interval) => `${provider}\u0000${symbol}\u0000${interval}`;
    const series = (m, k) => { let s = m.get(k); if(!s) m.set(k, s = new Map()); return s; };
    const copy = v => v === undefined ? null : JSON.parse(JSON.stringify(v));
    return {
      kind: 'memory',
      async getCandles({ provider, symbol, interval, fromSec = -Infinity, toSec = Infinity }) {
        const out = [];
        for(const c of candles.get(key(provider, symbol, interval))?.values() || []) {
          if(c.t >= fromSec && c.t < toSec) out.push({ ...c });
        }
        return out.sort((a, b) => a.t - b.t);
      },
      async putCandles({ provider, symbol, interval, candles: list }) {
        const s = series(candles, key(provider, symbol, interval));
        for(const { t, o, h, l, c, v } of Array.isArray(list) ? list : []) s.set(t, { t, o, h, l, c, v: v ?? null });
      },
      async getCoverage({ provider, symbol, interval, fromPage = -Infinity, toPage = Infinity }) {
        const out = [];
        for(const r of coverage.get(key(provider, symbol, interval))?.values() || []) {
          if(r.pageIndex >= fromPage && r.pageIndex <= toPage) out.push({ ...r });
        }
        return out.sort((a, b) => a.pageIndex - b.pageIndex);
      },
      async putCoverage({ provider, symbol, interval, pageIndex, fetchedAt, complete }) {
        series(coverage, key(provider, symbol, interval)).set(pageIndex, { provider, symbol, interval, pageIndex, fetchedAt, complete: !!complete });
      },
      async getMeta(k) { return meta.has(k) ? copy(meta.get(k).value) : null; },
      async putMeta(k, value) { meta.set(k, { key: k, value: copy(value), at: Date.now() }); },
      async clear() { candles.clear(); coverage.clear(); meta.clear(); },
    };
  };

  // ── Service (§7–8, §15, §17–18) ──
  const createMarketDataService = ({
    provider, store = null, now = defaultNow, sleep = defaultSleep, random = Math.random,
    maxConcurrent = 4, maxAttempts = 3, baseDelayMs = 1000, timeoutMs = 15000, backfillPauseMs = 250,
  } = {}) => {
    if(!provider || typeof provider.getCandles !== 'function') throw new Error('MarketData: createMarketDataService needs a provider');
    const st = store || createMemoryStore();
    const base = { provider: provider.id, symbol: provider.symbol };
    const per = provider.maxCandlesPerRequest;
    const native = new Set(provider.getAvailableIntervals());
    const nowSec = () => Math.floor(now());
    const earliestKey = iv => `earliest:${base.provider}:${base.symbol}:${iv}`;
    const backfillKey = iv => `backfill:${base.provider}:${base.symbol}:${iv}`;
    let pausedUntilMs = 0; // a 429 pauses every request, not only the one that hit it
    let viewToken = 0, viewController = null;

    const sourceOf = interval => {
      if(native.has(interval)) return interval;
      const from = Candles.INTERVALS[interval]?.from;
      if(hasOwn(Candles.INTERVALS, interval) && native.has(from)) return from;
      throw new Error(`MarketData: ${provider.id} cannot provide ${interval}`);
    };

    // Up to maxAttempts tries with doubling delay plus jitter; a numeric Retry-After replaces the
    // delay. Each try has its own timeout, linked to the caller's signal. The call is raced
    // against that signal, so an abort or timeout settles at once even if the fetch never does.
    const withRetry = async (call, signal) => {
      let delay = baseDelayMs;
      for(let attempt = 1; ; attempt++) {
        throwIfAborted(signal);
        const pause = pausedUntilMs - now() * 1000;
        if(pause > 0) await sleep(pause, signal);
        const ctl = new AbortController();
        let rejectOnAbort;
        const aborted = new Promise((_, reject) => { rejectOnAbort = () => reject(abortError()); });
        aborted.catch(() => {});
        ctl.signal.addEventListener('abort', rejectOnAbort, { once: true });
        const onAbort = () => ctl.abort();
        signal?.addEventListener('abort', onAbort, { once: true });
        let timedOut = false;
        const timer = timeoutMs > 0 ? setTimeout(() => { timedOut = true; ctl.abort(); }, timeoutMs) : null;
        try {
          return await Promise.race([call(ctl.signal), aborted]);
        } catch(e) {
          if(signal?.aborted) throw abortError();
          const err = timedOut ? codeError('timeout', 'request timed out') : e;
          if(!retryable(err) || isAbort(err) || attempt >= maxAttempts) throw err;
          const ms = err.retryAfterSec != null ? err.retryAfterSec * 1000 : delay + random() * 250;
          if(err.status === 429) pausedUntilMs = Math.max(pausedUntilMs, now() * 1000 + ms);
          await sleep(ms, signal);
          delay *= 2;
        } finally {
          if(timer) clearTimeout(timer);
          signal?.removeEventListener('abort', onAbort);
          ctl.signal.removeEventListener('abort', rejectOnAbort);
        }
      }
    };

    // One page: fetch, keep only completed candles, store them, then record coverage — in that
    // order, so coverage never claims candles that were not written. Returns every candle in the
    // page, the forming one included (it is shown, never stored).
    const fetchPage = async (interval, page, signal) => {
      const got = await withRetry(s => provider.getCandles({ interval, startSec: page.startSec, endSec: page.endSec, signal: s }), signal);
      const fetchedAt = nowSec();
      const s = Candles.intervalSeconds(interval);
      const completed = got.filter(c => c.t + s <= fetchedAt);
      if(completed.length) await st.putCandles({ ...base, interval, candles: completed });
      const record = { ...base, interval, pageIndex: page.index, fetchedAt, complete: page.endSec <= fetchedAt };
      await st.putCoverage(record);
      return { candles: got, record };
    };

    const runPool = async (items, worker, limit) => {
      let next = 0;
      await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
        while(next < items.length) await worker(items[next++]);
      }));
    };

    const getEarliest = async (interval = '1d') => {
      const v = await st.getMeta(earliestKey(interval));
      if(!v || v.provider !== base.provider || !Number.isInteger(v.earliestSec) || !Number.isFinite(v.verifiedAt)) return null;
      return { earliestSec: v.earliestSec, verifiedAt: v.verifiedAt, stale: nowSec() - v.verifiedAt > EARLIEST_MAX_AGE_SEC };
    };

    // A view: { range, interval } (the window follows from the range) or { interval, fromSec,
    // toSec } (an explicit window, e.g. panning). Read path: store → onUpdate → network for what
    // is missing plus the newest two buckets → merge → onUpdate. A newer loadView (or cancel)
    // supersedes this one: its requests are aborted, it resolves { status: 'superseded' }, and
    // nothing it received reaches onUpdate (pages that finished before the abort stay cached).
    const loadView = async ({ range = null, interval = null, fromSec = null, toSec = null, onUpdate = null } = {}) => {
      const token = ++viewToken;
      viewController?.abort();
      const controller = viewController = new AbortController();
      const signal = controller.signal;
      const live = () => token === viewToken;
      const superseded = { status: 'superseded', token };
      const tNow = nowSec();
      const earliest = await getEarliest('1d');
      if(!live()) return superseded;
      const earliestSec = earliest?.earliestSec ?? null;
      if(range != null) {
        interval = Candles.resolveInterval(range, interval, tNow, earliestSec);
        fromSec = Candles.rangeStart(range, tNow, earliestSec);
        toSec = tNow;
      }
      if(toSec == null) toSec = tNow;
      const source = sourceOf(interval);
      const ss = Candles.intervalSeconds(source);
      if(fromSec == null) {
        // ALL before the earliest candle is discovered: what is held, and at least the newest page.
        const held = await st.getCandles({ ...base, interval: source, toSec });
        if(!live()) return superseded;
        const newestStart = Candles.pageBounds(Candles.pageIndex(tNow, source, per), source, per).startSec;
        fromSec = held.length ? Math.min(held[0].t, newestStart) : newestStart;
      }
      const from = Candles.bucketStart(fromSec, interval); // the first target bucket in full
      // Coinbase refuses a page that starts in the future; such a page has nothing to give.
      const pages = Candles.pagesFor(from, toSec, source, per).filter(p => p.startSec <= tNow);
      const lo = pages.length ? pages[pages.length - 1].index : 0, hi = pages.length ? pages[0].index : -1;
      const [cached, cov] = await Promise.all([
        st.getCandles({ ...base, interval: source, fromSec: from, toSec }),
        pages.length ? st.getCoverage({ ...base, interval: source, fromPage: lo, toPage: hi }) : [],
      ]);
      if(!live()) return superseded;
      const coverage = new Map(cov.map(r => [r.pageIndex, r]));
      const byT = new Map(cached.map(c => [c.t, c]));
      const failed = [];

      const build = status => {
        const nat = [...byT.values()].filter(c => c.t >= from && c.t < toSec).sort((a, b) => a.t - b.t);
        const candles = source === interval ? nat.map(c => ({ ...c })) : Candles.aggregate(nat, interval, source, { nowSec: tNow });
        const last = candles[candles.length - 1];
        const completeTo = Math.min(toSec, Candles.bucketStart(tNow, source));
        const gaps = completeTo > from
          ? Candles.findGaps(nat, source, { fromSec: from, toSec: completeTo, isFetched: t => coverage.has(Candles.pageIndex(t, source, per)) })
          : [];
        return {
          status, token, interval, sourceInterval: source, fromSec: from, toSec, candles,
          formingIndex: last && !Candles.isComplete(last.t, interval, tNow) ? candles.length - 1 : -1,
          gaps, failedPages: failed.map(f => ({ ...f })), earliestSec,
          provider: { id: provider.id, label: provider.label, symbol: provider.symbol },
        };
      };
      if(onUpdate && cached.length) onUpdate(build('loading'));

      // Complete pages are never refetched. An incomplete page is refetched at most once per
      // interval — except the page(s) holding the newest two buckets, which every load refreshes
      // to correct a final candle stored moments before its close.
      const newest = Candles.bucketStart(tNow, source);
      const forced = new Set([newest, newest - ss].map(t => Candles.pageIndex(t, source, per)));
      const toFetch = pages.filter(p => {
        if(forced.has(p.index)) return true;
        const rec = coverage.get(p.index);
        return !rec || (!rec.complete && tNow - rec.fetchedAt >= ss);
      });
      await runPool(toFetch, async page => {
        if(signal.aborted) return;
        try {
          const { candles, record } = await fetchPage(source, page, signal);
          for(const c of candles) byT.set(c.t, c);
          coverage.set(page.index, record);
        } catch(e) {
          if(isAbort(e) || signal.aborted) return;
          failed.push({ index: page.index, startSec: page.startSec, endSec: page.endSec, error: e?.code || 'error', status: e?.status ?? null });
        }
      }, maxConcurrent);
      if(!live()) return superseded;
      const result = build(failed.length ? 'partial' : 'ok');
      if(onUpdate) onUpdate(result);
      return result;
    };

    // Leaving the Market tab: abort the view in flight; whatever it resolves is superseded.
    const cancel = () => { viewToken++; viewController?.abort(); viewController = null; };

    // Full daily history, newest page to oldest, one request at a time with a pause between.
    // Resumable (position kept in meta) and idempotent (writes are keyed by t). A page already
    // covered and holding candles costs no request. Two consecutive empty pages older than the
    // oldest candle held mean the provider's history starts there: that candle is recorded as the
    // earliest (§8). Stops after BACKFILL_MAX_FAILURES consecutive page failures; abort `signal`
    // to pause (tab hidden or Market tab left). Daily only: an intraday walk back to 2015 would be
    // tens of thousands of requests, and no range offers an intraday interval that needs it.
    const backfill = async ({ signal = null, onProgress = null } = {}) => {
      const interval = '1d';
      const known = await getEarliest(interval);
      if(known && !known.stale) return { status: 'complete', earliestSec: known.earliestSec };
      const saved = await st.getMeta(backfillKey(interval));
      const newestIdx = Candles.pageIndex(nowSec(), interval, per);
      const resume = saved && Number.isInteger(saved.nextPage) && saved.nextPage <= newestIdx;
      let idx = resume ? saved.nextPage : newestIdx;
      let emptyRun = resume && Number.isInteger(saved.emptyRun) ? saved.emptyRun : 0;
      let oldestSec = resume && Number.isInteger(saved.oldestSec) ? saved.oldestSec : null;
      let failures = 0, requested = false;
      const paused = () => ({ status: 'paused', nextPage: idx });
      for(;;) {
        if(signal?.aborted) return paused();
        const page = Candles.pageBounds(idx, interval, per);
        if(page.endSec <= 0) return { status: 'failed', error: 'no_history', nextPage: idx };
        let candles = null;
        const [rec] = await st.getCoverage({ ...base, interval, fromPage: idx, toPage: idx });
        if(rec?.complete) {
          const held = await st.getCandles({ ...base, interval, fromSec: page.startSec, toSec: page.endSec });
          if(held.length) candles = held;
        }
        if(!candles) {
          try {
            if(requested) await sleep(backfillPauseMs, signal);
            requested = true;
            ({ candles } = await fetchPage(interval, page, signal));
            failures = 0;
          } catch(e) {
            if(isAbort(e) || signal?.aborted) return paused();
            if(++failures >= BACKFILL_MAX_FAILURES) {
              await st.putMeta(backfillKey(interval), { nextPage: idx, emptyRun, oldestSec });
              return { status: 'failed', error: e?.code || 'error', nextPage: idx };
            }
            continue;
          }
        }
        if(candles.length) { oldestSec = oldestSec == null ? candles[0].t : Math.min(oldestSec, candles[0].t); emptyRun = 0; }
        else if(oldestSec != null) emptyRun++;
        idx--;
        if(emptyRun >= 2) {
          await st.putMeta(earliestKey(interval), { ...base, interval, earliestSec: oldestSec, verifiedAt: nowSec() });
          await st.putMeta(backfillKey(interval), null);
          return { status: 'complete', earliestSec: oldestSec };
        }
        await st.putMeta(backfillKey(interval), { nextPage: idx, emptyRun, oldestSec });
        onProgress?.({ nextPage: idx, oldestSec });
      }
    };

    // Completed candles of a native interval that are already held: store only, no request, and
    // no effect on the view in flight. The Market summary reads full daily history this way
    // while the chart shows some other range or interval.
    const readCached = async ({ interval = '1d', fromSec = -Infinity, toSec = Infinity } = {}) => {
      if(!native.has(interval)) throw codeError('interval', `${interval} is not a native interval`);
      return st.getCandles({ ...base, interval, fromSec, toSec });
    };

    return Object.freeze({
      provider, store: st,
      loadView, cancel, backfill, getEarliest, readCached,
      getCurrentPrice: ({ signal = null } = {}) => withRetry(s => provider.getCurrentPrice({ signal: s }), signal),
      get24HourStats: ({ signal = null } = {}) => withRetry(s => provider.get24HourStats({ signal: s }), signal),
      clearCache: () => st.clear(),
    });
  };

  return Object.freeze({
    COINBASE_GRANULARITY,
    createCoinbaseProvider, providers, createMemoryStore, createMarketDataService,
  });
})();

// ─── Market: Indicators ──────────────────────────────────────────────────────
// Technical indicators over validated candles { t, o, h, l, c, v }: the definition registry
// (SMA, EMA, RSI, MACD, Bollinger Bands, ATR, historical volatility), gap segmentation, settings
// validation, returns, drawdown and the high-since / all-time-high helpers. Pure: no I/O, no
// clock, no mutation of the input, and nothing here knows about transactions. Every output array
// is the input's length; a position with no defined value is null — never 0, never NaN.
// Every formula is written out in docs/technical-indicators.md, which this code must match.
// The Dashboard's buildMovingAverageSeries is separate and untouched; tests assert the two agree.
const Indicators = (() => {
  const DAY_SEC = 86400;
  const PERIOD_MIN = 2, PERIOD_MAX = 1000;
  const SOURCES = Object.freeze(['close', 'open', 'high', 'low', 'hl2', 'ohlc4']);
  const CATEGORIES = Object.freeze(['TREND', 'MOMENTUM', 'VOLATILITY', 'VOLUME', 'STATISTICAL']);
  // Highest BTC-USD price before the provider's earliest daily candle (§12). Deliberately null
  // until Phase 8 verifies a value, date and authoritative source; never filled in from memory.
  const ATH_SEED = null;

  const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const nulls = n => new Array(n).fill(null);
  const list = candles => Array.isArray(candles) ? candles : [];
  const isNum = x => typeof x === 'number' && Number.isFinite(x);

  // ── Price source (§1) ──
  const SOURCE_FN = {
    close: x => x.c, open: x => x.o, high: x => x.h, low: x => x.l,
    hl2: x => (x.h + x.l) / 2, ohlc4: x => (x.o + x.h + x.l + x.c) / 4,
  };
  const values = (candles, source = 'close') => list(candles).map(SOURCE_FN[source]);

  // ── Series math over plain number arrays ──
  // Rolling sum in the same order as buildMovingAverageSeries, so rounded values agree exactly.
  const smaOf = (xs, N) => {
    const out = nulls(xs.length);
    let sum = 0;
    for(let i = 0; i < xs.length; i++) {
      sum += xs[i];
      if(i >= N) sum -= xs[i - N];
      if(i >= N - 1) out[i] = sum / N;
    }
    return out;
  };
  // EMA seeded with the simple average of the first N values from `from` (§5); xs before
  // `from` are ignored (they may be null, as in the MACD line's warm-up).
  const emaOf = (xs, N, from = 0) => {
    const out = nulls(xs.length);
    const seedAt = from + N - 1;
    if(seedAt >= xs.length) return out;
    let sum = 0;
    for(let j = from; j <= seedAt; j++) sum += xs[j];
    let e = sum / N;
    out[seedAt] = e;
    const k = 2 / (N + 1);
    for(let i = seedAt + 1; i < xs.length; i++) { e = xs[i] * k + e * (1 - k); out[i] = e; }
    return out;
  };
  // Wilder RSI (§6). Same arithmetic as buildMovingAverageSeries: avgLoss 0 → 100.
  const rsiOf = (xs, N) => {
    const out = nulls(xs.length);
    if(xs.length <= N) return out;
    let g = 0, l = 0;
    for(let j = 1; j <= N; j++) { const d = xs[j] - xs[j - 1]; g += Math.max(d, 0); l += Math.max(-d, 0); }
    let ag = g / N, al = l / N;
    const rsi = () => al === 0 ? 100 : 100 - 100 / (1 + ag / al);
    out[N] = rsi();
    for(let i = N + 1; i < xs.length; i++) {
      const d = xs[i] - xs[i - 1];
      ag = (ag * (N - 1) + Math.max(d, 0)) / N;
      al = (al * (N - 1) + Math.max(-d, 0)) / N;
      out[i] = rsi();
    }
    return out;
  };

  // ── Settings validation (§1) ──
  const fail = msg => { throw new Error(`Indicators: ${msg}`); };
  const checkPeriod = (v, name) => {
    if(typeof v !== 'number' || !Number.isInteger(v) || v < PERIOD_MIN || v > PERIOD_MAX) fail(`${name} must be an integer from ${PERIOD_MIN} to ${PERIOD_MAX}`);
    return v;
  };
  const checkMultiplier = (v, name) => {
    if(!isNum(v) || !(v > 0) || v > 10) fail(`${name} must be a number greater than 0 and at most 10`);
    return v;
  };
  const checkSource = v => {
    if(typeof v !== 'string' || !SOURCES.includes(v)) fail(`source must be one of ${SOURCES.join(', ')}`);
    return v;
  };
  const checkLevel = (v, name) => {
    if(!isNum(v) || !(v > 0) || !(v < 100)) fail(`${name} must be a number between 0 and 100`);
    return v;
  };
  // Defaults filled in for absent keys; keys the definition doesn't know are dropped.
  const merge = (defaults, settings) => {
    if(settings != null && (typeof settings !== 'object' || Array.isArray(settings))) fail('settings must be an object');
    const s = { ...defaults };
    if(settings) for(const k of Object.keys(defaults)) if(hasOwn(settings, k) && settings[k] !== undefined) s[k] = settings[k];
    return s;
  };

  // ── Definitions ──
  // Each spec gives check(s) (throws on a bad value), warmup(s) and calculate(candles, s,
  // interval) over already-merged settings; define() wraps them so every public entry point
  // validates first. The public methods don't use `this`, so they can be passed around freely.
  const define = d => {
    const defaults = Object.freeze({ ...d.defaults });
    const validate = settings => { const s = merge(defaults, settings); d.check(s); return s; };
    return Object.freeze({
      id: d.id, name: d.name, category: d.category, placement: d.placement,
      defaults, presets: d.presets ? Object.freeze([...d.presets]) : null, series: Object.freeze([...d.series]),
      validate,
      warmup: settings => d.warmup(validate(settings)),
      calculate: (candles, settings, interval) => d.calculate(candles, validate(settings), interval),
    });
  };

  const sma = define({
    id: 'sma', name: 'Simple Moving Average', category: 'TREND', placement: 'overlay',
    defaults: { period: 50, source: 'close' }, presets: [20, 50, 100, 200], series: ['sma'],
    check(s) {
      checkPeriod(s.period, 'period'); checkSource(s.source);
      return s;
    },
    warmup(s) { return { sma: s.period - 1 }; },
    calculate(candles, s) {
      return { sma: smaOf(values(candles, s.source), s.period) };
    },
  });

  const ema = define({
    id: 'ema', name: 'Exponential Moving Average', category: 'TREND', placement: 'overlay',
    defaults: { period: 21, source: 'close' }, presets: [12, 21, 50, 200], series: ['ema'],
    check(s) {
      checkPeriod(s.period, 'period'); checkSource(s.source);
      return s;
    },
    warmup(s) { return { ema: s.period - 1 }; },
    calculate(candles, s) {
      return { ema: emaOf(values(candles, s.source), s.period) };
    },
  });

  const rsi = define({
    id: 'rsi', name: 'Relative Strength Index', category: 'MOMENTUM', placement: 'pane',
    defaults: { period: 14, overbought: 70, oversold: 30 }, series: ['rsi'],
    check(s) {
      checkPeriod(s.period, 'period'); checkLevel(s.overbought, 'overbought'); checkLevel(s.oversold, 'oversold');
      if(!(s.oversold < s.overbought)) fail('oversold must be below overbought');
      return s;
    },
    warmup(s) { return { rsi: s.period }; },
    calculate(candles, s) {
      return { rsi: rsiOf(values(candles), s.period) };
    },
  });

  const macd = define({
    id: 'macd', name: 'MACD', category: 'MOMENTUM', placement: 'pane',
    defaults: { fast: 12, slow: 26, signal: 9 }, series: ['macd', 'signal', 'histogram'],
    check(s) {
      checkPeriod(s.fast, 'fast'); checkPeriod(s.slow, 'slow'); checkPeriod(s.signal, 'signal');
      if(!(s.fast < s.slow)) fail('fast must be smaller than slow');
      return s;
    },
    warmup(s) {
      return { macd: s.slow - 1, signal: s.slow + s.signal - 2, histogram: s.slow + s.signal - 2 };
    },
    calculate(candles, s) {
      const c = values(candles);
      const fast = emaOf(c, s.fast), slow = emaOf(c, s.slow);
      const line = c.map((_, i) => i >= s.slow - 1 ? fast[i] - slow[i] : null);
      const signal = emaOf(line, s.signal, s.slow - 1);
      const histogram = line.map((m, i) => m !== null && signal[i] !== null ? m - signal[i] : null);
      return { macd: line, signal, histogram };
    },
  });

  const bollinger = define({
    id: 'bollinger', name: 'Bollinger Bands', category: 'VOLATILITY', placement: 'overlay',
    defaults: { period: 20, multiplier: 2 }, series: ['upper', 'middle', 'lower', 'percentB', 'bandWidth'],
    check(s) {
      checkPeriod(s.period, 'period'); checkMultiplier(s.multiplier, 'multiplier');
      return s;
    },
    warmup(s) {
      const w = s.period - 1;
      return { upper: w, middle: w, lower: w, percentB: w, bandWidth: w };
    },
    calculate(candles, s) {
      const N = s.period;
      const c = values(candles), n = c.length;
      const middle = smaOf(c, N);
      const upper = nulls(n), lower = nulls(n), percentB = nulls(n), bandWidth = nulls(n);
      for(let i = N - 1; i < n; i++) {
        let ss = 0;
        for(let j = i - N + 1; j <= i; j++) { const d = c[j] - middle[i]; ss += d * d; }
        const sd = Math.sqrt(ss / N); // population deviation, divisor N
        upper[i] = middle[i] + s.multiplier * sd;
        lower[i] = middle[i] - s.multiplier * sd;
        percentB[i] = upper[i] === lower[i] ? null : (c[i] - lower[i]) / (upper[i] - lower[i]);
        bandWidth[i] = (upper[i] - lower[i]) / middle[i];
      }
      return { upper, middle, lower, percentB, bandWidth };
    },
  });

  const atr = define({
    id: 'atr', name: 'Average True Range', category: 'VOLATILITY', placement: 'pane',
    defaults: { period: 14 }, series: ['atr'],
    check(s) {
      checkPeriod(s.period, 'period');
      return s;
    },
    warmup(s) { return { atr: s.period }; },
    calculate(candles, s) {
      const N = s.period;
      const xs = list(candles), n = xs.length;
      const out = nulls(n);
      if(n <= N) return { atr: out };
      const tr = i => Math.max(xs[i].h - xs[i].l, Math.abs(xs[i].h - xs[i - 1].c), Math.abs(xs[i].l - xs[i - 1].c));
      let sum = 0;
      for(let j = 1; j <= N; j++) sum += tr(j);
      let a = sum / N;
      out[N] = a;
      for(let i = N + 1; i < n; i++) { a = (a * (N - 1) + tr(i)) / N; out[i] = a; }
      return { atr: out };
    },
  });

  // Intervals per 365-day year (§10): 365 for 1d, 8760 for 1h, 52.142857… for 1w.
  const annualizationFactor = interval => 365 * DAY_SEC / Candles.intervalSeconds(interval);

  const volatility = define({
    id: 'volatility', name: 'Historical Volatility', category: 'VOLATILITY', placement: 'pane',
    defaults: { period: 30 }, presets: [7, 14, 30, 90], series: ['volatility'],
    check(s) {
      checkPeriod(s.period, 'period');
      return s;
    },
    warmup(s) { return { volatility: s.period }; },
    // interval is required: it sets the annualization factor.
    calculate(candles, s, interval) {
      const N = s.period;
      const sqrtP = Math.sqrt(annualizationFactor(interval));
      const c = values(candles), n = c.length;
      const out = nulls(n);
      const r = c.map((x, i) => i >= 1 ? Math.log(x / c[i - 1]) : null);
      for(let i = N; i < n; i++) {
        let sum = 0;
        for(let j = i - N + 1; j <= i; j++) sum += r[j];
        const mean = sum / N;
        let ss = 0;
        for(let j = i - N + 1; j <= i; j++) { const d = r[j] - mean; ss += d * d; }
        out[i] = Math.sqrt(ss / (N - 1)) * sqrtP; // sample deviation, divisor N-1
      }
      return { volatility: out };
    },
  });

  const DEFINITIONS = Object.freeze([sma, ema, rsi, macd, bollinger, atr, volatility]);
  const BY_ID = Object.freeze(Object.fromEntries(DEFINITIONS.map(d => [d.id, d])));
  const IDS = Object.freeze(DEFINITIONS.map(d => d.id));
  const get = id => {
    if(typeof id !== 'string' || !hasOwn(BY_ID, id)) fail(`unknown indicator ${JSON.stringify(id)}`);
    return BY_ID[id];
  };
  // For settings from a URL or stored preferences: invalid → the defaults, never a throw.
  const resolveSettings = (id, settings) => {
    const def = get(id);
    try { return def.validate(settings); } catch { return { ...def.defaults }; }
  };

  // ── Gap segmentation (§2) ──
  // Splits at every missing bucket (consecutive t further apart than one interval) and around
  // every candle flagged partial, runs calculate on each segment separately and concatenates.
  // A partial candle is its own segment, so all its values are null. Nothing is forward-filled.
  const calculateSegmented = (defOrId, candles, settings, interval) => {
    const def = typeof defOrId === 'string' ? get(defOrId) : defOrId;
    const s = def.validate(settings);
    const step = Candles.intervalSeconds(interval);
    const xs = list(candles);
    const out = Object.fromEntries(def.series.map(k => [k, []]));
    const run = (a, b) => {
      if(b <= a) return;
      const r = def.calculate(xs.slice(a, b), s, interval);
      for(const k of def.series) out[k].push(...r[k]);
    };
    let start = 0;
    for(let i = 0; i < xs.length; i++) {
      if(xs[i].partial) {
        run(start, i);
        for(const k of def.series) out[k].push(null);
        start = i + 1;
      } else if(i > start && xs[i].t - xs[i - 1].t !== step) {
        run(start, i);
        start = i;
      }
    }
    run(start, xs.length);
    return out;
  };

  // ── Returns (§11) ──
  const simple = (a, b) => b / a - 1;
  const log = (a, b) => Math.log(b / a);
  // Selected range return: last close over the first candle's open.
  const rangeReturn = candles => {
    const xs = list(candles);
    return xs.length ? simple(xs[0].o, xs[xs.length - 1].c) : null;
  };
  const PERIOD_DAYS = Object.freeze({ '1D': 1, '7D': 7, '30D': 30, '90D': 90, '1Y': 365, '3Y': 1095, '5Y': 1825 });
  // Period returns from daily candles. The reference is the close of the last daily candle that
  // had completed by the target time; if that exact candle is missing (before the earliest
  // candle, or a gap) the result is null — no neighbour stands in for it.
  const periodReturns = (daily, priceNow, nowSec) => {
    const out = { YTD: null };
    for(const k of Object.keys(PERIOD_DAYS)) out[k] = null;
    if(!isNum(priceNow) || !(priceNow > 0) || !isNum(nowSec)) return out;
    const byT = new Map(list(daily).map(x => [x.t, x]));
    const closeBefore = targetSec => {
      const ref = byT.get(Candles.bucketStart(Math.floor(targetSec), '1d') - DAY_SEC);
      return ref ? ref.c : null;
    };
    for(const [k, days] of Object.entries(PERIOD_DAYS)) {
      const c = closeBefore(nowSec - days * DAY_SEC);
      out[k] = c === null ? null : simple(c, priceNow);
    }
    // YTD: against the close of 31 December of the previous year (the last day before 1 Jan).
    const c = closeBefore(Date.UTC(new Date(nowSec * 1000).getUTCFullYear(), 0, 1) / 1000);
    out.YTD = c === null ? null : simple(c, priceNow);
    return out;
  };
  // Average and median of C[i]/C[i-1] - 1 over consecutive daily candles; a pair separated by a
  // gap is not a daily return and is skipped. Median of an even count: mean of the middle two.
  const dailyReturns = candles => {
    const xs = list(candles), rs = [];
    for(let i = 1; i < xs.length; i++) if(xs[i].t - xs[i - 1].t === DAY_SEC) rs.push(simple(xs[i - 1].c, xs[i].c));
    if(!rs.length) return { average: null, median: null, count: 0 };
    const sorted = [...rs].sort((a, b) => a - b), m = sorted.length >> 1;
    return {
      average: rs.reduce((a, b) => a + b, 0) / rs.length,
      median: sorted.length % 2 ? sorted[m] : (sorted[m - 1] + sorted[m]) / 2,
      count: rs.length,
    };
  };
  const returns = Object.freeze({ simple, log, range: rangeReturn, periods: periodReturns, daily: dailyReturns, PERIOD_DAYS });

  // Highest h and lowest l over the candles, with the bucket where each first occurred.
  const extremes = candles => {
    const xs = list(candles);
    if(!xs.length) return null;
    let hi = xs[0], lo = xs[0];
    for(const x of xs) { if(x.h > hi.h) hi = x; if(x.l < lo.l) lo = x; }
    return { high: hi.h, highT: hi.t, low: lo.l, lowT: lo.t };
  };

  // ── Drawdown (§12, close-based; the peak resets at the start of the given candles) ──
  const drawdown = candles => {
    const xs = list(candles);
    const series = nulls(xs.length);
    let peakIdx = 0, max = null;
    for(let i = 0; i < xs.length; i++) {
      if(xs[i].c > xs[peakIdx].c) peakIdx = i;
      series[i] = xs[i].c / xs[peakIdx].c - 1;
      if(max === null || series[i] < max.value) max = { value: series[i], peakIndex: peakIdx, troughIndex: i };
    }
    if(max) { max.peakT = xs[max.peakIndex].t; max.troughT = xs[max.troughIndex].t; }
    return { series, max };
  };

  // ── High since / all-time high (§12) ──
  const seedDaySec = seed => {
    if(!seed || typeof seed !== 'object' || !isNum(seed.price) || !(seed.price > 0)
      || typeof seed.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(seed.date)) fail('invalid ATH seed');
    const sec = Date.parse(`${seed.date}T00:00:00Z`) / 1000;
    if(!isNum(sec)) fail('invalid ATH seed date');
    return sec;
  };
  // ATH(T): the highest h over daily candles that had fully closed by T (t + 1 day <= T), and the
  // seed when it applies. The seed applies only when its day is earlier than the provider's
  // earliest daily candle (earliestSec; the first candle given when that is unknown) and had
  // itself ended by T. → { price, t, fromSeed } or null when nothing qualifies.
  const previousAth = (daily, T, { seed = ATH_SEED, earliestSec = null } = {}) => {
    const xs = list(daily);
    if(!isNum(T)) fail('previousAth needs a time in seconds');
    let best = null;
    if(seed != null) {
      const ss = seedDaySec(seed);
      const earliest = isNum(earliestSec) ? earliestSec : (xs.length ? xs[0].t : null);
      if(earliest !== null && ss < earliest && ss + DAY_SEC <= T) best = { price: seed.price, t: ss, fromSeed: true };
    }
    for(const x of xs) {
      if(x.t + DAY_SEC > T) continue;
      if(best === null || x.h > best.price) best = { price: x.h, t: x.t, fromSeed: false };
    }
    return best;
  };
  const mdyUtc = sec => {
    const d = new Date(sec * 1000);
    return `${String(d.getUTCMonth() + 1).padStart(2, '0')}/${String(d.getUTCDate()).padStart(2, '0')}/${d.getUTCFullYear()}`;
  };
  // The one place the high/drawdown wording is decided (approved decision D18). Without a
  // verified seed nothing is called an all-time high; until the earliest candle is verified the
  // labels are in a loading state rather than showing a date that may move.
  const athLabels = ({ seedVerified = false, earliestSec = null } = {}) => {
    if(seedVerified === true) {
      return { loading: false, summaryHigh: 'All-Time High', summaryDistance: 'Distance from ATH',
        summaryDrawdown: 'Current Drawdown', contextHigh: 'Previous ATH', contextDrawdown: 'Drawdown from Previous ATH' };
    }
    if(!isNum(earliestSec)) {
      return { loading: true, summaryHigh: null, summaryDistance: null, summaryDrawdown: null, contextHigh: null, contextDrawdown: null };
    }
    const high = `High since ${mdyUtc(earliestSec)}`, dd = `Drawdown from ${high}`;
    return { loading: false, summaryHigh: high, summaryDistance: dd, summaryDrawdown: dd, contextHigh: high, contextDrawdown: dd };
  };

  return Object.freeze({
    SOURCES, CATEGORIES, ATH_SEED, PERIOD_MIN, PERIOD_MAX,
    definitions: DEFINITIONS, ids: IDS, get, resolveSettings, calculateSegmented, annualizationFactor,
    returns, extremes, drawdown, previousAth, athLabels,
  });
})();

// ─── Market: Preferences ─────────────────────────────────────────────────────
// The Market view's per-device preferences (settings.market, a device view setting: never pushed
// to Drive, never a commit stamp) and their URL form, #market?range=1y&interval=1d&scale=log&
// sma=50,200&ema=21&rsi=14&macd=12,26,9&bb=20,2&atr=14&hv=30&vol=1. Pure and total: any input —
// a hand-edited backup, a Drive file, a hostile URL — yields valid preferences, never a throw.
// Indicator settings are judged by Indicators' own validation; nothing here restates a rule.
// The URL carries view parameters only: no transaction, amount, wallet or date ever goes in it.
//
// Shape: { range, intervals: { [range]: interval chosen for it }, scale: 'linear'|'log',
//   volume: bool, indicators: { sma: { periods: [n…], source }, ema: { periods, source },
//   bollinger: { on, period, multiplier }, rsi: { on, period }, macd: { on, fast, slow, signal },
//   atr: { on, period }, volatility: { on, period } } }
//
// URL rules: each parameter overrides the stored value on its own and an invalid one is ignored.
// The indicator parameters (sma ema rsi macd bb atr hv) count as one group: when at least one
// of them is valid the URL describes the whole indicator set, so an indicator it leaves out is
// off (its stored settings are kept); with none of them the stored indicator set stands. The
// SMA/EMA price source is a stored setting only; the URL leaves it as it is.
const { normalizeMarketPrefs, parseMarketHash, formatMarketHash } = (() => {
  const MAX_LINES = 6;        // SMA or EMA lines at once
  const MAX_HASH_LENGTH = 1024;
  const SINGLE = Object.freeze({ // indicator → the settings kept for it
    bollinger: ['period', 'multiplier'], rsi: ['period'], macd: ['fast', 'slow', 'signal'],
    atr: ['period'], volatility: ['period'],
  });
  const HASH_KEY = Object.freeze({ sma: 'sma', ema: 'ema', bollinger: 'bb', rsi: 'rsi', macd: 'macd', atr: 'atr', volatility: 'hv' });
  const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
  const own = (o, k) => isObj(o) && Object.prototype.hasOwnProperty.call(o, k);
  const pick = (o, keys) => Object.fromEntries(keys.filter(k => own(o, k)).map(k => [k, o[k]]));
  const valid = (id, settings) => { try { Indicators.get(id).validate(settings); return true; } catch { return false; } };

  const defaults = () => {
    const indicators = { sma: { periods: [], source: 'close' }, ema: { periods: [], source: 'close' } };
    for(const [id, keys] of Object.entries(SINGLE)) indicators[id] = { on: false, ...pick(Indicators.get(id).defaults, keys) };
    return { range: '1Y', intervals: {}, scale: 'linear', volume: true, indicators };
  };
  const normLines = (id, raw) => {
    const d = Indicators.get(id).defaults;
    const source = own(raw, 'source') && valid(id, { source: raw.source }) ? raw.source : d.source;
    const list = own(raw, 'periods') && Array.isArray(raw.periods) ? raw.periods : [];
    const periods = [...new Set(list.filter(p => valid(id, { period: p })))].sort((a, b) => a - b).slice(0, MAX_LINES);
    return { periods, source };
  };
  // Wrong-typed or out-of-range settings fall back to that indicator's defaults as a whole (a
  // MACD of fast 30 with slow 26 has no single bad key to drop).
  const normSingle = (id, raw) => {
    const keys = SINGLE[id];
    const s = Indicators.resolveSettings(id, pick(raw, keys));
    return { on: own(raw, 'on') && raw.on === true, ...pick(s, keys) };
  };
  const normalize = raw => {
    const out = defaults();
    if(!isObj(raw)) return out;
    if(typeof raw.range === 'string' && Candles.RANGES.includes(raw.range)) out.range = raw.range;
    if(isObj(raw.intervals)) {
      for(const r of Candles.RANGES) {
        const iv = own(raw.intervals, r) ? raw.intervals[r] : undefined;
        if(typeof iv === 'string' && Candles.INTERVAL_KEYS.includes(iv) && iv !== Candles.defaultInterval(r)) out.intervals[r] = iv;
      }
    }
    if(raw.scale === 'log' || raw.scale === 'linear') out.scale = raw.scale;
    if(typeof raw.volume === 'boolean') out.volume = raw.volume;
    const ind = isObj(raw.indicators) ? raw.indicators : {};
    out.indicators.sma = normLines('sma', ind.sma);
    out.indicators.ema = normLines('ema', ind.ema);
    for(const id of Object.keys(SINGLE)) out.indicators[id] = normSingle(id, ind[id]);
    return out;
  };
  const normalizeMarketPrefs = raw => { try { return normalize(raw); } catch { return defaults(); } };

  // ── URL ──
  const INT = /^\d{1,4}$/, DEC = /^\d{1,2}(\.\d{1,4})?$/;
  const ints = (s, n) => {
    const parts = s.split(',');
    return parts.length === n && parts.every(p => INT.test(p)) ? parts.map(Number) : null;
  };
  // → the indicator's patch, or null when the value is not valid for it.
  const parseIndicator = (id, value, base) => {
    if(id === 'sma' || id === 'ema') {
      const parts = value.split(',');
      if(!parts.length || parts.length > MAX_LINES || !parts.every(p => INT.test(p))) return null;
      const periods = parts.map(Number);
      return periods.every(p => valid(id, { period: p })) ? { periods } : null;
    }
    let s = null;
    if(id === 'macd') { const n = ints(value, 3); s = n && { fast: n[0], slow: n[1], signal: n[2] }; }
    else if(id === 'bollinger') {
      const [p, m, ...rest] = value.split(',');
      s = !rest.length && INT.test(p || '') && DEC.test(m || '') ? { period: Number(p), multiplier: Number(m) } : null;
    } else { const n = ints(value, 1); s = n && { period: n[0] }; }
    return s && valid(id, { ...base[id], ...s }) ? { on: true, ...s } : null;
  };
  const parseMarketHash = (hash, basePrefs = null) => {
    const prefs = normalizeMarketPrefs(basePrefs);
    try {
      if(typeof hash !== 'string' || hash.length > MAX_HASH_LENGTH) return prefs;
      let q = hash.replace(/^#/, '');
      if(q.startsWith('market')) q = q.slice(6);
      if(!q.startsWith('?')) return prefs;
      const params = new URLSearchParams(q.slice(1));
      const get = k => { const v = params.get(k); return typeof v === 'string' ? v : null; };
      const range = get('range') && Candles.RANGES.find(r => r === get('range').toUpperCase());
      if(range) prefs.range = range;
      const iv = get('interval');
      if(iv && Candles.INTERVAL_KEYS.includes(iv)) {
        if(iv === Candles.defaultInterval(prefs.range)) delete prefs.intervals[prefs.range];
        else prefs.intervals[prefs.range] = iv;
      }
      const scale = get('scale');
      if(scale === 'log' || scale === 'linear') prefs.scale = scale;
      const vol = get('vol');
      if(vol === '1' || vol === '0') prefs.volume = vol === '1';
      const found = {};
      for(const [id, key] of Object.entries(HASH_KEY)) {
        const v = get(key);
        const p = v === null ? null : parseIndicator(id, v, prefs.indicators);
        if(p) found[id] = p;
      }
      if(Object.keys(found).length) {
        for(const id of Object.keys(HASH_KEY)) {
          const cur = prefs.indicators[id];
          if(id === 'sma' || id === 'ema') prefs.indicators[id] = { ...cur, periods: found[id] ? found[id].periods : [] };
          else prefs.indicators[id] = { ...cur, ...(found[id] || { on: false }) };
        }
      }
      return normalizeMarketPrefs(prefs);
    } catch { return normalizeMarketPrefs(basePrefs); }
  };
  // `interval` is the interval actually on screen (the stored choice may not be allowed yet);
  // without it the stored choice, else the range's default, is written.
  const formatMarketHash = (rawPrefs, interval = null) => {
    const p = normalizeMarketPrefs(rawPrefs);
    const iv = typeof interval === 'string' && Candles.INTERVAL_KEYS.includes(interval)
      ? interval : (p.intervals[p.range] || Candles.defaultInterval(p.range));
    const parts = [`range=${p.range.toLowerCase()}`, `interval=${iv}`, `scale=${p.scale}`];
    const ind = p.indicators;
    if(ind.sma.periods.length) parts.push(`sma=${ind.sma.periods.join(',')}`);
    if(ind.ema.periods.length) parts.push(`ema=${ind.ema.periods.join(',')}`);
    if(ind.rsi.on) parts.push(`rsi=${ind.rsi.period}`);
    if(ind.macd.on) parts.push(`macd=${ind.macd.fast},${ind.macd.slow},${ind.macd.signal}`);
    if(ind.bollinger.on) parts.push(`bb=${ind.bollinger.period},${ind.bollinger.multiplier}`);
    if(ind.atr.on) parts.push(`atr=${ind.atr.period}`);
    if(ind.volatility.on) parts.push(`hv=${ind.volatility.period}`);
    parts.push(`vol=${p.volume ? 1 : 0}`);
    return `#market?${parts.join('&')}`;
  };
  return { normalizeMarketPrefs, parseMarketHash, formatMarketHash };
})();

// ─── Market: Personal ────────────────────────────────────────────────────────
// The join between the user's transactions and market history: chart rows, price resolution,
// balance history, Average Acquisition Price, the selected-range summary, filters and marker
// aggregation. Analytics only — not tax accounting, and wired into no tax path. Spec:
// docs/personal-market-analytics.md §1–10.
//
// Every function takes the transaction array as an argument and returns new objects: nothing is
// mutated, nothing is stored, and no field is added to a transaction. Every BTC quantity is an
// integer number of satoshis (toSatsInt); USD, prices and percentages are floats. Balance effects
// come from txPortfolioDelta / txWalletDeltas and nowhere else.
//
// The four averages are different numbers and keep their own names:
//   Average Acquisition Price  avgAcquisition, default options — purchases with their fees plus
//                              rewards at receipt value. Sales do not change it.
//   Average Purchase Price     the same function, AVG_PRESETS.PURCHASE_PRICE — purchases only,
//                              pre-fee. Reserved; no UI yet.
//   Dashboard Average Cost     applyTxToCostPool (not here)
//   Tax-Lot Cost Basis         buildLots (not here)
// `price` and `totalUsd / amount` are pre-fee unit prices, never "execution" prices.
const PersonalMarket = (() => {
  const DAY = 86400;
  const PRICE_SOURCE = Object.freeze({
    RECORDED_UNIT_PRICE:       'recorded_unit_price',
    DERIVED_TRANSACTION_VALUE: 'derived_transaction_value',
    REWARD_RECEIPT_VALUE:      'reward_receipt_value',
    HISTORICAL_MARKET_LOOKUP:  'historical_market_lookup',
    UNKNOWN:                   'unknown',
  });
  const CATEGORY = Object.freeze({
    ACQUISITION: 'ACQUISITION', DISPOSAL: 'DISPOSAL', REWARD: 'REWARD',
    TRANSFER_INTERNAL: 'TRANSFER_INTERNAL', SENT: 'SENT', RECEIVED: 'RECEIVED', FEE_ONLY: 'FEE_ONLY',
  });
  // Markers group the four transfer-like categories into one: they share a shape and a filter.
  const MARKER_GROUP = Object.freeze({
    ACQUISITION: 'ACQUISITION', DISPOSAL: 'DISPOSAL', REWARD: 'REWARD',
    TRANSFER_INTERNAL: 'TRANSFER', SENT: 'TRANSFER', RECEIVED: 'TRANSFER', FEE_ONLY: 'TRANSFER',
  });
  const MARKER_GROUP_ORDER = Object.freeze(['ACQUISITION', 'REWARD', 'DISPOSAL', 'TRANSFER']);
  const AVG_PRESETS = Object.freeze({
    ACQUISITION_PRICE: Object.freeze({ include: Object.freeze(['Buy', 'Reward']), feeMode: 'include' }),
    PURCHASE_PRICE:    Object.freeze({ include: Object.freeze(['Buy']), feeMode: 'exclude' }),
  });
  // §10: Purchases, Sales and Rewards on; Transfers (internal, sent, received, fee-only) off.
  // `wallets` null = every wallet.
  const DEFAULT_FILTERS = Object.freeze({ purchases: true, sales: true, rewards: true, transfers: false, wallets: null });
  const FILTER_KEY = Object.freeze({
    ACQUISITION: 'purchases', DISPOSAL: 'sales', REWARD: 'rewards',
    TRANSFER_INTERNAL: 'transfers', SENT: 'transfers', RECEIVED: 'transfers', FEE_ONLY: 'transfers',
  });
  const DEFAULT_MAX_MARKERS = 300;

  const isFiniteNum = x => typeof x === 'number' && Number.isFinite(x);
  const positive = x => isFiniteNum(x) && x > 0 ? x : null;
  const strOrEmpty = v => typeof v === 'string' ? v : '';

  // ── Daily closes (§3 HISTORICAL_MARKET_LOOKUP) ──
  // day start (UTC seconds) → close, from completed daily candles only. A candle flagged partial,
  // or (when nowSec is given) one whose day has not ended, is the forming candle: its close is
  // not that day's close, so it is not used.
  const dailyCloseMap = (candlesDaily, nowSec = null) => {
    const m = new Map();
    if(!Array.isArray(candlesDaily)) return m;
    for(const k of candlesDaily) {
      if(!k || !isFiniteNum(k.t) || k.t % DAY !== 0 || !positive(k.c) || k.partial) continue;
      if(isFiniteNum(nowSec) && k.t + DAY > nowSec) continue;
      m.set(k.t, k.c);
    }
    return m;
  };
  const dayStart = tSec => tSec - (((tSec % DAY) + DAY) % DAY);

  // ── Classification (§5), from the balance rules' reading of which ends are named ──
  const categoryOf = tx => {
    switch(tx.type) {
      case 'Buy': return CATEGORY.ACQUISITION;
      case 'Sell': return CATEGORY.DISPOSAL;
      case 'Reward': return CATEGORY.REWARD;
      case 'Consolidation': return CATEGORY.FEE_ONLY;
      case 'Transfer':
        // As txPortfolioDelta: from only = outflow, to only = inflow, otherwise only the fee
        // leaves (both named, or — on a malformed row — neither).
        if(tx.wallet && !tx.wallet2) return CATEGORY.SENT;
        if(!tx.wallet && tx.wallet2) return CATEGORY.RECEIVED;
        return CATEGORY.TRANSFER_INTERNAL;
      default: return null;
    }
  };

  // ── Price and value resolution (§3) ──
  // Returns { price, priceSource, usdValue }. usdValue is the pre-fee USD value of the row:
  // Buy/Sell numOr(totalUsd, amount × price) — the expression the rest of the app uses — and,
  // for a Reward, its value at receipt (usdValueAtReceipt, else amount × recorded price, else
  // amount × the day's close, then flagged by its priceSource). A value that is not positive is
  // unknown (null), never $0.
  const resolve = (tx, sats, closes) => {
    const btc = sats / 1e8;
    const close = closes.get(dayStart(Math.floor(txInstant(tx) / 1000)));
    const lookup = close != null
      ? { price: close, priceSource: PRICE_SOURCE.HISTORICAL_MARKET_LOOKUP }
      : { price: null, priceSource: PRICE_SOURCE.UNKNOWN };
    if(tx.type === 'Buy' || tx.type === 'Sell') {
      const usdValue = positive(numOr(tx.totalUsd, numOr(tx.amount) * numOr(tx.price)));
      const recorded = positive(numOr(tx.price, NaN));
      if(recorded) return { price: recorded, priceSource: PRICE_SOURCE.RECORDED_UNIT_PRICE, usdValue };
      const total = positive(numOr(tx.totalUsd, NaN));
      if(total && sats > 0) return { price: total / btc, priceSource: PRICE_SOURCE.DERIVED_TRANSACTION_VALUE, usdValue };
      return { ...lookup, usdValue };
    }
    if(tx.type === 'Reward') {
      const receipt = hasUsdValue(tx) ? positive(parseFloat(tx.usdValueAtReceipt)) : null;
      if(receipt && sats > 0) return { price: receipt / btc, priceSource: PRICE_SOURCE.REWARD_RECEIPT_VALUE, usdValue: receipt };
      const recorded = positive(numOr(tx.price, NaN));
      if(recorded) return { price: recorded, priceSource: PRICE_SOURCE.RECORDED_UNIT_PRICE, usdValue: sats > 0 ? btc * recorded : null };
      return { ...lookup, usdValue: lookup.price && sats > 0 ? btc * lookup.price : null };
    }
    // Transfer, Consolidation: the day's close only places an optional marker; no value.
    return { ...lookup, usdValue: null };
  };

  // §3 all-in figure, for Buy and Sell with a fee: Buy (totalUsd + fee) / amount, "Cost per BTC
  // including fees"; Sell (totalUsd − fee) / amount, "Net per BTC after fees".
  const allInOf = (type, usdValue, feeUsd, sats) => {
    if(!(feeUsd > 0) || usdValue == null || !(sats > 0)) return null;
    if(type === 'Buy') return (usdValue + feeUsd) / (sats / 1e8);
    if(type === 'Sell') return (usdValue - feeUsd) / (sats / 1e8);
    return null;
  };

  // ── Normalization (§2) ──
  // → { items, skipped } — items sorted with compareTx, one per usable transaction; skipped
  // counts rows with no usable instant (`noTime`) or an unknown type (`badType`). notes and
  // txhash are not copied: the detail panel reads them from the original record by id.
  const toChartTransactions = (transactions, { candlesDaily = null, nowSec = null } = {}) => {
    const closes = dailyCloseMap(candlesDaily, nowSec);
    const skipped = { noTime: 0, badType: 0 };
    const usable = [];
    (Array.isArray(transactions) ? transactions : []).forEach((tx, i) => {
      if(!tx || typeof tx !== 'object') { skipped.noTime++; return; }
      if(!Number.isFinite(txInstant(tx))) { skipped.noTime++; return; }
      if(!categoryOf(tx)) { skipped.badType++; return; }
      usable.push({ tx, i });
    });
    usable.sort((a, b) => compareTx(a.tx, b.tx) || a.i - b.i);
    const items = usable.map(({ tx }) => {
      const sats = toSatsInt(tx.amount);
      const btcFee = tx.type === 'Transfer' || tx.type === 'Consolidation';
      const feeUsd = (tx.type === 'Buy' || tx.type === 'Sell') ? numOr(tx.fee) : null;
      const r = resolve(tx, sats, closes);
      return {
        id: tx.id,
        tSec: Math.floor(txInstant(tx) / 1000),
        dateOnly: isNoonPlaceholder(tx),
        category: categoryOf(tx),
        type: tx.type,
        sats,
        feeSats: btcFee ? toSatsInt(tx.fee) : null,
        feeUsd,
        price: r.price,
        priceSource: r.priceSource,
        usdValueSource: tx.type === 'Reward' && r.priceSource === PRICE_SOURCE.REWARD_RECEIPT_VALUE ? strOrEmpty(tx.usdValueSource) : '',
        usdValue: r.usdValue,
        allIn: allInOf(tx.type, r.usdValue, feeUsd, sats),
        excludeStats: !!tx.excludeStats,
        wallet: strOrEmpty(tx.wallet),
        wallet2: strOrEmpty(tx.wallet2),
      };
    });
    return { items, skipped };
  };

  // UI wording for a row's price source (§3 table). Never "execution price".
  const priceSourceLabel = row => {
    if(!row) return 'Price unknown';
    const transferLike = row.type === 'Transfer' || row.type === 'Consolidation';
    switch(row.priceSource) {
      case PRICE_SOURCE.RECORDED_UNIT_PRICE:
        return row.type === 'Reward' ? 'Recorded price' : 'Recorded price (before fees)';
      case PRICE_SOURCE.DERIVED_TRANSACTION_VALUE:
        return 'Implied price: total ÷ amount (before fees)';
      case PRICE_SOURCE.REWARD_RECEIPT_VALUE: {
        const detail = Object.prototype.hasOwnProperty.call(USD_VALUE_SOURCE_LABELS, row.usdValueSource)
          ? USD_VALUE_SOURCE_LABELS[row.usdValueSource] : '';
        return detail ? `Value at receipt (${detail})` : 'Value at receipt';
      }
      case PRICE_SOURCE.HISTORICAL_MARKET_LOOKUP:
        return transferLike ? "Day's closing price (for reference)" : "Estimated from that day's closing price";
      default: return 'Price unknown';
    }
  };
  const allInLabel = row => !row || row.allIn == null ? null
    : row.type === 'Buy' ? 'Cost per BTC including fees' : 'Net per BTC after fees';

  // ── Filters (§10) ──
  const normalizeFilters = f => {
    const src = f && typeof f === 'object' ? f : {};
    const out = {};
    for(const k of ['purchases', 'sales', 'rewards', 'transfers']) out[k] = typeof src[k] === 'boolean' ? src[k] : DEFAULT_FILTERS[k];
    out.wallets = Array.isArray(src.wallets) ? [...new Set(src.wallets.filter(w => typeof w === 'string' && w))] : null;
    return out;
  };
  // A row matches the wallet filter when `wallet` or `wallet2` is listed.
  const inWallets = (row, wallets) => !wallets || wallets.includes(row.wallet) || wallets.includes(row.wallet2);
  const applyFilters = (rows, filters) => {
    const f = normalizeFilters(filters);
    return (Array.isArray(rows) ? rows : []).filter(r => r && f[FILTER_KEY[r.category]] && inWallets(r, f.wallets));
  };

  // ── Balance history (§6) ──
  // [{ tSec, sats }] step series, compareTx order, one point per instant holding the balance after
  // the last transaction at that instant. Every transaction counts, excludeStats included. With
  // `wallets`, the balance of just those wallets (txWalletDeltas): an internal transfer between
  // two of them costs only the fee, one to a wallet outside the set moves the amount.
  const balanceHistory = (transactions, { wallets = null } = {}) => {
    const scope = Array.isArray(wallets) ? new Set(wallets) : null;
    const rows = (Array.isArray(transactions) ? transactions : [])
      .map((tx, i) => ({ tx, i }))
      .filter(({ tx }) => tx && typeof tx === 'object' && Number.isFinite(txInstant(tx)))
      .sort((a, b) => compareTx(a.tx, b.tx) || a.i - b.i);
    const out = [];
    let bal = 0;
    for(const { tx } of rows) {
      const d = scope
        ? txWalletDeltas(tx, toSatsInt).reduce((s, [w, x]) => scope.has(w) ? s + x : s, 0)
        : txPortfolioDelta(tx, toSatsInt);
      bal += d;
      const tSec = Math.floor(txInstant(tx) / 1000);
      if(out.length && out[out.length - 1].tSec === tSec) out[out.length - 1].sats = bal;
      else out.push({ tSec, sats: bal });
    }
    return out;
  };
  // Balance after every transaction with tSec < atSec (0 before the first).
  const balanceBefore = (history, atSec) => {
    let lo = 0, hi = Array.isArray(history) ? history.length : 0;
    while(lo < hi) { const mid = (lo + hi) >> 1; if(history[mid].tSec < atSec) lo = mid + 1; else hi = mid; }
    return lo ? history[lo - 1].sats : 0;
  };
  // Resampled to candle buckets: the value at bucket t is the balance after the last transaction
  // with tSec < t + interval (the bucket's end).
  const balanceAtBuckets = (history, bucketTimes, interval) => {
    const s = Candles.intervalSeconds(interval);
    return (Array.isArray(bucketTimes) ? bucketTimes : []).map(t => ({ t, sats: balanceBefore(history, t + s) }));
  };

  // ── Average Acquisition Price (§7) ──
  // Rows → { sats, usdIn } through a per-type table, then reduce. usdIn: Buy = pre-fee value plus
  // the USD fee when feeMode is 'include'; Reward = value at receipt (estimated when it came from
  // the day's close). A row with no known usdIn is left out of numerator AND denominator.
  const USD_IN = Object.freeze({
    Buy: (row, feeMode) => row.usdValue == null ? null : row.usdValue + (feeMode === 'include' ? (row.feeUsd || 0) : 0),
    Reward: row => row.usdValue,
  });
  const avgOptions = opts => {
    const o = opts && typeof opts === 'object' ? opts : {};
    const include = (Array.isArray(o.include) ? o.include : AVG_PRESETS.ACQUISITION_PRICE.include)
      .filter(t => Object.prototype.hasOwnProperty.call(USD_IN, t));
    return {
      include, feeMode: o.feeMode === 'exclude' ? 'exclude' : 'include',
      fromSec: isFiniteNum(o.fromSec) ? o.fromSec : -Infinity,
      upToSec: isFiniteNum(o.upToSec) ? o.upToSec : Infinity,
      wallets: Array.isArray(o.wallets) ? o.wallets : null,
    };
  };
  // Over normalized rows; yields each included row with its usdIn, or the reason it was skipped.
  const acquisitionRows = (rows, o) => {
    const out = [];
    for(const row of rows) {
      if(!o.include.includes(row.type)) continue;
      if(row.tSec < o.fromSec || row.tSec > o.upToSec) continue;
      if(o.wallets && !inWallets(row, o.wallets)) continue;
      if(row.excludeStats) { out.push({ row, skip: 'excluded' }); continue; }
      if(!(row.sats > 0)) { out.push({ row, skip: 'nonPositive' }); continue; }
      const usdIn = USD_IN[row.type](row, o.feeMode);
      if(!(usdIn > 0)) { out.push({ row, skip: 'unknownValue' }); continue; }
      out.push({ row, usdIn, estimated: row.priceSource === PRICE_SOURCE.HISTORICAL_MARKET_LOOKUP });
    }
    return out;
  };
  const avgFromRows = (rows, opts) => {
    const o = avgOptions(opts);
    const res = { price: null, sats: 0, usd: 0, count: 0, estimated: 0, skipped: { unknownValue: 0, excluded: 0, nonPositive: 0 } };
    for(const a of acquisitionRows(rows, o)) {
      if(a.skip) { res.skipped[a.skip]++; continue; }
      res.sats += a.row.sats; res.usd += a.usdIn; res.count++;
      if(a.estimated) res.estimated++;
    }
    res.price = res.sats > 0 ? res.usd / (res.sats / 1e8) : null;
    return res;
  };
  // avgAcquisition(transactions, { candlesDaily, nowSec, include, feeMode, fromSec, upToSec, wallets })
  // → { price, sats, usd, count, estimated, skipped: { unknownValue, excluded, nonPositive } }.
  // fromSec and upToSec are both inclusive. Sell, Transfer and Consolidation never count.
  const avgAcquisition = (transactions, opts = {}) =>
    avgFromRows(toChartTransactions(transactions, opts).items, opts);
  // Historical step line: [{ tSec, price }], the running average after each included
  // acquisition. Acquisitions at one instant give one point (the value after the last of them),
  // as the chart cannot hold two values at one time. Sales and transfers produce no step.
  const avgAcquisitionSeries = (transactions, opts = {}) => {
    const o = avgOptions(opts);
    const out = [];
    let sats = 0, usd = 0;
    for(const a of acquisitionRows(toChartTransactions(transactions, opts).items, o)) {
      if(a.skip) continue;
      sats += a.row.sats; usd += a.usdIn;
      const p = { tSec: a.row.tSec, price: usd / (sats / 1e8) };
      if(out.length && out[out.length - 1].tSec === p.tSec) out[out.length - 1] = p; else out.push(p);
    }
    return out;
  };

  // ── Selected-range summary, "My Activity" (§8) ──
  // [fromSec, toSec). Category filters and the wallet filter apply to every line; Net BTC Change
  // comes from the balance history (scoped to the filtered wallets when there are any), so it
  // reflects fees and transfers. Internal transfers count in none of the other lines.
  const rangeSummary = (transactions, { fromSec, toSec, candlesDaily = null, nowSec = null, filters = null } = {}) => {
    const f = normalizeFilters(filters);
    const lo = isFiniteNum(fromSec) ? fromSec : -Infinity, hi = isFiniteNum(toSec) ? toSec : Infinity;
    const all = toChartTransactions(transactions, { candlesDaily, nowSec }).items;
    const rows = applyFilters(all.filter(r => r.tSec >= lo && r.tSec < hi), f);
    const sum = cat => rows.reduce((s, r) => r.category === cat ? s + r.sats : s, 0);
    const counted = rows.filter(r => r.category === CATEGORY.ACQUISITION || r.category === CATEGORY.DISPOSAL || r.category === CATEGORY.REWARD);
    const history = balanceHistory(transactions, { wallets: f.wallets });
    const netSats = balanceBefore(history, hi) - balanceBefore(history, lo);
    const acquiredSats = sum(CATEGORY.ACQUISITION), rewardSats = sum(CATEGORY.REWARD), soldSats = sum(CATEGORY.DISPOSAL);
    const include = [...(f.purchases ? ['Buy'] : []), ...(f.rewards ? ['Reward'] : [])];
    const invested = avgFromRows(rows, { include: ['Buy'], feeMode: 'include' });
    return {
      transactions: counted.length,
      acquiredSats, rewardSats, soldSats, netSats,
      usdInvested: invested.usd,
      usdInvestedSkipped: invested.skipped.unknownValue,
      avgAcquisition: avgFromRows(rows, { include, feeMode: 'include' }),
      // "Includes network fees and transfers to or from untracked wallets"
      netIncludesOther: netSats !== acquiredSats + rewardSats - soldSats,
    };
  };
