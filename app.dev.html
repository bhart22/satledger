// Records keys whose stored value was present but unreadable, so App can warn on mount.
const storageLoadIssues = [];
// Distinguishes "no data yet" from "data present but corrupt". The old behaviour swallowed
// the parse error and returned the defaults, which looked exactly like a fresh install —
// so a single bad write silently presented an empty portfolio. A corrupt blob is now
// quarantined under `<key>-corrupt` instead of being thrown away.
const loadStoredArray = (key, fallback) => {
  let raw = null;
  try { raw = localStorage.getItem(key); } catch { return fallback; }
  if(raw === null) return fallback;
  try {
    const parsed = JSON.parse(raw);
    if(!Array.isArray(parsed)) throw new Error('stored value is not an array');
    return parsed;
  } catch(e) {
    console.error('Stored data unreadable:', key, e);
    safeSetItem(key+'-corrupt', raw);
    storageLoadIssues.push(key);
    return []; // deliberately not `fallback` — never paper over real data with samples
  }
};
// Coerce, don't drop: a row with a non-string date would throw in .slice()/.localeCompare()
// and blank the whole app, but discarding the row would be data loss.
// Numeric fields arrive as numbers from hand-edited backups and other tools; the UI calls
// string methods on them (search used to crash on `amount.includes`).
const TX_STRING_FIELDS = ['amount','price','fee','totalUsd','wallet','wallet2','notes','txhash','usdValueAtReceipt'];
const sanitizeStoredTransactions = list => list.map(tx => {
  if(!tx || typeof tx !== 'object') return { date:'', type:'Buy', amount:'' };
  let out = tx;
  if(typeof tx.date !== 'string') out = {...out, date: tx.date == null ? '' : String(tx.date)};
  for(const k of TX_STRING_FIELDS) {
    if(typeof out[k] === 'number' || typeof out[k] === 'boolean') {
      if(out === tx) out = {...tx};
      out[k] = String(out[k]);
    }
  }
  return out;
});

// Sanitize, de-duplicate ids, fill datetimeUtc/sequence on rows that predate them, and default reward categories
const prepareTransactions = list => migrateRewardCategory(migrateTxTimestamps(ensureTxIds(sanitizeStoredTransactions(list))));

// ─── Market: Candle store ────────────────────────────────────────────────────
// IndexedDB cache of completed native candles (docs/market-data.md §14): database
// satledger-market v1, stores candles / coverage / meta, the same interface as
// MarketData.createMemoryStore(). Public market data only — not synced, not backed up, always
// safe to discard. Opened lazily by open(); if IndexedDB is unavailable, blocked or failing, the
// in-memory store is used for the session. Every operation resolves: a failed transaction logs a
// warning and behaves as a cache miss. A schema change bumps DB_VERSION and the upgrade drops and
// recreates every store.
const MarketCandleStore = (() => {
  const DB_NAME = 'satledger-market', DB_VERSION = 1, OPEN_TIMEOUT_MS = 3000;
  const STORES = {
    candles: ['provider', 'symbol', 'interval', 't'],
    coverage: ['provider', 'symbol', 'interval', 'pageIndex'],
    meta: 'key',
  };
  const warn = (what, e) => console.warn(`Market cache: ${what} failed; continuing without it`, e?.name || e?.message || String(e));
  const request = r => new Promise((resolve, reject) => { r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error); });

  const openDb = idb => new Promise((resolve, reject) => {
    let settled = false;
    const finish = (fn, v) => { if(!settled) { settled = true; clearTimeout(timer); fn(v); } };
    // A blocked upgrade (another tab holding an older version) must not hold the feature hostage.
    const timer = setTimeout(() => finish(reject, new Error('open timed out')), OPEN_TIMEOUT_MS);
    let r;
    try { r = idb.open(DB_NAME, DB_VERSION); } catch(e) { finish(reject, e); return; }
    r.onupgradeneeded = () => {
      const db = r.result;
      for(const name of [...db.objectStoreNames]) db.deleteObjectStore(name);
      for(const [name, keyPath] of Object.entries(STORES)) db.createObjectStore(name, { keyPath });
    };
    r.onsuccess = () => {
      const db = r.result;
      if(settled) { db.close(); return; }
      db.onversionchange = () => db.close(); // let a newer tab upgrade; later calls become misses
      finish(resolve, db);
    };
    r.onerror = () => finish(reject, r.error);
  });

  const wrap = db => {
    // Runs fn inside one transaction; for writes, waits for it to commit.
    const run = async (what, names, mode, fn, fallback) => {
      try {
        const tx = db.transaction(names, mode);
        const committed = new Promise((resolve, reject) => {
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
          tx.onabort = () => reject(tx.error || new Error('transaction aborted'));
        });
        const result = await fn(tx);
        if(mode === 'readwrite') await committed; else committed.catch(() => {});
        return result;
      } catch(e) { warn(what, e); return fallback; }
    };
    return {
      kind: 'indexeddb',
      getCandles: ({ provider, symbol, interval, fromSec = -Infinity, toSec = Infinity }) => !(toSec > fromSec) ? Promise.resolve([])
        : run('read candles', ['candles'], 'readonly', tx => request(tx.objectStore('candles').getAll(
            IDBKeyRange.bound([provider, symbol, interval, fromSec], [provider, symbol, interval, toSec], false, true)))
          .then(rows => rows.map(({ t, o, h, l, c, v }) => ({ t, o, h, l, c, v: v ?? null }))), []),
      putCandles: ({ provider, symbol, interval, candles }) => run('write candles', ['candles'], 'readwrite', tx => {
        const os = tx.objectStore('candles');
        for(const { t, o, h, l, c, v } of Array.isArray(candles) ? candles : []) os.put({ provider, symbol, interval, t, o, h, l, c, v: v ?? null });
      }, undefined),
      getCoverage: ({ provider, symbol, interval, fromPage = -Infinity, toPage = Infinity }) => !(toPage >= fromPage) ? Promise.resolve([])
        : run('read coverage', ['coverage'], 'readonly', tx => request(tx.objectStore('coverage').getAll(
            IDBKeyRange.bound([provider, symbol, interval, fromPage], [provider, symbol, interval, toPage]))), []),
      putCoverage: ({ provider, symbol, interval, pageIndex, fetchedAt, complete }) => run('write coverage', ['coverage'], 'readwrite', tx => {
        tx.objectStore('coverage').put({ provider, symbol, interval, pageIndex, fetchedAt, complete: !!complete });
      }, undefined),
      getMeta: key => run('read meta', ['meta'], 'readonly', tx => request(tx.objectStore('meta').get(key)).then(r => r ? r.value ?? null : null), null),
      putMeta: (key, value) => run('write meta', ['meta'], 'readwrite', tx => {
        tx.objectStore('meta').put({ key, value: value === undefined ? null : value, at: Date.now() });
      }, undefined),
      clear: () => run('clear', Object.keys(STORES), 'readwrite', tx => { for(const name of Object.keys(STORES)) tx.objectStore(name).clear(); }, undefined),
    };
  };

  // A new store each call; `idb` is injectable so tests can make it fail.
  const create = async ({ idb } = {}) => {
    try {
      if(idb === undefined) idb = typeof indexedDB === 'undefined' ? null : indexedDB; // the getter itself can throw
      if(!idb || typeof idb.open !== 'function') throw new Error('IndexedDB unavailable');
      return Object.freeze(wrap(await openDb(idb)));
    } catch(e) {
      warn('open', e);
      return Object.freeze(MarketData.createMemoryStore());
    }
  };
  let opened = null;
  const open = () => opened || (opened = create());
  return Object.freeze({ DB_NAME, DB_VERSION, open, create });
})();

// ─── Market: Chart adapter ───────────────────────────────────────────────────
// The only code that touches TradingView Lightweight Charts (docs/market-analytics.md §7). The
// library is vendored — pinned 5.3.0, Apache 2.0, NOTICE under vendor/ — and loaded lazily the
// first time the Market tab opens. MarketView talks to the adapter in plain data: candles in the
// { t, o, h, l, c, v } model in, { index, t } and index ranges out. No library object crosses.
const CHART_LIBRARY_SRC = 'vendor/lightweight-charts-5.3.0.standalone.production.js';
const CHART_LIBRARY_TIMEOUT_MS = 20000;
let chartLibraryPromise = null;
// One shared promise. A failure removes the tag and forgets the promise, so Retry starts over.
function loadChartLibrary() {
  if(window.LightweightCharts) return Promise.resolve(window.LightweightCharts);
  if(chartLibraryPromise) return chartLibraryPromise;
  const p = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    let timer = null;
    const done = err => {
      clearTimeout(timer);
      s.onload = s.onerror = null;
      if(!err && window.LightweightCharts) { resolve(window.LightweightCharts); return; }
      s.remove();
      if(chartLibraryPromise === p) chartLibraryPromise = null;
      reject(err || new Error('the chart library did not initialise'));
    };
    s.src = CHART_LIBRARY_SRC;
    s.async = true;
    s.onload = () => done(null);
    s.onerror = () => done(new Error('the chart library could not be loaded'));
    timer = setTimeout(() => done(new Error('the chart library took too long to load')), CHART_LIBRARY_TIMEOUT_MS);
    document.head.appendChild(s);
  });
  chartLibraryPromise = p;
  return p;
}

function createChartAdapter(container, { theme = 'light', mode = 'inline' } = {}) {
  const LC = window.LightweightCharts;
  if(!LC || typeof LC.createChart !== 'function') throw new Error('createChartAdapter: the chart library is not loaded');
  let pal = CHART_PALETTES[theme] || CHART_PALETTES.light;
  let interaction = mode;
  let wheel = false;      // wheel zoom/scroll only once the chart is clicked or focused (§4)
  let destroyed = false;
  let bars = [];          // the candles on screen, with a `forming` flag
  let byTime = new Map(); // t → index
  let quietUntil = 0;     // range changes before this come from our own calls, not the user
  const quiet = () => { quietUntil = performance.now() + 300; };

  const interactionOptions = () => ({
    handleScroll: { mouseWheel: wheel, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: interaction === 'expanded' },
    handleScale: { mouseWheel: wheel, pinch: true, axisPressedMouseMove: true, axisDoubleClickReset: true },
    kineticScroll: { touch: true, mouse: false },
    trackingMode: { exitMode: LC.TrackingModeExitMode.OnNextTap },
  });
  const themeOptions = () => ({
    layout: { background: { type: LC.ColorType.Solid, color: 'rgba(0,0,0,0)' }, textColor: pal.text, attributionLogo: true },
    grid: { vertLines: { color: pal.grid }, horzLines: { color: pal.grid } },
    rightPriceScale: { borderColor: pal.border },
    timeScale: { borderColor: pal.border },
    crosshair: { vertLine: { color: pal.cross, labelBackgroundColor: pal.label }, horzLine: { color: pal.cross, labelBackgroundColor: pal.label } },
  });
  const candleStyle = () => ({
    upColor: 'rgba(0,0,0,0)', downColor: pal.down, borderUpColor: pal.up, borderDownColor: pal.down,
    wickUpColor: pal.up, wickDownColor: pal.down,
  });

  const chart = LC.createChart(container, {
    width: Math.max(1, container.clientWidth), height: Math.max(1, container.clientHeight),
    ...themeOptions(),
    ...interactionOptions(),
    layout: { ...themeOptions().layout, fontFamily: getComputedStyle(container).fontFamily || undefined },
    rightPriceScale: { borderColor: pal.border, scaleMargins: { top: 0.08, bottom: 0.24 }, ensureEdgeTickMarksVisible: true },
    timeScale: { borderColor: pal.border, timeVisible: false, secondsVisible: false, rightOffset: 3 },
    crosshair: { ...themeOptions().crosshair, mode: LC.CrosshairMode.Normal },
  });
  // Formats are per series, not chart-wide (a chart-wide priceFormatter would put a $ on the
  // RSI and volatility panes too).
  const candles = chart.addSeries(LC.CandlestickSeries, { ...candleStyle(), priceFormat: CHART_FORMATS.usd });
  const volume = chart.addSeries(LC.HistogramSeries, { priceScaleId: 'volume', priceFormat: { type: 'volume' }, lastValueVisible: false, priceLineVisible: false });
  chart.priceScale('volume').applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
  liveChartAdapters++; reportChartAdapters();

  const toCandle = b => b.forming
    ? { time: b.t, open: b.o, high: b.h, low: b.l, close: b.c, color: pal.formingFill, borderColor: pal.forming, wickColor: pal.forming }
    : { time: b.t, open: b.o, high: b.h, low: b.l, close: b.c };
  const toVolume = b => b.v == null ? { time: b.t }
    : { time: b.t, value: b.v, color: b.forming ? pal.volForming : b.c >= b.o ? pal.volUp : pal.volDown };
  const paint = () => { candles.setData(bars.map(toCandle)); volume.setData(bars.map(toVolume)); };

  // ── events ──
  const subs = { crosshair: new Set(), range: new Set() };
  const emit = (set, v) => { for(const cb of set) { try { cb(v); } catch(e) { console.error('Market chart listener failed:', e); } } };
  const onMove = p => {
    const i = p && p.point && p.time != null ? byTime.get(p.time) : undefined;
    emit(subs.crosshair, i === undefined ? null : { index: i, t: bars[i].t });
  };
  const onRange = r => {
    if(!r) return;
    emit(subs.range, { fromIndex: r.from, toIndex: r.to, count: bars.length, user: performance.now() > quietUntil });
  };
  const onDbl = () => fit();
  chart.subscribeCrosshairMove(onMove);
  chart.timeScale().subscribeVisibleLogicalRangeChange(onRange);
  chart.subscribeDblClick(onDbl);
  const setWheel = on => { if(wheel === on) return; wheel = on; chart.applyOptions(interactionOptions()); };
  const onFocusIn = () => setWheel(true);
  const onFocusOut = e => { if(!container.contains(e.relatedTarget)) setWheel(interaction === 'expanded'); };
  container.addEventListener('focusin', onFocusIn);
  container.addEventListener('focusout', onFocusOut);
  container.addEventListener('pointerdown', onFocusIn);

  // ── size: one observer, at most one resize per frame, visible range kept ──
  let raf = 0;
  const resize = () => {
    if(destroyed) return;
    const w = container.clientWidth, h = container.clientHeight;
    if(w <= 0 || h <= 0) return; // hidden: keep the last size
    const ts = chart.timeScale();
    const r = ts.getVisibleLogicalRange();
    chart.resize(w, h);
    if(r) { quiet(); ts.setVisibleLogicalRange(r); }
    scheduleLayout();
  };
  const ro = typeof ResizeObserver === 'function'
    ? new ResizeObserver(() => { if(!raf) raf = requestAnimationFrame(() => { raf = 0; resize(); }); })
    : null;
  ro?.observe(container);

  // ── navigation ──
  const logicalRange = () => chart.timeScale().getVisibleLogicalRange();
  const setLogical = (from, to) => { quiet(); chart.timeScale().setVisibleLogicalRange({ from, to }); };
  function fit() { if(bars.length) { quiet(); chart.timeScale().fitContent(); } }
  const setVisibleRange = (fromSec, toSec) => {
    if(!bars.length || !(toSec > fromSec)) return;
    quiet();
    try { chart.timeScale().setVisibleRange({ from: fromSec, to: toSec }); } catch { fit(); }
  };
  const nearestIndex = t => {
    if(!bars.length) return -1;
    let lo = 0, hi = bars.length - 1;
    while(lo < hi) { const mid = (lo + hi) >> 1; if(bars[mid].t < t) lo = mid + 1; else hi = mid; }
    return lo > 0 && Math.abs(bars[lo - 1].t - t) < Math.abs(bars[lo].t - t) ? lo - 1 : lo;
  };
  const scrollToIndex = i => {
    const r = logicalRange();
    if(!r) return;
    const w = r.to - r.from;
    if(i >= r.from + 1 && i <= r.to - 1) return; // already in view
    setLogical(i - w / 2, i + w / 2);
  };

  // ── overlays (price pane) and indicator panes ──
  // Points arrive as [{ t, v }] with v null where the indicator has no value (warm-up, gaps):
  // those become whitespace, so a line breaks rather than bridging a gap. Colours come from the
  // caller, which knows the theme. Panes share the chart's single time scale and crosshair, so
  // pan, zoom and inspection are synchronised by construction.
  const toLinePoint = p => p.v == null || !Number.isFinite(p.v) ? { time: p.t } : { time: p.t, value: p.v };
  const toBarPoint = p => p.v == null || !Number.isFinite(p.v) ? { time: p.t } : { time: p.t, value: p.v, ...(p.color ? { color: p.color } : {}) };
  const lineOptions = (style = {}) => ({
    color: style.color || pal.text, lineWidth: style.width || 2,
    lineStyle: style.dashed ? LC.LineStyle.Dashed : LC.LineStyle.Solid,
    priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
    priceFormat: CHART_FORMATS[style.format] || CHART_FORMATS.usd,
  });
  const overlays = new Map(); // id → line series in pane 0
  const setOverlay = (id, points, style) => {
    if(destroyed) return;
    let s = overlays.get(id);
    if(s) s.applyOptions(lineOptions(style));
    else { s = chart.addSeries(LC.LineSeries, lineOptions(style), 0); overlays.set(id, s); container.dataset.overlays = String(overlays.size); }
    s.setData((Array.isArray(points) ? points : []).map(toLinePoint));
  };
  const removeOverlay = id => {
    const s = overlays.get(id);
    if(destroyed || !s) return;
    chart.removeSeries(s);
    overlays.delete(id);
    container.dataset.overlays = String(overlays.size);
  };

  // A pane: { series: [{ key, type: 'line' | 'histogram', points, color, width, dashed }],
  //   opts: { order, format: 'usd' | 'number' | 'percent', levels: [n…], fixed: [min, max] } }.
  // A pane with no series left is removed by the library, which renumbers the ones below it, so
  // any change to which panes exist rebuilds them all in `order`; a data-only change updates the
  // existing series in place.
  const panes = new Map(); // id → { series, opts, sig, apis }
  let paneOrder = [];
  const paneSeriesOptions = (opts, s) => {
    const base = {
      color: s.color || pal.text, priceLineVisible: false, lastValueVisible: true,
      priceFormat: CHART_FORMATS[opts.format] || CHART_FORMATS.number,
      ...(opts.fixed ? { autoscaleInfoProvider: () => ({ priceRange: { minValue: opts.fixed[0], maxValue: opts.fixed[1] } }) } : {}),
    };
    return s.type === 'histogram' ? base
      : { ...base, lineWidth: s.width || 2, lineStyle: s.dashed ? LC.LineStyle.Dashed : LC.LineStyle.Solid, crosshairMarkerVisible: false };
  };
  const paintPane = p => p.apis.forEach((api, i) => api.setData((p.series[i].points || []).map(p.series[i].type === 'histogram' ? toBarPoint : toLinePoint)));
  const buildPane = (p, index) => {
    p.apis = p.series.map(s => chart.addSeries(s.type === 'histogram' ? LC.HistogramSeries : LC.LineSeries, paneSeriesOptions(p.opts, s), index));
    // The chart-wide right-scale margins leave room for volume in the price pane; a pane has none.
    p.apis[0]?.priceScale().applyOptions({ scaleMargins: { top: 0.1, bottom: 0.08 } });
    for(const level of p.opts.levels || []) {
      p.apis[0]?.createPriceLine({ price: level, color: pal.cross, lineWidth: 1, lineStyle: LC.LineStyle.Dashed, axisLabelVisible: false, title: '' });
    }
    paintPane(p);
  };
  // Price pane 68 / 32 with one pane, 56 / 22 / 22 with two (docs/mobile-chart-ux.md §6).
  const STRETCH = { 1: [68, 32], 2: [56, 22, 22] };
  const rebuildPanes = () => {
    for(const p of panes.values()) { for(const api of p.apis || []) chart.removeSeries(api); p.apis = null; }
    paneOrder = [...panes.keys()].sort((a, b) => (panes.get(a).opts.order ?? 0) - (panes.get(b).opts.order ?? 0));
    paneOrder.forEach((id, i) => buildPane(panes.get(id), i + 1));
    const n = paneOrder.length;
    const f = STRETCH[n] || [46, ...paneOrder.map(() => 54 / n)];
    chart.panes().forEach((pane, i) => { if(f[i] != null) pane.setStretchFactor(f[i]); });
    scheduleLayout();
  };
  const paneSig = (series, opts) => JSON.stringify([series.map(s => [s.key, s.type]), opts.order ?? 0, opts.levels || [], opts.fixed || null]);
  const setPane = (id, series, opts = {}) => {
    if(destroyed) return;
    const list = Array.isArray(series) ? series : [];
    const sig = paneSig(list, opts), cur = panes.get(id);
    if(cur && cur.sig === sig && cur.apis) {
      cur.series = list; cur.opts = opts;
      cur.apis.forEach((api, i) => api.applyOptions(paneSeriesOptions(opts, list[i])));
      paintPane(cur);
      return;
    }
    panes.set(id, { series: list, opts, sig, apis: cur?.apis || null });
    rebuildPanes();
  };
  const removePane = id => {
    if(destroyed || !panes.has(id)) return;
    const p = panes.get(id);
    for(const api of p.apis || []) chart.removeSeries(api);
    p.apis = null;
    panes.delete(id);
    rebuildPanes();
  };

  // Where each indicator pane sits inside the container, for the pane titles MarketView draws
  // over the canvas: [{ id, top, height }] in CSS px. Emitted after the library has laid out
  // (next frame) and whenever a pane's size changes, including a separator drag.
  const layoutSubs = new Set();
  let layoutRaf = 0;
  const paneRo = typeof ResizeObserver === 'function' ? new ResizeObserver(() => scheduleLayout()) : null;
  function scheduleLayout() {
    if(destroyed || layoutRaf) return;
    layoutRaf = requestAnimationFrame(() => { layoutRaf = requestAnimationFrame(() => { layoutRaf = 0; emitLayout(); }); });
  }
  const emitLayout = () => {
    if(destroyed) return;
    const box = container.getBoundingClientRect();
    const all = chart.panes();
    paneRo?.disconnect();
    const out = [];
    all.forEach((pane, i) => {
      const el = pane.getHTMLElement();
      if(!el) return;
      paneRo?.observe(el);
      if(i === 0) return;
      const r = el.getBoundingClientRect();
      if(paneOrder[i - 1]) out.push({ id: paneOrder[i - 1], top: Math.round(r.top - box.top), height: Math.round(r.height) });
    });
    container.dataset.panes = String(all.length);
    emit(layoutSubs, out);
  };

  const adapter = {
    setCandles(list, { formingIndex = -1, interval = null, keepView = false } = {}) {
      if(destroyed) return;
      const prev = keepView && bars.length ? chart.timeScale().getVisibleRange() : null;
      bars = (Array.isArray(list) ? list : []).map((c, i) => ({ t: c.t, o: c.o, h: c.h, l: c.l, c: c.c, v: c.v ?? null, forming: i === formingIndex }));
      byTime = new Map(bars.map((b, i) => [b.t, i]));
      if(interval) chart.applyOptions({ timeScale: { timeVisible: Candles.intervalSeconds(interval) < 86400 } });
      quiet();
      paint();
      if(prev) { try { chart.timeScale().setVisibleRange(prev); } catch {} }
    },
    // The forming candle, updated in place from the spot poll (docs/market-data.md §16).
    updateLast(c) {
      if(destroyed || !c || !bars.length) return;
      const last = bars[bars.length - 1];
      if(c.t < last.t) return;
      const b = { t: c.t, o: c.o, h: c.h, l: c.l, c: c.c, v: c.v ?? null, forming: true };
      if(c.t === last.t) bars[bars.length - 1] = b; else { bars.push(b); byTime.set(b.t, bars.length - 1); }
      candles.update(toCandle(b));
      volume.update(toVolume(b));
    },
    setVolume(points) { if(!destroyed) volume.applyOptions({ visible: points !== null }); },
    setScale(scale) {
      if(destroyed) return;
      chart.priceScale('right').applyOptions({ mode: scale === 'log' ? LC.PriceScaleMode.Logarithmic : LC.PriceScaleMode.Normal });
    },
    setVisibleRange, fit,
    scrollToTime(t) { const i = nearestIndex(t); if(i >= 0) scrollToIndex(i); },
    // Keyboard support (docs/mobile-chart-ux.md §10): crosshair on a candle, zoom, pan.
    showCrosshair(i) {
      const b = bars[i];
      if(destroyed || !b) return;
      scrollToIndex(i);
      chart.setCrosshairPosition(b.c, b.t, candles);
    },
    clearCrosshair() { if(!destroyed) chart.clearCrosshairPosition(); },
    zoom(factor) {
      const r = logicalRange();
      if(destroyed || !r) return;
      const w = Math.max(5, (r.to - r.from) * factor), right = r.to; // anchored at the right edge
      setLogical(right - w, right);
    },
    pan(nBars) { const r = logicalRange(); if(!destroyed && r) setLogical(r.from + nBars, r.to + nBars); },
    onCrosshair(cb) { subs.crosshair.add(cb); return () => subs.crosshair.delete(cb); },
    onVisibleRange(cb) { subs.range.add(cb); return () => subs.range.delete(cb); },
    setOverlay, removeOverlay, setPane, removePane,
    onLayout(cb) { layoutSubs.add(cb); scheduleLayout(); return () => layoutSubs.delete(cb); },
    // Markers arrive in Phase 7; until then they do nothing.
    setMarkers() {},
    onMarkerClick() { return () => {}; },
    setInteraction(next) {
      if(destroyed || next === interaction) return;
      interaction = next;
      wheel = next === 'expanded' || container.contains(document.activeElement);
      chart.applyOptions(interactionOptions());
    },
    setTheme(next) {
      const p = CHART_PALETTES[next];
      if(destroyed || !p || p === pal) return;
      pal = p;
      chart.applyOptions(themeOptions());
      candles.applyOptions(candleStyle());
      paint();
      if(panes.size) rebuildPanes(); // the reference lines take the theme's colour
    },
    resize,
    destroy() {
      if(destroyed) return;
      destroyed = true;
      ro?.disconnect();
      paneRo?.disconnect();
      if(raf) cancelAnimationFrame(raf);
      if(layoutRaf) cancelAnimationFrame(layoutRaf);
      container.removeEventListener('focusin', onFocusIn);
      container.removeEventListener('focusout', onFocusOut);
      container.removeEventListener('pointerdown', onFocusIn);
      chart.unsubscribeCrosshairMove(onMove);
      chart.timeScale().unsubscribeVisibleLogicalRangeChange(onRange);
      chart.unsubscribeDblClick(onDbl);
      subs.crosshair.clear(); subs.range.clear(); layoutSubs.clear();
      overlays.clear(); panes.clear();
      delete container.dataset.overlays; delete container.dataset.panes;
      chart.remove();
      liveChartAdapters--; reportChartAdapters();
    },
  };
  return Object.freeze(adapter);
}

// ─── Market: View ────────────────────────────────────────────────────────────
// The Market tab: price header, range and interval, a candlestick chart with volume, and the
// persistent readout. Candles come only through MarketData's service (IndexedDB first, then
// Coinbase in page-aligned windows); the chart only through createChartAdapter. Nothing here
// reads, receives or sends transactions. Layout and states: docs/mobile-chart-ux.md §2–3, §12.
let marketServicePromise = null;
const getMarketService = () => marketServicePromise || (marketServicePromise = MarketCandleStore.open()
  .then(store => MarketData.createMarketDataService({
    provider: MarketData.providers.coinbase.create({ fetchImpl: (url, init) => fetch(url, init) }),
    store,
  }))
  .catch(e => { marketServicePromise = null; throw e; }));

const MARKET_RANGE_NAMES = { '1D':'1 day', '1W':'1 week', '1M':'1 month', '3M':'3 months', '6M':'6 months',
  'YTD':'year to date', '1Y':'1 year', '3Y':'3 years', '5Y':'5 years', 'ALL':'all available history' };
const MARKET_INTERVAL_NAMES = { '1m':'1-minute', '5m':'5-minute', '15m':'15-minute', '30m':'30-minute',
  '1h':'hourly', '4h':'4-hour', '1d':'daily', '1w':'weekly' };
const mktPad = n => String(n).padStart(2, '0');
const mktDay = tSec => { const d = new Date(tSec * 1000); return `${mktPad(d.getUTCMonth()+1)}/${mktPad(d.getUTCDate())}/${d.getUTCFullYear()}`; };
// Candle time in UTC: the bucket's day, week or start time.
const mktCandleWhen = (tSec, interval) => {
  if(interval === '1w') return `Week of ${mktDay(tSec)} (UTC)`;
  if(interval === '1d') return `${mktDay(tSec)} (UTC day)`;
  const d = new Date(tSec * 1000);
  return `${mktDay(tSec)} ${mktPad(d.getUTCHours())}:${mktPad(d.getUTCMinutes())} UTC`;
};
const mktAge = ms => {
  const s = Math.max(0, Math.round(ms / 1000));
  if(s < 60) return `${s}s`;
  if(s < 3600) return `${Math.round(s / 60)} min`;
  if(s < 86400) return `${Math.round(s / 3600)} h`;
  return `${Math.round(s / 86400)} d`;
};
const mktClock = ms => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const mktSigned = (diff, base) => {
  if(!Number.isFinite(diff) || !(base > 0)) return null;
  const sign = diff > 0 ? '+' : diff < 0 ? '−' : '';
  return { text: `${sign}${fmtUSD(Math.abs(diff))} (${sign}${Math.abs(diff / base * 100).toFixed(2)}%)`, dir: diff > 0 ? 'up' : diff < 0 ? 'down' : '' };
};
const mktVolume = v => v == null ? '—' : `${Number(v).toLocaleString('en-US', { maximumFractionDigits: 2 })} BTC`;

// A row of mutually exclusive buttons: role="radiogroup", roving tabindex, arrow keys move.
function MarketRadioGroup({ label, options, value, onChange }) {
  const refs = useRef({});
  const enabled = options.filter(o => !o.disabled);
  const tabStop = enabled.some(o => o.value === value) ? value : enabled[0]?.value;
  const onKeyDown = (e, v) => {
    const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if(step === undefined && e.key !== 'Home' && e.key !== 'End') return;
    e.preventDefault();
    if(!enabled.length) return;
    const i = enabled.findIndex(o => o.value === v);
    const next = e.key === 'Home' ? 0 : e.key === 'End' ? enabled.length - 1 : (i + step + enabled.length) % enabled.length;
    const o = enabled[next];
    onChange(o.value);
    refs.current[o.value]?.focus();
  };
  return (
    <div role="radiogroup" aria-label={label} className="mkt-group">
      {options.map(o => (
        <button key={o.value} type="button" role="radio" className="mkt-btn"
          aria-checked={o.value === value} tabIndex={o.value === tabStop ? 0 : -1}
          disabled={o.disabled} title={o.title || undefined}
          ref={el => { refs.current[o.value] = el; }}
          onClick={() => onChange(o.value)} onKeyDown={e => onKeyDown(e, o.value)}>
          {o.label}{o.disabled && o.title ? <span className="mkt-sr">{`, unavailable: ${o.title}`}</span> : null}
        </button>
      ))}
    </div>
  );
}

// Dialog behaviour for the expanded chart, reusing useModalA11y (Tab trap, Escape, body scroll
// lock, focus restored) on the chart shell that is already mounted — expanding moves nothing,
// so the chart keeps its range, zoom and state.
function MarketExpandedA11y({ nodeRef, onClose }) {
  const ref = useModalA11y(onClose);
  React.useLayoutEffect(() => { ref.current = nodeRef.current; }, []); // before useModalA11y's effect
  return null;
}

// A throw in the Market view stays in the Market tab: every other tab keeps working.
class MarketErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error('Market view error caught by boundary:', error, info?.componentStack); }
  componentWillUnmount() { document.body.classList.remove('mkt-expanded'); }
  render() {
    if(!this.state.error) return this.props.children;
    return (
      <div className="mkt">
        <div className="mkt-shell" role="alert" data-market-error="1">
          <strong>The Market view ran into a problem.</strong>
          <span style={{fontSize:'.875rem',color:'var(--text-secondary)'}}>
            Your transactions are not affected, and every other tab still works.
          </span>
          <div><button type="button" className="btn btn-secondary btn-sm" onClick={() => this.setState({ error: null })}>Try again</button></div>
          <details style={{fontSize:'.75rem',color:'var(--text-tertiary)'}}>
            <summary style={{cursor:'pointer'}}>Technical details</summary>
            <pre style={{whiteSpace:'pre-wrap'}}>{String(this.state.error?.message || this.state.error)}</pre>
          </details>
        </div>
      </div>
    );
  }
}

// ── Indicators on the chart ──
// Which indicators are on, with their settings, labels and colours, derived from the
// preferences. Every number comes from Indicators.calculateSegmented; nothing here computes a
// formula. SMA and EMA may each have several lines; EMA lines are dashed so the two families
// differ by more than colour.
const MKT_COLORS = {
  light: { sma: { 20:'#0d9488', 50:'#2563eb', 100:'#9333ea', 200:'#db2777' }, ema: { 12:'#0891b2', 21:'#b45309', 50:'#7c3aed', 200:'#be185d' },
    extra: ['#4d7c0f', '#c2410c', '#0f766e', '#6d28d9', '#a21caf', '#1d4ed8'], bb: '#64748b', bbMid: '#94a3b8',
    rsi: '#7c3aed', macd: '#2563eb', signal: '#ea580c', histUp: 'rgba(20,154,76,.55)', histDown: 'rgba(216,58,58,.55)', atr: '#0d9488', hv: '#c2410c' },
  dark: { sma: { 20:'#2dd4bf', 50:'#60a5fa', 100:'#c084fc', 200:'#f472b6' }, ema: { 12:'#22d3ee', 21:'#facc15', 50:'#a78bfa', 200:'#f9a8d4' },
    extra: ['#a3e635', '#fb923c', '#5eead4', '#c4b5fd', '#f0abfc', '#93c5fd'], bb: '#94a3b8', bbMid: '#64748b',
    rsi: '#c084fc', macd: '#60a5fa', signal: '#fb923c', histUp: 'rgba(46,189,107,.55)', histDown: 'rgba(240,86,79,.55)', atr: '#2dd4bf', hv: '#fb923c' },
};
const MKT_PANE_ORDER = { rsi: 1, macd: 2, atr: 3, volatility: 4 };
const MKT_PANE_LABEL = { rsi: 'RSI', macd: 'MACD', atr: 'ATR', volatility: 'Historical Volatility' };
function marketIndicatorSpecs(prefs, theme) {
  const col = MKT_COLORS[theme] || MKT_COLORS.light, ind = prefs.indicators, out = [];
  let extra = 0;
  const lineColor = (fam, p) => col[fam][p] || col.extra[extra++ % col.extra.length];
  const src = s => s === 'close' ? '' : ` (${s})`;
  for(const fam of ['sma', 'ema']) {
    for(const period of ind[fam].periods) {
      out.push({ key: `${fam}:${period}`, id: fam, settings: { period, source: ind[fam].source }, placement: 'overlay',
        label: `${fam.toUpperCase()} ${period}${src(ind[fam].source)}`, format: 'usd',
        lines: [{ series: fam, color: lineColor(fam, period), dashed: fam === 'ema' }] });
    }
  }
  const b = ind.bollinger;
  if(b.on) out.push({ key: 'bollinger', id: 'bollinger', settings: { period: b.period, multiplier: b.multiplier }, placement: 'overlay',
    label: `BB ${b.period}, ${b.multiplier}`, format: 'usd',
    lines: [{ series: 'upper', short: 'U', color: col.bb }, { series: 'middle', short: 'M', color: col.bbMid, dashed: true }, { series: 'lower', short: 'L', color: col.bb }] });
  if(ind.rsi.on) out.push({ key: 'rsi', id: 'rsi', settings: { period: ind.rsi.period }, placement: 'pane', label: `RSI ${ind.rsi.period}`,
    format: 'number', levels: [70, 50, 30], fixed: [0, 100], lines: [{ series: 'rsi', color: col.rsi }] });
  const m = ind.macd;
  if(m.on) out.push({ key: 'macd', id: 'macd', settings: { fast: m.fast, slow: m.slow, signal: m.signal }, placement: 'pane',
    label: `MACD ${m.fast}, ${m.slow}, ${m.signal}`, format: 'number',
    lines: [{ series: 'histogram', short: 'Hist', type: 'histogram', up: col.histUp, down: col.histDown },

    format: 'usd', lines: [{ series: 'atr', color: col.atr }] });
  if(ind.volatility.on) out.push({ key: 'volatility', id: 'volatility', settings: { period: ind.volatility.period }, placement: 'pane',

  for(const s of out) if(s.placement === 'pane') { s.order = MKT_PANE_ORDER[s.id]; s.paneLabel = MKT_PANE_LABEL[s.id]; }

}

// A numeric setting: edited as text, validated on blur or Enter by `commit`, which returns an
// error message (shown, value not applied) or null.
function MarketNumberField({ label, value, commit, decimal = false, name }) {
  const [draft, setDraft] = useState(String(value));
  const [error, setError] = useState('');
  const id = useMemo(() => 'mkt-num-' + Math.random().toString(36).slice(2, 9), []);
  useEffect(() => { setDraft(String(value)); setError(''); }, [value]);
  const apply = () => {
    const t = draft.trim();
    if(t === String(value)) { setError(''); return; }
    const ok = decimal ? /^\d+(\.\d+)?$/.test(t) : /^\d+$/.test(t);
    const msg = ok ? commit(Number(t)) : `${label} must be a ${decimal ? 'number' : 'whole number'}.`;
    setError(msg || '');
  };
  return (
    <span className="mkt-field">
      <label htmlFor={id}>{label}</label>
      <input id={id} name={name} type="text" inputMode={decimal ? 'decimal' : 'numeric'} value={draft} aria-invalid={!!error}
        aria-describedby={error ? id + '-err' : undefined}
        onChange={e => setDraft(e.target.value)} onBlur={apply}
        onKeyDown={e => { if(e.key === 'Enter') { e.preventDefault(); apply(); } }} />
      {error ? <span className="mkt-field-error" id={id + '-err'} role="alert">{error}</span> : null}
    </span>
  );
}

// SMA or EMA: preset lines as toggles, custom periods, and the price source.
function MarketLineFamily({ id, name, prefs, update }) {
  const fam = prefs.indicators[id], def = Indicators.get(id);
  const [custom, setCustom] = useState('');
  const [error, setError] = useState('');
  const setFam = patch => update(p => ({ ...p, indicators: { ...p.indicators, [id]: { ...p.indicators[id], ...patch } } }));
  const toggle = period => setFam({ periods: fam.periods.includes(period) ? fam.periods.filter(x => x !== period) : [...fam.periods, period] });
  const addCustom = () => {
    const t = custom.trim();
    if(!/^\d+$/.test(t)) { setError('Period must be a whole number.'); return; }
    const period = Number(t);
    try { def.validate({ period }); } catch(e) { setError(mktErrorText(e)); return; }
    if(fam.periods.includes(period)) { setError(`${id.toUpperCase()} ${period} is already on.`); return; }
    if(fam.periods.length >= 6) { setError('At most six lines; turn one off first.'); return; }
    setFam({ periods: [...fam.periods, period] }); setCustom(''); setError('');
  };
  const customs = fam.periods.filter(p => !def.presets.includes(p));
  const inputId = `mkt-${id}-custom`;
  return (
    <div className="mkt-ind" data-indicator={id}>
      <div className="mkt-ind-name">{name}</div>
      <div className="mkt-chips" role="group" aria-label={`${name} lines`}>
        {def.presets.map(p => (
          <button key={p} type="button" className="mkt-btn" aria-pressed={fam.periods.includes(p)} onClick={() => toggle(p)}>{p}</button>
        ))}
        {customs.map(p => (
          <button key={p} type="button" className="mkt-btn" aria-pressed="true" onClick={() => toggle(p)} aria-label={`Remove ${id.toUpperCase()} ${p}`}>{p} ×</button>
        ))}
      </div>
      <div className="mkt-ind-settings">
        <span className="mkt-field">
          <label htmlFor={inputId}>Custom period</label>
          <input id={inputId} type="text" inputMode="numeric" value={custom} aria-invalid={!!error}
            onChange={e => { setCustom(e.target.value); setError(''); }}
            onKeyDown={e => { if(e.key === 'Enter') { e.preventDefault(); addCustom(); } }} />
        </span>
        <button type="button" className="btn btn-secondary btn-sm" onClick={addCustom}>Add</button>
        <span className="mkt-field">
          <label htmlFor={`mkt-${id}-source`}>Source</label>
          <select id={`mkt-${id}-source`} value={fam.source} onChange={e => setFam({ source: e.target.value })}>
            {Indicators.SOURCES.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
        </span>
      </div>
      {error ? <div className="mkt-field-error" role="alert">{error}</div> : null}
    </div>
  );
}

// An indicator that is on or off, with its numeric settings validated by Indicators.
function MarketSingleIndicator({ id, name, fields, prefs, update, onToggle }) {
  const cur = prefs.indicators[id];

    const next = { ...cur, [key]: n };
    try { Indicators.get(id).validate(Object.fromEntries(fields.map(f => [f.key, next[f.key]]))); }
    catch(e) { return mktErrorText(e); }
    update(p => ({ ...p, indicators: { ...p.indicators, [id]: { ...p.indicators[id], [key]: n } } }));
    return null;
  };
  return (
    <div className="mkt-ind" data-indicator={id}>
      <MktSwitch on={cur.on} label={name} onChange={on => onToggle(id, on)} />
      <div className="mkt-ind-settings">

      </div>
    </div>
  );
}

// ── Quantitative summary (docs/technical-indicators.md §11–12) ──
// Daily figures use completed daily candles held on this device (the background backfill fills
// them); "today" is the forming day. A figure whose input is missing is "—", never estimated.
// Nothing is called an all-time high: Indicators.athLabels decides the wording (decision D18).
function marketSummary({ daily, candles, interval, price, nowSec, earliestSec }) {
  const DAY = 86400, today = Candles.bucketStart(nowSec, '1d');
  const done = daily.filter(c => c.t + DAY <= nowSec);
  const fresh = done.length > 0 && done[done.length - 1].t === today - DAY; // yesterday is held
  const last = (id, settings, key) => {
    if(!fresh) return null;
    const r = Indicators.calculateSegmented(id, done, settings, '1d')[key];
    return r[r.length - 1];
  };
  // The forming day's range: candles on screen that lie inside today, plus the current price.
  let fh = null, fl = null;
  if(Candles.intervalSeconds(interval) <= DAY) {
    for(const c of candles) if(c.t >= today && c.t < today + DAY) { fh = fh == null ? c.h : Math.max(fh, c.h); fl = fl == null ? c.l : Math.min(fl, c.l); }
  }
  const p = price > 0 ? price : null;
  if(p != null) { fh = fh == null ? p : Math.max(fh, p); fl = fl == null ? p : Math.min(fl, p); }

  const labels = Indicators.athLabels({ seedVerified: false, earliestSec });
  const ath = Indicators.previousAth(done, nowSec, { earliestSec });
  const high = labels.loading ? null : ath == null && fh == null ? null : Math.max(ath ? ath.price : -Infinity, fh ?? -Infinity);
  const highT = high == null ? null : ath && ath.price >= high ? ath.t : today;
  const yearAgo = today - 364 * DAY;
  const yr = Indicators.extremes(done.filter(c => c.t >= yearAgo));
  const covers = done.length > 0 && done[0].t <= yearAgo;
  const wk52 = yr && covers ? {
    high: fh != null ? Math.max(yr.high, fh) : yr.high, low: fl != null ? Math.min(yr.low, fl) : yr.low,
  } : null;
  const sma50 = last('sma', { period: 50 }, 'sma'), sma200 = last('sma', { period: 200 }, 'sma');
  const ext = Indicators.extremes(candles);
  const dd = Indicators.drawdown(candles).max;
  return {
    labels,
    rangeReturn: Indicators.returns.range(candles),
    rangeHigh: ext ? ext.high : null, rangeHighT: ext ? ext.highT : null,
    rangeLow: ext ? ext.low : null, rangeLowT: ext ? ext.lowT : null,
    high52: wk52 ? wk52.high : null, low52: wk52 ? wk52.low : null,
    high, highT,
    drawdownFromHigh: high != null && p != null ? Indicators.returns.simple(high, p) : null,
    sma50, sma200,
    sma50Dist: sma50 != null && p != null ? Indicators.returns.simple(sma50, p) : null,
    sma200Dist: sma200 != null && p != null ? Indicators.returns.simple(sma200, p) : null,
    rsi14: last('rsi', { period: 14 }, 'rsi'),
    atr14: last('atr', { period: 14 }, 'atr'),
    hv30: last('volatility', { period: 30 }, 'volatility'),
    maxDrawdown: dd ? dd.value : null, maxDrawdownPeakT: dd ? dd.peakT : null, maxDrawdownTroughT: dd ? dd.troughT : null,
  };
}
const mktPct = v => v == null || !Number.isFinite(v) ? '—' : `${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v * 100).toFixed(2)}%`;

        {item('rsi14', 'RSI 14 (daily)', s.rsi14, s.rsi14 == null ? '—' : s.rsi14.toFixed(1))}
        {item('atr14', 'ATR 14 (daily)', s.atr14, usd(s.atr14))}
        {item('hv30', '30-day volatility', s.hv30, s.hv30 == null ? '—' : `${(s.hv30 * 100).toFixed(1)}%`, 'annualized', 'Sample standard deviation of 30 daily log returns, times √365.')}
      </dl>

    </section>

function MarketView({ theme, btcPrice, priceUpdatedAt, storedPrefs = null, onPrefsChange = null }) {
  // Preferences: stored per device, overridden on load by a #market?… URL (not saved until the
  // user changes something). Every change is saved through onPrefsChange — a device view setting.
  const [prefs, setPrefsState] = useState(() => {
    const stored = normalizeMarketPrefs(storedPrefs);
    return location.hash.startsWith('#market?') ? parseMarketHash(location.hash, stored) : stored;
  });
  const prefsRef = useRef(prefs); prefsRef.current = prefs;
  const onPrefsChangeRef = useRef(onPrefsChange); onPrefsChangeRef.current = onPrefsChange;
  const updatePrefs = useCallback(change => {
    const next = normalizeMarketPrefs(typeof change === 'function' ? change(prefsRef.current) : change);
    prefsRef.current = next;
    setPrefsState(next);
    onPrefsChangeRef.current?.(next);
  }, []);
  const range = prefs.range, scale = prefs.scale;
  const [expanded, setExpanded] = useState(false);
  const [sheet, setSheet] = useState(false);
  const [narrow, setNarrow] = useState(() => !!window.matchMedia?.('(max-width: 768px)').matches);
  const [paneLayout, setPaneLayout] = useState([]);
  const [daily, setDaily] = useState([]);
  const [lib, setLib] = useState(() => window.LightweightCharts ? 'ready' : 'loading');
  const [libTry, setLibTry] = useState(0);
  const [adapter, setAdapter] = useState(null);
  const [crash, setCrash] = useState(null);
  const [view, setView] = useState(null);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  const [reloadKey, setReloadKey] = useState(0);
  const [loadedOnce, setLoadedOnce] = useState(false);
  const [earliestSec, setEarliestSec] = useState(null);
  const [extending, setExtending] = useState(false);
  const [historyEnd, setHistoryEnd] = useState(null); // null | 'start' | 'cap'
  const [inspectT, setInspectT] = useState(null);     // candle time under the crosshair; null = latest
  const [stats, setStats] = useState(null);
  const [statsError, setStatsError] = useState(false);
  const [backfill, setBackfill] = useState({ status: 'idle' });
  const [backfillRun, setBackfillRun] = useState(0);
  const [online, setOnline] = useState(() => navigator.onLine !== false);
  const [tick, setTick] = useState(0); // re-render every 15 s so ages and staleness move on
  const [announce, setAnnounce] = useState('');
  if(crash) throw crash;

  const chartRef = useRef(null), shellRef = useRef(null);
  const viewRef = useRef(null); viewRef.current = view;
  const loadingRef = useRef(true); loadingRef.current = loading;
  const earliestRef = useRef(null); earliestRef.current = earliestSec;
  const historyEndRef = useRef(null); historyEndRef.current = historyEnd;
  const expandedRef = useRef(false); expandedRef.current = expanded;
  const extendingRef = useRef(false), refreshingRef = useRef(false), appliedViewRef = useRef(null);
  const seqRef = useRef(0), announceTimer = useRef(null);

  const nowMs = Date.now(), nowSec = Math.floor(nowMs / 1000);
  const requested = prefs.intervals[range] ?? Candles.defaultInterval(range);
  const interval = Candles.resolveInterval(range, requested, nowSec, earliestSec);
  const allowed = Candles.allowedIntervals(range, nowSec, earliestSec);
  const intervalRef = useRef(interval); intervalRef.current = interval;
  const maxPanes = narrow && !expanded ? 2 : 4;

  // ── URL: the hash mirrors the view (replaceState, so Back is not a list of indicator toggles);
  // a hash edited by hand is applied ──
  useEffect(() => {
    const h = formatMarketHash(prefs, interval);
    if(location.hash !== h) history.replaceState(null, '', h);
  }, [prefs, interval]);
  useEffect(() => {
    const onHash = () => {
      const h = location.hash;
      if(!h.startsWith('#market?') || h === formatMarketHash(prefsRef.current, intervalRef.current)) return;
      updatePrefs(p => parseMarketHash(h, p));
    };
    window.addEventListener('hashchange', onHash);
    const mq = window.matchMedia?.('(max-width: 768px)');
    const onMq = () => setNarrow(!!mq.matches);
    mq?.addEventListener?.('change', onMq);
    return () => { window.removeEventListener('hashchange', onHash); mq?.removeEventListener?.('change', onMq); };
  }, []);

  const applyResult = useCallback((r, mode, forRange) => {
    setView({ ...r, mode, range: forRange, loadedAt: Date.now(), seq: ++seqRef.current });
  }, []);

  // ── clock, connectivity ──
  useEffect(() => {
    const id = setInterval(() => setTick(n => n + 1), 15000);
    const on = () => setOnline(true), off = () => setOnline(false);
    window.addEventListener('online', on); window.addEventListener('offline', off);
    return () => { clearInterval(id); window.removeEventListener('online', on); window.removeEventListener('offline', off); };
  }, []);

  // ── chart library, then the adapter once the container has a size ──
  useEffect(() => {
    if(window.LightweightCharts) { setLib('ready'); return; }
    let alive = true;
    setLib('loading');
    loadChartLibrary().then(() => { if(alive) setLib('ready'); }, e => {
      console.warn('Market: chart library failed to load:', e?.message || e);
      if(alive) setLib('error');
    });
    return () => { alive = false; };
  }, [libTry]);

  useEffect(() => {
    if(lib !== 'ready') return;
    const el = chartRef.current;
    if(!el) return;
    let a = null, ro = null;
    const tryCreate = () => {
      if(a || el.clientWidth === 0 || el.clientHeight === 0) return;
      try { a = createChartAdapter(el, { theme, mode: expandedRef.current ? 'expanded' : 'inline' }); }
      catch(e) { setCrash(e); return; }
      setAdapter(a);
    };
    tryCreate();
    if(!a && typeof ResizeObserver === 'function') {
      ro = new ResizeObserver(() => { tryCreate(); if(a) { ro.disconnect(); ro = null; } });
      ro.observe(el);
    }
    return () => { ro?.disconnect(); a?.destroy(); appliedViewRef.current = null; setAdapter(null); };
  }, [lib]);

  useEffect(() => { adapter?.setTheme(theme); }, [adapter, theme]);
  useEffect(() => { adapter?.setScale(scale); }, [adapter, scale]);
  useEffect(() => { adapter?.setInteraction(expanded ? 'expanded' : 'inline'); }, [adapter, expanded]);
  useEffect(() => {
    if(!expanded) return;
    document.body.classList.add('mkt-expanded');
    return () => document.body.classList.remove('mkt-expanded');
  }, [expanded]);

  // ── the view for the selected range and interval ──
  useEffect(() => {
    let alive = true;
    setLoading(true); setLoadError(null); setHistoryEnd(null); setInspectT(null);
    (async () => {
      const svc = await getMarketService();
      if(!alive) return;
      const r = await svc.loadView({ range, interval, onUpdate: u => { if(alive && u.candles.length) applyResult(u, 'fit', range); } });
      if(!alive || r.status === 'superseded') return;
      applyResult(r, 'fit', range);
      if(r.earliestSec != null) setEarliestSec(r.earliestSec);
      setLoading(false);
      setLoadedOnce(true);
    })().catch(e => {
      if(!alive) return;
      console.warn('Market: view failed to load:', e?.code || e?.message || e);
      setLoadError(e?.code || 'error');
      setLoading(false);
    });
    return () => { alive = false; };
  }, [range, interval, reloadKey]);

  // Leaving the tab aborts whatever the view still has in flight.
  useEffect(() => () => { marketServicePromise?.then(s => s.cancel()).catch(() => {}); }, []);

  useEffect(() => {
    let alive = true;
    getMarketService().then(s => s.getEarliest('1d')).then(e => { if(alive && e) setEarliestSec(e.earliestSec); }).catch(() => {});
    return () => { alive = false; };
  }, []);

  // Same window, fresh data, view kept: used when the forming candle's bucket has closed.
  const refreshView = useCallback(async () => {
    const v = viewRef.current;
    if(!v || refreshingRef.current || loadingRef.current) return;
    refreshingRef.current = true;
    try {
      const svc = await getMarketService();
      const r = await svc.loadView({ interval: v.interval, fromSec: v.fromSec, toSec: Math.floor(Date.now() / 1000) });
      const cur = viewRef.current;
      if(r.status !== 'superseded' && cur && cur.range === v.range && cur.interval === v.interval) applyResult(r, 'keep', v.range);
    } catch(e) { console.warn('Market: refresh failed:', e?.code || e?.message || e); }
    finally { refreshingRef.current = false; }
  }, [applyResult]);

  // Older history when the user pans to within one screen of the oldest candle: one more native
  // page per gesture (docs/market-data.md §7, §10), never past the discovered earliest candle.
  const extend = useCallback(async () => {
    const v = viewRef.current;
    if(!v || extendingRef.current) return;
    const svc = await getMarketService();
    const span = Candles.pageSpan(v.sourceInterval, svc.provider.maxCandlesPerRequest);
    const oldest = v.candles.length ? v.candles[0].t : v.fromSec;
    const known = earliestRef.current;
    if(known != null && oldest <= known) { setHistoryEnd('start'); return; }
    const now = Math.floor(Date.now() / 1000);
    const from = Candles.bucketStart(known != null ? Math.max(oldest - span, known) : oldest - span, v.interval);
    if(v.sourceInterval !== '1d' && Math.ceil((now - from) / Candles.intervalSeconds(v.sourceInterval)) > Candles.MAX_NATIVE_CANDLES) {
      setHistoryEnd('cap'); return;
    }
    extendingRef.current = true; setExtending(true);
    try {
      const r = await svc.loadView({ interval: v.interval, fromSec: from, toSec: now });
      const cur = viewRef.current;
      if(r.status === 'superseded' || !cur || cur.range !== v.range || cur.interval !== v.interval) return;
      if(!r.failedPages.length && (!r.candles.length || r.candles[0].t >= oldest)) setHistoryEnd('start');
      applyResult(r, 'keep', v.range);
    } catch(e) { console.warn('Market: older history failed:', e?.code || e?.message || e); }
    finally { extendingRef.current = false; setExtending(false); }
  }, [applyResult]);
  const extendRef = useRef(extend); extendRef.current = extend;

  // ── the forming candle follows the 60 s spot poll (docs/market-data.md §16) ──
  const display = useMemo(() => {
    if(!view) return null;
    const fi = view.formingIndex;
    if(fi < 0 || !(btcPrice > 0) || !priceUpdatedAt || priceUpdatedAt <= view.loadedAt) return view.candles;
    const f = view.candles[fi], at = priceUpdatedAt / 1000;
    if(at < f.t || at >= f.t + Candles.intervalSeconds(view.interval)) return view.candles;
    const out = view.candles.slice();
    out[fi] = { ...f, c: btcPrice, h: Math.max(f.h, btcPrice), l: Math.min(f.l, btcPrice) };
    return out;
  }, [view, btcPrice, priceUpdatedAt]);
  const indexOfT = useMemo(() => new Map((display || []).map((c, i) => [c.t, i])), [display]);

  useEffect(() => {
    if(!adapter || !view) return;
    adapter.setCandles(display, { formingIndex: view.formingIndex, interval: view.interval, keepView: view.mode === 'keep' && appliedViewRef.current != null });
    if(view.mode === 'fit') adapter.fit();
    appliedViewRef.current = view;
  }, [adapter, view]);
  useEffect(() => {
    if(!adapter || !view || appliedViewRef.current !== view || view.formingIndex < 0) return;
    adapter.updateLast(display[view.formingIndex]);
  }, [display]);

  // ── indicators: computed once per (candles, settings); never on crosshair or UI events ──
  const specs = useMemo(() => marketIndicatorSpecs(prefs, theme), [prefs.indicators, theme]);
  const calcKey = JSON.stringify(specs.map(s => [s.key, s.id, s.settings]));
  const viewInterval = view?.interval || null;
  const indicatorValues = useMemo(() => {
    const out = {};
    if(!display?.length || !viewInterval) return out;
    for(const s of specs) out[s.key] = Indicators.calculateSegmented(s.id, display, s.settings, viewInterval);
    document.documentElement.dataset.marketIndicatorRuns = String(++marketIndicatorRuns);
    return out;
  }, [display, viewInterval, calcKey]);
  const paneSpecs = specs.filter(s => s.placement === 'pane');
  const shownPaneKeys = paneSpecs.slice(0, maxPanes).map(s => s.key);
  const hiddenPanes = paneSpecs.length - shownPaneKeys.length;
  const appliedOverlays = useRef(new Set()), appliedPanes = useRef(new Set());
  useEffect(() => {
    if(!adapter) return;
    const times = (display || []).map(c => c.t);
    const pts = (values, colorOf = null) => times.map((t, i) => {
      const v = values ? values[i] : null;
      return colorOf && v != null ? { t, v, color: colorOf(v) } : { t, v };
    });
    const wantO = new Set(), wantP = new Set();
    for(const s of specs) {
      const vals = indicatorValues[s.key];
      if(s.placement === 'overlay') {
        for(const ln of s.lines) {
          const id = `${s.key}/${ln.series}`;
          wantO.add(id);
          adapter.setOverlay(id, pts(vals?.[ln.series]), { color: ln.color, dashed: !!ln.dashed, width: 2, format: s.format });
        }
      } else if(shownPaneKeys.includes(s.key)) {
        wantP.add(s.key);
        adapter.setPane(s.key, s.lines.map(ln => ({
          key: ln.series, type: ln.type || 'line', color: ln.color, width: 2,
          points: pts(vals?.[ln.series], ln.type === 'histogram' ? v => v >= 0 ? ln.up : ln.down : null),
        })), { order: s.order, format: s.format, levels: s.levels, fixed: s.fixed });
      }
    }
    for(const id of appliedOverlays.current) if(!wantO.has(id)) adapter.removeOverlay(id);
    for(const id of appliedPanes.current) if(!wantP.has(id)) adapter.removePane(id);
    appliedOverlays.current = wantO; appliedPanes.current = wantP;
  }, [adapter, indicatorValues, specs, shownPaneKeys.join(',')]);
  useEffect(() => { adapter?.setVolume(prefs.volume ? [] : null); }, [adapter, prefs.volume]);
  useEffect(() => {
    if(!adapter) return;
    return adapter.onLayout(setPaneLayout);
  }, [adapter]);

  // ── daily history held on this device, for the summary: re-read after loads and backfill ──
  const dailyTrigger = `${backfill.status}|${loading ? '' : view?.seq ?? ''}`;
  useEffect(() => {
    let alive = true;
    getMarketService().then(s => s.readCached({ interval: '1d' })).then(d => { if(alive) setDaily(d); }).catch(() => {});
    return () => { alive = false; };
  }, [dailyTrigger]);
  const today = Candles.bucketStart(nowSec, '1d');
  const summary = useMemo(() => display?.length && view ? marketSummary({
    daily, candles: display, interval: view.interval, price: btcPrice, nowSec: Math.floor(Date.now() / 1000), earliestSec,
  }) : null, [daily, display, view?.interval, btcPrice, earliestSec, today]);

  // The forming bucket has closed: fetch it as a completed candle plus the new forming one.
  useEffect(() => {
    if(!view || view.formingIndex < 0 || loading) return;
    const f = view.candles[view.formingIndex];
    if(Date.now() / 1000 >= f.t + Candles.intervalSeconds(view.interval) && Date.now() - view.loadedAt > 5000) refreshView();
  }, [tick, priceUpdatedAt, view, loading, refreshView]);

  useEffect(() => {
    if(!adapter) return;
    const offCross = adapter.onCrosshair(p => setInspectT(p ? p.t : null));
    const offRange = adapter.onVisibleRange(r => {
      if(!r.user || loadingRef.current || historyEndRef.current || !r.count) return;
      if(r.fromIndex <= r.toIndex - r.fromIndex) extendRef.current();
    });
    return () => { offCross(); offRange(); };
  }, [adapter]);

  // ── 24 h change: only from the stats endpoint, never from candles on screen ──
  useEffect(() => {
    let alive = true;
    const ctl = new AbortController();
    const load = async () => {
      if(document.visibilityState === 'hidden') return;
      try {
        const svc = await getMarketService();
        const s = await svc.get24HourStats({ signal: ctl.signal });
        if(alive) { setStats(s); setStatsError(false); }
      } catch(e) { if(alive && e?.name !== 'AbortError') setStatsError(true); }
    };
    load();
    const id = setInterval(load, 120000);
    return () => { alive = false; ctl.abort(); clearInterval(id); };
  }, []);

  // ── full daily history in the background, after the first view (docs/market-data.md §18) ──
  useEffect(() => {
    if(!loadedOnce) return;
    let stopped = false, ctl = null;
    const start = async () => {
      if(stopped || ctl || document.visibilityState === 'hidden') return;
      ctl = new AbortController();
      const mine = ctl;
      setBackfill({ status: 'running' });
      let r;
      try { r = await (await getMarketService()).backfill({ signal: mine.signal }); }
      catch(e) { r = { status: 'failed', error: e?.code || 'error' }; }
      ctl = null;
      if(stopped) return;
      setBackfill(r);
      if(r.status === 'complete' && r.earliestSec != null) setEarliestSec(r.earliestSec);
      if(r.status === 'paused' && document.visibilityState !== 'hidden') start();
    };
    const onVisibility = () => { if(document.visibilityState === 'hidden') ctl?.abort(); else start(); };
    start();
    document.addEventListener('visibilitychange', onVisibility);
    return () => { stopped = true; ctl?.abort(); document.removeEventListener('visibilitychange', onVisibility); };
  }, [loadedOnce, backfillRun]);

  // ALL drawn before the earliest candle was known is redrawn from it once it is.
  useEffect(() => {
    if(range === 'ALL' && earliestSec != null && view && view.earliestSec == null && !loading) setReloadKey(k => k + 1);
  }, [earliestSec]);

  // ── handlers ──
  const chooseRange = r => { if(r !== range) updatePrefs(p => ({ ...p, range: r })); };
  const chooseInterval = iv => { updatePrefs(p => ({ ...p, intervals: { ...p.intervals, [p.range]: iv } })); };
  const retryLoad = () => { setLoadError(null); setReloadKey(k => k + 1); };
  const resetView = () => {
    if(!adapter || !display?.length) return;
    adapter.clearCrosshair(); setInspectT(null);
    const from = Candles.rangeStart(range, Math.floor(Date.now() / 1000), earliestSec);
    if(from == null) adapter.fit(); else adapter.setVisibleRange(from, Math.floor(Date.now() / 1000) + Candles.intervalSeconds(interval));
  };
  const say = text => {
    clearTimeout(announceTimer.current);
    announceTimer.current = setTimeout(() => setAnnounce(text), 400);
  };
  useEffect(() => () => clearTimeout(announceTimer.current), []);

  const inspectIdx = inspectT != null && indexOfT.has(inspectT) ? indexOfT.get(inspectT) : null;
  const shownIdx = display?.length ? (inspectIdx ?? display.length - 1) : -1;
  const shown = shownIdx >= 0 ? display[shownIdx] : null;
  const prevClose = shownIdx > 0 ? display[shownIdx - 1].c : null;
  const shownChange = shown && prevClose != null ? mktSigned(shown.c - prevClose, prevClose) : null;
  const shownForming = !!view && shownIdx === view.formingIndex && shownIdx >= 0;

  const onChartKey = e => {
    if(!adapter || !display?.length) return;
    const n = display.length, cur = inspectIdx ?? n - 1;
    let next;
    switch(e.key) {
      case 'ArrowLeft': next = cur - (e.shiftKey ? 10 : 1); break;
      case 'ArrowRight': next = cur + (e.shiftKey ? 10 : 1); break;
      case 'Home': next = 0; break;
      case 'End': next = n - 1; break;
      case '+': case '=': e.preventDefault(); adapter.zoom(0.8); return;
      case '-': case '_': e.preventDefault(); adapter.zoom(1.25); return;
      case 'Escape':
        if(inspectT == null) return;
        e.preventDefault(); e.stopPropagation();
        adapter.clearCrosshair(); setInspectT(null);
        return;
      default: return;
    }
    e.preventDefault();
    next = Math.max(0, Math.min(n - 1, next));
    adapter.showCrosshair(next);
    const c = display[next];
    setInspectT(c.t);
    say(`${mktCandleWhen(c.t, view.interval)}: open ${fmtUSD(c.o)}, high ${fmtUSD(c.h)}, low ${fmtUSD(c.l)}, close ${fmtUSD(c.c)}`);
  };
  // Bound natively on the chart element: the expanded shell's Escape listener (useModalA11y) is
  // native too, and a React handler would run only after it had already closed the overlay.
  const chartKeyRef = useRef(onChartKey); chartKeyRef.current = onChartKey;
  useEffect(() => {
    const el = chartRef.current;
    if(!el) return;
    const onKey = e => chartKeyRef.current(e);
    el.addEventListener('keydown', onKey);
    return () => el.removeEventListener('keydown', onKey);
  }, []);

  // ── derived status ──
  const sec = Candles.intervalSeconds(view?.interval || interval);
  const lastDone = view && display?.length ? display[view.formingIndex >= 0 ? view.formingIndex - 1 : display.length - 1] : null;
  const candlesStale = !!lastDone && nowSec - (lastDone.t + sec) > 2 * sec;
  const priceAge = priceUpdatedAt ? nowMs - priceUpdatedAt : null;
  const priceStale = priceAge == null || priceAge > 180000;
  const statsStale = !!stats && nowMs - stats.at * 1000 > 300000;
  const change24 = stats ? mktSigned(stats.last - stats.open, stats.open) : null;
  const hasCandles = !!display?.length;
  const providerGaps = (view?.gaps || []).filter(g => g.kind === 'provider').reduce((n, g) => n + g.missing, 0);
  const failed = !!view && view.failedPages.length > 0;
  const volumeLabel = `Volume (${view?.provider?.label || 'Coinbase'})`;
  const newestCandleEnd = hasCandles ? (display[display.length - 1].t + sec) * 1000 : null;

  let chartState = 'ready';
  if(lib === 'loading') chartState = 'library-loading';
  else if(lib === 'error') chartState = 'library-error';
  else if(!hasCandles && loading) chartState = 'loading';
  else if(!hasCandles && !online) chartState = 'offline';
  else if(!hasCandles && (loadError || failed)) chartState = 'error';
  else if(!hasCandles) chartState = 'empty';
  else if(!online) chartState = 'offline-cached';
  else if(failed) chartState = 'partial';
  else if(candlesStale) chartState = 'stale';

  const firstOpen = hasCandles ? display[0].o : null, lastClose = hasCandles ? display[display.length - 1].c : null;
  const rangeReturnPct = firstOpen > 0 ? Indicators.returns.range(display) * 100 : null;
  const ariaLabel = hasCandles
    ? `BTC/USD ${MARKET_INTERVAL_NAMES[view.interval]} candles, ${MARKET_RANGE_NAMES[view.range] || view.range}. Last close ${fmtUSD(lastClose)}`
      + (rangeReturnPct != null ? `, return over the candles shown ${rangeReturnPct >= 0 ? '+' : '−'}${Math.abs(rangeReturnPct).toFixed(1)} %.` : '.')
    : 'BTC/USD candlestick chart — no data shown yet.';

  const rangeOptions = Candles.RANGES.map(r => ({ value: r, label: r }));
  const intervalOptions = Candles.INTERVAL_KEYS.map(iv => {
    if(allowed.includes(iv)) return { value: iv, label: iv };
    const start = Candles.rangeStart(range, nowSec, earliestSec);
    const tooLong = start != null && Candles.intervalSeconds(iv) >= nowSec - start;
    return { value: iv, label: iv, disabled: true, title: start == null ? 'Daily or weekly until full history has loaded'
      : tooLong ? 'Longer than the range' : 'Too many candles for this range' };
  });

  const scaleButton = (
    <button type="button" className="mkt-btn" aria-pressed={scale === 'log'} onClick={() => updatePrefs(p => ({ ...p, scale: p.scale === 'log' ? 'linear' : 'log' }))} title="Logarithmic price scale">Log</button>
  );
  const indicatorCount = mktIndicatorCount(prefs);
  const indicatorsButton = (
    <button type="button" className="mkt-btn" aria-haspopup="dialog" onClick={() => setSheet(true)} data-open-indicators="1"
      aria-label={`Indicators${indicatorCount ? `, ${indicatorCount} on` : ''}`}>
      Indicators{indicatorCount ? <span className="mkt-count" aria-hidden="true">{indicatorCount}</span> : null}
    </button>
  );
  const navButtons = (
    <>
      <button type="button" className="mkt-btn" onClick={() => adapter?.zoom(0.8)} aria-label="Zoom in" title="Zoom in" disabled={!hasCandles}>+</button>
      <button type="button" className="mkt-btn" onClick={() => adapter?.zoom(1.25)} aria-label="Zoom out" title="Zoom out" disabled={!hasCandles}>−</button>
      <button type="button" className="mkt-btn" onClick={() => adapter?.fit()} title="Show every loaded candle" disabled={!hasCandles}>Fit</button>
      <button type="button" className="mkt-btn" onClick={resetView} title="Back to the selected range" disabled={!hasCandles}>Reset</button>
    </>
  );

  return (
    <div className="mkt" data-market-view="1">
      {/* Price header */}
      <div className="mkt-header">
        <span className="mkt-pair">BTC / USD</span>
        <span className="mkt-price" aria-label={btcPrice ? `Bitcoin price ${fmtUSD(btcPrice)}` : 'Bitcoin price unavailable'}>
          {btcPrice ? fmtUSD(btcPrice) : '—'}
        </span>
        {priceStale && btcPrice ? <span className="mkt-badge" data-stale="price">Stale · {priceAge == null ? 'age unknown' : mktAge(priceAge)}</span> : null}
        <span className={`mkt-change ${change24 ? 'mkt-' + change24.dir : ''}`} data-change24>
          {change24 ? <>{change24.text} <span style={{fontWeight:500,color:'var(--text-tertiary)'}}>24 h</span></> : statsError ? '24 h change unavailable' : '24 h …'}
          {statsStale ? <span className="mkt-badge" style={{marginLeft:'.375rem'}}>Stale · {mktAge(nowMs - stats.at * 1000)}</span> : null}
        </span>
        <div className="mkt-fresh" data-freshness>
          {loading && hasCandles ? <span><span className="mkt-spinner" aria-hidden="true" /> Updating…</span> : null}
          <span>Price {priceUpdatedAt ? `updated ${mktClock(priceUpdatedAt)}` : 'not loaded yet'}{priceStale && priceAge != null ? ` (${mktAge(priceAge)} ago)` : ''}</span>
          {view ? <span>Candles updated {mktClock(view.loadedAt)}</span> : null}
          {candlesStale ? <span className="mkt-badge" data-stale="candles">Candles stale · newest {mktAge(nowMs - (lastDone.t + sec) * 1000)} old</span> : null}
          {providerGaps ? <span>{providerGaps} missing candle{providerGaps === 1 ? '' : 's'} from the provider</span> : null}
          {backfill.status === 'running' ? <span>Loading full daily history…</span> : null}
          {backfill.status === 'failed' ? <span>History incomplete · <button type="button" className="btn btn-secondary btn-sm" onClick={() => setBackfillRun(n => n + 1)}>Retry</button></span> : null}
        </div>
      </div>

      {/* Range row and toolbar: one line each, scrolling sideways on a phone */}
      <div className="mkt-scroll">
        <MarketRadioGroup label="Range" options={rangeOptions} value={range} onChange={chooseRange} />
      </div>
      <div className="mkt-scroll" role="toolbar" aria-label="Chart controls">
        <MarketRadioGroup label="Interval" options={intervalOptions} value={interval} onChange={chooseInterval} />
        <div className="mkt-group">{scaleButton}{indicatorsButton}</div>
        <div className="mkt-group">{navButtons}</div>
        <div className="mkt-group">
          <button type="button" className="mkt-btn" onClick={() => setExpanded(true)} aria-label="Expand chart" title="Expand chart">{Icon.Expand({width:15,height:15})}</button>
        </div>
      </div>

      {!online && hasCandles ? (
        <div className="mkt-banner" role="status">Offline — showing saved data from {newestCandleEnd ? new Date(Math.min(newestCandleEnd, Date.now())).toLocaleString() : 'earlier'}</div>
      ) : failed && hasCandles ? (
        <div className="mkt-banner" role="status" data-partial>
          Some history could not be loaded.
          <button type="button" className="btn btn-secondary btn-sm" onClick={retryLoad}>Retry</button>
        </div>
      ) : null}

      <div ref={shellRef} className={`mkt-shell${expanded ? ' expanded' : ''}`}
        {...(expanded ? { role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Expanded BTC/USD chart', tabIndex: -1 } : {})}>
        {expanded ? <MarketExpandedA11y nodeRef={shellRef} onClose={() => setExpanded(false)} /> : null}
        <div className="mkt-shell-bar mkt-scroll">
          <span className="mkt-shell-title">BTC / USD · {range} · {interval}{btcPrice ? ` · ${fmtUSD(btcPrice)}` : ''}</span>
          <div className="mkt-group">{scaleButton}{indicatorsButton}</div>
          <div className="mkt-group">{navButtons}</div>
          <div className="mkt-group">
            <button type="button" className="mkt-btn" onClick={() => setExpanded(false)} aria-label="Close expanded chart">{Icon.X({width:15,height:15})}</button>
          </div>
        </div>

        {/* Persistent readout: always the same height, so nothing jumps (§3) */}
        <div className="mkt-readout" aria-live="off" data-readout data-t={shown ? shown.t : ''}>
          {shown ? (
            <>
              <span className="mkt-when">
                {mktCandleWhen(shown.t, view.interval)}
                {shownForming ? <span className="mkt-badge" style={{marginLeft:'.375rem'}}>forming</span> : null}
                {shown.partial && !shownForming ? <span className="mkt-badge" style={{marginLeft:'.375rem'}}>incomplete bucket</span> : null}
              </span>
              <span>O <b>{fmtUSD(shown.o)}</b></span>
              <span>H <b>{fmtUSD(shown.h)}</b></span>
              <span>L <b>{fmtUSD(shown.l)}</b></span>
              <span>C <b>{fmtUSD(shown.c)}</b></span>
              <span className={shownChange ? 'mkt-' + shownChange.dir : ''}>{shownChange ? shownChange.text : '—'}</span>
              {prefs.volume ? <span>{volumeLabel} <b>{mktVolume(shown.v)}</b></span> : null}
            </>
          ) : <span className="mkt-when">{volumeLabel}</span>}
          {specs.length ? (
            <div className="mkt-readout-ind" data-readout-indicators>
              {specs.filter(s => s.placement === 'overlay' || shownPaneKeys.includes(s.key)).map(s => (

          ) : chartState === 'offline' ? (

            </div>
          ) : chartState === 'error' ? (
            <div className="mkt-overlay" role="alert">

          ) : chartState === 'empty' ? (

          ) : null}
          {loading && hasCandles ? <div className="mkt-progress" aria-hidden="true" /> : null}
          {extending ? <div className="mkt-edge">Loading history…</div> : historyEnd === 'cap' ? <div className="mkt-edge">Choose a longer interval for older candles</div> : null}
        </div>
        {hiddenPanes > 0 ? (
          <div className="mkt-fresh" data-hidden-panes={hiddenPanes}>
            {hiddenPanes} more indicator pane{hiddenPanes === 1 ? '' : 's'} on — {maxPanes} fit on this screen.
            {!expanded ? <button type="button" className="btn btn-secondary btn-sm" onClick={() => setExpanded(true)}>Expand to see all</button> : null}
          </div>
        ) : null}
        <div className="mkt-legal">
          Market data: {view?.provider?.label || 'Coinbase'} (BTC-USD). Times in UTC. Charts by TradingView Lightweight Charts™ —

        </div>
      </div>
      {summary ? <MarketSummaryView s={summary} rangeName={MARKET_RANGE_NAMES[view.range] || view.range} interval={view.interval} /> : null}
      {sheet ? (
        <MarketSheet title="Indicators" onClose={() => setSheet(false)}>

        </MarketSheet>
      ) : null}
      <div className="mkt-sr" aria-live="polite">{announce}</div>
    </div>
  );
}

  const updateSettings = (patch) => {

  const VAULT_AUTO_LOCK_MS = 15 * 60 * 1000;

  React.useEffect(() => {

  // ─── Drive push queue ─────────────────────────────────────────────────────
  // The push is debounced 1500ms. Closing or backgrounding the tab inside that window used to
  // leave local stamped newer than Drive while Drive kept the older copy — after which another
  // device would pull stale data and push it over the newer local. Four defences, in order of
  // how early they catch it: a keepalive flush on hide that can outlive the document, a retry
  // ladder for transport failures, a resume on regaining focus or network, and a dirty marker
  // that survives in localStorage so the next launch can finish the job.
  const pendingPushRef = useRef(null);
  const retryTimerRef = useRef(null);
  const retryAttemptRef = useRef(0);
  // Pushes are serialised. Two overlapping pushes used to race in two ways: the older one
  // finishing cleared pendingPushRef and btc-pending-push even though a newer edit had been
  // queued meanwhile (so that edit never left the device and wasn't even marked dirty), and the
  // newer one's findFile could see the older one's fresh revision and cry drive_changed at a
  // write that was our own.
  const pushInFlightRef = useRef(0);
  const pushAgainRef = useRef(false);
  // Clears the queue only if nothing newer arrived while `payload` was in flight.
  const settlePush = (payload) => {
    retryAttemptRef.current = 0;
    if(pendingPushRef.current !== payload) return false;
    pendingPushRef.current = null;
    localStorage.removeItem('btc-pending-push');
    setSyncState('synced');
    setLastSync(new Date());
    return true;
  };
  const performDrivePush = React.useCallback(async (payload, opts={}) => {
    // An urgent (page-hide) push may overlap: the document is going away and waiting is not
    // an option. Its skipped findFile means it can't trip the conflict check either.
    if(pushInFlightRef.current > 0 && !opts.urgent) { pushAgainRef.current = true; return; }
    pushInFlightRef.current++;
    let followUp = false;
    try {
      // Only a clean success chains a follow-up. After a conflict or a refused token another
      // attempt can only fail the same way, and transport failures own their retry ladder.
      const ok = await performDrivePushOnce(payload, opts);
      followUp = ok && (pushAgainRef.current || (pendingPushRef.current && pendingPushRef.current !== payload && !syncDebounce.current));
    } finally {
      pushInFlightRef.current--;
      pushAgainRef.current = false;
    }
    if(followUp && !retryTimerRef.current && pendingPushRef.current) performDrivePush(pendingPushRef.current);
  }, []);
  const performDrivePushOnce = async (payload, opts) => {
    const expected = localStorage.getItem('btc-drive-seen-mtime') || '';
    if(retryTimerRef.current) { clearTimeout(retryTimerRef.current); retryTimerRef.current = null; }
    try {
      await GDriveSync.push(payload, expected || undefined, { urgent: !!opts.urgent });
      settlePush(payload);
      return true;
    } catch(e) {
      if(e && e.message === 'token_expired') {
        // The silent refresh was refused. Retrying can't help without the user; the dirty
        // marker stays set, and the UI must stop claiming it is connected.
        pushAgainRef.current = false;
        retryAttemptRef.current = 0;
        setSyncState('disconnected');
        showToast('⚠ Google Drive sign-in expired. Your change is saved on this device — reconnect in Settings → Cloud Sync to sync it.', 9000);
        return;
      }
      if(e && e.code === 'drive_changed') {
        // A keepalive push can land without us ever seeing the response — the page was being
        // torn down. That leaves btc-drive-seen-mtime stale, so our OWN write looks foreign on
        // the next attempt. Read the file back before crying conflict: if it already carries
        // this payload's stamp, the push succeeded and we just adopt the new revision.
        try {
          const remote = await GDriveSync.pull();
          if(remote && payload.lastModified && remote.lastModified === payload.lastModified) {
            dlog('[GDrive] drive_changed was our own completed keepalive push — adopting');
            if(remote._driveModifiedTime) safeSetItem('btc-drive-seen-mtime', remote._driveModifiedTime);
            settlePush(payload);
            return true;
          }
        } catch(verifyErr) { console.warn('Could not verify drive_changed:', verifyErr); }
        // Another device really did write since we last saw this file. Refuse to clobber it and
        // leave btc-pending-push set, so the conflict is surfaced instead of resolved silently.
        console.warn('Drive changed since last sync — push aborted rather than overwriting');
        pushAgainRef.current = false;
        retryAttemptRef.current = 0;

        showToast('⚠ Google Drive was changed on another device. Your edit is saved locally — open Settings → Cloud Sync to resolve.', 10000);
        return;
      }

      setSyncState('error');

          retryTimerRef.current = null;
          if(pendingPushRef.current) performDrivePush(pendingPushRef.current);

  const queueDrivePush = React.useCallback((payload) => {

    pendingPushRef.current = payload;
    safeSetItem('btc-pending-push', payload.lastModified || new Date().toISOString());
