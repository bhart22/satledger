                              <button className="btn-icon" style={{width:36,height:36,color:'var(--green)'}} title="Unarchive wallet" aria-label="Unarchive wallet" onClick={()=>{patchWallet(w,{archived:false});showToast(`${w.name} restored`);}}>{Icon.Unarchive({width:14,height:14})}</button>
                            )}
                            <button className="btn-icon btn-icon-danger" style={{width:36,height:36,color:'var(--red)'}} title="Delete permanently" aria-label="Delete permanently" onClick={()=>{setConfirmDialog({title:'Delete Wallet',message:`Permanently delete ${w.name}? Its transactions will no longer count toward stats. This cannot be undone — consider archiving instead or exporting a backup first.`,confirmLabel:'Delete Wallet',danger:true,onConfirm:()=>{removeWallet(w);showToast(`${w.name} deleted`);setConfirmDialog(null);}});}}>{Icon.X({width:14,height:14})}</button>
                          </div>
                        </div>
                        <span className="wallet-type-badge">{w.type}</span>
                        <div className="wallet-btc" style={{marginTop:'.625rem'}}>{fmtBTC(bal)} {btcUnit()}</div>
                        {usd!==null && <div className="wallet-usd">{fmtUSD(usd)}</div>}
                        {w.address && <div className="wallet-address">{w.address}</div>}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* Unregistered wallet names — their BTC is invisible to Holdings */}
            {unknownWalletNames.length > 0 && (
              <div className="card" style={{borderColor:'#d97706'}}>
                <div className="card-header">
                  <div className="card-title" style={{color:'#d97706'}}>Unregistered Wallet Names</div>
                </div>
                <div className="card-body">
                  {(()=>{
                    const refs = unknownWalletNames.reduce((n,[,c])=>n+c,0);
                    const names = unknownWalletNames.length;
                    return (
                      <div style={{fontSize:'.8125rem',color:'var(--text-secondary)',lineHeight:1.6,marginBottom:'.875rem'}}>
                        {refs} transaction{refs===1?'':'s'} reference {names} name{names===1?'':'s'} that {names===1?"isn't":"aren't"} a registered wallet.

                      </div>

                  })()}
                  <div style={{display:'flex',flexDirection:'column',gap:'.5rem'}}>

                        <div style={{fontSize:'.875rem'}}>
                          <span style={{fontFamily:'var(--font-mono)',fontWeight:600}}>{name}</span>
                          <span style={{color:'var(--text-tertiary)',marginLeft:'.5rem'}}>{count} transaction{count===1?'':'s'}</span>
                        </div>
                        <div style={{display:'flex',gap:'.5rem'}}>
                          <button className="btn btn-secondary btn-sm" onClick={()=>{
                            setWalletForm({name, type:'Exchange', address:''});

                          message: `Replace whatever is in Google Drive with your local ${transactions.length} transaction${transactions.length===1?'':'s'} and ${wallets.length} wallet${wallets.length===1?'':'s'}? Any data in Drive that isn't on this device will be lost.`,

                          danger: true,
                          onConfirm: async()=>{
                            setConfirmDialog(null);
                            setSyncState('syncing');
                            try {
                              await pushLocalToDrive('Pushed to Google Drive');
                              setSyncState('synced'); setLastSync(new Date());
                            } catch { setSyncState('error'); showToast('Push failed'); }
                          },
                        });

                      <button className="btn btn-secondary btn-sm" onClick={async()=>{

                        // unreadable payload bails out before anything local is touched.
                        setSyncState('syncing');
                        let remote;
                        try { remote = await GDriveSync.pull(); }
                        catch { setSyncState('error'); showToast('Pull failed'); return; }
                        if(!remote || !(Array.isArray(remote.transactions) || remote.vault)) {
                          setSyncState('synced'); showToast('No remote data found'); return;
                        }
                        const remoteCount = Array.isArray(remote.transactions) ? remote.transactions.length : null;
                        setSyncState('synced');
                        setConfirmDialog({
                          title: 'Replace Local Data',
                          message: remoteCount === null
                            ? `This Drive file contains a vault but no transaction list. Only the vault will be replaced. Continue?`
                            : `Replace your local ${transactions.length} transaction${transactions.length===1?'':'s'} with the ${remoteCount} in Google Drive? A recovery snapshot will be kept, available under Export → Backup & Restore.`,
                          confirmLabel: 'Replace Local Data',
                          danger: true,
                          onConfirm: ()=>{
                            setConfirmDialog(null);
                            applyRemotePayload(remote, { stash: true });
                            setLastSync(new Date());
                            showToast('Pulled from Google Drive');

                            {maLineDefs.map((ma, mi) => (

                                    }} />
                                    <span className="theme-slider"></span>
                                  </label>
                                </div>

                                        <input
                                          className="form-input"
                                          type="number"
                                          min="0"
                                          max="100"
                                          step="1"
                                          value={rsiThresholdDraft.overbought}

                                          aria-label="RSI overbought threshold"
                                          style={rsiThresholdError ? {borderColor:'var(--red)'} : undefined}
                                        />
                                      </label>
                                      <label style={{display:'flex',flexDirection:'column',gap:'.375rem'}}>
                                        <span style={{fontSize:'.75rem',fontWeight:600,color:'var(--text-secondary)',textTransform:'uppercase',letterSpacing:'.04em'}}>Oversold</span>

                                        />

                                    </div>
                                    <div style={{fontSize:'.75rem',color:'var(--text-secondary)',marginTop:'.625rem'}}>
                                      Leave a field blank or set it to <strong>0</strong> to disable that RSI threshold line. When enabled, values above <strong>{rsiThresholdDraft.overbought || 'the overbought threshold'}</strong> are overbought, and values below <strong>{rsiThresholdDraft.oversold || 'the oversold threshold'}</strong> are oversold.
                                    </div>
                                    {rsiThresholdError && (
                                      <div style={{fontSize:'.75rem',color:'var(--red)',marginTop:'.5rem',fontWeight:600}}>
                                        {rsiThresholdError}
                                      </div>
                                    )}
                                  </div>
                                )}
                              </div>
                            ))}
                          </div>

                    <div className="form-group">
                      <label className="form-label" htmlFor="tx-total-usd">Total USD</label>
                      <input id="tx-total-usd" type="number" min="0" inputMode="decimal" step="0.01" className="form-input" placeholder="0.00" value={form.totalUsd} onChange={e=>{
                        const usd = e.target.value;
                        const amt = numOr(form.amount, null);
                        const usdN = numOr(usd, null);
                        // amt must be > 0, not merely truthy — "0" here used to yield price "Infinity"
                        const newPrice = (usdN !== null && amt !== null && amt > 0) ? (usdN/amt).toFixed(2) : '';
                        setForm({...form, totalUsd:usd, price:newPrice});
                      }}/>
                    </div>
                  )}
                  <div className="form-group">
                    <label className="form-label" htmlFor="tx-fee">Fee {form.type==='Transfer'||form.type==='Consolidation'?`(${btcUnit()})`:'(USD)'}</label>
                    <input id="tx-fee" type="number" min="0" inputMode="decimal" step={form.type==='Transfer'||form.type==='Consolidation'?(satsMode?'1':'0.00000001'):'0.01'} className="form-input" placeholder="0" value={form.type==='Transfer'||form.type==='Consolidation'?btcToUnitInput(form.fee):form.fee} onChange={e=>{
                      const isBtcFee = form.type==='Transfer'||form.type==='Consolidation';
                      setForm({...form, fee: isBtcFee ? unitInputToBtc(e.target.value) : e.target.value});
                    }}/>
                  </div>
                  {form.type==='Consolidation' && (
                    <div className="form-group full" style={{marginTop:'-.25rem'}}>
                      <div style={{fontSize:'.75rem',color:'var(--text-secondary)'}}>
                        Amount consolidated is informational only. Only the {btcUnit()} fee changes wallet holdings.
                      </div>
                    </div>
                  )}
                  <div className="form-group full">
                    <label className="form-label" htmlFor="tx-hash">TxHash (optional)</label>
                    <input id="tx-hash" className="form-input" placeholder="On-chain transaction hash" value={form.txhash} onChange={e=>setForm({...form,txhash:e.target.value})} style={{fontFamily:'JetBrains Mono',fontSize:'.75rem'}}/>
                  </div>
                  <div className="form-group full">
                    <label className="form-label" htmlFor="tx-notes">Notes</label>
                    <input id="tx-notes" className="form-input" placeholder="Optional description" value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})}/>
                  </div>
                  <div className="form-group full">
                    <label style={{display:'flex',alignItems:'center',gap:'.5rem',fontSize:'.8125rem',color:'var(--text-secondary)',cursor:'pointer'}}>
                      <input type="checkbox" checked={form.excludeStats||false} onChange={e=>setForm({...form,excludeStats:e.target.checked})} style={{accentColor:'var(--bitcoin-orange)'}}/>
                      Exclude from cost basis & P&L
                    </label>
                  </div>
                </div>
              </div>
              <div className="modal-footer">
                <button type="button" className="btn btn-secondary" onClick={requestCloseTxModal}>Cancel</button>
                <button type="button" className="btn btn-primary" onClick={handleSubmit}>{editId!==null?'Update':'Add'} Transaction</button>
              </div>
            </div>
        </Modal>
      )}

      {/* ── Add/Edit Wallet Modal ── */}
      {showWalletModal && (
        <Modal onClose={()=>setShowWalletModal(false)} title={`${editWalletTarget!==null?'Edit':'Add'} Wallet`} maxWidth={420}>
            <div>
              <div className="modal-body">
                <div className="form-group" style={{marginBottom:'1rem'}}>
                  <label className="form-label" htmlFor="wallet-name">Name</label>
                  <input id="wallet-name" className="form-input" placeholder="e.g. Bitkey Cold Storage" value={walletForm.name} onChange={e=>setWalletForm({...walletForm,name:e.target.value})} required/>
                </div>
                <div className="form-group" style={{marginBottom:'1rem'}}>
                  <label className="form-label" htmlFor="wallet-type">Type</label>
                  <select id="wallet-type" className="form-select" value={walletForm.type} onChange={e=>setWalletForm({...walletForm,type:e.target.value})}>
                    <option>Exchange</option><option>Wallet</option><option>Cold Storage</option><option>Other</option>
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label" htmlFor="wallet-address">Bitcoin Address (optional)</label>
                  <input id="wallet-address" className="form-input" placeholder="bc1q…" value={walletForm.address} onChange={e=>setWalletForm({...walletForm,address:e.target.value})} style={{fontFamily:'JetBrains Mono',fontSize:'.75rem'}}/>
                </div>
              </div>
              <div className="modal-footer">
                <button type="button" className="btn btn-secondary" onClick={()=>setShowWalletModal(false)}>Cancel</button>
                <button type="button" className="btn btn-primary" onClick={handleWalletSubmit}>{editWalletTarget!==null?'Update':'Add'} Wallet</button>
              </div>
            </div>
        </Modal>
      )}

      {/* ── IMPORT PREVIEW ── */}
      {importPreview && (
        <Modal onClose={()=>setImportPreview(null)} title="Import Preview" maxWidth={640}>
            <div className="modal-body">
              <div style={{display:'flex',gap:'1rem',flexWrap:'wrap',marginBottom:'1rem'}}>
                <div style={{flex:1,minWidth:120,padding:'.75rem',borderRadius:8,background:'var(--bg-tertiary)',border:'1px solid var(--border-color)'}}>
                  <div style={{fontSize:'.6875rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em',color:'var(--text-secondary)',marginBottom:'.25rem'}}>New Transactions</div>
                  <div style={{fontSize:'1.25rem',fontWeight:700,color:'var(--green)'}}>{importPreview.rows.length}</div>
                </div>
                {importPreview.dupeCount > 0 && (
                  <div style={{flex:1,minWidth:120,padding:'.75rem',borderRadius:8,background:'var(--bg-tertiary)',border:'1px solid var(--border-color)'}}>
                    <div style={{fontSize:'.6875rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em',color:'var(--text-secondary)',marginBottom:'.25rem'}}>Duplicates Skipped</div>
                    <div style={{fontSize:'1.25rem',fontWeight:700,color:'var(--text-tertiary)'}}>{importPreview.dupeCount}</div>
                  </div>
                )}
                {importPreview.badCount > 0 && (
                  <div style={{flex:1,minWidth:120,padding:'.75rem',borderRadius:8,background:'var(--bg-tertiary)',border:'1px solid #d97706'}}>
                    <div style={{fontSize:'.6875rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em',color:'var(--text-secondary)',marginBottom:'.25rem'}}>Unreadable Rows</div>
                    <div style={{fontSize:'1.25rem',fontWeight:700,color:'#d97706'}}>{importPreview.badCount}</div>
                  </div>
                )}
                <div style={{flex:1,minWidth:120,padding:'.75rem',borderRadius:8,background:'var(--bg-tertiary)',border:'1px solid var(--border-color)'}}>
                  <div style={{fontSize:'.6875rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em',color:'var(--text-secondary)',marginBottom:'.25rem'}}>Format</div>
                  <div style={{fontSize:'1.25rem',fontWeight:700}}>{importPreview.format}</div>
                </div>
              </div>
              <div style={{fontSize:'.75rem',fontWeight:600,color:'var(--text-secondary)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'.5rem'}}>Transaction Summary</div>
              <div className="table-wrap" style={{maxHeight:300,overflowY:'auto',border:'1px solid var(--border-color)',borderRadius:8}}>
                <table>
                  <thead><tr><th>Date</th><th>Type</th><th>Wallet</th><th>Amount</th><th>Price</th></tr></thead>
                  <tbody>
                    {importPreview.rows.slice(0, 50).map((tx, i) => (
                      <tr key={i}>
                        <td style={{whiteSpace:'nowrap',fontSize:'.8125rem'}}>{fmtDate(tx.date)}</td>
                        <td><span className={`badge badge-${tx.type==='Consolidation'?'consolidation':tx.type.toLowerCase()}`}>{tx.type}</span></td>
                        <td style={{fontSize:'.8125rem'}}>{tx.wallet||'—'}</td>
                        <td className="mono" style={{fontSize:'.8125rem'}}>{fmtBTC(tx.amount)}</td>
                        <td className="mono" style={{fontSize:'.8125rem'}}>{tx.price && parseFloat(tx.price)>0 ? fmtUSD(tx.price) : '—'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                {importPreview.rows.length > 50 && (
                  <div style={{padding:'.5rem 1rem',fontSize:'.75rem',color:'var(--text-tertiary)',textAlign:'center',borderTop:'1px solid var(--border-color)'}}>
                    Showing first 50 of {importPreview.rows.length} transactions
                  </div>
                )}
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={()=>setImportPreview(null)}>Cancel</button>
              <button className="btn btn-primary" onClick={()=>{
                const merged=[...transactions,...importPreview.rows];
                setTransactions(merged);
                save(merged, wallets);
                showToast(`Imported ${importPreview.rows.length} transactions${importPreview.dupeCount ? ` (${importPreview.dupeCount} duplicates skipped)` : ''}`);
                setImportPreview(null);
              }}>{Icon.Check({width:14,height:14})} Import {importPreview.rows.length} Transactions</button>
            </div>
        </Modal>
      )}

      {/* ── TRANSFER WIZARD ── */}
      {showWizard && <TransferWizard
        transactions={transactions}
        wallets={wallets}
        wizardStep={wizardStep}
        setWizardStep={setWizardStep}
        wizardEdits={wizardEdits}
        setWizardEdits={setWizardEdits}
        setShowWizard={setShowWizard}
        setTransactions={setTransactions}
        save={save}
        showToast={showToast}
      />}


      {/* ── Reset Data Dialog ── */}
      {showResetDialog && <ResetDialog
        transactions={transactions}
        wallets={wallets}
        hasVault={!!vault}
        onClose={()=>setShowResetDialog(false)}
        onReset={(keepWallets) => {
          // A reset replaces everything, so keep the same recovery snapshot a Drive pull does
          stashPreSyncSnapshot();
          setSnapshotNonce(n => n+1);
          localStorage.removeItem('btc-tx-v2');
          if(!keepWallets) {
            localStorage.removeItem('btc-wallets');
            localStorage.removeItem(VAULT_STORAGE_KEY);
            setWallets([...DEFAULT_WALLETS]);
            setVault(null);
            lockVault();
          }
          setTransactions(PRELOADED_TRANSACTIONS);
          save(PRELOADED_TRANSACTIONS, keepWallets ? wallets : DEFAULT_WALLETS, { vault: keepWallets ? vault : null });
          setShowResetDialog(false);
          showToast(keepWallets ? 'Transactions cleared — wallets and vault kept' : 'All data reset');
        }}
      />}

      {/* Confirm Dialog */}
      {showGuide && (
        <Modal onClose={()=>setShowGuide(false)} title="How It Works" maxWidth={560}
          headerExtra={Icon.HelpCircle({width:20,height:20})}>
            <div className="modal-body" style={{fontSize:'.9375rem',lineHeight:1.7,color:'var(--text-secondary)'}}>
              <p style={{marginBottom:'1rem'}}><strong style={{color:'var(--text-primary)'}}>SatLedger</strong> is a personal Bitcoin portfolio tracker. All data is stored locally in your browser — nothing is sent to a server.</p>

              <h4 style={{color:'var(--text-primary)',marginBottom:'.375rem',fontSize:'.9375rem'}}>Getting Started</h4>
              <p style={{marginBottom:'1rem'}}>Create your wallets (exchanges, hardware wallets, etc.) in the <strong>Wallets</strong> tab, then log your buys, sells, transfers, and rewards in the <strong>Transactions</strong> tab. The <strong>Dashboard</strong> automatically calculates your holdings, cost basis, and P&L.</p>

              <h4 style={{color:'var(--text-primary)',marginBottom:'.375rem',fontSize:'.9375rem'}}>Transaction Types</h4>
              <ul style={{paddingLeft:'1.25rem',marginBottom:'1rem'}}>
                <li><strong>Buy</strong> — Purchase BTC into a wallet</li>
                <li><strong>Sell</strong> — Sell BTC from a wallet</li>
                <li><strong>Transfer</strong> — Move BTC between wallets (network fees deducted)</li>
                <li><strong>Reward</strong> — Staking, interest, or earn rewards</li>
                <li><strong>Consolidation</strong> — Same-wallet movement where only the BTC fee affects holdings</li>
              </ul>

              <h4 style={{color:'var(--text-primary)',marginBottom:'.375rem',fontSize:'.9375rem'}}>Google Drive Sync</h4>
              <p style={{marginBottom:'1rem'}}>Optionally sign in with Google to back up and sync your data across devices. Data is stored privately in your Google Drive app data — only this app can access it.</p>

              <h4 style={{color:'var(--text-primary)',marginBottom:'.375rem',fontSize:'.9375rem'}}>Inheritance Vault</h4>
              <p style={{marginBottom:'1rem'}}>The <strong>Vault</strong> tab lets you store encrypted notes (seed phrases, instructions) protected by a passphrase. This data is encrypted before being saved or synced.</p>

              <h4 style={{color:'var(--text-primary)',marginBottom:'.375rem',fontSize:'.9375rem'}}>Export & Backup</h4>
              <p>Use the <strong>Export</strong> tab to download a full JSON backup or generate a CoinLedger-compatible CSV for tax reporting. You can restore from a backup at any time in <strong>Settings</strong>.</p>

              <div style={{marginTop:'1rem',paddingTop:'1rem',borderTop:'1px solid var(--border-color)',fontSize:'.875rem',display:'flex',flexWrap:'wrap',gap:'1rem'}}>
                <div>
                  <span style={{color:'var(--text-secondary)'}}>Feedback: </span>
                  <a href="mailto:info@satledger.com" style={{color:'var(--bitcoin-orange)',fontWeight:600,textDecoration:'none'}}>info@satledger.com</a>
                </div>
                <div>
                  <span style={{color:'var(--text-secondary)'}}>GitHub: </span>
                  <a href="https://github.com/bhart22/satledger" target="_blank" rel="noreferrer" style={{color:'var(--bitcoin-orange)',fontWeight:600,textDecoration:'none'}}>github.com/bhart22/satledger</a>
                </div>
              </div>
            </div>
        </Modal>
      )}

      {showTipJar && (
        <Modal onClose={()=>setShowTipJar(false)} title="Send a Tip" maxWidth={480}
          headerExtra={Icon.Heart({width:20,height:20})}>
            <div className="modal-body" style={{fontSize:'.9375rem',lineHeight:1.6,color:'var(--text-secondary)'}}>
              <p style={{marginBottom:'1.25rem'}}>If you find SatLedger useful, consider sending a small Bitcoin tip. Every sat is appreciated!</p>

              {/* QR images are pre-generated static files (npm run qr). They used to be fetched
                  from api.qrserver.com, which the page's own img-src CSP blocked — so they never
                  rendered in production — besides sending every tip address to a third party
                  that could have substituted its own QR, and breaking offline. */}
              {TIP_TARGETS.map(t => (
                <div key={t.label} style={{marginBottom:'1.25rem'}}>
                  <div style={{display:'flex',alignItems:'center',gap:'.375rem',marginBottom:'.5rem',fontWeight:600,color:'var(--text-primary)',fontSize:'.875rem'}}>
                    {Icon[t.icon]({width:16,height:16,style:{color:t.color}})} {t.label}
                  </div>
                  <div style={{display:'flex',gap:'.75rem',alignItems:'flex-start'}}>
                    <img src={t.qr}
                      alt={`QR code for the ${t.label} tip address`} width={120} height={120}
                      style={{borderRadius:'8px',border:'1px solid var(--border-color)',flexShrink:0,background:'#fff',padding:4}} />
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{
                        fontFamily:'JetBrains Mono',fontSize:'.75rem',wordBreak:'break-all',
                        background:'var(--bg-tertiary)',padding:'.625rem',borderRadius:'8px',
                        border:'1px solid var(--border-color)',color:'var(--text-primary)',lineHeight:1.5,
                        marginBottom:'.5rem'
                      }}>{t.address}</div>
                      <button className="btn btn-secondary btn-sm" onClick={()=>{
                        navigator.clipboard.writeText(t.address);
                        showToast(`${t.label} address copied!`);
                      }} style={{display:'flex',alignItems:'center',gap:'.375rem',fontSize:'.8125rem'}}>
                        {Icon.Copy({width:14,height:14})} Copy address
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
        </Modal>
      )}

      {confirmDialog && (() => {
        // dismissible:false is for dialogs where BOTH options are real decisions (the sync
        // conflict), so there is no safe "just close it" action.
        const dismissible = confirmDialog.dismissible !== false;
        const dismiss = dismissible ? (()=>setConfirmDialog(null)) : undefined;
        const showConfirmIcon = confirmDialog.confirmIcon !== false && confirmDialog.danger;
        return (
          <Modal
            onClose={dismiss || (()=>{})}
            dismissible={dismissible}
            showClose={dismissible}
            title={confirmDialog.title}
            maxWidth={420}
            headerStyle={confirmDialog.danger?{background:'var(--red-light)',borderBottom:'1px solid var(--red)'}:undefined}
            titleStyle={confirmDialog.danger?{color:'var(--red)'}:undefined}
            headerExtra={confirmDialog.danger && <span style={{color:'var(--red)',display:'flex'}}>{Icon.Warning({width:20,height:20})}</span>}
          >
            <div className="modal-body">
              <p style={{fontSize:'.9375rem',color:'var(--text-secondary)',lineHeight:1.6}}>{confirmDialog.message}</p>
              {/* Optional this-device vs Drive breakdown. Only the sync conflict uses it — a
                  choice between two copies is unmakeable without seeing what differs. */}
              {confirmDialog.details && (
                confirmDialog.details.length === 0 ? (
                  <p style={{fontSize:'.8125rem',color:'var(--text-tertiary)',marginTop:'.75rem'}}>
                    {confirmDialog.detailsEmptyText || 'No differences detected.'}
                  </p>
                ) : (
                  <div style={{marginTop:'.875rem',border:'1px solid var(--border-color)',borderRadius:8,overflow:'hidden'}}>
                    <div style={{display:'grid',gridTemplateColumns:'minmax(80px,auto) 1fr 1fr',gap:0,fontSize:'.75rem'}}>
                      <div style={{padding:'.4rem .625rem',fontWeight:600,background:'var(--bg-tertiary)',color:'var(--text-secondary)'}}></div>
                      <div style={{padding:'.4rem .625rem',fontWeight:600,background:'var(--bg-tertiary)',color:'var(--text-secondary)'}}>This device</div>
                      <div style={{padding:'.4rem .625rem',fontWeight:600,background:'var(--bg-tertiary)',color:'var(--text-secondary)'}}>Google Drive</div>
                      {confirmDialog.details.map(row => (
                        <React.Fragment key={row.label}>
                          <div style={{padding:'.4rem .625rem',fontWeight:600,borderTop:'1px solid var(--border-color)'}}>{row.label}</div>
                          <div style={{padding:'.4rem .625rem',borderTop:'1px solid var(--border-color)',wordBreak:'break-word'}}>{row.local}</div>
                          <div style={{padding:'.4rem .625rem',borderTop:'1px solid var(--border-color)',wordBreak:'break-word'}}>{row.remote}</div>
                        </React.Fragment>
                      ))}
                    </div>
                  </div>
                )
              )}
            </div>
            <div className="modal-footer">
              <button type="button" className="btn btn-secondary" onClick={confirmDialog.onCancel || (()=>setConfirmDialog(null))}>
                {confirmDialog.cancelLabel || 'Cancel'}
              </button>
              <button type="button" className={`btn ${confirmDialog.danger?'btn-danger':'btn-primary'}`} onClick={confirmDialog.onConfirm}>
                {showConfirmIcon && Icon.Trash({width:13,height:13})} {confirmDialog.confirmLabel||'Confirm'}
              </button>
            </div>
          </Modal>
        );
      })()}

      <nav
        className="mobile-bottom-nav"
        aria-label="Primary"
        style={isMobileViewport ? {
          display:'flex',
          position:'fixed',
          left:0,
          right:0,
          bottom:0,
          width:'100vw',
          maxWidth:'100vw',
          visibility:'visible',
          opacity:1,
          pointerEvents:'auto',
        } : { display:'none' }}
      >
        {NAV_ITEMS.filter(item=> item.key!=='vault' || effectiveSettings.showVault!==false).map(item=>(
          <button
            key={item.key}
            className={`mobile-bottom-nav-item ${tab===item.key?'active':''}`}
            onClick={()=>setTab(item.key)}
            aria-current={tab===item.key ? 'page' : undefined}
            aria-label={item.label}
          >
            {Icon[item.icon]({width:18,height:18})}
            <span className="mobile-bottom-nav-label">{item.label}</span>
          </button>
        ))}
      </nav>

      {/* Toast */}
      {toast && <div className="toast" role="status" aria-live="polite">{toast}</div>}
      {updateAvailable && !toast && (
        <div className="toast" role="status" aria-live="polite" style={{display:'flex',alignItems:'center',gap:'.75rem'}}>
          <span>A new version of SatLedger is available.</span>
          <button type="button" className="btn btn-secondary btn-sm" onClick={()=>location.reload()}>Reload</button>
        </div>
      )}
    </div>
  );
}

function ResetDialog({ transactions, wallets, hasVault, onClose, onReset }) {
  const [keepWallets, setKeepWallets] = React.useState(true);
  const [confirmText, setConfirmText] = React.useState('');
  const canConfirm = confirmText.toLowerCase() === 'reset';
  const activeWallets = wallets.filter(w => !w.archived);

  return (
    <Modal
      onClose={onClose}
      title="Reset Data"
      maxWidth={480}
      headerStyle={{background:'var(--red-light)',borderBottom:'1px solid var(--red)'}}
      titleStyle={{color:'var(--red)'}}
      headerExtra={<span style={{color:'var(--red)',display:'flex'}}>{Icon.Warning({width:20,height:20})}</span>}
    >
        <div className="modal-body" style={{padding:'1.5rem'}}>
          {hasVault && (
            <div style={{fontSize:'.8125rem',color:'#d97706',fontWeight:600,marginBottom:'1rem'}}>
              A full reset will also remove your encrypted vault.
            </div>
          )}
          {/* What will be deleted */}
          <div style={{marginBottom:'1.25rem'}}>
            <div style={{fontSize:'.8125rem',fontWeight:600,color:'var(--text-secondary)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:'.75rem'}}>This will permanently delete</div>
            <div style={{background:'var(--bg-tertiary)',borderRadius:10,padding:'1rem 1.25rem',border:'1px solid var(--border-color)'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'.5rem'}}>
                <span style={{fontSize:'.875rem',color:'var(--text-primary)'}}>All transactions</span>
                <span style={{fontFamily:'JetBrains Mono',fontSize:'.8125rem',fontWeight:600,color:'var(--red)'}}>{transactions.length}</span>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',opacity:keepWallets?.4:1,transition:'opacity .2s'}}>
                <span style={{fontSize:'.875rem',color:'var(--text-primary)',textDecoration:keepWallets?'line-through':'none'}}>{keepWallets?'Wallets (kept)':'All wallets'}</span>
                <span style={{fontFamily:'JetBrains Mono',fontSize:'.8125rem',fontWeight:600,color:keepWallets?'var(--green)':'var(--red)'}}>{keepWallets?'✓ kept':activeWallets.length}</span>
              </div>
            </div>
          </div>

          {/* Keep wallets toggle */}
          <div style={{background:'var(--bg-tertiary)',borderRadius:10,padding:'1rem 1.25rem',border:'1px solid var(--border-color)',marginBottom:'1.25rem',cursor:'pointer',transition:'border-color .15s',borderColor:keepWallets?'var(--green)':'var(--border-color)'}} onClick={()=>setKeepWallets(k=>!k)}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'.75rem'}}>
              <div style={{display:'flex',alignItems:'center',gap:'.75rem'}}>
                <div style={{width:38,height:22,borderRadius:11,background:keepWallets?'var(--green)':'var(--border-color)',transition:'background .2s',position:'relative',flexShrink:0,cursor:'pointer'}}>
                  <div style={{width:16,height:16,borderRadius:8,background:'#fff',position:'absolute',top:3,left:keepWallets?19:3,transition:'left .2s',boxShadow:'0 1px 3px rgba(0,0,0,.2)'}}/>
                </div>
                <div>
                  <div style={{fontSize:'.875rem',fontWeight:600}}>Keep my wallets</div>
                  <div style={{fontSize:'.75rem',color:'var(--text-secondary)',marginTop:'.125rem'}}>Preserve {activeWallets.length} wallet{activeWallets.length!==1?'s':''} and their settings</div>
                </div>
              </div>
            </div>
            {keepWallets && activeWallets.length > 0 && (
              <div style={{display:'flex',flexWrap:'wrap',gap:'.375rem',marginTop:'.75rem',paddingTop:'.75rem',borderTop:'1px solid var(--border-color)'}}>
                {activeWallets.slice(0,8).map(w=>(
                  <span key={w.id} style={{fontSize:'.6875rem',fontWeight:600,padding:'.2rem .5rem',borderRadius:5,background:'var(--bitcoin-light)',color:'var(--bitcoin-orange)'}}>{w.name}</span>
                ))}
                {activeWallets.length>8 && <span style={{fontSize:'.6875rem',color:'var(--text-tertiary)',padding:'.2rem 0'}}>+{activeWallets.length-8} more</span>}
              </div>
            )}
          </div>

          {/* Type RESET to confirm */}
          <div>
            <div style={{fontSize:'.8125rem',fontWeight:500,color:'var(--text-secondary)',marginBottom:'.5rem'}}>
              Type <strong style={{color:'var(--red)',fontFamily:'JetBrains Mono',letterSpacing:'.05em'}}>RESET</strong> to confirm
            </div>
            <input
              className="form-input"
              placeholder="Type RESET"
              value={confirmText}
              onChange={e=>setConfirmText(e.target.value)}
              autoFocus
              style={{width:'100%',fontFamily:'JetBrains Mono',textAlign:'center',fontSize:'.9375rem',letterSpacing:'.08em',borderColor:canConfirm?'var(--red)':'var(--border-color)'}}
            />
          </div>
        </div>

        <div className="modal-footer" style={{borderTop:'1px solid var(--border-color)'}}>
          <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
          <button
            className="btn"
            disabled={!canConfirm}
            onClick={()=>onReset(keepWallets)}
            style={{
              background:canConfirm?'var(--red)':'var(--bg-tertiary)',
              color:canConfirm?'#fff':'var(--text-tertiary)',
              border:'none',
              cursor:canConfirm?'pointer':'not-allowed',
              transition:'all .2s',
            }}
          >
            {Icon.Trash({width:13,height:13})} {keepWallets ? 'Reset Transactions' : 'Reset Everything'}
          </button>
        </div>
    </Modal>
  );
}

function WizardWalletSelect({ label, value, wallets, onChange }) {
  const [custom, setCustom] = React.useState(false);
  const isKnown = wallets.some(w => w.name === value);

  // If value is set but not in list, show custom input
  React.useEffect(() => {
    if(value && !wallets.some(w => w.name === value)) setCustom(true);
  }, []);

  return (
    <div>
      <div className="wizard-field-label">{label}</div>
      {!custom ? (
        <select
          className="form-select"
          style={{width:'100%'}}
          value={value}
          onChange={ev => {
            if(ev.target.value === '__custom__') { setCustom(true); onChange(''); }
            else onChange(ev.target.value);
          }}
        >
          <option value="">— Select wallet —</option>
          {wallets.map(w => <option key={w.id} value={w.name}>{w.name}</option>)}
          <option value="__custom__">Other (type manually)...</option>
        </select>
      ) : (
        <div style={{display:'flex',gap:'.375rem'}}>
          <input
            className="form-input"
            style={{flex:1}}
            placeholder="Type wallet name"
            autoFocus
            value={value}
            onChange={ev => onChange(ev.target.value)}
          />
          <button
            type="button"
            className="btn btn-secondary btn-sm"
            onClick={() => { setCustom(false); onChange(''); }}
            title="Back to list"
          >{Icon.X({width:12,height:12})}</button>
        </div>
      )}
      {!value && <div className="wizard-missing">{Icon.Warning({width:12,height:12})} Required</div>}
    </div>
  );
}


function TransferWizard({ transactions, wallets, wizardStep, setWizardStep, wizardEdits, setWizardEdits, setShowWizard, setTransactions, save, showToast }) {
  // The worklist is FROZEN for the wizard's lifetime. Deriving it from the live
  // `transactions` prop meant that saving the current transfer removed it from the list
  // while wizardStep advanced — so every second transfer was skipped, and once the list
  // shrank past wizardStep the summary step became unreachable and the modal went blank.
  // The launcher resets wizardStep/wizardEdits before mounting, so a snapshot is safe.
  const [incomplete] = React.useState(() => transactions
    .filter(t=>t.type==='Transfer'&&(!t.wallet||!t.wallet2))); // Consolidation excluded — same-wallet adjustment
  const total = incomplete.length;
  const isIntro = wizardStep===0;
  const isSummary = total===0 || wizardStep===total+1;
  const currentTx = (!isIntro&&!isSummary) ? incomplete[wizardStep-1] : null;
  // Edits are keyed by transaction id, so a Drive pull landing mid-wizard can't redirect
  // them onto whichever row now sits at that index.
  const edit = currentTx ? (wizardEdits[currentTx.id]||{wallet:currentTx.wallet||'',wallet2:currentTx.wallet2||'',skip:false}) : null;
  // Belt and braces: if anything else mutates the step past the end, land on the summary
  // rather than rendering an empty body with no way to finish.
  React.useEffect(() => { if(wizardStep > total+1) setWizardStep(total+1); }, [wizardStep, total, setWizardStep]);

  const setEdit = (field, val) => {
    if(!currentTx) return;
    const existing = wizardEdits[currentTx.id] || {wallet:currentTx.wallet||'', wallet2:currentTx.wallet2||'', skip:false};
    setWizardEdits(prev => ({...prev, [currentTx.id]: {...existing, [field]: val}}));
  };

  const saveCurrentAndNext = () => {
    // Save the current tx immediately if it has both wallets set
    if(currentTx && edit && !edit.skip && edit.wallet && edit.wallet2) {
      const updated = transactions.map(t => t.id === currentTx.id
        ? {...t, wallet: edit.wallet.trim(), wallet2: edit.wallet2.trim()}
        : t);
      setTransactions(updated);
      save(updated, wallets);
    }
    setWizardStep(s => s+1);
  };

  const applyAll = () => {
    // Apply any remaining unapplied edits (e.g. ones revisited via Back)
    const updated = transactions.map(t => {
      const e = wizardEdits[t.id];
      if(!e || e.skip) return t;
      return {...t, wallet: (e.wallet||t.wallet||'').trim(), wallet2: (e.wallet2||t.wallet2||'').trim()};
    });
    setTransactions(updated);
    save(updated, wallets);
    setShowWizard(false);
    showToast('All transfers saved');
  };

  // Dialog semantics + Tab trap + focus restore. Escape is handled by the hook (node-scoped),
  // so it is removed from the window handler below to avoid firing twice.
  const dialogRef = useModalA11y(() => setShowWizard(false));
  const titleId = React.useMemo(() => 'wizard-title-' + Math.random().toString(36).slice(2,9), []);

  // Arrow/Enter navigation stays window-level — it's a wizard-wide shortcut, not dialog plumbing.
  const handlerRef = React.useRef();
  handlerRef.current = { isIntro, isSummary, wizardStep, applyAll, saveCurrentAndNext };
  React.useEffect(() => {
    const handler = (e) => {
      if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      const { isIntro, isSummary, wizardStep, applyAll, saveCurrentAndNext } = handlerRef.current;
      if(e.key === 'ArrowRight' || e.key === 'Enter') {
        e.preventDefault();
        if(isSummary) applyAll();
        else if(isIntro) setWizardStep(s => s+1);
        else saveCurrentAndNext();
      } else if(e.key === 'ArrowLeft' && wizardStep > 0) {
        e.preventDefault();
        setWizardStep(s => s-1);
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  const doneCount = Object.values(wizardEdits).filter(e=>!e.skip&&e.wallet&&e.wallet2).length;
  const skipCount = Object.values(wizardEdits).filter(e=>e.skip).length;

  return (
          <div className="wizard-overlay" onMouseDown={backdropHandler(()=>setShowWizard(false))}>
            <div
              className="wizard"
              ref={dialogRef}
              role="dialog"
              aria-modal="true"
              aria-labelledby={titleId}
              tabIndex={-1}
              onMouseDown={e=>e.stopPropagation()}
              onClick={e=>e.stopPropagation()}
            >

              {/* Header */}
              <div className="wizard-header">
                <div className="wizard-progress">
                  {[...Array(total+2)].map((_,i)=>(
                    <div key={i} className={`wizard-step-dot ${i<wizardStep?'done':i===wizardStep?'active':''}`}/>
                  ))}
                </div>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                  <div>
                    <div className="wizard-title" id={titleId}>
                      {isIntro ? 'Transfer Wallet Wizard' : isSummary ? 'Review & Apply' : `Transfer ${wizardStep} of ${total}`}
                    </div>
                    <div className="wizard-subtitle">
                      {isIntro ? `${total} transfer${total!==1?'s':''} need wallet assignments` :
                       isSummary ? `${doneCount} fixed · ${skipCount} skipped · ${total-doneCount-skipCount} remaining` :
                       fmtDate(currentTx?.date)+' · '+parseFloat(currentTx?.amount||0).toFixed(8)+' BTC'}
                    </div>
                  </div>
                  <button className="btn-icon" onClick={()=>setShowWizard(false)}>{Icon.X()}</button>
                </div>
              </div>

              {/* Body */}
              <div className="wizard-body">

                {/* INTRO STEP */}
                {isIntro && (
                  <div>
                    <div style={{textAlign:'center',padding:'1rem 0 1.5rem'}}>
                      <div style={{fontSize:'3rem',marginBottom:'1rem'}}>↔️</div>
                      <div style={{fontSize:'1rem',fontWeight:600,marginBottom:'.5rem'}}>Assign wallets to your transfers</div>
                      <div style={{fontSize:'.875rem',color:'var(--text-secondary)',maxWidth:400,margin:'0 auto',lineHeight:1.7}}>
                        Each transfer needs a <strong>From</strong> and <strong>To</strong> wallet to track where your BTC moved. We'll walk through each one so you can assign or skip.
                      </div>
                    </div>
                    <div style={{background:'var(--bg-tertiary)',borderRadius:10,padding:'1rem 1.25rem'}}>
                      {incomplete.slice(0,5).map((tx,i)=>(
                        <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'.375rem 0',borderBottom:i<Math.min(incomplete.length,5)-1?'1px solid var(--border-color)':'none',fontSize:'.8125rem'}}>
                          <span style={{color:'var(--text-secondary)'}}>{fmtDate(tx.date)}</span>
                          <span style={{fontFamily:'JetBrains Mono',color:'var(--bitcoin-orange)',fontWeight:600}}>{parseFloat(tx.amount||0).toFixed(8)} BTC</span>
                          <span style={{color:'#d97706',fontSize:'.75rem',fontWeight:600}}>
                            {!tx.wallet&&!tx.wallet2?'Missing both':!tx.wallet?'Missing From':'Missing To'}
                          </span>
                        </div>
                      ))}
                      {incomplete.length>5 && <div style={{fontSize:'.75rem',color:'var(--text-tertiary)',textAlign:'center',paddingTop:'.5rem'}}>+{incomplete.length-5} more</div>}
                    </div>
                  </div>
                )}

                {/* TX REVIEW STEP */}
                {!isIntro && !isSummary && currentTx && edit && (
                  <div>
                    <div className={`wizard-tx-card ${edit.skip?'skipped':(!edit.wallet||!edit.wallet2)?'needs-fix':'fixed'}`}>
                      <div className="wizard-tx-meta">
                        <span className="wizard-tx-amount">{parseFloat(currentTx.amount||0).toFixed(8)} BTC</span>
                        <span className="wizard-tx-date">{fmtDate(currentTx.date)}</span>
                        {currentTx.fee && <span style={{fontSize:'.75rem',color:'var(--text-tertiary)'}}>fee: {currentTx.fee} BTC</span>}
                      </div>
                      {currentTx.notes && <div className="wizard-tx-notes">"{currentTx.notes}"</div>}
                    </div>

                    {edit.skip ? (
                      <div style={{textAlign:'center',padding:'1rem',color:'var(--text-secondary)',fontSize:'.875rem'}}>
                        This transfer will be skipped.
                        <button className="btn btn-secondary btn-sm" style={{display:'block',margin:'.75rem auto 0'}}
                          onClick={()=>setEdit('skip',false)}>Undo Skip</button>
                      </div>
                    ) : (
                      <div>
                        <div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:".75rem",alignItems:"start"}}>
                          <WizardWalletSelect
                            label="From Wallet"
                            value={edit.wallet}
                            wallets={wallets}
                            onChange={v=>setEdit('wallet',v)}
                          />
                          <div style={{display:"flex",alignItems:"center",justifyContent:"center",paddingTop:"1.375rem",color:"var(--text-tertiary)",fontSize:"1.25rem"}}>→</div>
                          <WizardWalletSelect
                            label="To Wallet"
                            value={edit.wallet2}
                            wallets={wallets}
                            onChange={v=>setEdit('wallet2',v)}
                          />
                        </div>
                        {edit.wallet && edit.wallet2 && (
                          <div style={{marginTop:'1rem',background:'var(--green-light)',borderRadius:8,padding:'.625rem 1rem',fontSize:'.8125rem',color:'var(--green)',fontWeight:600,display:'flex',alignItems:'center',gap:'.5rem'}}>
                            ✓ Ready: {edit.wallet} → {edit.wallet2}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                )}

                {/* SUMMARY STEP */}
                {isSummary && (
                  <div>
                    <div style={{marginBottom:'1.25rem'}}>
                      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'.75rem',marginBottom:'1.25rem'}}>
                        {[
                          ['Ready to apply',doneCount,'var(--green)'],
                          ['Skipped',skipCount,'var(--text-secondary)'],
                          ['Still incomplete',total-doneCount-skipCount,'#d97706'],
                        ].map(([label,val,color])=>(
                          <div key={label} style={{background:'var(--bg-tertiary)',borderRadius:10,padding:'.875rem',textAlign:'center'}}>
                            <div style={{fontSize:'1.5rem',fontWeight:700,fontFamily:'JetBrains Mono',color}}>{val}</div>
                            <div style={{fontSize:'.75rem',color:'var(--text-secondary)',marginTop:'.25rem'}}>{label}</div>
                          </div>
                        ))}
                      </div>
                      {Object.entries(wizardEdits).filter(([,e])=>!e.skip&&e.wallet&&e.wallet2).map(([txId,e])=>{
                        const tx = incomplete.find(t => t.id === txId);
                        return (
                          <div key={txId} className="wizard-summary-row">
                            <span style={{color:'var(--text-secondary)',fontSize:'.8125rem'}}>{fmtDate(tx?.date)}</span>
                            <span style={{fontFamily:'JetBrains Mono',fontSize:'.8125rem',color:'var(--bitcoin-orange)'}}>{numOr(tx?.amount).toFixed(8)}</span>
                            <span style={{fontSize:'.8125rem',fontWeight:500}}>{e.wallet} → {e.wallet2}</span>
                            <span style={{color:'var(--green)',fontSize:'.8125rem'}}>✓</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>

              {/* Footer */}
              <div className="wizard-footer">
                <div style={{display:'flex',alignItems:'center',gap:'.75rem'}}>
                  {!isIntro && !isSummary && (
                    <button className="btn btn-secondary btn-sm" onClick={()=>setEdit('skip',!edit?.skip)}>
                      {edit?.skip ? 'Undo Skip' : 'Skip for Now'}
                    </button>
                  )}
                  <span style={{fontSize:'.6875rem',color:'var(--text-tertiary)',whiteSpace:'nowrap'}} className="desktop-only">← → to navigate · Esc to close</span>
                </div>
                <div style={{display:'flex',gap:'.625rem'}}>
                  {wizardStep>0 && (
                    <button className="btn btn-secondary" onClick={()=>setWizardStep(s=>s-1)}>← Back</button>
                  )}
                  {!isSummary && (
                    <button
                      className="btn btn-primary"
                      onClick={isIntro ? ()=>setWizardStep(s=>s+1) : saveCurrentAndNext}
                    >
                      {isIntro ? 'Start →' : wizardStep===total ? 'Review →' : 'Next →'}
                    </button>
                  )}
                  {isSummary && (
                    <button className="btn btn-primary" onClick={applyAll}>
                      Done
                    </button>
                  )}
                </div>
              </div>

            </div>
          </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App/></ErrorBoundary>
);
// Tells the boot watchdog in the head script that React got this far, so it stops waiting.
window.__satBooted = true;
</script>
</body>
</html>
