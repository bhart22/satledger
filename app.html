        // Both true means a genuine two-sided conflict, which is the one case that must not be
        // resolved silently — timestamps alone can't decide it, because each device stamps its
        // own clock and a fast clock would win forever.
        const localDirty = !!localStorage.getItem('btc-pending-push');
        const seenMtime = localStorage.getItem('btc-drive-seen-mtime') || '';
        const remoteMoved = !!(remote._driveModifiedTime && seenMtime && remote._driveModifiedTime !== seenMtime);

        // With no recorded revision (first connection, or a cleared marker) we can't tell
        // whether Drive moved, so an unpushed local change against it must be asked about.
        const remoteMaybeMoved = remoteMoved || !seenMtime;
        const alreadyLanded = remoteMod === localMod;

        // The conflict check comes before the empty-side shortcuts: a deliberate local
        // "Reset all data" made while disconnected is dirty-and-empty, and used to be
        // silently undone by the "fresh device" pull below.
        if(localDirty && remoteMaybeMoved && !alreadyLanded && (localHasData || remoteHasData)) {
          resolveSyncConflict(remote);
          return; // the dialog owns syncState from here
        } else if(localIsEmpty && !remoteIsEmpty) {
          // Fresh device — always pull remote data down. No snapshot needed: there is
          // nothing local to lose.
          applyRemotePayload(remote);
          showToast(`Restored ${remoteTxCount} transactions from Google Drive`);
        } else if(!localIsEmpty && remoteIsEmpty) {
          // Remote is empty, local has data — push up
          await pushLocalToDrive('Backed up to Google Drive');
        } else if(localDirty && !alreadyLanded) {
          // Unpushed edit, Drive unchanged since we last saw it. Checked before the stamps,
          // which come from each device's own clock.
          await pushLocalToDrive(`Synced to Google Drive — ${localTxCount} transactions`);
        } else if(remoteMod > localMod) {
          // Remote is newer — pull, keeping a local snapshot in case this overwrites unsynced work
          applyRemotePayload(remote, { stash: true });
          showToast(`Updated from Google Drive — ${remoteTxCount} transactions`);
        } else {
          // Local is newer or same — sync up
          await pushLocalToDrive(localTxCount === remoteTxCount ? 'Connected — everything is up to date' : `Synced to Google Drive — ${localTxCount} transactions`);
        }
      } else if(localHasData) {
        // No remote file at all, push local data
        await pushLocalToDrive('Backed up to Google Drive');
      } else {
        showToast('Connected — ready to sync');
      }
      setSyncState('synced');
      setLastSync(new Date());
    } catch(e) {
      console.error('Sign-in error:', e);
      setSyncState('error');
      localStorage.removeItem('btc-sync-enabled');
      // drive_unreachable: Drive answered with an error, so nothing was compared or written.
      showToast(e && e.code === 'drive_unreachable'
        ? `Couldn't reach Google Drive (${e.status}). Nothing was changed — try again shortly.`
        : e && e.type === 'popup_failed_to_open'
          ? 'The Google sign-in window was blocked. Click Sign in again.'
          : 'Sign-in failed');
    }
  }, [transactions, wallets, vault, applyRemotePayload, pushLocalToDrive, resolveSyncConflict]);

  const handleSignOut = useCallback(() => {
    GDriveSync.signOut();
    lockVault();
    setSyncState('disconnected');
    setSyncUser(null);
    setLastSync(null);
    localStorage.removeItem('btc-sync-enabled');
    localStorage.removeItem('btc-sync-user');
    showToast('Disconnected from Google Drive');
  }, [lockVault]);

  // Auto-reconnect on mount if previously signed in
  useEffect(() => {
    if(syncInitialized.current) return;
    syncInitialized.current = true;
    const wasEnabled = localStorage.getItem('btc-sync-enabled');
    const savedUser = localStorage.getItem('btc-sync-user');
    if(savedUser) { try { setSyncUser(JSON.parse(savedUser)); } catch {} }
    if(wasEnabled) {
      (async () => {
        try {
          const ready = await GDriveSync.init();
          if(!ready) { setSyncState('disconnected'); return; }
          // The token lives in sessionStorage, so it is ALWAYS absent on a fresh launch — new
          // tab, PWA relaunch, or a different device. Gating the pull on isTokenValid() alone
          // therefore meant the automatic "pull first on reconnect" never once ran: the app
          // booted on stale localStorage, reported disconnected, and the next edit pushed that
          // stale state over whatever the other device had written. Try the silent grant first
          // and only fall back to disconnected if Google actually refuses.
          let haveToken = GDriveSync.isTokenValid();
          if(!haveToken) {
            try { await GDriveSync.requestToken(false); haveToken = GDriveSync.isTokenValid(); }
            catch(e) { dlog('[GDrive] silent token refresh declined:', e); haveToken = false; }
          }
          if(haveToken) {
            setSyncState('syncing');
            const remote = await GDriveSync.pull();
            const localDirty = !!localStorage.getItem('btc-pending-push');
            if(remote && remote.lastModified) {
              const localMod = localStorage.getItem('btc-last-modified') || '0';
              const seenMtime = localStorage.getItem('btc-drive-seen-mtime') || '';
              const remoteMoved = !!(remote._driveModifiedTime && seenMtime && remote._driveModifiedTime !== seenMtime);
              // Our own last push may have landed without us seeing the response (keepalive on
              // page-hide). Same stamp on both sides means there is nothing to reconcile.
              const alreadyLanded = remote.lastModified === localMod;
              if(alreadyLanded && localDirty) {
                pendingPushRef.current = null;
                localStorage.removeItem('btc-pending-push');
                if(remote._driveModifiedTime) safeSetItem('btc-drive-seen-mtime', remote._driveModifiedTime);
              } else if(localDirty && (remoteMoved || !seenMtime)) {
                // Two-sided conflict — ask, don't guess. With no recorded revision we can't
                // tell whether Drive moved, so that counts as a conflict too. Bail out before
                // touching syncState so the dialog owns it.
                resolveSyncConflict(remote);
                return;
              } else if(localDirty) {
                // An edit that never reached Drive, and Drive hasn't moved since we last saw
                // it — send it. This must come BEFORE the stamp comparison: stamps come from
                // each device's own clock, so a fast-clocked device's older data could
                // otherwise "win" and silently overwrite the edit.
                await pushLocalToDrive(null);
              } else if(remote.lastModified > localMod) {
                applyRemotePayload(remote, { stash: true });
              }
            } else if(!remote && localDirty) {
              // The Drive file is gone (deleted, or never created). Nothing remote to lose.
              await pushLocalToDrive(null);
            }
            setSyncState('synced');
            setLastSync(new Date());
          } else {
            // No grant available without user interaction — the sign-in button is the way back.
            setSyncState('disconnected');
          }
        } catch(e) {
          console.error('Auto-reconnect failed:', e);
          setSyncState('disconnected');
        }
      })();
    }
  }, []);

  function showToast(msg, dur=3000) {
    if(toastTimer.current) clearTimeout(toastTimer.current);
    setToast(msg);
    toastTimer.current = setTimeout(() => { setToast(null); toastTimer.current = null; }, dur);
  }

  const handleCreateVault = async () => {
    setVaultError('');
    if(!hasVaultContent(vaultDraft)) { setVaultError('Add at least one vault section before saving.'); return; }
    if(!vaultSetupPassphrase || vaultSetupPassphrase.length < VAULT_MIN_PASSPHRASE_LENGTH) { setVaultError(`Use a vault passphrase with at least ${VAULT_MIN_PASSPHRASE_LENGTH} characters.`); return; }
    if(vaultSetupPassphrase !== vaultSetupConfirm) { setVaultError('Vault passphrases do not match.'); return; }
    setVaultBusy(true);
    try {
      const encryptedVault = await encryptVaultDraft(vaultDraft, vaultSetupPassphrase);
      setVault(encryptedVault);
      vaultPassphraseRef.current = vaultSetupPassphrase;
      setVaultUnlocked(true);
      setVaultSetupPassphrase('');
      setVaultSetupConfirm('');
      save(transactions, wallets, { vault: encryptedVault });
      showToast('Vault created and encrypted');
    } catch(e) {
      console.error('Vault create failed:', e);
      setVaultError('Could not create the vault.');
    } finally {
      setVaultBusy(false);
    }
  };

  const handleUnlockVault = async (emergency=false) => {
    if(!vault) return;
    setVaultError('');
    if(!vaultPassphraseInput) { setVaultError('Enter your vault passphrase to continue.'); return; }
    setVaultBusy(true);
    try {
      const decrypted = await decryptVaultData(vault, vaultPassphraseInput);
      vaultPassphraseRef.current = vaultPassphraseInput;
      setVaultDraft(decrypted);
      setVaultUnlocked(true);
      setVaultEmergencyMode(emergency);
      setVaultPassphraseInput('');
      showToast(emergency ? 'Emergency mode unlocked' : 'Vault unlocked');
    } catch(e) {
      console.error('Vault unlock failed:', e);
      setVaultError('Incorrect passphrase or corrupted vault data.');
    } finally {
      setVaultBusy(false);
    }
  };

  const handleSaveVault = async () => {
    setVaultError('');
    if(!vaultUnlocked || !vaultPassphraseRef.current) { setVaultError('Unlock the vault before saving.'); return; }
    if(!hasVaultContent(vaultDraft)) { setVaultError('Add at least one vault section before saving.'); return; }
    setVaultBusy(true);
    try {
      const encryptedVault = await encryptVaultDraft(vaultDraft, vaultPassphraseRef.current, vault);
      setVault(encryptedVault);
      save(transactions, wallets, { vault: encryptedVault });
      showToast('Vault saved');
    } catch(e) {
      console.error('Vault save failed:', e);
      setVaultError('Could not save the vault.');
    } finally {
      setVaultBusy(false);
    }
  };

  // The recovery snapshot keeps its own copy of the vault. Left alone, a passphrase change
  // (often made BECAUSE the old one leaked) still left ciphertext under the old passphrase on
  // this device, and Restore Snapshot brought a deleted vault back.
  const replaceSnapshotVault = (nextVault) => {
    try {
      const raw = localStorage.getItem('btc-presync-backup');
      if(!raw) return;
      const snap = JSON.parse(raw);
      if(!snap || typeof snap !== 'object' || !Object.prototype.hasOwnProperty.call(snap, 'vault')) return;
      snap.vault = nextVault;
      safeSetItem('btc-presync-backup', JSON.stringify(snap));
      setSnapshotNonce(n => n+1);
    } catch {}
  };
  const handleChangeVaultPassphrase = async () => {
    setVaultError('');
    if(!vaultUnlocked || !vaultPassphraseRef.current) { setVaultError('Unlock the vault before changing the passphrase.'); return; }
    if(!vaultNewPassphrase || vaultNewPassphrase.length < VAULT_MIN_PASSPHRASE_LENGTH) { setVaultError(`Use a new passphrase with at least ${VAULT_MIN_PASSPHRASE_LENGTH} characters.`); return; }
    if(vaultNewPassphrase !== vaultNewPassphraseConfirm) { setVaultError('New vault passphrases do not match.'); return; }
    setVaultBusy(true);
    try {
      const encryptedVault = await encryptVaultDraft(vaultDraft, vaultNewPassphrase, vault);
      setVault(encryptedVault);
      vaultPassphraseRef.current = vaultNewPassphrase;
      setVaultNewPassphrase('');
      setVaultNewPassphraseConfirm('');
      save(transactionsRef.current, walletsRef.current, { vault: encryptedVault });
      replaceSnapshotVault(encryptedVault);
      showToast("Vault passphrase updated. Older backup files and Drive's revision history still open with the old passphrase.", 9000);
    } catch(e) {
      console.error('Vault passphrase update failed:', e);
      setVaultError('Could not change the vault passphrase.');
    } finally {
      setVaultBusy(false);
    }
  };

  const handleDeleteVault = () => {
    setConfirmDialog({
      title: 'Delete Vault',
      message: "Delete the encrypted vault permanently? It is removed from this device, the recovery snapshot and the current Google Drive copy. Backup files you exported earlier, and Google Drive's revision history (kept about 30 days), still contain the encrypted vault.",
      confirmLabel: 'Delete Vault',
      danger: true,
      onConfirm: () => {
        setVault(null);
        localStorage.removeItem(VAULT_STORAGE_KEY);
        lockVault();
        save(transactionsRef.current, walletsRef.current, { vault: null });
        replaceSnapshotVault(null);
        setConfirmDialog(null);
        showToast('Vault deleted');
      },
    });
  };

  // ─── Wallet holdings ─────────────────────────────────────────────────────
  const walletHoldings = useMemo(() => {
    const h = Object.create(null); // wallet names are user text — '__proto__' must be just a name
    transactions.forEach(tx => {
      const amt = parseFloat(tx.amount)||0;
      const fee = parseFloat(tx.fee)||0;
      // A Transfer with no source wallet is an inflow from outside (e.g. an unpaired
      // CoinLedger Deposit), so only the side that is named moves.
      const add = (w, delta) => { if(!w) return; h[w] = (h[w]||0) + delta; };
      if(tx.type==='Buy'||tx.type==='Reward') add(tx.wallet, amt);
      else if(tx.type==='Sell') add(tx.wallet, -amt);
      else if(tx.type==='Transfer') { add(tx.wallet, -(amt+fee)); add(tx.wallet2, amt); }
      else if(tx.type==='Consolidation') add(tx.wallet, -fee);
    });
    return h;
  }, [transactions]);

  // ─── Running per-wallet balance after each transaction ───────────────────
  // tx id → { walletName: satsAfterThatTransaction }. Built from ALL transactions in
  // chronological order — the exact reverse of the list's own sort — so the figure a row
  // shows is its true balance at that point in history and never shifts when a filter,
  // search or page changes. Type semantics mirror walletHoldings above; keep the two in step.
  //
  // Accumulated in whole satoshis, not floats: summing hundreds of 0.0000xxxx rewards leaves
  // residue in the low decimals, and a column whose whole job is making a mistyped reward
  // obvious can't afford to invent digit-level noise of its own.
  const runningBalances = useMemo(() => {
    const chrono = transactions
      .map((tx, i) => ({ tx, i }))
      .sort((a, b) => a.tx.date.localeCompare(b.tx.date) || a.i - b.i);
    const toSats = v => Math.round(numOr(v) * 1e8);
    const bal = Object.create(null);
    const out = {};
    chrono.forEach(({ tx }) => {
      const amt = toSats(tx.amount), fee = toSats(tx.fee);
      const w1 = tx.wallet, w2 = tx.wallet2;
      const add = (w, delta) => { if(!w) return; bal[w] = (bal[w]||0) + delta; };
      if(tx.type==='Buy'||tx.type==='Reward') add(w1, amt);
      else if(tx.type==='Sell') add(w1, -amt);
      else if(tx.type==='Transfer') { add(w1, -(amt + fee)); add(w2, amt); }
      else if(tx.type==='Consolidation') add(w1, -fee);
      // Both sides of a transfer are recorded so the column can follow whichever wallet the
      // user is filtering on, rather than always reporting the source.
      const after = Object.create(null);
      if(w1) after[w1] = bal[w1] || 0;
      if(w2 && tx.type==='Transfer') after[w2] = bal[w2];
      if(Object.keys(after).length) out[tx.id] = after;
    });
    return out;
  }, [transactions]);

  // Total holdings = only ACTIVE wallets (archived wallets hidden from dashboard)
  const trackedHoldings = useMemo(() => {
    const walletSet = new Set(activeWallets.map(w => w.name));
    return Object.entries(walletHoldings)
      .filter(([name]) => walletSet.has(name))
      .reduce((sum, [, bal]) => sum + bal, 0);
  }, [walletHoldings, activeWallets]);
  const dashboardTrackedHoldings = useMemo(() => {
    if(!hasDashboardWalletFilter) return trackedHoldings;
    return Object.entries(walletHoldings)
      .filter(([name]) => selectedDashboardWalletSet.has(name))
      .reduce((sum, [, bal]) => sum + bal, 0);
  }, [walletHoldings, trackedHoldings, hasDashboardWalletFilter, selectedDashboardWalletSet]);

  // Wallet names referenced by transactions but not registered as wallets — from a typo, a
  // deleted wallet, or an import. Their BTC silently vanishes from Holdings, so surface it.
  // Compared against ALL wallets: archived ones are excluded from Holdings but still known.
  const unknownWalletNames = useMemo(() => {
    const known = new Set(wallets.map(w => String(w.name||'').trim()).filter(Boolean));
    const counts = {};
    transactions.forEach(tx => {
      [tx.wallet, tx.wallet2].forEach(name => {
        const n = String(name||'').trim();
        if(!n || known.has(n)) return;
        counts[n] = (counts[n]||0) + 1;
      });
    });
    return Object.entries(counts).sort((a,b) => b[1]-a[1]);
  }, [transactions, wallets]);

  // ─── Stats (ALL transactions, not filtered by registered wallets) ────────
  const stats = useMemo(() => {
    let totalBought=0, totalSold=0, totalFeesBTC=0, costBasis=0, runningBTC=0, rewardsIncome=0;
    // Sort by date to process sells in chronological order for proportional cost reduction
    const sorted = [...transactions].filter(tx => !tx.excludeStats)
      .map(tx => ({ ...tx, _nd: normalizeDate(tx.date) }))
      .filter(tx => tx._nd)
      .sort((a,b) => a._nd.localeCompare(b._nd));
    sorted.forEach(tx => {
      const amt = parseFloat(tx.amount)||0;
      const price = parseFloat(tx.price)||0;
      const fee = parseFloat(tx.fee)||0;
      if(tx.type==='Buy') {
        totalBought+=amt; runningBTC+=amt;
        costBasis+=(numOr(tx.totalUsd, amt*price))+fee;
      } else if(tx.type==='Sell') {
        totalSold+=amt;
        const r = sellFromCostPool(runningBTC, costBasis, amt, 0);
        costBasis = r.poolCost; runningBTC = r.poolBtc;
      } else if(tx.type==='Transfer' || tx.type==='Consolidation') {
        totalFeesBTC+=fee; runningBTC = Math.max(0, runningBTC - fee);
      }
      else if(tx.type==='Reward') { totalBought+=amt; runningBTC+=amt; rewardsIncome+=amt; }
    });
    // Use trackedHoldings (wallet-based) for market value — it correctly handles transfers
    const currentValue = trackedHoldings * (btcPrice||0);
    const unrealized = currentValue - costBasis;
    return { totalBought, totalSold, totalFeesBTC, costBasis, rewardsIncome, currentValue, unrealized };
  }, [transactions, btcPrice, trackedHoldings]);

  // ─── Filtered transactions ────────────────────────────────────────────────
  const filtered = useMemo(() => {
    // Insertion order, used as the same-day tie-break below.
    const order = new Map(transactions.map((tx, i) => [tx, i]));
    return transactions.filter(tx => {
      if(filterType!=='All' && tx.type!==filterType) return false;
      if(filterWallet!=='All' && tx.wallet!==filterWallet && tx.wallet2!==filterWallet) return false;
      if(filterYear!=='All' && !tx.date.startsWith(filterYear)) return false;
      if(filterDateFrom && tx.date < filterDateFrom) return false;
      if(filterDateTo && tx.date > filterDateTo) return false;
      if(search) {
        const q = search.toLowerCase();
        // String() on every field: rows are sanitized on load, but one bad value here used to
        // take the whole app down to the error screen.
        const has = v => v != null && String(v).toLowerCase().includes(q);
        if(!( has(tx.wallet) || has(tx.wallet2) || has(tx.notes) || has(tx.txhash) ||
              has(tx.type) || has(tx.amount) )) return false;
      }
      return true;
    // Newest first. Date alone left same-day rows in insertion order, so each day's block
    // read oldest-first inside an otherwise newest-first list — the most recently added
    // transaction sank to the bottom of its day. Reverse the insertion order on ties so the
    // whole list reads consistently newest → oldest.
    }).sort((a,b)=> b.date.localeCompare(a.date) || order.get(b) - order.get(a));
  }, [transactions, filterType, filterWallet, filterYear, filterDateFrom, filterDateTo, search]);

  const years = useMemo(() => [...new Set(transactions.map(t=>t.date.slice(0,4)))].sort().reverse(), [transactions]);
  const walletNames = useMemo(() => [...new Set(transactions.flatMap(t=>[t.wallet,t.wallet2].filter(Boolean)))].sort(), [transactions]);

  // Which wallet's running balance a row shows: the one being filtered on when a filter is
  // active (so a transfer INTO that wallet reports its side, not the source's), otherwise the
  // row's own From Wallet. Rows with no wallet have no balance to report.
  const balanceFor = tx => {
    const after = runningBalances[tx.id];
    if(!after) return null;
    const name = (filterWallet!=='All' && after[filterWallet]!==undefined) ? filterWallet : tx.wallet;
    if(!name || after[name]===undefined) return null;
    return { wallet: name, btc: after[name]/1e8, negative: after[name] < 0 };
  };

  const paged = filtered.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);
  const totalPages = Math.max(1, Math.ceil(filtered.length/PAGE_SIZE));

  // ─── CRUD ─────────────────────────────────────────────────────────────────
  const handleSubmit = () => {
    const date = normalizeDate(form.date);
    if(!date) { showToast('A valid date is required'); return; }
    // Almost always a mistyped year, and it would sort above everything and skew every chart
    if(date > todayLocal()) { showToast('The date is in the future — check the year'); return; }
    // Parse once into finite numbers. The old truthiness checks let "0" and "-1" through
    // (both are truthy strings), so a zero amount produced price "Infinity" in storage and
    // poisoned cost basis from then on.
    const isConsolidation = form.type==='Consolidation';
    const rawAmount = String(form.amount??'').trim();
    const amt = rawAmount === '' ? null : parseFloat(rawAmount);
    if(rawAmount !== '' && !Number.isFinite(amt)) { showToast('Amount is not a valid number'); return; }
    if(!isConsolidation && !(Number.isFinite(amt) && amt > 0)) { showToast('Amount must be greater than zero'); return; }
    if(isConsolidation && amt !== null && amt < 0) { showToast('Amount cannot be negative'); return; }
    const parseOptional = (raw, label) => {
      const s = String(raw??'').trim();
      if(s === '') return null;
      const n = parseFloat(s);
      if(!Number.isFinite(n)) { showToast(`${label} is not a valid number`); return undefined; }
      if(n < 0) { showToast(`${label} cannot be negative`); return undefined; }
      return n;
    };
    const feeN = parseOptional(form.fee, 'Fee');       if(feeN === undefined) return;
    const priceN = parseOptional(form.price, 'Price'); if(priceN === undefined) return;
    const usdN = parseOptional(form.totalUsd, 'Total USD'); if(usdN === undefined) return;
    if((form.type==='Buy'||form.type==='Sell') && priceN === null && usdN === null) {
      showToast('Price or Total USD is required for Buy/Sell'); return;
    }

    const finalForm = {
      ...form,
      date,
      // Trim wallet names — a trailing space creates an invisible phantom wallet whose
      // balance never shows up under the real one.
      wallet: String(form.wallet||'').trim(),
      wallet2: String(form.wallet2||'').trim(),
    };
    // Wallet rules. Holdings skip a row with no wallet, so it silently counted toward stats but
    // no balance; a Transfer to itself only burns the fee. Enforced for new rows; an edit to an
    // imported, still-incomplete transfer is left to the Fix Transfers wizard.
    if(editId === null) {
      if(!finalForm.wallet) { showToast('Choose a wallet'); return; }
      if(finalForm.type==='Transfer' && !finalForm.wallet2) { showToast('Choose the wallet this transfer goes to'); return; }
    }
    if(finalForm.type==='Transfer' && finalForm.wallet && finalForm.wallet === finalForm.wallet2) {
      showToast('A transfer needs two different wallets — use Consolidation for a fee-only move within one wallet'); return;
    }
    // Derive price only when the division is actually safe
    if((finalForm.type==='Buy'||finalForm.type==='Sell') && usdN !== null && priceN === null && Number.isFinite(amt) && amt > 0) {
      finalForm.price = (usdN/amt).toFixed(2);
    }
    // Read the live lists, not this render's: commitTransaction can run from the "Save Anyway"
    // confirm, after a Drive pull or another tab has replaced them — and saving this render's
    // copy would silently revert that update.
    const commitTransaction = () => {
      const txs = transactionsRef.current, wals = walletsRef.current;
      if(editId!==null) {
        // Look up by id, not index: a Drive pull resolving while the modal was open used to
        // land this edit on whichever row happened to occupy that index.
        const i = txs.findIndex(t => t.id === editId);
        if(i === -1) {
          showToast('That transaction no longer exists — it may have changed on another device.');
          setShowModal(false); setEditId(null); setForm(emptyForm());
          return;
        }
        const u=[...txs]; u[i]={...finalForm, id: editId}; setTransactions(u); save(u, wals);
        showToast('Transaction updated');
      } else {
        const added=[...txs, {...finalForm, id: newTxId()}]; setTransactions(added); save(added, wals);
        showToast('Transaction added');
      }
      setShowModal(false); setEditId(null); setForm(emptyForm());
    };
    // Confirm before saving a BTC outflow that would leave the wallet negative
    let balanceAfter = null;
    if(finalForm.type==='Sell' || finalForm.type==='Transfer' || finalForm.type==='Consolidation') {
      const amt = parseFloat(finalForm.amount)||0;
      const fee = (finalForm.type==='Transfer' || finalForm.type==='Consolidation') ? (parseFloat(finalForm.fee)||0) : 0;
      const walletBal = walletHoldings[finalForm.wallet] || 0;
      // If editing, take the old transaction's effect on THIS wallet back out. It used to add
      // back the old outflow unconditionally — so moving "Sell 1 from A" to wallet B credited
      // B with A's coin, and B could be driven negative with no warning.
      const old = editId!==null ? transactionsRef.current.find(t => t.id === editId) : null;
      const adjustment = old ? -txEffectOnWallet(old, finalForm.wallet) : 0;
      balanceAfter = finalForm.type==='Consolidation'
        ? walletBal + adjustment - fee
        : walletBal + adjustment - amt - fee;
    }
    if(balanceAfter!==null && balanceAfter < -0.000000005) {
      setConfirmDialog({
        title: 'Negative Wallet Balance',
        message: `This ${finalForm.type} would leave ${finalForm.wallet} at ${fmtBTC(balanceAfter)} ${btcUnit()}. The amount may be larger than the wallet holds, or an earlier transaction may be missing. Save it anyway?`,
        confirmLabel: 'Save Anyway',
        danger: true,
        onConfirm: () => { commitTransaction(); setConfirmDialog(null); },
      });
      return;
    }
    commitTransaction();
  };

  // Closing the transaction modal used to silently throw away a half-filled form — including
  // via a stray backdrop click. Confirm first, but only when there's actually something to lose.
  const TX_FORM_FIELDS = ['date','type','wallet','wallet2','amount','price','fee','totalUsd','notes','txhash'];
  const isTxFormDirty = () => {
    if(editId !== null) {
      const orig = transactions.find(t => t.id === editId);
      if(!orig) return false;
      return TX_FORM_FIELDS.some(k => String(form[k] ?? '') !== String(orig[k] ?? ''))
        || !!form.excludeStats !== !!orig.excludeStats;
    }
    const blank = emptyForm();
    return TX_FORM_FIELDS.some(k => String(form[k] ?? '') !== String(blank[k] ?? ''))
      || !!form.excludeStats !== !!blank.excludeStats;
  };
  const closeTxModal = () => { setShowModal(false); setEditId(null); };
  const requestCloseTxModal = () => {
    if(!isTxFormDirty()) { closeTxModal(); return; }
    setConfirmDialog({
      title: 'Discard changes?',
      message: 'This transaction has unsaved changes. Close the form and discard them?',
      confirmLabel: 'Discard',
      danger: true,
      confirmIcon: false,
      onConfirm: () => { closeTxModal(); setConfirmDialog(null); },
    });
  };

  const handleEdit = tx => {
    const amtN = numOr(tx.amount, null), priceN = numOr(tx.price, null);
    const totalUsd = tx.totalUsd || ((amtN !== null && priceN !== null) ? (amtN*priceN).toFixed(2) : '');
    setForm({...tx, totalUsd});
    setEditId(tx.id ?? null);
    setShowModal(true);
  };
  const handleDelete = tx => {
    setConfirmDialog({
      title: 'Delete Transaction',
      message: `Delete the ${tx.type} of ${fmtBTC(tx.amount)} ${btcUnit()} on ${fmtDate(tx.date)}? This cannot be undone — consider exporting a backup first.`,
      confirmLabel: 'Delete',
      danger: true,
      onConfirm: () => {
        // Live refs: the dialog may have sat open across a Drive pull. Checking this render's
        // array could never catch that, and saving it would revert the pull.
        const current = transactionsRef.current;
        const filtered = current.filter(t => t.id !== tx.id);
        if(filtered.length === current.length) {
          showToast('That transaction no longer exists — it may have changed on another device.');
          setConfirmDialog(null);
          return;
        }
        setTransactions(filtered); save(filtered, walletsRef.current); showToast('Deleted'); setConfirmDialog(null);
      },
    });
  };

  // Wallet edits, matched by id (name for legacy rows without one) against the LIVE list.
  // The buttons used to splice by render-time index into render-time arrays, so a list that
  // changed underneath — a Drive pull, another tab, a confirm left open — had the edit land
  // on the wrong wallet or revert the update.
  const sameWallet = (a, b) => (a?.id && b?.id) ? a.id === b.id : String(a?.name||'') === String(b?.name||'');
  const patchWallet = (target, patch) => {
    const nw = walletsRef.current.map(w => sameWallet(w, target) ? {...w, ...patch} : w);
    setWallets(nw); save(transactionsRef.current, nw);
  };
  const removeWallet = (target) => {
    const nw = walletsRef.current.filter(w => !sameWallet(w, target));
    setWallets(nw); save(transactionsRef.current, nw);
  };

  const handleWalletSubmit = (e) => {
    e.preventDefault();
    // Trim matters on its own: "Ledger " and "Ledger" are two silently-separate balance keys.
    const name = String(walletForm.name||'').trim();
    if(!name) { showToast('Wallet name is required'); return; }
    // Live lists, and the edited wallet matched by id: the modal can stay open across a Drive
    // pull, and a stored index would then point at a different wallet.
    const wals = walletsRef.current, txs = transactionsRef.current;
    const editIdx = editWalletTarget !== null ? wals.findIndex(w => sameWallet(w, editWalletTarget)) : -1;
    if(editWalletTarget !== null && editIdx === -1) {
      showToast('That wallet no longer exists — it may have changed on another device.');
      setShowWalletModal(false); setEditWalletTarget(null); return;
    }
    const collides = wals.some((w,i) => i!==editIdx && String(w.name||'').trim().toLowerCase() === name.toLowerCase());
    if(collides) { showToast(`A wallet named "${name}" already exists`); return; }
    const cleanForm = {...walletForm, name, address: String(walletForm.address||'').trim()};

    if(editWalletTarget!==null) {
      const oldName = String(wals[editIdx]?.name||'');
      const u=[...wals]; u[editIdx]={...u[editIdx],...cleanForm};
      // Cascade the rename through every transaction that references the old name, or the
      // wallet's entire balance is orphaned.
      const affected = oldName !== name ? countWalletReferences(txs, oldName) : 0;
      const nextTxs = renameWalletInTransactions(txs, oldName, name);
      setWallets(u);
      if(nextTxs !== txs) setTransactions(nextTxs);
      // save() FIRST — it writes localStorage synchronously, and updateSettings' debounced
      // push reads transactions back out of localStorage. Both share syncDebounce, so the
      // later call wins; reversing this order would push pre-rename transactions.
      save(nextTxs, u);
      // dashboardWalletFilter stores wallet NAMES, so it needs the rename too or the
      // dashboard filter silently drops the wallet.
      const filter = settings.dashboardWalletFilter;
      if(oldName !== name && Array.isArray(filter) && filter.includes(oldName)) {
        updateSettings({ dashboardWalletFilter: filter.map(n => n===oldName ? name : n) });
      }
      if(affected) showToast(`Wallet renamed — updated ${affected} transaction${affected===1?'':'s'}`);
    } else {
      const nw=[...wals,{id:'w'+Date.now(),...cleanForm}]; setWallets(nw); save(txs, nw);
    }
    setShowWalletModal(false); setEditWalletTarget(null); setWalletForm({name:'',type:'Exchange',address:''});
  };

  // ─── Export CoinLedger CSV ────────────────────────────────────────────────
  // Wallets tracked via external API (e.g. Coinbase) — skip Withdrawal row for these,
  // only emit the Deposit on the receiving side. Configurable in Settings.
  const exportCSV = (yearFilter) => {
    const headers = ['Date (UTC)','Platform (Optional)','Asset Sent','Amount Sent','Asset Received','Amount Received','Fee Currency (Optional)','Fee Amount (Optional)','Type','Description (Optional)','TxHash (Optional)'];
    const src = [...(yearFilter ? transactions.filter(t=>t.date.startsWith(yearFilter)) : transactions)];
    const fmtNum = v => v ? parseFloat(v).toFixed(8).replace(/\.?0+$/,'') : '';
    const rows = [];

    src.sort((a,b)=>a.date.localeCompare(b.date)).forEach(tx => {
      const amt = tx.amount||''; const fee = tx.fee||'';
      // Normalised, so the one column the formula guard below skips can only ever hold a
      // date: rows synced from Drive aren't date-checked on the way in.
      const day = normalizeDate(tx.date);
      if(!day) return;
      const dateStr = day+' 00:00:00';

      if(tx.type==='Buy') {
        const usd = numOr(tx.totalUsd, numOr(amt)*numOr(tx.price)).toFixed(2);
        rows.push([dateStr, tx.wallet||'', 'USD', usd, 'BTC', fmtNum(amt),
          fee ? 'USD' : '', fee ? parseFloat(fee).toFixed(2) : '',
          'Trade', tx.notes||'', tx.txhash||'']);

      } else if(tx.type==='Sell') {
        const usd = numOr(tx.totalUsd, numOr(amt)*numOr(tx.price)).toFixed(2);
        rows.push([dateStr, tx.wallet||'', 'BTC', fmtNum(amt), 'USD', usd,
          fee ? 'USD' : '', fee ? parseFloat(fee).toFixed(2) : '',
          'Trade', tx.notes||'', tx.txhash||'']);

      } else if(tx.type==='Transfer') {
        // Withdrawal row
        rows.push([dateStr, tx.wallet||'', 'BTC', fmtNum(amt), '', '',
          fee ? 'BTC' : '', fee ? fmtNum(fee) : '',
          'Withdrawal', tx.notes||`Transfer to ${tx.wallet2||'wallet'}`, tx.txhash||'']);
        // Deposit row
        if(tx.wallet2) {
          rows.push([dateStr, tx.wallet2, '', '', 'BTC', fmtNum(amt),
            '', '',
            'Deposit', `Transfer from ${tx.wallet||'wallet'}`, tx.txhash||'']);
        }
      } else if(tx.type==='Consolidation') {
        if(fee) {
          rows.push([dateStr, tx.wallet||'', 'BTC', fmtNum(fee), '', '',
            '', '',
            'Withdrawal', tx.notes||`UTXO consolidation fee`, tx.txhash||'']);
        }

      } else if(tx.type==='Reward') {
        rows.push([dateStr, tx.wallet||'', '', '', 'BTC', fmtNum(amt),
          '', '', 'Income', tx.notes||'', tx.txhash||'']);
      }
    });
    // Quoting alone is NOT protection against formula injection — Excel and Sheets evaluate
    // after unquoting. Only the free-text columns are guarded, and numeric-looking values are
    // exempt: fmtNum can legitimately emit a leading '-', and prefixing that would make
    // CoinLedger reject the row.
    const FREE_TEXT_COLS = new Set([1, 9, 10]); // Platform, Description, TxHash
    const csvField = (v, col) => {
      let s = v == null ? '' : String(v);
      if(FREE_TEXT_COLS.has(col) && /^[=+\-@\t\r]/.test(s) && !/^-?\d+(\.\d+)?$/.test(s)) s = "'" + s;
      return '"' + s.replace(/"/g,'""') + '"';
    };
    const csv=[headers,...rows].map(r=>r.map(csvField).join(',')).join('\r\n'); // CRLF per RFC 4180
    downloadBlob(new Blob([csv],{type:'text/csv'}), `coinledger-${yearFilter||'all'}-${todayLocal()}.csv`);
    showToast(`Exported ${rows.length} transactions`);
  };

  // ─── Export Full Backup JSON ──────────────────────────────────────────────
  const exportBackupJSON = () => {
    const payload = {
      version: BACKUP_SCHEMA_VERSION,
      exportedAt: new Date().toISOString(),
      transactions,
      wallets,
      settings,
      vault,
      lastModified: localStorage.getItem('btc-last-modified')||new Date().toISOString(),
    };
    downloadBlob(new Blob([JSON.stringify(payload,null,2)], { type:'application/json' }), `btc-tracker-backup-${todayLocal()}.json`);
  };

  // ─── Import Backup / CSV ──────────────────────────────────────────────────
  const importCSV = (e) => {
    const file=e.target.files[0]; if(!file) return;
    // Larger than any real ledger, and too big for localStorage anyway: a write that size
    // fails, and a restore would then push data to Drive that this device couldn't keep.
    if(file.size > MAX_IMPORT_BYTES) {
      showToast(`That file is ${(file.size/1048576).toFixed(1)} MB — too large to be a SatLedger backup or CSV.`, 6000);
      e.target.value=''; return;
    }
    const reader=new FileReader();
    reader.onload = ev => {
      const raw = ev.target.result;
      const trimmed = raw.trim();
      if(file.name.toLowerCase().endsWith('.json') || trimmed.startsWith('{')) {
        try {
          const parsed = JSON.parse(trimmed);
          if(Array.isArray(parsed.transactions) || parsed.vault || Array.isArray(parsed.wallets) || parsed.settings) {
            // Drop rows that would corrupt portfolio math (bad date, unknown type).
            // normalizeDate now returns '' for garbage, so this filter finally rejects it —
            // previously it passed the raw string through and a single bad row blanked every chart.
            const rawTransactions = Array.isArray(parsed.transactions) ? parsed.transactions : [];
            const importedTransactions = ensureTxIds(sanitizeStoredTransactions(rawTransactions
              .filter(tx => tx && typeof tx === 'object' && normalizeDate(tx.date) && VALID_TX_TYPES.includes(tx.type))
              .map(tx => ({...tx, date: normalizeDate(tx.date)}))));
            const skippedCount = rawTransactions.length - importedTransactions.length;
            // De-dupe by trimmed lowercase name: duplicates double-count in the holdings pie
            // and collide as React keys, and a hand-edited backup is an easy way to create them.
            const seenImportedWallets = new Set();
            let mergedWalletCount = 0;
            const importedWallets = (Array.isArray(parsed.wallets) ? parsed.wallets : [])
              .filter(w => w && typeof w === 'object' && w.name)
              .map(w => ({...w, name: String(w.name).trim()}))
              .filter(w => {
                const key = w.name.toLowerCase();
                if(!key) return false;
                if(seenImportedWallets.has(key)) { mergedWalletCount++; return false; }
                seenImportedWallets.add(key);
                return true;
              });
            const applyBackup = () => {
              // Same "about to replace everything" semantics as a Drive pull, so keep the
              // same recovery snapshot.
              stashPreSyncSnapshot();
              setSnapshotNonce(n => n+1);
              setTransactions(importedTransactions);
              setWallets(importedWallets);
              if(parsed.settings) {
                const normalized = normalizeSettings(parsed.settings);
                setSettings(normalized);
                safeSetItem('btc-settings', JSON.stringify(normalized));
              }
              // A malformed vault can never be unlocked, and stored it would replace a working
              // one on every synced device. Keep only one that has the fields decryption needs.
              const vaultInvalid = !!parsed.vault && !isVaultBlob(parsed.vault);
              const importedVault = vaultInvalid ? null : (parsed.vault || null);
              setVault(importedVault);
              if(importedVault) safeSetItem(VAULT_STORAGE_KEY, JSON.stringify(importedVault));
              else localStorage.removeItem(VAULT_STORAGE_KEY);
              lockVault();
              // Fresh stamp, as in restorePreSyncSnapshot: the file's own lastModified is older
              // than other devices' copies, so they would skip pulling the restore — and a
              // far-future one would make this device refuse every pull afterwards.
              save(importedTransactions, importedWallets, { vault: importedVault });
              const notes = [];
              if(skippedCount > 0) notes.push(`${skippedCount} invalid row${skippedCount===1?'':'s'} skipped`);
              if(mergedWalletCount > 0) notes.push(`${mergedWalletCount} duplicate wallet${mergedWalletCount===1?'':'s'} merged`);
              if(vaultInvalid) notes.push('vault in the file was unreadable and was not restored');
              showToast(notes.length ? `Backup restored — ${notes.join(', ')}` : 'Backup restored', notes.length ? 6000 : 3000);
            };
            if(transactions.length > 0 || wallets.length > 0) {
              setConfirmDialog({
                title: 'Replace Current Data',
                message: `Restoring this backup replaces your current ${transactions.length} transaction${transactions.length===1?'':'s'} and ${wallets.length} wallet${wallets.length===1?'':'s'} with ${importedTransactions.length} transaction${importedTransactions.length===1?'':'s'} and ${importedWallets.length} wallet${importedWallets.length===1?'':'s'} from the file. Continue?`,
                confirmLabel: 'Restore Backup',
                danger: true,
                onConfirm: () => { applyBackup(); setConfirmDialog(null); },
              });
            } else {
              applyBackup();
            }
          } else {
            showToast('Backup file does not contain tracker data');
          }
        } catch {
          showToast('Could not import backup file');
        }
        e.target.value='';
        return;
      }
      const lines=raw.split('\n');
      const hdr=lines[0].toLowerCase();
      const isCL=hdr.includes('asset sent')||hdr.includes('asset received');
      // Parse CSV line respecting quoted fields
      const parseCSVLine = (line) => {
        const result = []; let current = ''; let inQuotes = false;
        for(let c = 0; c < line.length; c++) {
          if(inQuotes) {
            if(line[c] === '"' && line[c+1] === '"') { current += '"'; c++; }
            else if(line[c] === '"') { inQuotes = false; }
            else { current += line[c]; }
          } else {
            if(line[c] === '"') { inQuotes = true; }
            else if(line[c] === ',') { result.push(current.trim()); current = ''; }
            else { current += line[c]; }
          }
        }
        result.push(current.trim());
        return result;
      };
      const imported=[];
      // Dedup helper: build set of existing transaction keys.
      // Deliberately NOT keyed on id — every imported row would be unique and dedupe would
      // silently stop working.
      const txKey = (tx) => `${tx.date}|${tx.type}|${tx.wallet}|${tx.amount}`;
      const existingKeys = new Set(transactions.map(txKey));
      let dupeCount = 0;
      let badCount = 0;
      const clRows = [];
      for(let i=1;i<lines.length;i++) {
        const line=lines[i].trim(); if(!line) continue;
        const cols=parseCSVLine(line);
        if(isCL) {
          // Collected and parsed as a whole below: Withdrawal/Deposit pairs span two rows.
          clRows.push(cols);
        } else {
          if(cols.length<6) { badCount++; continue; }
          // Same gate as the JSON path. Previously this branch stored date/type/amount
          // verbatim, so an MM/DD/YYYY date broke fmtDate, sorting and the year filter — and
          // could never match the dedupe key, so re-importing a file doubled the ledger.
          const d = normalizeDate(cols[0]);
          const type = canonicalTxType(cols[1]);
          if(!d || !type) { badCount++; continue; }
          if(type!=='Consolidation' && !(numOr(cols[4], 0) > 0)) { badCount++; continue; }
          const newTx = {id:newTxId(),date:d,type,wallet:(cols[2]||'').trim(),wallet2:(cols[3]||'').trim(),amount:cols[4],price:cols[5],fee:cols[6]||'',totalUsd:cols[7]||'',notes:cols[8]||'',txhash:cols[9]||'',excludeStats:cols[10]==='true'};
          // Backward compat: old format had notes at index 7 and txhash at 8 (no totalUsd)
          // Detect by checking if cols[7] looks like a number (totalUsd) or text (notes)
          if(cols.length<=9 && cols[7] && isNaN(parseFloat(cols[7]))) {
            newTx.totalUsd = '';
            newTx.notes = cols[7]||'';
            newTx.txhash = cols[8]||'';
            newTx.excludeStats = false;
          }
          if(existingKeys.has(txKey(newTx))) { dupeCount++; continue; }
          existingKeys.add(txKey(newTx));
          imported.push(newTx);
        }
      }
      if(isCL) {
        const { txs, bad } = parseCoinLedgerRows(clRows);
        badCount += bad;
        for(const newTx of txs) {
          if(existingKeys.has(txKey(newTx))) { dupeCount++; continue; }
          existingKeys.add(txKey(newTx));
          imported.push(newTx);
        }
      }
      if(imported.length) { setImportPreview({ rows: imported, dupeCount, badCount, format: isCL ? 'CoinLedger' : 'CSV' }); }
      else if(dupeCount) showToast(`All ${dupeCount} transactions already exist — nothing imported`);
      else if(badCount) showToast(`No valid transactions found — ${badCount} row${badCount===1?'':'s'} could not be read`);
      else showToast('No valid transactions found');
    };
    reader.readAsText(file);
    e.target.value='';
  };

  // ─── Render ───────────────────────────────────────────────────────────────
  const isSampleMode = transactions.length === 0;
  const effectiveSettings = isSampleMode
    ? {
        ...settings,
        bgDots: settings.bgDots === undefined ? false : settings.bgDots,
        showVault: settings.showVault === undefined ? false : settings.showVault,
        rsiThresholds: normalizeRsiThresholds(settings.rsiThresholds),
      }
    : normalizeSettings(settings);
  const effectiveHiddenCharts = isSampleMode && (settings.hiddenCharts||{}).monthly === undefined
    ? { ...(settings.hiddenCharts||{}), monthly: true }
    : (settings.hiddenCharts||{});
  const effectiveMaLines = isSampleMode && (settings.maLines||{}).rsi14 === undefined
    ? { ...(settings.maLines||{}), rsi14: false }
    : (settings.maLines||{});

  // Transactions always store BTC. When the display unit is sats, the modal's
  // BTC-denominated inputs (Amount, BTC fee) accept and show sats instead.
  const satsMode = BTC_DISPLAY_UNIT === 'sats';
  const btcToUnitInput = (btcStr) => {
    if(btcStr === '' || btcStr == null) return '';
    if(!satsMode) return btcStr;
    const n = parseFloat(btcStr);
    return isNaN(n) ? btcStr : String(Math.round(n*1e8));
  };
  const unitInputToBtc = (inStr) => {
    if(inStr === '') return '';
    if(!satsMode) return inStr;
    const n = parseFloat(inStr);
    return isNaN(n) ? '' : (Math.round(n)/1e8).toFixed(8);
  };

  return (
    <div className={`app ${effectiveSettings.hideValues?'values-hidden':''}`}>
      {/* Command bar — contextual page title instead of repeated branding */}
      <header className="header">
        <div className="header-inner">
          <div className="header-brand">
            <div className="logo mobile-logo">
              <img className="logo-icon logo-icon-light" src="images/logo-dark-128.png" alt="SatLedger" width="128" height="128" />
              <img className="logo-icon logo-icon-dark" src="images/logo-white-128.png" alt="SatLedger" width="128" height="128" />
            </div>
            <span className="page-title">{NAV_ITEMS.find(n=>n.key===tab)?.label||'Dashboard'}</span>
            <span className="page-crumb desktop-only">SatLedger</span>
          </div>
          <div className="header-controls">
            {/* Sync status */}
            {syncState==='disconnected' ? (
              <button className="sync-pill" onClick={handleSignIn} onPointerEnter={preloadGsi} onFocus={preloadGsi} onTouchStart={preloadGsi} title="Sign in with Google to sync across devices" aria-label="Sign in with Google to sync across devices">
                {Icon.Cloud({width:12,height:12})}
                <span className="desktop-only">Sign in</span>
              </button>
            ) : (
              <button className={`sync-pill ${syncState}`} onClick={()=>setTab('settings')} title={syncUser ? `Synced as ${syncUser.email}` : 'Sync status'}>
                <div className={`sync-dot ${syncState==='synced'?'connected':syncState==='syncing'?'syncing':'error'}`}/>
                <span className="desktop-only">{syncState==='syncing'?'Syncing…':syncState==='error'?'Sync error':'Synced'}</span>
              </button>
            )}
            {btcPrice && (() => {
              // A real <button> so refresh is keyboard-reachable. The staleness hint replaces
              // the old once-a-minute failure toast: show it, don't nag about it.
              const age = priceUpdatedAt ? Date.now() - priceUpdatedAt : null;
              const stale = age !== null && age > 180000;
              return (
                <button
                  type="button"
                  className="price-pill"
                  onClick={()=>fetchPrice()}
                  style={{cursor:'pointer',border:'none',opacity:stale?.55:1}}
                  aria-label={`Bitcoin price ${fmtUSD(btcPrice)}${stale?' (may be out of date)':''} — click to refresh`}
                  title={priceUpdatedAt
                    ? `BTC price · updated ${age > 86400000 ? new Date(priceUpdatedAt).toLocaleString() : new Date(priceUpdatedAt).toLocaleTimeString()}${stale?' (may be out of date)':''} · click to refresh`
                    : 'Click to refresh BTC price'}
                >
                  <div className={`price-dot${priceLoading?' loading':''}`}/>
                  {fmtUSD(btcPrice)}
                </button>
              );
            })()}
            <button className="btn btn-secondary btn-sm" onClick={()=>updateSettings({hideValues:!settings.hideValues})} title={effectiveSettings.hideValues?'Show values':'Hide values'} aria-label={effectiveSettings.hideValues?'Show financial values':'Hide financial values'} aria-pressed={!!effectiveSettings.hideValues} style={{padding:'.375rem .5rem',minWidth:0}}>
              {effectiveSettings.hideValues ? Icon.EyeOff({width:14,height:14}) : Icon.Eye({width:14,height:14})}
            </button>
            <button className="btn btn-primary add-tx-btn" title="Add transaction" aria-label="Add transaction" onClick={()=>{setForm(emptyForm());setEditId(null);setShowModal(true);}}>
              + <span className="desktop-only">Add Transaction</span><span className="mobile-only">Add</span>
            </button>
          </div>
        </div>
      </header>

      <div className="app-body">
        {/* Desktop sidebar */}
        <aside className="sidebar">
          <a className="rail-logo" href="#dashboard" onClick={()=>setTab('dashboard')} title="SatLedger">
            <img className="logo-icon logo-icon-light" src="images/logo-dark-128.png" alt="SatLedger" width="128" height="128" />
            <img className="logo-icon logo-icon-dark" src="images/logo-white-128.png" alt="SatLedger" width="128" height="128" />
          </a>
          <nav className="sidebar-nav">
            {NAV_ITEMS.filter(item=> item.key!=='vault' || effectiveSettings.showVault!==false).map(item=>(
              <button key={item.key} className={`sidebar-item ${tab===item.key?'active':''}`} onClick={()=>setTab(item.key)} title={item.label}>
                {Icon[item.icon]({width:19,height:19})}
                <span className="sidebar-item-label">{item.label}</span>
              </button>
            ))}
          </nav>
          <button className="rail-theme" onClick={()=>setTheme(t=>t==='dark'?'light':'dark')} title="Toggle theme">
            {theme==='dark' ? '☀' : '☾'}
          </button>
          <div className="sidebar-version">v{APP_VERSION}</div>
        </aside>

        <main className="main" style={effectiveSettings.bgDots===false?{backgroundImage:'none'}:{}}>
        {/* ── DASHBOARD ── */}
        {tab==='dashboard' && (
          <>
            {/* Transfer wizard banner */}
            {(()=>{
              const incomplete = transactions.filter(t=>t.type==='Transfer'&&(!t.wallet||!t.wallet2)); // Consolidation excluded — same-wallet adjustment
              if(!incomplete.length) return null;
              return (
                <div style={{background:'rgba(217,119,6,.08)',border:'1px solid #d97706',borderRadius:12,padding:'1rem 1.5rem',marginBottom:'1.25rem',display:'flex',alignItems:'center',justifyContent:'space-between',gap:'1rem',flexWrap:'wrap'}}>
                  <div style={{display:'flex',alignItems:'center',gap:'.75rem'}}>
                    <span style={{color:'#d97706',display:'flex'}}>{Icon.Warning({width:22,height:22})}</span>
                    <div>
                      <div style={{fontWeight:600,fontSize:'.9375rem'}}>
                        {incomplete.length} transfer{incomplete.length!==1?'s':''} missing wallet info
                      </div>
                      <div style={{fontSize:'.8125rem',color:'var(--text-secondary)',marginTop:'.125rem'}}>
                        These won't be counted correctly until From/To wallets are assigned.
                      </div>
                    </div>
                  </div>
                  <button className="btn btn-primary" onClick={()=>{setWizardEdits({});setWizardStep(0);setShowWizard(true);}}>
                    Fix Transfers →
                  </button>
                </div>
              );
            })()}
            {(() => {
              const hs = settings.hiddenStats || {};
              const breakEvenPrice = trackedHoldings > 0.00000001 ? stats.costBasis / trackedHoldings : null;
              const statCards = {
                holdings: () => (
                  <div className="stat-card stat-hero" key="holdings">
                    <div className="stat-label" style={{display:'flex',flexDirection:'column',alignItems:'flex-start',gap:'.375rem'}}>
                      <div style={{display:'flex',alignItems:'center',gap:'.375rem'}}>
                        <span>Holdings</span>
                        <InfoTip text="Holdings only include active (non-archived) wallets. Archived wallets still contribute to cost basis and P&L calculations. Delete a wallet entirely to remove it from all stats." position="bottom" />
                      </div>
                      {hasDashboardWalletFilter && <span className="scope-badge">Selected wallets</span>}
                    </div>
                    <div className={`stat-value ${dashboardTrackedHoldings>0?'btc':'zero'}`}>{fmtBTC(dashboardTrackedHoldings)}</div>
                    <div className="stat-sub">{btcUnit()}{btcPrice?` · ${fmtUSD(dashboardTrackedHoldings*(btcPrice||0))}`:''}</div>
                  </div>
                ),
                costBasis: () => (
                  <div className="stat-card" key="costBasis">
                    <div className="stat-label" style={{display:'flex',alignItems:'center',gap:'.375rem',flexWrap:'wrap'}}>Cost Basis{hasDashboardWalletFilter && <span className="scope-badge">Portfolio-wide</span>}</div>
                    <div className={`stat-value${stats.costBasis>0?'':' zero'}`} style={{fontSize:'1.375rem'}}>{fmtUSD(stats.costBasis)}</div>
                    <div className="stat-sub">{fmtBTC(trackedHoldings)} {btcUnit()} acquired</div>
                  </div>
                ),
                totalPL: () => (
                  <div className="stat-card" key="totalPL">
                    <div className="stat-label" style={{display:'flex',alignItems:'center',gap:'.375rem',flexWrap:'wrap'}}>Total P&L{hasDashboardWalletFilter && <span className="scope-badge">Portfolio-wide</span>}</div>
                    <div className={`stat-value ${btcPrice && (stats.currentValue>0 || stats.costBasis>0) ? (stats.unrealized>=0?'green':'red') : 'zero'}`} style={{fontSize:'1.375rem'}}>
                      {btcPrice?fmtUSD(stats.unrealized):'—'}
                    </div>
                    <div className="stat-sub">{btcPrice&&stats.costBasis>0?`${(stats.unrealized/stats.costBasis*100).toFixed(1)}% return on cost`:'Waiting for price'}</div>
                  </div>
                ),
                breakEven: () => (
                  <div className="stat-card" key="breakEven">
                    <div className="stat-label" style={{display:'flex',alignItems:'center',gap:'.375rem',flexWrap:'wrap'}}>Break-Even Price{hasDashboardWalletFilter && <span className="scope-badge">Portfolio-wide</span>}</div>
                    <div className={`stat-value${btcPrice && breakEvenPrice ? (btcPrice >= breakEvenPrice ? ' green' : ' red') : ' zero'}`} style={{fontSize:'1.375rem'}}>
                      {breakEvenPrice ? fmtUSD(breakEvenPrice) : '—'}
                    </div>
                    <div className="stat-sub">{btcPrice && breakEvenPrice ? (btcPrice >= breakEvenPrice ? `${fmtUSD(btcPrice - breakEvenPrice)} below market` : `${fmtUSD(breakEvenPrice - btcPrice)} above market`) : 'BTC price needed to break even'}</div>
                  </div>
                ),
                rewards: () => (
                  <div className="stat-card stat-extra" key="rewards">
                    <div className="stat-label" style={{display:'flex',alignItems:'center',gap:'.375rem',flexWrap:'wrap'}}>Rewards Earned{hasDashboardWalletFilter && <span className="scope-badge">Portfolio-wide</span>}</div>
                    <div className={`stat-value ${stats.rewardsIncome>0?'btc':'zero'}`} style={{fontSize:'1.375rem'}}>{fmtBTC(stats.rewardsIncome)}</div>
                    <div className="stat-sub">{btcPrice?fmtUSD(stats.rewardsIncome*btcPrice):''} at current price</div>
                  </div>
                ),
                networkFees: () => (
                  <div className="stat-card stat-extra" key="networkFees">
                    <div className="stat-label" style={{display:'flex',alignItems:'center',gap:'.375rem',flexWrap:'wrap'}}>Network Fees{hasDashboardWalletFilter && <span className="scope-badge">Portfolio-wide</span>}</div>
                    <div className="stat-value" style={{fontSize:'1.375rem',color:'var(--text-secondary)'}}>{fmtBTC(stats.totalFeesBTC)}</div>
                    <div className="stat-sub">{btcUnit()} in transfer fees</div>
                  </div>
                ),
                totalTx: () => (
                  <div className="stat-card stat-extra" key="totalTx">
                    <div className="stat-label" style={{display:'flex',alignItems:'center',gap:'.375rem',flexWrap:'wrap'}}>Total Transactions{hasDashboardWalletFilter && <span className="scope-badge">Portfolio-wide</span>}</div>
                    <div className={`stat-value${transactions.length>0?'':' zero'}`} style={{fontSize:'1.875rem'}}>{transactions.length}</div>
                    <div className="stat-sub">{transactions.filter(t=>t.type==='Buy').length} buys · {transactions.filter(t=>t.type==='Reward').length} rewards</div>
                  </div>
                ),
              };
              return (
                <div className={`stats-grid ${moreStats?'stats-expanded':''}`}>
                  {STAT_CARD_DEFS.map(def => !hs[def.key] && statCards[def.key] ? statCards[def.key]() : null)}
                </div>
              );
            })()}
            {STAT_CARD_DEFS.filter(def => !(settings.hiddenStats||{})[def.key]).length > 4 && (
              <button className="stats-toggle-btn" onClick={()=>setMoreStats(s=>!s)}>
                {moreStats ? 'Show less' : 'Show more stats'}
                <span style={{display:'inline-flex',transform:moreStats?'rotate(180deg)':'none',transition:'transform .2s'}}>{Icon.ChevronDown({width:16,height:16})}</span>
              </button>
            )}

            {/* ── Charts ── */}
            <DashboardCharts transactions={transactions} wallets={wallets} btcPrice={btcPrice} historicalPrices={historicalPrices} historicalPriceLoading={historicalPriceLoading} settings={settings} updateSettings={updateSettings} selectedWallets={selectedDashboardWallets} />

            {/* Wallet holdings pie chart */}
            {(() => {
              const PIE_COLORS = ['#f7931a','#3b82f6','#10b981','#8b5cf6','#ef4444','#f59e0b','#06b6d4','#ec4899','#84cc16','#6366f1'];
              // De-duped by name: walletHoldings is keyed by NAME, so two wallet records sharing
              // a name each pulled the same balance and double-counted it in the pie total —
              // which then disagreed with the Holdings stat card (that sums the unique-name map
              // once) — and produced duplicate React keys. handleWalletSubmit now prevents new
              // collisions; this keeps any already in storage from rendering wrong.
              const seenWalletNames = new Set();
              const walletData = activeWallets
                .filter(w => !hasDashboardWalletFilter || selectedDashboardWalletSet.has(w.name))
                .filter(w => {
                  const key = String(w.name||'').trim().toLowerCase();
                  if(!key || seenWalletNames.has(key)) return false;
                  seenWalletNames.add(key);
                  return true;
                })
                .map(w => ({ name:w.name, type:w.type, amount:walletHoldings[w.name]||0 }))
                .filter(d => d.amount > 0.00000001)
                .sort((a,b) => b.amount - a.amount);
              const totalBTC = walletData.reduce((s,d) => s+d.amount, 0);
              if(!walletData.length) {
                if(!hasDashboardWalletFilter) return null;
                return (
                  <div className="card">
                    <div className="card-header">
                      <div style={{display:'flex',alignItems:'center',gap:'.5rem',flexWrap:'wrap'}}>
                        <div className="card-title">Holdings by Wallet</div>
                        <span className="scope-badge">Selected wallets</span>
                      </div>
                      <button className="btn btn-secondary btn-sm" onClick={()=>setTab('wallets')}>Manage Wallets →</button>
                    </div>
                    <div className="card-body" style={{color:'var(--text-secondary)',fontSize:'.875rem'}}>No wallet holdings for the selected dashboard filter.</div>
                  </div>
                );
              }
              const segments = walletData.map((d,i) => ({
                ...d, pct: d.amount / totalBTC, color: PIE_COLORS[i % PIE_COLORS.length]
              }));
              return (
                <div className="card">
                  <div className="card-header" style={{cursor:'pointer'}} onClick={()=>setWalletsOpen(o=>!o)}>
                    <div style={{display:'flex',alignItems:'center',gap:'.5rem',flexWrap:'wrap'}}>
                      <span style={{display:'inline-flex',transform:walletsOpen?'rotate(180deg)':'none',transition:'transform .2s'}}>{Icon.ChevronDown({width:16,height:16})}</span>
                      <div className="card-title">Holdings by Wallet</div>
                      {hasDashboardWalletFilter && <span className="scope-badge">Selected wallets</span>}
                    </div>
                    <button className="btn btn-secondary btn-sm" onClick={e=>{e.stopPropagation();setTab('wallets');}}>Manage Wallets →</button>
                  </div>
                  {walletsOpen && <div className="card-body">
                    <PieChart segments={segments} totalBTC={totalBTC} btcPrice={btcPrice} />
                  </div>}
                </div>
              );
            })()}
          </>
        )}

        {/* ── TRANSACTIONS ── */}
        {tab==='transactions' && (
          <div className="card">

              <select className="filter-select" aria-label="Filter by transaction type" value={filterType} onChange={e=>{setFilterType(e.target.value);setPage(1);}}>
                <option value="All">All Types</option>
                {['Buy','Sell','Transfer','Reward','Consolidation'].map(t=><option key={t}>{t}</option>)}
              </select>
              <select className="filter-select" aria-label="Filter by wallet" value={filterWallet} onChange={e=>{setFilterWallet(e.target.value);setPage(1);}}>
                <option value="All">All Wallets</option>
                {walletNames.map(w=><option key={w}>{w}</option>)}
              </select>
              <select className="filter-select" aria-label="Filter by year" value={filterYear} onChange={e=>{setFilterYear(e.target.value);setPage(1);}}>
                <option value="All">All Years</option>
                {years.map(y=><option key={y}>{y}</option>)}
              </select>
              <div style={{display:'flex',alignItems:'center',gap:'.375rem',flexShrink:0}}>

                <span style={{color:'var(--text-tertiary)',fontSize:'.75rem'}}>to</span>
                <input type="date" className="form-input" value={filterDateTo} onChange={e=>{setFilterDateTo(e.target.value);setFilterYear('All');setPage(1);}} title="To date" aria-label="Filter to date" style={{fontSize:'.75rem',padding:'.375rem .5rem',width:'auto'}} />
              </div>
              <button className="btn btn-secondary btn-sm" onClick={()=>{setSearch('');setFilterType('All');setFilterWallet('All');setFilterYear('All');setFilterDateFrom('');setFilterDateTo('');setPage(1);}}>

              </button>
              <span className="filter-count">{filtered.length} of {transactions.length}</span>
            </div>

            {filtered.length===0 ? (
              <div className="empty"><div className="empty-icon">₿</div><div className="empty-text">{transactions.length===0 ? 'No transactions yet' : 'No matching transactions'}</div><div className="empty-sub">{transactions.length===0 ? 'Add your first transaction to get started' : 'Try adjusting your filters'}</div></div>
            ) : (
              <>
                {/* Mobile card layout */}
                <div className="tx-cards">
                  {paged.map((tx,i)=>{
                    const total = numOr(tx.totalUsd, numOr(tx.amount)*numOr(tx.price));
                    const bal = balanceFor(tx);
                    return (
                      <div key={tx.id} className="tx-card" style={tx.excludeStats?{opacity:.5}:{}}>
                        <div className="tx-card-row">
                          <div style={{display:'flex',alignItems:'center',gap:'.5rem'}}>
                            <span className={`badge badge-${tx.type==='Consolidation'?'consolidation':tx.type.toLowerCase()}`}>{tx.type}</span>
                            <span style={{fontSize:'.8125rem',color:'var(--text-secondary)'}}>{fmtDate(tx.date)}</span>
                            {tx.excludeStats && <span style={{fontSize:'.5625rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em',padding:'.1rem .3rem',borderRadius:3,background:'var(--bg-tertiary)',color:'var(--text-tertiary)'}}>excluded</span>}
                          </div>
                          <div style={{display:'flex',gap:'.25rem'}}>
                            <button className="btn-icon" style={{width:32,height:32}} onClick={()=>handleEdit(tx)} title="Edit" aria-label={`Edit ${tx.type} of ${fmtBTC(tx.amount)} ${btcUnit()} on ${fmtDate(tx.date)}`}>{Icon.Edit({width:13,height:13})}</button>
                            <button className="btn-icon btn-icon-danger" style={{width:32,height:32}} onClick={()=>handleDelete(tx)} title="Delete" aria-label={`Delete ${tx.type} of ${fmtBTC(tx.amount)} ${btcUnit()} on ${fmtDate(tx.date)}`}>{Icon.Trash({width:13,height:13})}</button>
                          </div>
                        </div>
                        <div className="tx-card-row" style={{marginTop:'.5rem'}}>
                          <div>

                            <div className="tx-card-val">{tx.wallet||'—'}</div>

                            <div className="tx-card-label">Amount</div>

                            <div className="tx-card-label">Total</div>
                            <div className="tx-card-val mono">{fmtUSD(total)}</div>
                          </div>}

                          </div>
                        </div>}
                        {bal && (
                          <div className="tx-card-row" style={{marginTop:'.5rem',paddingTop:'.5rem',borderTop:'1px solid var(--border-color)'}}>
                            <div className="tx-card-label">{bal.wallet} balance</div>
                            <div className="tx-card-val mono" style={{color:bal.negative?'var(--red)':'var(--text-secondary)'}}>{fmtBTC(bal.btc)} {btcUnit()}</div>
                          </div>
                        )}
                        {tx.notes && <div style={{marginTop:'.375rem',fontSize:'.75rem',color:'var(--text-tertiary)'}}>{tx.notes}</div>}
                      </div>
                    );
                  })}
                </div>

                {/* Desktop table layout */}
                <div className="table-wrap tx-table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>From Wallet</th>
                        <th>To Wallet</th>
                        <th>Amount ({btcUnit()})</th>
                        <th title="Wallet balance immediately after this transaction. Always computed from every transaction, so filters and paging don't change it.">Balance ({btcUnit()})</th>
                        <th className="desktop-only">Price/BTC</th>
                        <th className="desktop-only">Total USD</th>
                        <th className="desktop-only">Fee</th>
                        <th className="desktop-only">Notes</th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                      {paged.map((tx,i)=>{
                        const total = numOr(tx.totalUsd, numOr(tx.amount)*numOr(tx.price));
                        const bal = balanceFor(tx);
                        return (
                          <tr key={tx.id} style={tx.excludeStats?{opacity:.5}:{}}>
                            <td style={{whiteSpace:'nowrap',fontSize:'.8125rem'}}>{fmtDate(tx.date)}</td>
                            <td>
                              <span className={`badge badge-${tx.type==='Consolidation'?'consolidation':tx.type.toLowerCase()}`}>{tx.type}</span>
                              {tx.excludeStats && <span style={{fontSize:'.5625rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em',padding:'.1rem .3rem',borderRadius:3,background:'var(--bg-tertiary)',color:'var(--text-tertiary)',marginLeft:'.25rem',verticalAlign:'middle'}}>excluded</span>}
                            </td>
                            <td style={{fontWeight:500}}>{tx.wallet||'—'}</td>
                            <td style={{color:'var(--text-secondary)'}}>{tx.wallet2||'—'}</td>
                            <td className="mono" style={{fontWeight:600}}>{fmtBTC(tx.amount)}</td>
                            <td className="mono" title={bal ? `${bal.wallet} balance after this transaction` : undefined}
                                style={{fontSize:'.8125rem',color:bal ? (bal.negative?'var(--red)':'var(--text-secondary)') : 'var(--text-tertiary)',fontWeight:bal&&bal.negative?600:400}}>
                              {bal ? fmtBTC(bal.btc) : '—'}
                            </td>
                            <td className="mono desktop-only">{tx.price && parseFloat(tx.price)>0 ? fmtUSD(tx.price) : '—'}</td>
                            <td className="mono desktop-only">{total>0 ? fmtUSD(total) : '—'}</td>
                            <td className="mono desktop-only" style={{fontSize:'.75rem',color:'var(--text-secondary)'}}>
                              {tx.fee && parseFloat(tx.fee)>0 ? (tx.type==='Transfer'||tx.type==='Consolidation'?`${fmtBTC(tx.fee)} ${btcUnit()}`:fmtUSD(tx.fee)) : '—'}
                            </td>
                            <td className="desktop-only" style={{maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontSize:'.75rem',color:'var(--text-secondary)'}}>

                              <div style={{display:'flex',gap:'.25rem'}}>

                                <button className="btn-icon btn-icon-danger" onClick={()=>handleDelete(tx)} title="Delete" aria-label={`Delete ${tx.type} of ${fmtBTC(tx.amount)} ${btcUnit()} on ${fmtDate(tx.date)}`}>{Icon.Trash()}</button>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
                {totalPages>1 && (
                  <div className="pagination">
                    <span className="page-info">Page {page} of {totalPages} · {filtered.length} results</span>
                    <div className="page-btns">
                      <button className="page-btn" disabled={page===1} onClick={()=>setPage(1)}>«</button>
                      <button className="page-btn" disabled={page===1} onClick={()=>setPage(p=>p-1)}>‹</button>
                      {Array.from({length:Math.min(5,totalPages)},(_,i)=>{
                        const p=Math.max(1,Math.min(totalPages-4,page-2))+i;
                        return <button key={p} className={`page-btn ${p===page?'active':''}`} onClick={()=>setPage(p)}>{p}</button>;
                      })}
                      <button className="page-btn" disabled={page===totalPages} onClick={()=>setPage(p=>p+1)}>›</button>
                      <button className="page-btn" disabled={page===totalPages} onClick={()=>setPage(totalPages)}>»</button>
                    </div>
                  </div>
                )}
              </>
            )}
          </div>
        )}

        {/* ── WALLETS ── */}
        {tab==='wallets' && (
          <>
            <div className="card">
              <div className="card-header">
                <div style={{display:'flex',alignItems:'center',gap:'.75rem'}}>
                  <div className="card-title">Wallet Manager</div>
                  {wallets.some(w=>w.archived) && (
                    <button className={`btn btn-sm ${showArchived?'btn-primary':'btn-secondary'}`} onClick={()=>setShowArchived(s=>!s)}>
                      {showArchived ? 'Hide' : 'Show'} Archived ({wallets.filter(w=>w.archived).length})
                    </button>
                  )}
                </div>
                <button className="btn btn-primary btn-sm" onClick={()=>{setWalletForm({name:'',type:'Exchange',address:''});setEditWalletTarget(null);setShowWalletModal(true);}}>+ Add Wallet</button>
              </div>
              <div className="card-body">
                {wallets.filter(w => showArchived ? true : !w.archived).length === 0 && (
                  <div className="empty">
                    <div className="empty-icon">₿</div>
                    <div className="empty-text">{wallets.length===0 ? 'No wallets yet' : 'No active wallets'}</div>
                    <div className="empty-sub">{wallets.length===0 ? 'Add an exchange, hardware wallet, or cold storage wallet to start tracking' : 'All wallets are archived — use Show Archived to view them'}</div>
                    {wallets.length===0 && (
                      <button className="btn btn-primary" style={{marginTop:'1rem'}} onClick={()=>{setWalletForm({name:'',type:'Exchange',address:''});setEditWalletTarget(null);setShowWalletModal(true);}}>+ Add Wallet</button>
                    )}
                  </div>
                )}
                <div className="wallet-grid">
                  {wallets.filter(w => showArchived ? true : !w.archived).map((w,i)=>{
                    const walletIdx = wallets.indexOf(w);
                    const bal = walletHoldings[w.name]||0;
                    const usd = btcPrice ? bal*btcPrice : null;
                    return (
                      <div key={w.id} className="wallet-card" style={w.archived?{opacity:.55,borderStyle:'dashed'}:{}}>
                        <div className="wallet-card-header">
                          <div style={{display:'flex',alignItems:'center',gap:'.375rem'}}>
                            <div className="wallet-name">{w.name}</div>
                            {w.archived && <span style={{fontSize:'.5625rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em',padding:'.1rem .375rem',borderRadius:4,background:'var(--bg-tertiary)',color:'var(--text-tertiary)',border:'1px solid var(--border-color)'}}>Archived</span>}
                          </div>
                          <div style={{display:'flex',gap:'.25rem'}}>
                            {!w.archived && (
                              <button className="btn-icon" style={{width:36,height:36}} onClick={()=>{setWalletForm({name:w.name,type:w.type,address:w.address});setEditWalletTarget(w);setShowWalletModal(true);}} title="Edit" aria-label={`Edit wallet ${w.name}`}>{Icon.Edit({width:14,height:14})}</button>
                            )}

                              <button className="btn-icon" style={{width:36,height:36}} title="Archive wallet" aria-label="Archive wallet" onClick={()=>{patchWallet(w,{archived:true});showToast(`${w.name} archived`);}}>{Icon.Archive({width:14,height:14})}</button>
