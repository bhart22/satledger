<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#0a0a0a">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://accounts.google.com; connect-src 'self' https://api.coinbase.com https://api.exchange.coinbase.com https://www.googleapis.com https://accounts.google.com https://oauth2.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://accounts.google.com https://*.googleusercontent.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <title>SatLedger — Bitcoin Portfolio Tracker</title>
  <script crossorigin="anonymous" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin="anonymous" integrity="sha384-ezQ6HS3FLspd9te19o2McUV6FAK091+GG7KO54f/R8DKgCDi7fULhapNrd5LY+vG" src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
  <script>
    // Refuse to run framed. A meta CSP can't set frame-ancestors, so without this a hostile
    // page could frame the app and trick clicks through Force Push or Delete Vault. (An HTTP
    // `Content-Security-Policy: frame-ancestors 'none'` header is the stronger fix where the
    // host allows custom headers.)
    if (window.top !== window.self) {
      document.documentElement.style.display = 'none';
      try { window.top.location = window.self.location.href; } catch (e) {}
    }
    // Apply the theme before first paint (React only sets it after mounting, so the page used
    // to flash dark for light-theme users). With no saved choice, follow the OS.
    (function () {
      var t = null;
      try { t = localStorage.getItem('btc-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
    // Verbose sync logging leaks Drive file ids and portfolio sizes into the console of a
    // shared or screen-shared browser. Opt in with localStorage['btc-debug'] = '1'.
    var DEBUG = (function() { try { return localStorage.getItem('btc-debug') === '1'; } catch (e) { return false; } })();
    var dlog = function() { if (DEBUG) console.log.apply(console, arguments); };

    // Google Drive Sync Module
    const GDRIVE_CLIENT_ID = '1022736433382-1iui89030rcghre1ml7je3of5tj5s5li.apps.googleusercontent.com';
    const GDRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
    const GDRIVE_FILENAME = 'btc-tracker-data.json';
    const driveUnreachable = (status) => {
      const err = new Error('drive_unreachable');
      err.code = 'drive_unreachable';
      err.status = status;
      return err;
    };

    const GDriveSync = {
      tokenClient: null,
      accessToken: null,
      tokenExpiry: null,
      fileId: null,
      modifiedTime: null, // Drive's server-side revision marker for the synced file
      _initPromise: null,
      
      // Google's sign-in script can't carry SRI and runs with full page privileges, so it is
      // only fetched for people who use sync: on launch when sync is on, or when a Sign in
      // button is hovered, focused or touched (so it is usually ready by the click).
      loadScript() {
        if(window.google?.accounts?.oauth2 || document.getElementById('gsi-client')) return;
        const s = document.createElement('script');
        s.id = 'gsi-client';
        s.src = 'https://accounts.google.com/gsi/client';
        s.async = true;
        s.onerror = () => { s.remove(); }; // let a later attempt retry
        document.head.appendChild(s);
      },

      init() {
        if(this._initPromise) return this._initPromise;
        this.loadScript();
        this._initPromise = new Promise((resolve) => {
          let expired = false;
          const check = () => {
            if(window.google?.accounts?.oauth2) {
              this.tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: GDRIVE_CLIENT_ID,
                scope: GDRIVE_SCOPE,
                callback: () => {},
              });
              // Restore cached token (sessionStorage only — cleared when the tab closes)
              try { localStorage.removeItem('btc-gtoken'); } catch {} // clean up legacy persistent copy
              try {
                const cached = JSON.parse(sessionStorage.getItem('btc-gtoken')||'null');
                if(cached && cached.token && cached.expiry > Date.now()) {
                  this.accessToken = cached.token;
                  this.tokenExpiry = cached.expiry;
                }
              } catch {}
              resolve(true);
            } else {
              if(!expired) setTimeout(check, 100);
            }
          };
          check();
          setTimeout(() => {
            // Not loaded in time (offline, blocked). Forget this attempt so the next Sign in
            // click tries again instead of failing forever on a cached `false`.
            expired = true;
            if(!this.tokenClient) this._initPromise = null;
            resolve(!!this.tokenClient);
          }, 10000);
        });
        return this._initPromise;
      },

      _cacheToken(token, expiresIn) {
        this.accessToken = token;
        // Honor Google's actual expiry (typically 1h) with a 60s safety margin;
        // ensureToken will silently refresh if Google rejects it
        const ttl = (Number(expiresIn) > 0 ? Number(expiresIn) - 60 : 3540) * 1000;
        this.tokenExpiry = Date.now() + ttl;
        try { sessionStorage.setItem('btc-gtoken', JSON.stringify({ token, expiry: this.tokenExpiry })); } catch {}
      },

      _clearToken() {
        this.accessToken = null;
        this.tokenExpiry = null;
        try { sessionStorage.removeItem('btc-gtoken'); } catch {}
        try { localStorage.removeItem('btc-gtoken'); } catch {}
      },

      isTokenValid() {
        return this.accessToken && this.tokenExpiry && Date.now() < this.tokenExpiry;
      },

      requestToken(interactive) {
        return new Promise((resolve, reject) => {
          if(!this.tokenClient) { reject(new Error('Not initialized')); return; }
          this.tokenClient.callback = (resp) => {
            if(resp.error) { this._clearToken(); reject(resp); return; }
            this._cacheToken(resp.access_token, resp.expires_in);
            resolve(resp.access_token);
          };
          this.tokenClient.error_callback = (err) => { this._clearToken(); reject(err); };
          // Use prompt:'' for silent, prompt:'consent' for interactive
          this.tokenClient.requestAccessToken({ prompt: interactive ? 'consent' : '' });
        });
      },

      async ensureToken() {
        if(this.isTokenValid()) return this.accessToken;
        // Try silent re-auth first
        try {
          await this.requestToken(false);
          return this.accessToken;
        } catch {
          // Silent failed — need interactive
          this._clearToken();
          throw new Error('token_expired');
        }
      },
      
      async _fetch(url, opts={}) {
        const token = await this.ensureToken();
        const r = await fetch(url, {
          ...opts,
          headers: { 'Authorization': 'Bearer ' + token, ...(opts.headers||{}) },
        });
        if(r.status === 401) {
          this._clearToken();
          const newToken = await this.ensureToken();
          return fetch(url, {
            ...opts,
            headers: { 'Authorization': 'Bearer ' + newToken, ...(opts.headers||{}) },
          });
        }
        return r;
      },

      async findFile() {
        // Check cached fileId first
        if(!this.fileId) {
          try { this.fileId = localStorage.getItem('btc-gdrive-fileid') || null; } catch {}
        }
        const r = await this._fetch(
          `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D'${GDRIVE_FILENAME}'&orderBy=modifiedTime%20desc&fields=files(id,name,modifiedTime)`
        );
        // A 403/429/5xx body has no `files`, which used to read as "no file on Drive" — the
        // caller then created a duplicate file, or pushed local over data it never saw.
        // "Couldn't ask" must stay distinct from "asked, and there is nothing".
        if(!r.ok) { console.error('[GDrive] findFile failed:', r.status); throw driveUnreachable(r.status); }
        const data = await r.json();
        dlog('[GDrive] findFile response:', data);
        if(data.files && data.files.length > 0) {
          this.fileId = data.files[0].id;
          // Drive's own modifiedTime is monotonic per file and immune to client clock skew —
          // unlike the lastModified string each device stamps for itself.
          this.modifiedTime = data.files[0].modifiedTime || null;
          localStorage.setItem('btc-gdrive-fileid', this.fileId);
          return data.files[0];
        }
        this.fileId = null;
        this.modifiedTime = null;
        localStorage.removeItem('btc-gdrive-fileid');
        return null;
      },

      async pull() {
        await this.ensureToken();
        const file = await this.findFile();
        if(!file) { dlog('[GDrive] pull: no file found'); return null; }
        dlog('[GDrive] pull: reading file', this.fileId);
        const r = await this._fetch(
          `https://www.googleapis.com/drive/v3/files/${this.fileId}?alt=media`
        );
        if(!r.ok) { console.error('[GDrive] pull failed:', r.status); if(DEBUG) console.error(await r.text()); throw driveUnreachable(r.status); }
        const data = await r.json();
        dlog('[GDrive] pull: got data with', data?.transactions?.length, 'transactions');
        // Remember which server revision this content came from
        if(data && typeof data === 'object') data._driveModifiedTime = this.modifiedTime;
        return data;
      },

      // expectedModifiedTime: abort rather than overwrite if Drive has moved on since we last
      // saw it. A check-then-act race remains, but the window shrinks from hours to millis.
      //
      // opts.urgent marks a push issued while the page is being hidden or torn down. The
      // document can die at ANY await, so an urgent push trades two safety features for a
      // chance of landing at all:
      //   - it skips the findFile() round-trip and reuses the cached fileId, removing a whole
      //     request from the critical path;
      //   - it sets keepalive on the upload so the browser finishes it after the page is gone.
      // The cost is that conflict detection goes stale (modifiedTime is not re-read), so an
      // urgent push can overwrite a foreign write. That is the deliberate trade: the pending
      // marker survives in localStorage either way, and the next launch reconciles. Losing the
      // edit outright — the old behaviour — is strictly worse than a detectable overwrite.
      async push(data, expectedModifiedTime, opts={}) {
        const urgent = !!opts.urgent;
        await this.ensureToken();
        const body = JSON.stringify(data);
        dlog('[GDrive] push:', data?.transactions?.length, 'transactions', data?.vault ? 'with vault' : 'without vault', urgent ? '(urgent)' : '');

        // Search for the existing file first (also refreshes modifiedTime). Skipped for an
        // urgent push that already knows the fileId.
        if(!urgent || !this.fileId) await this.findFile();

        if(this.fileId) {
          if(expectedModifiedTime && this.modifiedTime && this.modifiedTime !== expectedModifiedTime) {
            const err = new Error('drive_changed');
            err.code = 'drive_changed';
            err.remoteModifiedTime = this.modifiedTime;
            throw err;
          }
          dlog('[GDrive] push: updating existing file', this.fileId);
          // keepalive is capped at 64KB per browser spec, and the cap covers the whole request.
          // Over that the request is rejected outright, so fall back to a normal fetch and let
          // the retry queue cover it.
          const useKeepalive = urgent && (() => {
            try { return new Blob([body]).size < 60000; } catch { return body.length < 60000; }
          })();
          const r = await this._fetch(
            `https://www.googleapis.com/upload/drive/v3/files/${this.fileId}?uploadType=media&fields=id,modifiedTime`,
            { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body, ...(useKeepalive ? { keepalive: true } : {}) }
          );
          if(!r.ok) { console.error('[GDrive] push update failed:', r.status); if(DEBUG) console.error(await r.text()); throw new Error('push failed'); }
          const res = await r.json().catch(() => null);
          this.modifiedTime = res?.modifiedTime || null;
          // Storing an empty revision would switch off conflict detection for the next push.
          // Read it back instead; if even that fails, leave the previous marker in place.
          if(!this.modifiedTime) { try { await this.findFile(); } catch {} }
        } else {
          dlog('[GDrive] push: creating new file');
          const boundary = 'btc_boundary_' + Date.now();
          const multipart =
            '--' + boundary + '\r\n' +
            'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
            JSON.stringify({ name: GDRIVE_FILENAME, parents: ['appDataFolder'] }) + '\r\n' +
            '--' + boundary + '\r\n' +
            'Content-Type: application/json\r\n\r\n' +
            body + '\r\n' +
            '--' + boundary + '--';
          const r = await this._fetch(
            'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime',
            { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + boundary }, body: multipart }
          );
          if(!r.ok) { console.error('[GDrive] push create failed:', r.status); if(DEBUG) console.error(await r.text()); throw new Error('push failed'); }
          const res = await r.json();
          this.fileId = res.id;
          this.modifiedTime = res.modifiedTime || null;
          localStorage.setItem('btc-gdrive-fileid', this.fileId);
          dlog('[GDrive] push: created file', this.fileId);
        }
        // Record the revision we just produced so the next push can detect a foreign write
        if(this.modifiedTime) { try { localStorage.setItem('btc-drive-seen-mtime', this.modifiedTime); } catch {} }
        return true;
      },
      
      // Local cleanup runs whether or not a token is live: it used to sit inside
      // `if(this.accessToken)`, so after a refused silent refresh Disconnect did nothing at all.
      //
      // btc-drive-seen-mtime and btc-pending-push are deliberately KEPT. They are this
      // device's record of "which Drive revision my data is based on" and "I have changes
      // Drive hasn't seen". Wiping them meant a reconnect could never notice that another
      // device had written in the meantime, and fell back to comparing device clocks.
      async signOut() {
        if(this.accessToken) {
          try { google.accounts.oauth2.revoke(this.accessToken); } catch {}
        }
        this._clearToken();
        this.fileId = null;
        this.modifiedTime = null;
        try { localStorage.removeItem('btc-gdrive-fileid'); } catch {}
      },
      
      isSignedIn() { return this.isTokenValid(); },

      // Connected this session, even if the hour-long token has since lapsed. _clearToken()
      // (sign-out, or a refused silent refresh) is what ends a session — not the clock.
      hasSession() { return !!this.accessToken; }
    };

    // ─── Boot watchdog ──────────────────────────────────────────────────────
    // An error boundary can't help if React never mounts — a Babel syntax error, a blocked
    // CDN, or an SRI failure all produce a white page with no route to the user's data.
    // This lives in the plain (non-Babel) script on purpose, so it survives all three.
    // ES5 syntax only: it is not transpiled.
    window.__satBooted = false;

    // Build a rescue download straight from localStorage. Each value is parsed
    // INDIVIDUALLY and falls back to the raw string — the whole premise is that stored data
    // may be malformed, so a rescue that itself throws would be useless.
    window.__satRescue = function () {
      var keys = ['btc-tx-v2', 'btc-wallets', 'btc-settings', 'btc-vault', 'btc-last-modified',
                  'btc-presync-backup', 'btc-tx-v2-corrupt', 'btc-wallets-corrupt'];
      var out = { rescuedAt: new Date().toISOString(), note: 'Emergency export. Values that could not be parsed are included verbatim under _raw_<key>.' };
      for (var i = 0; i < keys.length; i++) {
        var k = keys[i], raw = null;
        try { raw = localStorage.getItem(k); } catch (e) { continue; }
        if (raw === null) continue;
        try { out[k] = JSON.parse(raw); } catch (e) { out['_raw_' + k] = raw; }
      }
      try {
        var blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'satledger-rescue-' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      } catch (e) {
        // Last resort if Blob/download is unavailable: put it on screen to copy by hand
        alert('Could not build a download. Copy this text instead:\n\n' + JSON.stringify(out));
      }
    };

    window.__satShowBootFallback = function (detail) {
      if (window.__satFallbackShown) return;
      window.__satFallbackShown = true;
      var root = document.getElementById('root');
      if (!root) return;
      // Inline styles only, so this still renders if the stylesheet failed too
      root.innerHTML =
        '<div style="max-width:640px;margin:12vh auto;padding:2rem;font-family:system-ui,-apple-system,sans-serif;line-height:1.6;color:#111">' +
          '<h1 style="font-size:1.25rem;margin-bottom:.75rem">SatLedger could not start</h1>' +
          '<p style="margin-bottom:1rem;color:#555">Your data is still saved in this browser. Download a copy before trying anything else.</p>' +
          '<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.25rem">' +
            '<button id="sat-rescue-btn" style="padding:.6rem 1rem;border-radius:999px;border:0;background:#f7931a;color:#fff;font-weight:600;cursor:pointer">Download my data</button>' +
            '<button id="sat-reload-btn" style="padding:.6rem 1rem;border-radius:999px;border:1px solid #ccc;background:#fff;cursor:pointer">Reload</button>' +
            '<button id="sat-clearcache-btn" style="padding:.6rem 1rem;border-radius:999px;border:1px solid #ccc;background:#fff;cursor:pointer">Clear cached prices &amp; reload</button>' +
          '</div>' +
          (detail ? '<pre style="white-space:pre-wrap;font-size:.75rem;color:#777;background:#f6f6f6;padding:.75rem;border-radius:6px;overflow:auto">' + String(detail).replace(/[<>&]/g, '') + '</pre>' : '') +
        '</div>';
      document.getElementById('sat-rescue-btn').onclick = window.__satRescue;
      document.getElementById('sat-reload-btn').onclick = function () { location.reload(); };
      // A corrupt price cache is the likeliest soft-brick, and it is fully rebuildable
      document.getElementById('sat-clearcache-btn').onclick = function () {
        try { localStorage.removeItem('btc-price-history-v1'); } catch (e) {}
        location.reload();
      };
    };

    setTimeout(function () {
      if (!window.__satBooted) window.__satShowBootFallback('The app did not finish loading within 8 seconds.');
    }, 8000);

    window.addEventListener('error', function (e) {
      if (!window.__satBooted) window.__satShowBootFallback(e.message || 'Script error');
    });
    window.addEventListener('unhandledrejection', function (e) {
      if (!window.__satBooted) window.__satShowBootFallback((e.reason && e.reason.message) || 'Unhandled promise rejection');
    });

    // Offline support — service workers require HTTPS (or localhost); skipped on file://
    if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service worker registration failed:', e));
      });
    }

    // A long-open tab or installed PWA never re-navigates, so a deploy only reached it on a
    // manual reload. Compare this page's ETag now and then (on return to the tab, at most
    // every 30 min) and let the app offer a reload. HEAD bypasses the service worker, which
    // only handles GET.
    (function () {
      var baseline = null, lastCheck = 0;
      function check() {
        if (Date.now() - lastCheck < 30 * 60e3) return;
        lastCheck = Date.now();
        fetch(location.pathname, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
          var tag = r.ok && (r.headers.get('etag') || r.headers.get('last-modified'));
          if (!tag) return;
          if (baseline === null) { baseline = tag; return; }
          if (tag !== baseline) {
            window.__satUpdateAvailable = true;
            window.dispatchEvent(new Event('satledger:update-available'));
          }
        }).catch(function () {});
      }
      window.addEventListener('load', check);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') check();
      });
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>

    .logo-icon { width:30px; height:30px; border-radius:50%; flex-shrink:0; object-fit:contain; }
    [data-theme="light"] .logo-icon-dark { display:none; }
    [data-theme="dark"] .logo-icon-light { display:none; }
    .logo-text { font-size:1.0625rem; font-weight:600; letter-spacing:-.02em; white-space:nowrap; display:block; }
    .logo-tagline { font-size:.6875rem; color:var(--text-tertiary); font-weight:400; white-space:nowrap; border-left:1px solid var(--border-color); padding-left:.625rem; margin-left:.25rem; }
    .header-actions { display:flex; gap:.5rem; align-items:center; }
    .sidebar-collapse-btn { width:32px; height:32px; border-radius:7px; background:var(--bg-tertiary); border:1px solid var(--border-color); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-secondary); transition:all .15s; }
    .sidebar-collapse-btn:hover { border-color:var(--border-hover); color:var(--text-primary); background:var(--bg-secondary); }

    /* App body: sidebar + main */
    .app-body { display:flex; flex:1; padding-top:var(--app-header-height); }

    /* Sidebar */
    .sidebar { width:220px; background:var(--bg-secondary); border-right:1px solid var(--border-color); display:flex; flex-direction:column; flex-shrink:0; transition:width .2s ease; overflow:hidden; height:calc(100vh - var(--app-header-height)); position:fixed; top:var(--app-header-height); z-index:100; }
    .sidebar ~ .main { margin-left:220px; transition:margin-left .2s ease; }
    .sidebar.collapsed ~ .main { margin-left:60px; }
    .sidebar.collapsed { width:60px; }
    .sidebar-nav { flex:1; padding:.5rem; display:flex; flex-direction:column; gap:2px; overflow-y:auto; }
    .sidebar-item { display:flex; align-items:center; gap:.75rem; padding:.625rem .75rem; border-radius:8px; border:none; background:none; cursor:pointer; color:var(--text-secondary); font-size:.875rem; font-weight:500; font-family:inherit; transition:all .15s; white-space:nowrap; width:100%; text-align:left; }
    .sidebar-item:hover { background:var(--bg-tertiary); color:var(--text-primary); }
    .sidebar-item.active { background:var(--bitcoin-light); color:var(--bitcoin-orange); font-weight:600; }
    .sidebar-item svg { flex-shrink:0; margin-left:10px; }
    .sidebar-item-label { opacity:1; transition:opacity .15s; }
    .sidebar.collapsed .sidebar-item-label { opacity:0; width:0; overflow:hidden; }
    .sidebar.collapsed .sidebar-item { justify-content:center; padding:.625rem 1rem; }
    .sidebar-theme { padding:.625rem .5rem; display:flex; align-items:center; justify-content:center; gap:.75rem; }
    .sidebar-theme-toggle { width:38px; height:22px; border-radius:11px; border:none; cursor:pointer; position:relative; transition:background .2s; flex-shrink:0; margin-left:0; }
    .sidebar-theme-toggle.light { background:var(--border-color); }
    .sidebar-theme-toggle.dark { background:var(--bitcoin-orange); }
    .sidebar-theme-toggle .toggle-knob { width:16px; height:16px; border-radius:8px; background:#fff; position:absolute; top:3px; transition:left .2s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
    .sidebar-theme-toggle.light .toggle-knob { left:3px; }
    .sidebar-theme-toggle.dark .toggle-knob { left:19px; }
    .sidebar-theme-label { font-size:.8125rem; color:var(--text-secondary); font-weight:500; white-space:nowrap; }
    .sidebar.collapsed .sidebar-theme-label { opacity:0; width:0; overflow:hidden; }
    .sidebar.collapsed .sidebar-theme { justify-content:center; }
    .sidebar-utility-links { border-top:1px solid var(--border-color); padding-top:.25rem; }
    .theme-switch { position:relative; display:inline-block; width:38px; height:22px; flex-shrink:0; }
    .theme-switch input { opacity:0; width:0; height:0; }
    .theme-slider { position:absolute; cursor:pointer; inset:0; background:var(--border-color); border-radius:11px; transition:background .2s; }
    .theme-slider::before { content:''; position:absolute; width:16px; height:16px; border-radius:8px; background:#fff; left:3px; top:3px; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
    .theme-switch input:checked + .theme-slider { background:var(--bitcoin-orange); }
    .theme-switch input:checked + .theme-slider::before { transform:translateX(16px); }
    .sidebar-version { padding:.375rem .75rem; font-size:.6875rem; color:var(--text-tertiary); font-family:'JetBrains Mono',monospace; text-align:center; border-top:1px solid var(--border-color); }
    .sidebar.collapsed .sidebar-version { font-size:.5625rem; }

    /* Mobile bottom navigation */
    .mobile-bottom-nav {
      display:none;
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      width:100vw;
      max-width:100vw;
      z-index:320;
      padding:.55rem .6rem calc(.55rem + env(safe-area-inset-bottom, 0px));
      background:rgba(255,255,255,.96);
      border-top:1px solid var(--border-color);
      backdrop-filter:blur(18px);
      box-shadow:0 -8px 24px rgba(15,23,42,.08);
      visibility:hidden;
      opacity:0;
      pointer-events:none;
      align-items:stretch;
      gap:.35rem;
    }
    [data-theme="dark"] .mobile-bottom-nav { background:rgba(20,20,20,.96); }
    .mobile-bottom-nav-item {
      display:flex;
      flex:1 1 0;
      width:100%;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:.28rem;
      min-height:52px;
      border:none;
      border-radius:12px;
      background:none;
      color:var(--text-secondary);
      font:inherit;
      font-size:.64rem;
      font-weight:600;
      letter-spacing:.01em;
      cursor:pointer;
      transition:all .15s ease;
    }
    .mobile-bottom-nav-item svg { flex-shrink:0; }
    .mobile-bottom-nav-item.active {
      background:var(--bitcoin-light);
      color:var(--bitcoin-orange);
    }
    .mobile-bottom-nav-item:active { transform:translateY(1px); }
    .mobile-bottom-nav-label {
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    /* Main */
    .main {
      flex:1; max-width:100%; width:100%; margin:0 auto; padding:1.5rem; min-width:0; overflow-x:hidden;
      background-color:var(--main-surface);
      background-image:radial-gradient(circle, var(--main-dot-color) 1.2px, transparent 1.2px);
      background-size:20px 20px;
      background-position:10px 10px;
    }

    /* Buttons */
    .btn { padding:.5rem 1rem; border-radius:8px; font-size:.8125rem; font-weight:500; border:none; cursor:pointer; transition:all .15s; font-family:inherit; white-space:nowrap; display:inline-flex; align-items:center; gap:.375rem; }
    .btn:active { transform:translateY(1px); }
    .btn-primary { background:var(--bitcoin-orange); color:#fff; }
    .btn-primary:hover { background:#e8890f; box-shadow:var(--shadow-md); }
    .btn-secondary { background:var(--bg-tertiary); color:var(--text-primary); border:1px solid var(--border-color); }
    .btn-secondary:hover { border-color:var(--border-hover); background:var(--bg-secondary); }
    .btn-danger { background:var(--red-light); color:var(--red); border:1px solid var(--red); }
    .btn-danger:hover { background:var(--red); color:#fff; }
    .btn-sm { padding:.375rem .75rem; font-size:.75rem; }
    .btn-icon { width:32px; height:32px; padding:0; border-radius:7px; background:var(--bg-tertiary); border:1px solid var(--border-color); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; transition:all .15s; font-size:.9375rem; color:var(--text-primary); }
    .btn-icon:hover { border-color:var(--border-hover); background:var(--bg-secondary); color:var(--text-primary); }
    .btn-icon-danger:hover { background:var(--red-light); border-color:var(--red); color:var(--red); }
    [data-theme="dark"] .btn-icon { color:#e5e5e5; border-color:#404040; }
    [data-theme="dark"] .btn-icon:hover { color:#fff; border-color:#525252; }

    /* Cards / Sections */
    .card { background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:12px; box-shadow:var(--shadow-sm); overflow:hidden; margin-bottom:1.25rem; }
    .settings-grid { column-count:2; column-gap:1.25rem; }
    .settings-grid .card { margin-bottom:1.25rem; break-inside:avoid; display:inline-block; width:100%; }
    @media(max-width:768px) { .settings-grid { column-count:1; } }
    .card-header { padding:1.125rem 1.5rem; border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center; gap:1rem; }
    .card-title { font-size:1rem; font-weight:600; letter-spacing:-.01em; }
    .card-body { padding:1.25rem 1.5rem; }
    /* (.legal-* rules removed — privacy.html and terms.html are standalone documents that
       define their own copies, and the in-app LegalPage component was never rendered.) */

    /* Stats grid */
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; margin-bottom:1.25rem; }
    .stat-card { background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:12px; padding:1.25rem; box-shadow:var(--shadow-sm); transition:all .2s; }
    .stat-card:hover { box-shadow:var(--shadow-md); border-color:var(--border-hover); }
    .stat-label { font-size:.75rem; color:var(--text-secondary); font-weight:600; text-transform:uppercase; letter-spacing:.06em; margin-bottom:.375rem; }
    .stat-value { font-size:1.625rem; font-weight:700; font-family:'JetBrains Mono',monospace; letter-spacing:-.02em; line-height:1.2; }
    .stat-sub { font-size:.75rem; color:var(--text-tertiary); margin-top:.25rem; }
    .stat-value.btc { color:var(--bitcoin-orange); }
    .stat-value.green { color:var(--green); }
    .stat-value.red { color:var(--red); }
    .stat-value.zero { color:var(--text-tertiary); }
    .sample-badge { font-size:.625rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; background:var(--bg-tertiary); color:var(--text-tertiary); border:1px solid var(--border-color); border-radius:4px; padding:.125rem .375rem; white-space:nowrap; flex-shrink:0; margin-top:4px; }
    .stat-card.stat-hero { grid-column:span 2; }
    @media(min-width:1100px) { .stats-grid { grid-template-columns:repeat(4,1fr); } }
    .values-hidden .stat-value, .values-hidden .stat-sub, .values-hidden .wallet-btc, .values-hidden .wallet-usd, .values-hidden .pie-total, .values-hidden .chart-subtitle { filter:blur(8px); user-select:none; pointer-events:none; }
    .values-hidden .public-data .chart-subtitle { filter:none; user-select:auto; pointer-events:auto; }
    .scope-badge { display:inline-flex; align-items:center; padding:.16rem .45rem; border-radius:999px; border:1px solid var(--border-color); background:var(--bg-tertiary); color:var(--text-tertiary); font-size:.625rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; white-space:nowrap; }

    /* Badges */
    .badge { display:inline-flex; padding:.2rem .5rem; border-radius:5px; font-size:.6875rem; font-weight:600; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; }
    .badge-buy { background:var(--blue-light); color:var(--blue); }
    .badge-sell { background:var(--red-light); color:var(--red); }
    .badge-transfer { background:var(--purple-light); color:var(--purple); }
    .badge-consolidation { background:var(--blue-light); color:var(--blue); }
    .badge-reward { background:var(--green-light); color:var(--green); }

    /* Table */
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:.8125rem; }
    thead { background:var(--bg-tertiary); }
    th { padding:.75rem 1rem; text-align:left; font-weight:600; font-size:.6875rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text-secondary); border-bottom:1px solid var(--border-color); white-space:nowrap; }
    td { padding:.75rem 1rem; border-bottom:1px solid var(--border-color); vertical-align:middle; }
    tbody tr { transition:background .1s; }
    tbody tr:hover { background:var(--bg-tertiary); }
    tbody tr:last-child td { border-bottom:none; }
    .mono { font-family:'JetBrains Mono',monospace; }

    /* Mobile transaction cards */
    .tx-cards { display:none; }
    .tx-card { background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:10px; padding:.875rem; }
    .tx-card + .tx-card { margin-top:.5rem; }
    .tx-card-row { display:flex; justify-content:space-between; align-items:center; }
    .tx-card-row + .tx-card-row { margin-top:.375rem; }
    .tx-card-label { font-size:.6875rem; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }
    .tx-card-val { font-size:.8125rem; font-weight:600; }

    /* Search/filter bar */
    .filter-bar { display:flex; gap:.625rem; align-items:center; flex-wrap:wrap; padding:1rem 1.5rem; border-bottom:1px solid var(--border-color); background:var(--bg-tertiary); }
    .search-input { padding:.5rem .875rem; border:1px solid var(--border-color); border-radius:8px; font-size:.8125rem; background:var(--bg-secondary); color:var(--text-primary); font-family:inherit; flex:1; min-width:160px; transition:border-color .15s; }
    .search-input:focus { outline:none; border-color:var(--bitcoin-orange); box-shadow:0 0 0 3px rgba(247,147,26,.1); }
    .filter-select { padding:.5rem .75rem; border:1px solid var(--border-color); border-radius:8px; font-size:.8125rem; background:var(--bg-secondary); color:var(--text-primary); font-family:inherit; cursor:pointer; }
    .filter-select:focus { outline:none; border-color:var(--bitcoin-orange); }
    .filter-count { font-size:.75rem; color:var(--text-tertiary); white-space:nowrap; margin-left:auto; }
    .dashboard-filter-row { display:flex; gap:.625rem; align-items:flex-start; flex-wrap:wrap; margin-bottom:.75rem; }
    .dashboard-filter-label { display:flex; flex-direction:column; gap:.125rem; min-width:110px; padding-top:.35rem; }
    .dashboard-filter-label strong { font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text-secondary); }
    .dashboard-filter-label span { font-size:.75rem; color:var(--text-tertiary); }
    .dashboard-filter-actions { display:flex; gap:.375rem; flex-wrap:wrap; }
    .dashboard-wallet-chips { display:flex; gap:.375rem; flex-wrap:wrap; flex:1; }
    .dashboard-range-row { display:flex; gap:.375rem; margin-bottom:1rem; align-items:center; flex-wrap:wrap; }
    .dashboard-filter-row .btn { height:28px; padding:0 .75rem; font-size:.75rem; line-height:1; box-sizing:border-box; }
    .wallet-chip { display:inline-flex; align-items:center; gap:.35rem; height:28px; padding:0 .75rem; border-radius:999px; border:1px solid var(--border-color); background:var(--bg-secondary); color:var(--text-secondary); font-size:.75rem; line-height:1; box-sizing:border-box; cursor:pointer; transition:all .15s; }
    .wallet-chip:hover { border-color:var(--border-hover); color:var(--text-primary); }
    .wallet-chip.active { background:var(--bitcoin-light); color:var(--bitcoin-orange); border-color:rgba(247,147,26,.35); }
    .wallet-chip:disabled { opacity:.6; cursor:default; }

    /* Modal */
    .overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:1000; padding:1rem; animation:fadeIn .2s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .modal { background:var(--bg-secondary); border-radius:16px; box-shadow:var(--shadow-lg); max-width:620px; width:100%; max-height:92vh; overflow-y:auto; animation:slideUp .25s ease; }
    /* The dialog is focused programmatically when it opens (see useModalA11y); the ring on the
       container itself would be noise, but focus rings on the controls inside are untouched. */
    .modal:focus { outline:none; }
    @keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .modal-header { padding:1.25rem 1.5rem; border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center; }
    .modal-title { font-size:1.0625rem; font-weight:600; }
    .modal-body { padding:1.5rem; }
    .modal-footer { padding:1rem 1.5rem; border-top:1px solid var(--border-color); display:flex; justify-content:flex-end; gap:.625rem; }

    /* Form */
    .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:1rem; margin-bottom:1rem; }
    .form-group { display:flex; flex-direction:column; gap:.375rem; }
    .form-group.full { grid-column:1/-1; }
    .form-label { font-size:.8125rem; font-weight:500; color:var(--text-secondary); }
    .form-input, .form-select { padding:.5rem .75rem; border:1px solid var(--border-color); border-radius:8px; font-size:.875rem; font-family:'IBM Plex Sans',sans-serif; background:var(--bg-secondary); color:var(--text-primary); transition:border-color .15s; }
    .form-input[type=number] { font-family:'JetBrains Mono',monospace; }
    .form-input::placeholder { color:var(--text-tertiary); }
    .form-input:focus, .form-select:focus { outline:none; border-color:var(--bitcoin-orange); box-shadow:0 0 0 3px rgba(247,147,26,.1); }
    .price-wrap { position:relative; }
    .price-wrap .form-input { padding-right:2.5rem; }
    /* iOS Safari zooms the whole page into any focused field under 16px and leaves it zoomed.
       !important because several date filters set a smaller size inline. */
    @media (max-width:768px) {
      input:not([type=checkbox]):not([type=radio]), select, textarea { font-size:16px !important; }
    }
    .price-refresh { position:absolute; right:.5rem; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--bitcoin-orange); font-size:1rem; padding:0; display:flex; }
    .price-refresh:hover { opacity:.7; }

    /* Wallet manager */
    .wallet-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1rem; }
    .wallet-card { background:var(--bg-tertiary); border:1px solid var(--border-color); border-radius:10px; padding:1.25rem; transition:all .2s; }
    .wallet-card:hover { border-color:var(--bitcoin-orange); }
    .wallet-card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:.75rem; }
    .wallet-name { font-size:.9375rem; font-weight:600; }
    .wallet-type-badge { font-size:.625rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em; padding:.15rem .5rem; border-radius:4px; background:var(--bitcoin-light); color:var(--bitcoin-orange); }
    .wallet-btc { font-size:1.375rem; font-weight:700; font-family:'JetBrains Mono',monospace; color:var(--bitcoin-orange); }
    .wallet-usd { font-size:.8125rem; color:var(--text-secondary); margin-top:.125rem; font-family:'JetBrains Mono',monospace; }
    .wallet-delta { font-size:.75rem; margin-top:.375rem; }
    .wallet-address { font-size:.6875rem; color:var(--text-tertiary); font-family:'JetBrains Mono',monospace; margin-top:.5rem; word-break:break-all; }

    /* Pie chart */
    .donut-chart-container { display:flex; flex-direction:column; align-items:center; gap:1.25rem; padding:1rem 0; }
    .donut-chart-wrap { position:relative; }
    .donut-segment { transition:opacity .15s, filter .15s; cursor:pointer; }
    .donut-segment:hover { opacity:.85; filter:brightness(1.1); }
    .donut-legend { display:flex; flex-wrap:wrap; justify-content:center; gap:.5rem .875rem; }
    .donut-legend-item { display:flex; align-items:center; gap:.375rem; font-size:.75rem; color:var(--text-secondary); cursor:pointer; }
    .donut-legend-item:hover { color:var(--text-primary); }
    .donut-legend-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .donut-tooltip { position:fixed; pointer-events:none; z-index:1000; background:var(--bg-primary); border:1px solid var(--border-color); border-radius:10px; padding:.75rem 1rem; box-shadow:0 8px 24px rgba(0,0,0,.15); min-width:180px; }
    .donut-tooltip .dt-name { font-size:.875rem; font-weight:600; margin-bottom:.25rem; }
    .donut-tooltip .dt-type { font-size:.625rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em; padding:.1rem .4rem; border-radius:3px; background:var(--bitcoin-light); color:var(--bitcoin-orange); display:inline-block; margin-bottom:.5rem; }
    .donut-tooltip .dt-row { display:flex; justify-content:space-between; gap:1rem; font-size:.8125rem; padding:.125rem 0; }
    .donut-tooltip .dt-label { color:var(--text-tertiary); }
    .donut-tooltip .dt-value { font-family:'JetBrains Mono',monospace; font-weight:600; }
    .donut-tooltip .dt-pct { color:var(--bitcoin-orange); }

    /* Audit / reconcile */
    .audit-row { display:flex; justify-content:space-between; align-items:center; padding:.625rem 0; border-bottom:1px solid var(--border-color); font-size:.875rem; }
    .audit-row:last-child { border-bottom:none; }
    .audit-label { color:var(--text-secondary); }
    .audit-value { font-family:'JetBrains Mono',monospace; font-weight:600; }
    .audit-ok { color:var(--green); }
    .audit-warn { color:#d97706; }
    .audit-err { color:var(--red); }
    /* An emptied archived wallet is the expected end state, not something to flag */
    .audit-muted { color:var(--text-tertiary); }

    /* Toggle */
    .theme-toggle { width:34px; height:34px; border-radius:8px; background:var(--bg-tertiary); border:1px solid var(--border-color); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1rem; transition:all .2s; }
    .theme-toggle:hover { border-color:var(--border-hover); }

    /* Empty state */
    .empty { text-align:center; padding:3rem 1rem; color:var(--text-tertiary); }
    .empty-icon { font-size:3rem; opacity:.3; margin-bottom:.75rem; }
    .empty-text { font-size:1rem; color:var(--text-secondary); margin-bottom:.25rem; }
    .empty-sub { font-size:.8125rem; }

    /* Price pill */
    .price-pill { display:inline-flex; align-items:center; gap:.375rem; font-size:.75rem; padding:.25rem .625rem; border-radius:100px; background:var(--bitcoin-light); color:var(--bitcoin-orange); font-weight:600; font-family:'JetBrains Mono',monospace; transition:opacity .15s; }
    .price-pill:hover { opacity:.8; }
    .price-dot { width:6px; height:6px; border-radius:50%; background:var(--bitcoin-orange); animation:pulse 2s infinite; }
    .price-dot.loading { animation:spin 1s linear infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

    /* Sync status */
    .sync-pill { display:inline-flex; align-items:center; gap:.375rem; font-size:.6875rem; padding:.25rem .625rem; border-radius:100px; font-weight:600; white-space:nowrap; cursor:pointer; border:1px solid var(--border-color); background:var(--bg-tertiary); color:var(--text-secondary); transition:all .15s; }
    .sync-pill:hover { border-color:var(--border-hover); }

const DEFAULT_RSI_THRESHOLDS = { overbought: 70, oversold: 30 };
const RSI_ZONE_COLORS = {
  neutral: '#ec4899',
  overbought: '#dc2626',
  oversold: '#16a34a',
};

function normalizeRsiThresholds(thresholds) {
  if(thresholds === undefined) return { ...DEFAULT_RSI_THRESHOLDS };
  const rawOverbought = Number(thresholds?.overbought);
  const rawOversold = Number(thresholds?.oversold);
  const overbought = Number.isFinite(rawOverbought) && rawOverbought > 0 && rawOverbought <= 100
    ? rawOverbought
    : null;
  const oversold = Number.isFinite(rawOversold) && rawOversold > 0 && rawOversold <= 100
    ? rawOversold
    : null;
  if(overbought != null && oversold != null && oversold >= overbought) return { ...DEFAULT_RSI_THRESHOLDS };
  return { overbought, oversold };
}

// Per-device view state. Stored in btc-settings with everything else, but changing one is not
// a data edit (no commit stamp, no push), a pull never overwrites this device's values, and
// the sync conflict dialog ignores them.
const DEVICE_VIEW_SETTING_KEYS = ['chartRange', 'chartRangeCustom', 'hideValues', 'dashboardWalletFilter'];
const withoutViewSettings = (s) => {
  const out = {...(s && typeof s === 'object' ? s : {})};
  DEVICE_VIEW_SETTING_KEYS.forEach(k => { delete out[k]; });
  return out;
};
const keepLocalViewSettings = (remoteSettings, localSettings) => {
  const out = {...remoteSettings};
  DEVICE_VIEW_SETTING_KEYS.forEach(k => {
    if(localSettings && Object.prototype.hasOwnProperty.call(localSettings, k)) out[k] = localSettings[k];
  });
  return out;
};

// Settings arrive from backups and from Drive, i.e. from files anyone can hand-edit. A value of
// the wrong type — `chartOrder: "x"` — threw on every render, and because settings sync, it
// bricked every device at once. Wrong-typed keys are dropped so each consumer's default applies.
const SETTINGS_TYPE_GUARDS = {
  chartOrder: v => Array.isArray(v) && v.every(k => typeof k === 'string'),
  hiddenCharts: v => v && typeof v === 'object' && !Array.isArray(v),
  hiddenStats: v => v && typeof v === 'object' && !Array.isArray(v),
  maLines: v => v && typeof v === 'object' && !Array.isArray(v),
  dashboardWalletFilter: v => v === null || (Array.isArray(v) && v.every(k => typeof k === 'string')),
  chartRange: v => typeof v === 'string',
  chartRangeCustom: v => typeof v === 'string',
  defaultTxType: v => VALID_TX_TYPES.includes(v),
  hideValues: v => typeof v === 'boolean',
  bgDots: v => typeof v === 'boolean',
  showVault: v => typeof v === 'boolean',
};
function normalizeSettings(nextSettings) {
  const raw = nextSettings && typeof nextSettings === 'object' && !Array.isArray(nextSettings) ? nextSettings : {};
  const base = {...raw};
  for(const [k, valid] of Object.entries(SETTINGS_TYPE_GUARDS)) {
    if(Object.prototype.hasOwnProperty.call(base, k) && base[k] !== undefined && !valid(base[k])) delete base[k];
  }
  return {
    defaultTxType: 'Buy',
    // Defaulted here so every chart agrees. Leaving it undefined meant each consumer applied
    // its own fallback, and the moving-average chart disagreed with the rest of the dashboard.
    chartRange: 'All',
    ...base,
    displayUnit: base.displayUnit === 'sats' ? 'sats' : 'btc',
    rsiThresholds: normalizeRsiThresholds(base.rsiThresholds),
  };
}

function getRsiState(value, thresholds = DEFAULT_RSI_THRESHOLDS) {
  if(value == null || !Number.isFinite(Number(value))) return 'neutral';
  if(thresholds.overbought != null && value >= thresholds.overbought) return 'overbought';
  if(thresholds.oversold != null && value <= thresholds.oversold) return 'oversold';
  return 'neutral';
}

function getRsiColor(value, thresholds = DEFAULT_RSI_THRESHOLDS) {
  return RSI_ZONE_COLORS[getRsiState(value, thresholds)] || RSI_ZONE_COLORS.neutral;
}

function validateRsiThresholdDraft(draft) {
  const rawOverbought = String(draft.overbought ?? '').trim();
  const rawOversold = String(draft.oversold ?? '').trim();
  const overbought = rawOverbought === '' ? null : Number(rawOverbought);
  const oversold = rawOversold === '' ? null : Number(rawOversold);
  if((overbought != null && !Number.isFinite(overbought)) || (oversold != null && !Number.isFinite(oversold))) {
    return { error: 'RSI thresholds must be numeric values.' };
  }
  if((overbought != null && (overbought < 0 || overbought > 100)) || (oversold != null && (oversold < 0 || oversold > 100))) {
    return { error: 'RSI thresholds must stay between 0 and 100.' };
  }
  const normalizedOverbought = overbought && overbought > 0 ? overbought : null;
  const normalizedOversold = oversold && oversold > 0 ? oversold : null;
  if(normalizedOverbought != null && normalizedOversold != null && normalizedOversold >= normalizedOverbought) {
    return { error: 'Oversold must be lower than overbought.' };
  }
  if(normalizedOverbought == null && normalizedOversold == null) {
    return { overbought: null, oversold: null, error: '' };
  }
  if(normalizedOverbought == null || normalizedOversold == null) {
    return { overbought: normalizedOverbought, oversold: normalizedOversold, error: '' };
  }
  return { overbought: normalizedOverbought, oversold: normalizedOversold, error: '' };
}

// Catches a render throw so malformed stored data shows a page with an export button instead
// of a blank screen. Recovery goes through window.__satRescue (which reads localStorage
// directly) rather than the app's own exporter — App state is exactly what's broken here.
// Inline styles only, so it survives a stylesheet failure too.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) {
    // Always log — swallowing this would make the app undebuggable
    console.error('Render error caught by boundary:', error, info?.componentStack);
  }
  render() {
    if(!this.state.error) return this.props.children;
    const wrap = {maxWidth:640,margin:'12vh auto',padding:'2rem',fontFamily:'system-ui,-apple-system,sans-serif',lineHeight:1.6};
    const btn = {padding:'.6rem 1rem',borderRadius:999,border:0,background:'#f7931a',color:'#fff',fontWeight:600,cursor:'pointer'};
    const btn2 = {padding:'.6rem 1rem',borderRadius:999,border:'1px solid #ccc',background:'transparent',cursor:'pointer'};
    return (
      <div style={wrap}>
        <h1 style={{fontSize:'1.25rem',marginBottom:'.75rem'}}>Something went wrong</h1>
        <p style={{marginBottom:'1rem',opacity:.75}}>
          Your data is still saved in this browser. Download a copy before trying anything else.
        </p>
        <div style={{display:'flex',gap:'.5rem',flexWrap:'wrap',marginBottom:'1.25rem'}}>
          <button style={btn} onClick={()=>window.__satRescue && window.__satRescue()}>Download my data</button>
          <button style={btn2} onClick={()=>location.reload()}>Reload</button>
          <button style={btn2} onClick={()=>{ try{localStorage.removeItem(HISTORICAL_PRICE_CACHE_KEY);}catch(e){} location.reload(); }}>
            Clear cached prices &amp; reload
          </button>
        </div>
        <details style={{fontSize:'.8125rem',opacity:.7}}>
          <summary style={{cursor:'pointer'}}>Technical details</summary>
          <pre style={{whiteSpace:'pre-wrap',marginTop:'.5rem',fontSize:'.75rem'}}>
            {String(this.state.error?.stack || this.state.error)}
          </pre>
        </details>
      </div>
    );
  }
}

// Rolling sums instead of a fresh inner loop per window. The 200-week average alone was
// ~4,200 × 1,400 ≈ 6M additions per rebuild; this is ~3 additions per day instead.
// Float note: subtracting the departing element drifts vs. re-summing, but over ~4,200 prices
// in the 1e4–1e5 range the drift is ~1e-9 — invisible after .toFixed(2). Not worth Kahan.
// ─── Modal accessibility ─────────────────────────────────────────────────────
// One implementation for every overlay in the app: dialog semantics, a Tab trap, Escape to
// close, body scroll lock, and focus restored to whatever opened it. Attach the returned ref
// to the .modal element.
//
// The keydown listener is bound to the DIALOG NODE, not window, on purpose: TransferWizard
// already has a window-level Escape handler, and a node-scoped listener plus stopPropagation
// keeps a stacked confirm dialog from also closing the modal underneath it.
// Body scroll is reference-counted, NOT saved and restored per modal. With save/restore, a
// confirm dialog stacked on the transaction form would capture 'hidden' as the value to put
// back, and whichever cleanup ran last won — leaving the page permanently unscrollable after
// closing both. Only the last modal to close unlocks.
let modalScrollLocks = 0;
let modalScrollPrevious = '';
const lockBodyScroll = () => {
  if(modalScrollLocks === 0) {
    modalScrollPrevious = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
  }
  modalScrollLocks++;
};
const unlockBodyScroll = () => {
  modalScrollLocks = Math.max(0, modalScrollLocks - 1);
  if(modalScrollLocks === 0) document.body.style.overflow = modalScrollPrevious;
};

function useModalA11y(onClose) {
  const ref = React.useRef(null);
  const onCloseRef = React.useRef(onClose);
  onCloseRef.current = onClose;
  React.useEffect(() => {
    const node = ref.current;
    if(!node) return;
    const previouslyFocused = document.activeElement;
    lockBodyScroll();

    const focusables = () => Array.from(node.querySelectorAll(
      'a[href],button:not([disabled]),input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'
    )).filter(el => el.offsetParent !== null || el === document.activeElement);

    (focusables()[0] || node).focus();

    const onKeyDown = (e) => {
      if(e.key === 'Escape') {
        e.stopPropagation();
        if(onCloseRef.current) { e.preventDefault(); onCloseRef.current(); }
        return;
      }
      if(e.key !== 'Tab') return;
      const items = focusables();
      if(!items.length) { e.preventDefault(); return; }
      const i = items.indexOf(document.activeElement);
      if(e.shiftKey && i <= 0) { e.preventDefault(); items[items.length-1].focus(); }
      else if(!e.shiftKey && i === items.length-1) { e.preventDefault(); items[0].focus(); }
    };
    node.addEventListener('keydown', onKeyDown);
    return () => {
      node.removeEventListener('keydown', onKeyDown);
      unlockBodyScroll();
      if(previouslyFocused && typeof previouslyFocused.focus === 'function') previouslyFocused.focus();
    };
  }, []);
  return ref;
}

// Backdrop dismissal on mouseDOWN, not click: with onClick, a text selection that starts
// inside the modal and ends on the backdrop counts as a backdrop click and throws the form away.
function backdropHandler(onClose) {
  return (e) => { if(e.target === e.currentTarget) onClose(); };
}

// Wraps a modal body with dialog semantics + the hook above. Children render inside .modal.
function Modal({ onClose, title, titleStyle, headerStyle, maxWidth, showClose = true, closeLabel = 'Close dialog', dismissible = true, children, modalStyle, headerExtra }) {
  const titleId = React.useMemo(() => 'modal-title-' + Math.random().toString(36).slice(2,9), []);
  const ref = useModalA11y(dismissible ? onClose : null);
  return (
    <div className="overlay" onMouseDown={dismissible ? backdropHandler(onClose) : undefined}>
      <div
        className="modal"
        ref={ref}
        role="dialog"
        aria-modal="true"
        aria-labelledby={titleId}
        tabIndex={-1}
        style={{...(maxWidth ? {maxWidth} : {}), ...(modalStyle||{})}}
        onMouseDown={e=>e.stopPropagation()}
        onClick={e=>e.stopPropagation()}
      >
        <div className="modal-header" style={headerStyle}>
          <div style={{display:'flex',alignItems:'center',gap:'.625rem'}}>
            {headerExtra}
            <div className="modal-title" id={titleId} style={titleStyle}>{title}</div>
          </div>
          {showClose && (
            <button className="btn-icon" onClick={onClose} aria-label={closeLabel} type="button">{Icon.X()}</button>
          )}
        </div>
        {children}
      </div>
    </div>
  );
}

// Expanded-chart modal shell. Its own component so useModalA11y can run on mount/unmount —
// the charts render it conditionally, and hooks can't be called conditionally.
function ExpandedChartOverlay({ onClose, title, children, maxWidth = 960 }) {
  const titleId = React.useMemo(() => 'chart-modal-' + Math.random().toString(36).slice(2,9), []);
  const ref = useModalA11y(onClose);
  return ReactDOM.createPortal(
    <div
      style={{position:'fixed',inset:0,zIndex:9999,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(0,0,0,.5)',backdropFilter:'blur(4px)'}}
      onMouseDown={backdropHandler(onClose)}
    >
      <div
        ref={ref}
        role="dialog"
        aria-modal="true"
        aria-labelledby={titleId}
        tabIndex={-1}
        onMouseDown={e=>e.stopPropagation()}
        style={{background:'var(--bg-primary)',borderRadius:'16px',width:'calc(100vw - 2rem)',maxWidth:maxWidth+'px',maxHeight:'calc(100vh - 2rem)',overflow:'auto',boxShadow:'0 25px 50px rgba(0,0,0,.25)',outline:'none'}}
      >
        {typeof children === 'function' ? children(titleId) : children}
      </div>
    </div>,
    document.body
  );
}

function buildMovingAverageSeries(allDays) {
  if(!allDays.length) return [];
  const result = [];
  let avgGain = 0;
  let avgLoss = 0;
  let sum50 = 0, sum200 = 0, sum1400 = 0;
  for(let i = 0; i < allDays.length; i++) {
    const [date, price] = allDays[i];
    const pt = { date, price };
    sum50 += price;   if(i >= 50)   sum50   -= allDays[i - 50][1];
    sum200 += price;  if(i >= 200)  sum200  -= allDays[i - 200][1];
    sum1400 += price; if(i >= 1400) sum1400 -= allDays[i - 1400][1];
    if(i >= 49)   pt.ma50d  = +(sum50 / 50).toFixed(2);
    if(i >= 199)  pt.ma200d = +(sum200 / 200).toFixed(2);
    if(i >= 1399) pt.ma200w = +(sum1400 / 1400).toFixed(2);
    if(i === 14) {
      let gains = 0;
      let losses = 0;
      for(let j = 1; j <= 14; j++) {
        const delta = allDays[j][1] - allDays[j-1][1];
        if(delta >= 0) gains += delta;
        else losses += Math.abs(delta);
      }
      avgGain = gains / 14;
      avgLoss = losses / 14;
      const rs = avgLoss === 0 ? Infinity : avgGain / avgLoss;
      pt.rsi14 = +(100 - (100 / (1 + rs))).toFixed(1);
    } else if(i > 14) {
      const delta = allDays[i][1] - allDays[i-1][1];
      const gain = Math.max(delta, 0);
      const loss = Math.max(-delta, 0);
      avgGain = ((avgGain * 13) + gain) / 14;
      avgLoss = ((avgLoss * 13) + loss) / 14;
      const rs = avgLoss === 0 ? Infinity : avgGain / avgLoss;
      pt.rsi14 = +(100 - (100 / (1 + rs))).toFixed(1);
    }
    result.push(pt);
  }
  return result;
}

// ─── Dashboard Charts ─────────────────────────────────────────────────────────
function DashboardCharts({ transactions, wallets, btcPrice, historicalPrices, historicalPriceLoading, settings, updateSettings, selectedWallets }) {
  const activeWallets = React.useMemo(() => wallets.filter(w => !w.archived), [wallets]);
  const selectedWalletSet = React.useMemo(() => new Set(selectedWallets || []), [selectedWallets]);
  const hasWalletFilter = selectedWalletSet.size > 0;
  const filteredScopeLabel = hasWalletFilter ? 'Selected wallets' : null;
  const globalScopeLabel = hasWalletFilter ? 'Portfolio-wide' : null;
  const { chartData, accumulatedData, dcaData, feeBurnData, rewardData, plData } = React.useMemo(() => {
    const sorted = transactions
      .map(tx => ({ ...tx, normalizedDate: normalizeDate(tx.date) }))
      .filter(tx => tx.normalizedDate)
      .sort((a,b) => a.normalizedDate.localeCompare(b.normalizedDate));
    let totalCost = 0;
    const points = [];
    const accumulatedPoints = [];
    const dcaMap = {};
    let runningBTC = 0;
    let filteredRunningBTC = 0;
    let runningBTCForCost = 0;
    let cumulativeFees = 0;
    let cumulativeRewards = 0;
    let realizedPL = 0;
    const feePoints = [], rewardPoints = [], plPoints = [];
    sorted.forEach(tx => {
      const amt = numOr(tx.amount);
      const fee = numOr(tx.fee);
      const price = numOr(tx.price);
      const w1 = tx.wallet;
      const w2 = tx.wallet2;
      const matchesSelected = !hasWalletFilter || selectedWalletSet.has(w1) || selectedWalletSet.has(w2);

      // Always track BTC balance (all transactions, including excluded)
      if(tx.type==='Buy'||tx.type==='Reward') { runningBTC+=amt; }
      else if(tx.type==='Sell') { runningBTC-=amt; }
      else if(tx.type==='Transfer') { runningBTC-=fee; }
      else if(tx.type==='Consolidation') { runningBTC-=fee; }

      // Cost basis — only non-excluded transactions
      if(!tx.excludeStats) {
        if(tx.type==='Buy') {
          runningBTCForCost+=amt;
          totalCost+=(numOr(tx.totalUsd, amt*price))+fee;
        } else if(tx.type==='Reward') { runningBTCForCost+=amt; }
        else if(tx.type==='Sell') {
          // Net proceeds: USD exchange fee reduces what the sale actually returned
          const proceeds = (numOr(tx.totalUsd, amt*price)) - fee;
          const r = sellFromCostPool(runningBTCForCost, totalCost, amt, proceeds);
          realizedPL += r.realized;
          totalCost = r.poolCost; runningBTCForCost = r.poolBtc;
        } else if(tx.type==='Transfer' || tx.type==='Consolidation') {
          runningBTCForCost = Math.max(0, runningBTCForCost - fee);
        }
      }

      // DCA tracking — Buy transactions only
      if(tx.type==='Buy' && !tx.excludeStats && matchesSelected) {
        const buyUsd = numOr(tx.totalUsd, amt * price);
        if(buyUsd > 0) {
          dcaMap[tx.normalizedDate] = (dcaMap[tx.normalizedDate]||0) + buyUsd;
        }
      }

      // Fee burn tracking — only Transfer/Consolidation fees (actual BTC lost to network)
      // Buy/Sell fees are USD-denominated exchange fees, not BTC burn
      if(fee > 0 && !tx.excludeStats && matchesSelected && (tx.type==='Transfer'||tx.type==='Consolidation')) {
        cumulativeFees += fee;
        const lastFee = feePoints[feePoints.length-1];
        if(lastFee && lastFee.date===tx.normalizedDate) feePoints[feePoints.length-1] = { date:tx.normalizedDate, fees:+cumulativeFees.toFixed(8) };
        else feePoints.push({ date:tx.normalizedDate, fees:+cumulativeFees.toFixed(8) });
      }

      // Reward income tracking
      if(tx.type==='Reward' && !tx.excludeStats && matchesSelected) {
        cumulativeRewards += amt;
        const lastRew = rewardPoints[rewardPoints.length-1];
        if(lastRew && lastRew.date===tx.normalizedDate) rewardPoints[rewardPoints.length-1] = { date:tx.normalizedDate, rewards:+cumulativeRewards.toFixed(8) };
        else rewardPoints.push({ date:tx.normalizedDate, rewards:+cumulativeRewards.toFixed(8) });
      }

      // P&L tracking — record realized P&L and cost snapshot at each transaction date
      // Also track totalBtc (all holdings incl. excluded) for portfolio value chart
      if(tx.type==='Buy'||tx.type==='Sell'||tx.type==='Reward'||tx.type==='Transfer'||tx.type==='Consolidation') {
        const lastPL = plPoints[plPoints.length-1];
        const plPt = { date:tx.normalizedDate, realized:+realizedPL.toFixed(2), btcHeld:+runningBTCForCost.toFixed(8), totalBtc:+runningBTC.toFixed(8), costBasis:+totalCost.toFixed(2) };
        if(lastPL && lastPL.date===tx.normalizedDate) plPoints[plPoints.length-1] = plPt;
        else plPoints.push(plPt);
      }

      // (Monthly summary is bucketed separately below, after the range cutoff is applied —
      // see monthlySummary. Bucketing here and filtering afterwards meant a month was kept or
      // dropped wholesale based on whether its synthetic mid-month date passed the cutoff.)

      // Running BTC for the wallet-filtered holdings series. (Per-wallet balance maps used to
      // be accumulated here too, across ~35 lines, but were never read — walletHoldings in App
      // is the real source for those. Removed so this block stops advertising a total it
      // doesn't actually produce.)
      if(matchesSelected) {
        if(tx.type==='Buy'||tx.type==='Reward') {
          if(selectedWalletSet.has(w1)) filteredRunningBTC += amt;
        } else if(tx.type==='Sell') {
          if(selectedWalletSet.has(w1)) filteredRunningBTC -= amt;
        } else if(tx.type==='Transfer') {
          if(selectedWalletSet.has(w1)) filteredRunningBTC -= (amt + fee);
          if(selectedWalletSet.has(w2)) filteredRunningBTC += amt;
        } else if(tx.type==='Consolidation') {
          if(selectedWalletSet.has(w1)) filteredRunningBTC -= fee;
        }
      }
      const totalBTC = runningBTC;
      const avgCost = runningBTCForCost>0.00000001 ? totalCost/runningBTCForCost : null;
      const pt = { date:tx.normalizedDate, btc:+totalBTC.toFixed(8), avgCost:avgCost!==null ? +avgCost.toFixed(2) : null };
      const accumulatedPt = { date:tx.normalizedDate, btc:+(hasWalletFilter ? filteredRunningBTC : totalBTC).toFixed(8) };
      const last = points[points.length-1];
      if(last && last.date===tx.normalizedDate) points[points.length-1]=pt;
      else points.push(pt);
      const lastAccumulated = accumulatedPoints[accumulatedPoints.length-1];
      if(lastAccumulated && lastAccumulated.date===tx.normalizedDate) accumulatedPoints[accumulatedPoints.length-1]=accumulatedPt;
      else accumulatedPoints.push(accumulatedPt);
    });
    // Trim leading zero-BTC points
    while(points.length > 1 && points[0].btc < 0.00000001) {
      points.shift();
    }
    while(accumulatedPoints.length > 1 && accumulatedPoints[0].btc < 0.00000001) {
      accumulatedPoints.shift();
    }
    const dcaPts = Object.entries(dcaMap).sort((a,b)=>a[0].localeCompare(b[0])).map(([date,buyUsd])=>({date,buyUsd:+buyUsd.toFixed(2)}));
    return { chartData: points, accumulatedData: accumulatedPoints, dcaData: dcaPts, feeBurnData: feePoints, rewardData: rewardPoints, plData: plPoints };
  }, [transactions, wallets, hasWalletFilter, selectedWalletSet]);

  const chartCutoff = React.useMemo(
    () => rangeCutoff(settings.chartRange, settings.chartRangeCustom),
    [settings.chartRange, settings.chartRangeCustom]
  );

  // Monthly summary — bucketed AFTER the range cutoff, so each bar totals only the activity
  // actually inside the selected range, exactly like every other chart.
  //
  // This used to be bucketed over all transactions and then filtered by the bucket's synthetic
  // mid-month date, which meant a month was kept or dropped as a whole depending on which side
  // of the cutoff its 15th fell: with a 3M range ending 25 Apr, the April bar disappeared
  // entirely even though 25-30 Apr were in range.
  const monthlySummary = React.useMemo(() => {
    const monthlyMap = {};
    transactions.forEach(tx => {
      if(tx.excludeStats) return;
      const nd = normalizeDate(tx.date);
      if(!nd || (chartCutoff && nd < chartCutoff)) return;
      if(hasWalletFilter && !selectedWalletSet.has(tx.wallet) && !selectedWalletSet.has(tx.wallet2)) return;
      const month = nd.slice(0,7); // YYYY-MM
      if(!monthlyMap[month]) monthlyMap[month] = { buys:0, sells:0, rewards:0, fees:0 };
      const amt = numOr(tx.amount);
      const fee = numOr(tx.fee);
      const usd = numOr(tx.totalUsd, amt*numOr(tx.price));
      if(tx.type==='Buy') monthlyMap[month].buys += usd;
      else if(tx.type==='Sell') monthlyMap[month].sells += usd;
      if(tx.type==='Reward') monthlyMap[month].rewards += amt;
      if(fee > 0) monthlyMap[month].fees += fee;
    });
    return Object.entries(monthlyMap).sort((a,b)=>a[0].localeCompare(b[0])).map(([month, d])=>({
      // `date` positions the bar at mid-month (the visual centre of the bucket); `label` is what
      // the tooltip and axis show, so the synthetic day never reaches the user.
      date: month+'-15', month, label: fmtMonthLabel(month),
      buys:+d.buys.toFixed(2), sells:+d.sells.toFixed(2), rewards:+d.rewards.toFixed(8), fees:+d.fees.toFixed(8),
    }));
  }, [transactions, chartCutoff, hasWalletFilter, selectedWalletSet]);

  // Time-range filtering
  const rangeFiltered = React.useMemo(() => {
    const cutoff = chartCutoff;
    if(!cutoff) return { chart: chartData, accumulated: accumulatedData, dca: dcaData, fees: feeBurnData, rewards: rewardData, pl: plData, monthly: monthlySummary };
    return {
      chart: chartData.filter(d => d.date >= cutoff),
      accumulated: accumulatedData.filter(d => d.date >= cutoff),
      dca: dcaData.filter(d => d.date >= cutoff),
      fees: feeBurnData.filter(d => d.date >= cutoff),
      rewards: rewardData.filter(d => d.date >= cutoff),
      pl: plData.filter(d => d.date >= cutoff),
      monthly: monthlySummary, // already cutoff-aware
    };
  }, [chartData, accumulatedData, dcaData, feeBurnData, rewardData, plData, monthlySummary, chartCutoff]);

  const costData = React.useMemo(() => rangeFiltered.chart.filter(d=>d.avgCost!==null), [rangeFiltered.chart]);
  // P&L chart data — compute unrealized using historical prices for accuracy
  const plChartData = React.useMemo(() => {
    if(!rangeFiltered.pl.length || !Object.keys(historicalPrices).length) return [];
    // For each date with a historical price, interpolate the realized/cost/holdings from plPoints.
    // NOTE: toISOString() below is CORRECT here — these compare against historicalPrices keys,
    // which are genuine UTC day buckets from dayKeyUTC. Do not "fix" it to a local date.
    const plPts = rangeFiltered.pl;
    const sortedDates = Object.keys(historicalPrices).filter(d => {
      return plPts.length && d >= plPts[0].date && d <= (plPts[plPts.length-1].date > new Date().toISOString().slice(0,10) ? plPts[plPts.length-1].date : new Date().toISOString().slice(0,10));
    }).sort();
    if(!sortedDates.length) return [];
    let pi = 0;
    return sortedDates.map(date => {
      while(pi < plPts.length-1 && plPts[pi+1].date <= date) pi++;
      const snap = plPts[pi];
      if(!snap || date < snap.date) return null;
      const mktPrice = historicalPrices[date];
      const unrealized = snap.btcHeld > 0.00000001 ? +(snap.btcHeld * mktPrice - snap.costBasis).toFixed(2) : 0;
      return { date, realized: snap.realized, unrealized, totalPL: +(snap.realized + unrealized).toFixed(2) };
    }).filter(Boolean);
  }, [rangeFiltered.pl, historicalPrices]);

  // Portfolio Value vs Cost Basis chart data
  const valueBasisData = React.useMemo(() => {
    if(!rangeFiltered.pl.length || !Object.keys(historicalPrices).length) return [];
    const plPts = rangeFiltered.pl;
    const sortedDates = Object.keys(historicalPrices).filter(d => {
      return plPts.length && d >= plPts[0].date && d <= (plPts[plPts.length-1].date > new Date().toISOString().slice(0,10) ? plPts[plPts.length-1].date : new Date().toISOString().slice(0,10));
    }).sort();
    if(!sortedDates.length) return [];
    let pi = 0;
    return sortedDates.map(date => {
      while(pi < plPts.length-1 && plPts[pi+1].date <= date) pi++;
      const snap = plPts[pi];
      if(!snap || date < snap.date) return null;
      const mktPrice = historicalPrices[date];
      const marketValue = +((snap.totalBtc != null ? snap.totalBtc : snap.btcHeld) * mktPrice).toFixed(2);
      return { date, marketValue, costBasis: +snap.costBasis.toFixed(2) };
    }).filter(Boolean);
  }, [rangeFiltered.pl, historicalPrices]);

  // Waterfall data for BTC flow chart
  const waterfallData = React.useMemo(() => {
    const cutoff = rangeCutoff(settings.chartRange, settings.chartRangeCustom) || '1900-01-01';
    const sorted = transactions
      .map(tx => ({ ...tx, normalizedDate: normalizeDate(tx.date) }))
      .filter(tx => tx.normalizedDate)
      .sort((a,b) => a.normalizedDate.localeCompare(b.normalizedDate));
    // Compute starting BTC (all transactions before cutoff)
    let startBTC = 0;
    let buys = 0, rewards = 0, sells = 0, fees = 0;
    sorted.forEach(tx => {
      const amt = numOr(tx.amount);
      const fee = numOr(tx.fee);
      if(tx.normalizedDate < cutoff) {
        // Before range — accumulate into starting balance
        if(tx.type==='Buy') startBTC += amt;
        else if(tx.type==='Reward') startBTC += amt;
        else if(tx.type==='Sell') startBTC -= amt;
        else if(tx.type==='Transfer'||tx.type==='Consolidation') startBTC -= fee;
      } else {
        // In range — track each category
        if(tx.type==='Buy') buys += amt;
        else if(tx.type==='Reward') rewards += amt;
        else if(tx.type==='Sell') sells += amt;
        if(fee > 0 && (tx.type==='Transfer'||tx.type==='Consolidation')) fees += fee;
      }
    });
    const endBTC = startBTC + buys + rewards - sells - fees;
    return { startBTC: +startBTC.toFixed(8), buys: +buys.toFixed(8), rewards: +rewards.toFixed(8), sells: +sells.toFixed(8), fees: +fees.toFixed(8), endBTC: +endBTC.toFixed(8) };
  }, [transactions, settings.chartRange, settings.chartRangeCustom]);

  // Price overlay data for Accumulated BTC chart
  const priceOverlayData = React.useMemo(() => {
    if(!historicalPrices || !Object.keys(historicalPrices).length) return [];
    const chartDates = rangeFiltered.accumulated;
    if(!chartDates.length) return [];
    const minDate = chartDates[0].date;
    const maxDate = chartDates[chartDates.length-1].date;
    return Object.entries(historicalPrices)
      .filter(([d]) => d >= minDate && d <= maxDate)
      .sort((a,b) => a[0].localeCompare(b[0]))
      .map(([date, price]) => ({ date, price }));
  }, [historicalPrices, rangeFiltered.accumulated]);

  // BTC Price with 200D & 200W Moving Averages.
  // Split in two on purpose: the series (a sort over ~4,200 keys plus the full MA/RSI build) now
  // depends only on the price data, so switching 1Y→3M just re-filters instead of rebuilding it.
  const maSeries = React.useMemo(() => {
    if(!historicalPrices || !Object.keys(historicalPrices).length) return [];
    const allDays = Object.entries(historicalPrices).sort((a,b)=>a[0].localeCompare(b[0]));
    if(allDays.length < 200) return [];
    return buildMovingAverageSeries(allDays);
  }, [historicalPrices]);
  const maChartData = React.useMemo(() => {
    const cutoff = rangeCutoff(settings.chartRange, settings.chartRangeCustom);
    return cutoff ? maSeries.filter(d => d.date >= cutoff) : maSeries;
  }, [maSeries, settings.chartRange, settings.chartRangeCustom]);

  // Sample data for empty state
  const isSample = !chartData.length;
  const sampleChartData = React.useMemo(() => {
    if(!isSample) return {};
    const today = new Date();
    const pts = [], dcaPts = [], feePts = [], rewardPts = [], plPts = [], monthlyPts = [], priceOverlayPts = [], valueBasisPts = [];
    const samplePriceForMonth = (idx) => {
      const trend = 18000 + (24 - idx) * 2200;
      const cycle = Math.sin(idx * 0.55) * 11000;
      const noise = Math.cos(idx * 0.18) * 4500;
      return +(trend + cycle + noise).toFixed(2);
    };
    let btc = 0, cost = 0, fees = 0, rewards = 0, realized = 0;
    for(let i = 24; i >= 0; i--) {
      const d = new Date(today.getFullYear(), today.getMonth() - i, 15);
      const date = localDateKey(d);
      const month = date.slice(0,7);
      const price = samplePriceForMonth(i);
      const buyAmt = 0.01 + Math.random()*0.04;
      const buyUsd = +(buyAmt * price).toFixed(2);
      btc += buyAmt;
      cost += buyUsd;
      const fee = +(Math.random()*0.00005).toFixed(8);
      fees += fee;
      if(i % 4 === 0) { const r = +(0.0001+Math.random()*0.0003).toFixed(8); rewards += r; btc += r; }
      if(i === 8) { const sellAmt = 0.05; const sellUsd = +(sellAmt*price).toFixed(2); const avgCost = cost/btc; realized += sellUsd - sellAmt*avgCost; cost -= avgCost*sellAmt; btc -= sellAmt; }
      const avgCost = btc > 0 ? +(cost/btc).toFixed(2) : null;
      const mktVal = btc * price;
      const unrealized = +(mktVal - cost).toFixed(2);
      pts.push({ date, btc:+btc.toFixed(8), avgCost });
      priceOverlayPts.push({ date, price });
      dcaPts.push({ date, buyUsd });
      feePts.push({ date, fees: +fees.toFixed(8) });
      rewardPts.push({ date, rewards: +rewards.toFixed(8) });
      plPts.push({ date, realized: +realized.toFixed(2), unrealized, totalPL: +(realized+unrealized).toFixed(2) });
      valueBasisPts.push({ date, marketValue: +mktVal.toFixed(2), costBasis: +cost.toFixed(2) });
      monthlyPts.push({ date, month, label: fmtMonthLabel(month), buys: buyUsd, sells: 0, rewards: 0, fees: 0 });
    }
    const totalDays = 1700;
    const start = new Date(today);
    start.setDate(start.getDate() - (totalDays - 1));
    const dailyPrices = [];
    for(let i = 0; i < totalDays; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const date = localDateKey(d);
      const trend = 14000 + i * 34;
      const longCycle = Math.sin(i / 82) * 10500;
      const shortCycle = Math.cos(i / 19) * 2200;
      const price = +(trend + longCycle + shortCycle).toFixed(2);
      dailyPrices.push([date, price]);
    }
    const movingAvgPts = buildMovingAverageSeries(dailyPrices);
    return {
      chart: pts,
      dca: dcaPts,
      fees: feePts,
      rewards: rewardPts,
      pl: plPts,
      monthly: monthlyPts,
      priceOverlay: priceOverlayPts,
      movingAvg: movingAvgPts,
      valueBasis: valueBasisPts,
      waterfall: { startBTC: +(pts[0]?.btc||0).toFixed(8), buys: 0.65, rewards: 0.003, sells: 0.05, fees: 0.0002, endBTC: +(pts[pts.length-1]?.btc||0).toFixed(8) },
    };
  }, [isSample]);

  const sc = isSample ? sampleChartData : null;

  const fmtCompactUSD = (v) => {
    const abs = Math.abs(v);
    if(abs >= 1000000) return '$'+(v/1000000).toFixed(1).replace(/\.0$/,'')+'M';
    if(abs >= 1000) return '$'+(v/1000).toFixed(0)+'k';
    return '$'+Math.round(v);
  };

  const visibleChart = isSample ? sc.chart : rangeFiltered.accumulated;
  const chartRangeVal = settings.chartRange || 'All';
  const hc = settings.hiddenCharts || {};
