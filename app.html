  const effectiveHiddenCharts = isSample && hc.monthly === undefined ? { ...hc, monthly: true } : hc;
  const ml = settings.maLines || {};
  const effectiveMaLines = isSample && ml.rsi14 === undefined ? { ...ml, rsi14: false } : ml;
  const rsiThresholds = normalizeRsiThresholds(settings.rsiThresholds);
  const _costData = isSample ? sc.chart.filter(d=>d.avgCost!==null) : costData;
  const _dca = isSample ? sc.dca : rangeFiltered.dca;
  const _fees = isSample ? sc.fees : rangeFiltered.fees;
  const _rewards = isSample ? sc.rewards : rangeFiltered.rewards;
  const _pl = isSample ? sc.pl : plChartData;
  const _monthly = isSample ? sc.monthly : rangeFiltered.monthly;
  const _valueBasis = isSample ? sc.valueBasis : valueBasisData;
  const _waterfall = isSample ? sc.waterfall : waterfallData;
  const _priceOverlay = isSample ? sc.priceOverlay : priceOverlayData;
  const hasLiveMovingAvg = maChartData.length > 0;
  const _movingAvg = hasLiveMovingAvg ? maChartData : (isSample ? sc.movingAvg : maChartData);
  const walletFilterSelection = (settings.dashboardWalletFilter || []).filter(name => activeWallets.some(w => w.name === name));
  const noFilteredData = hasWalletFilter && !visibleChart.length && !_dca.length && !_fees.length && !_rewards.length && !_monthly.length;
  const S = isSample || undefined; // sampleData prop
  const toggleWalletFilter = (name) => {
    const current = new Set(walletFilterSelection);
    if(current.has(name)) current.delete(name);
    else current.add(name);
    updateSettings({ dashboardWalletFilter: [...current] });
  };
  const renderFilteredEmptyCard = (title) => (
    <div className="card">
      <div className="card-header" style={{alignItems:'center'}}>
        <div style={{display:'flex',alignItems:'center',gap:'.5rem',flexWrap:'wrap'}}>
          <div className="card-title">{title}</div>
          <span className="scope-badge">Selected wallets</span>
        </div>
      </div>
      <div className="card-body" style={{color:'var(--text-secondary)',fontSize:'.875rem'}}>
        No activity for the selected wallets in this time range.
      </div>
    </div>
  );

  return (
    <>
    {isSample && (
      <div style={{background:'var(--bg-secondary)',border:'1px solid var(--border-color)',borderRadius:12,padding:'1rem 1.25rem',marginBottom:'1rem',display:'flex',alignItems:'center',gap:'.75rem',flexWrap:'wrap'}}>
        <span style={{color:'var(--text-tertiary)',display:'flex'}}>{Icon.Info({width:20,height:20})}</span>
        <div>
          <div style={{fontWeight:600,fontSize:'.9375rem',color:'var(--text-primary)'}}>Sample Charts</div>
          <div style={{fontSize:'.8125rem',color:'var(--text-secondary)',marginTop:'.125rem'}}>These charts use sample data to preview available visualizations. Add your first transaction to see your real portfolio.</div>
        </div>
      </div>
    )}
    {!isSample && <>
      <div className="dashboard-filter-row">
        <div className="dashboard-filter-label">
          <strong>Dashboard Wallets</strong>
          <span>{hasWalletFilter ? `${walletFilterSelection.length} selected` : 'All active wallets'}</span>
        </div>
        <div className="dashboard-filter-actions">
          <button className={hasWalletFilter ? 'btn btn-secondary btn-sm' : 'btn btn-primary btn-sm'} onClick={() => updateSettings({ dashboardWalletFilter: [] })}>All</button>
        </div>
        <div className="dashboard-wallet-chips">
          {activeWallets.map(wallet => (
            <button
              key={wallet.id}
              className={`wallet-chip ${walletFilterSelection.includes(wallet.name) ? 'active' : ''}`}
              onClick={() => toggleWalletFilter(wallet.name)}
              title={wallet.type}
            >
              <span>{wallet.name}</span>
            </button>
          ))}
        </div>
      </div>
      <div className="dashboard-range-row">
        {['3M','6M','1Y','5Y','YTD','All','Custom'].map(r => (
          <button key={r} onClick={() => updateSettings({ chartRange: r })}
            className={chartRangeVal===r ? 'btn btn-primary' : 'btn btn-secondary'}
            style={{padding:'.25rem .75rem',fontSize:'.75rem'}}>
            {r}
          </button>
        ))}
        {chartRangeVal === 'Custom' && (
          <input type="date"
            value={settings.chartRangeCustom || ''}
            onChange={e => updateSettings({ chartRangeCustom: e.target.value })}
            style={{padding:'.25rem .5rem',fontSize:'.75rem',borderRadius:'8px',
              border:'1px solid var(--border-color)',background:'var(--bg-secondary)',
              color:'var(--text-primary)',fontFamily:'inherit'}}
          />
        )}
      </div>
      {noFilteredData && (
        <div style={{background:'var(--bg-secondary)',border:'1px solid var(--border-color)',borderRadius:12,padding:'1rem 1.25rem',marginBottom:'1rem',fontSize:'.8125rem',color:'var(--text-secondary)'}}>
          No dashboard activity for the selected wallets in this date range.
        </div>
      )}
    </>}
    {(() => {
      const chartRenderers = {
        accumulatedBtc: () => visibleChart.length > 0 ? <SVGChart sampleData={S}
          data={visibleChart} dataKey="btc" title="Accumulated BTC"
          subtitle={visibleChart[visibleChart.length-1]?.btc.toFixed(8)+' BTC total'}
          scopeLabel={filteredScopeLabel}
          color="#f7931a" formatY={v=>v.toFixed(2)}
          formatTooltip={(v)=>{ const usd = btcPrice ? ' · $'+Math.round(v*btcPrice).toLocaleString() : ''; return v.toFixed(8)+' BTC'+usd; }}
          fillGradient={true}
          overlay={_priceOverlay.length > 0 ? { data: _priceOverlay, dataKey: 'price', color: '#6b7280', formatY: fmtCompactUSD, formatTooltip: v => '$'+Math.round(v).toLocaleString(), label: 'BTC Price' } : undefined}
        /> : (hasWalletFilter ? renderFilteredEmptyCard('Accumulated BTC') : null),
        costBasis: () => _costData.length > 1 ? <SVGChart sampleData={S}
          data={_costData} dataKey="avgCost" title="Average Cost Basis"
          subtitle={fmtUSD(_costData[_costData.length-1]?.avgCost||0)+' / BTC'}
          scopeLabel={globalScopeLabel}
          color="#2563eb" formatY={v=>'$'+Math.round(v/1000)+'k'}
          formatTooltip={(v)=>'$'+Math.round(v).toLocaleString()+' avg cost'}
          refLine={isSample?undefined:btcPrice} refLineColor="#16a34a" refLineLabel={isSample?undefined:'Now $'+Math.round(btcPrice||0).toLocaleString()}
        /> : null,
        valueBasis: () => _valueBasis.length > 1 ? <SVGChart sampleData={S}
          data={_valueBasis} dataKey="marketValue" title="Portfolio Value vs Cost Basis"
          subtitle={(() => { const last = _valueBasis[_valueBasis.length-1]; if(!last) return ''; const diff = last.marketValue - last.costBasis; return fmtUSD(last.marketValue) + ' value · ' + (diff>=0?'+':'') + fmtUSD(diff) + ' P&L'; })()}
          scopeLabel={globalScopeLabel}
          color="#16a34a" formatY={fmtCompactUSD}
          formatTooltip={v => fmtUSD(v) + ' market value'}
          fillGradient={true}
          lines={[{ dataKey:'costBasis', color:'#2563eb', label:'Cost Basis', dashed: true, formatTooltip: v => fmtUSD(v) + ' invested' }]}
        /> : (historicalPriceLoading ? <div className="card"><div className="card-header"><div className="card-title">Portfolio Value vs Cost Basis</div><div style={{fontSize:'.8125rem',color:'var(--text-secondary)',fontFamily:'JetBrains Mono'}}>Loading…</div></div></div> : null),
        dca: () => _dca.length > 0 ? <SVGChart sampleData={S}
          data={_dca} dataKey="buyUsd" title="DCA Tracker"
          subtitle={fmtUSD(_dca.reduce((s,d)=>s+d.buyUsd,0))+' total invested'}
          scopeLabel={filteredScopeLabel}
          color="#10b981" chartType="bar" formatY={fmtCompactUSD}
          formatTooltip={v => '$'+Math.round(v).toLocaleString()+' bought'}
        /> : (hasWalletFilter ? renderFilteredEmptyCard('DCA Tracker') : null),
        pl: () => _pl.length > 1 ? <SVGChart sampleData={S}
          data={_pl} dataKey="totalPL" title="Realized vs Unrealized P&L"
          subtitle={(_pl[_pl.length-1]?.totalPL>=0?'+':'')+fmtUSD(_pl[_pl.length-1]?.totalPL||0)+' total P&L'}
          scopeLabel={globalScopeLabel}
          color={_pl[_pl.length-1]?.totalPL>=0 ? '#16a34a' : '#dc2626'}
          formatY={v => { const sign=v>0?'+':v<0?'-':''; const abs=Math.abs(v); if(abs>=1000000) return sign+'$'+(abs/1000000).toFixed(1).replace(/\.0$/,'')+'M'; if(abs>=1000) return sign+'$'+Math.round(abs/1000)+'k'; if(abs>=1) return sign+'$'+Math.round(abs); return '$0'; }}
          formatTooltip={v => (v>=0?'+':'-')+'$'+Math.round(Math.abs(v)).toLocaleString()}
          refLine={0} refLineColor="var(--text-tertiary)" refLineLabel="Break even"
        /> : null,
        waterfall: () => (_waterfall.buys > 0 || _waterfall.rewards > 0 || _waterfall.sells > 0 || _waterfall.fees > 0 || _waterfall.startBTC > 0) ? <WaterfallChart data={_waterfall} btcPrice={btcPrice} sampleData={S} scopeLabel={globalScopeLabel} /> : null,
        feeBurn: () => _fees.length > 0 ? <SVGChart sampleData={S}
          data={_fees} dataKey="fees" title="Cumulative Fee Burn"
          subtitle={_fees[_fees.length-1]?.fees.toFixed(8)+' BTC in fees'}
          scopeLabel={filteredScopeLabel}
          color="#ef4444" formatY={v=>v.toFixed(4)} formatTooltip={v => v.toFixed(8)+' BTC lost to fees'} fillGradient={true}
        /> : (hasWalletFilter ? renderFilteredEmptyCard('Cumulative Fee Burn') : null),
        rewards: () => _rewards.length > 0 ? <SVGChart sampleData={S}
          data={_rewards} dataKey="rewards" title="Reward Income"
          subtitle={_rewards[_rewards.length-1]?.rewards.toFixed(8)+' BTC earned'}
          scopeLabel={filteredScopeLabel}
          color="#8b5cf6" formatY={v=>v.toFixed(4)}
          formatTooltip={v => { const usd = btcPrice ? ' · $'+Math.round(v*btcPrice).toLocaleString() : ''; return v.toFixed(8)+' BTC'+usd; }}
          fillGradient={true}
        /> : (hasWalletFilter ? renderFilteredEmptyCard('Reward Income') : null),
        monthly: () => _monthly.length > 0 ? <SVGChart sampleData={S}
          data={_monthly} dataKey="buys" title="Monthly Summary"
          subtitle={_monthly.length+' months of activity'}
          scopeLabel={filteredScopeLabel}
          color="#0ea5e9" chartType="bar" formatY={fmtCompactUSD}
          formatTooltip={v => '$'+Math.round(v).toLocaleString()+' bought'}
        /> : (hasWalletFilter ? renderFilteredEmptyCard('Monthly Summary') : null),
        movingAvg: () => _movingAvg.length > 0 ? <SVGChart sampleData={isSample && !hasLiveMovingAvg ? S : undefined}
          data={_movingAvg} dataKey="price" title="BTC Price & Moving Averages"
          subtitle={fmtUSD(_movingAvg[_movingAvg.length-1]?.price||0)+' current'}
          scopeLabel={globalScopeLabel}
          color="#f7931a" formatY={fmtCompactUSD} formatTooltip={v => '$'+Math.round(v).toLocaleString()} publicData
          overlay={(() => {
            if((effectiveMaLines.rsi14===false) || !_movingAvg.some(d=>d.rsi14!=null)) return undefined;
            const rsiData = _movingAvg.filter(d=>d.rsi14!=null);
            const latestRsi = rsiData[rsiData.length-1]?.rsi14 ?? null;
            const activeRefLines = [
              ...(rsiThresholds.overbought != null ? [{ value: rsiThresholds.overbought, color: RSI_ZONE_COLORS.overbought, label: 'RSI Overbought' }] : []),
              ...(rsiThresholds.oversold != null ? [{ value: rsiThresholds.oversold, color: RSI_ZONE_COLORS.oversold, label: 'RSI Oversold' }] : []),
            ];
            return {
              data: rsiData,
              dataKey: 'rsi14',
              color: getRsiColor(latestRsi, rsiThresholds),
              formatY: v => Math.round(v),
              formatTooltip: v => 'RSI: '+v.toFixed(1),
              label: 'RSI (14)',
              getValueColor: v => getRsiColor(v, rsiThresholds),
              getLegendColor: () => getRsiColor(latestRsi, rsiThresholds),
              refLines: activeRefLines,
            };
          })()}
          lines={[
            ...((effectiveMaLines.ma50d!==false) && _movingAvg.some(d=>d.ma50d!=null) ? [{ dataKey:'ma50d', color:'#ef4444', label:'50D MA', dashed:false, formatTooltip:v=>'50D: $'+Math.round(v).toLocaleString() }] : []),
            ...((effectiveMaLines.ma200d!==false) && _movingAvg.some(d=>d.ma200d!=null) ? [{ dataKey:'ma200d', color:'#a855f7', label:'200D MA', dashed:false, formatTooltip:v=>'200D: $'+Math.round(v).toLocaleString() }] : []),
            ...((effectiveMaLines.ma200w!==false) && _movingAvg.some(d=>d.ma200w!=null) ? [{ dataKey:'ma200w', color:'#06b6d4', label:'200W MA', dashed:false, formatTooltip:v=>'200W: $'+Math.round(v).toLocaleString() }] : []),
          ]}
        /> : null,
      };
      const order = settings.chartOrder || DEFAULT_CHART_ORDER;
      const reconciledOrder = [...order.filter(k => DEFAULT_CHART_ORDER.includes(k)), ...DEFAULT_CHART_ORDER.filter(k => !order.includes(k))];
      return (
        <div className="charts-grid" style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(340px,1fr))',gridAutoFlow:'dense',gap:'1rem'}}>
          {reconciledOrder.map(key => !effectiveHiddenCharts[key] && chartRenderers[key] ? <React.Fragment key={key}>{chartRenderers[key]()}</React.Fragment> : null)}
        </div>
      );
    })()}
    </>
  );
}

function WaterfallChart({ data, btcPrice, sampleData, scopeLabel }) {
  const [hover, setHover] = React.useState(null);
  const [mouse, setMouse] = React.useState({x:0,y:0});
  const [expanded, setExpanded] = React.useState(false);
  const handleMove = useThrottledCallback((e) => setMouse({x:e.clientX,y:e.clientY}), 32);
  const { startBTC, buys, rewards, sells, fees, endBTC } = data;
  const bars = [
    { key:'start', label:'Start', value: startBTC, color:'#6b7280', isTotal: true },
    { key:'buys', label:'Buys', value: buys, color:'#16a34a', direction: 1 },
    { key:'rewards', label:'Rewards', value: rewards, color:'#8b5cf6', direction: 1 },
    { key:'sells', label:'Sells', value: sells, color:'#dc2626', direction: -1 },
    { key:'fees', label:'Fees', value: fees, color:'#ef4444', direction: -1 },
    { key:'end', label:'End', value: endBTC, color:'#f7931a', isTotal: true },
  ];
  let running = startBTC;
  const positioned = bars.map(bar => {
    if(bar.isTotal) {
      const r = { ...bar, bottom: 0, top: bar.value };
      if(bar.key === 'end') running = endBTC;
      return r;
    }
    const bottom = bar.direction > 0 ? running : running - bar.value;
    const top = bar.direction > 0 ? running + bar.value : running;
    running = bar.direction > 0 ? running + bar.value : running - bar.value;
    return { ...bar, bottom, top };
  });
  const maxVal = Math.max(...positioned.map(b => b.top), 0.00000001);
  const netChange = endBTC - startBTC;
  const netPct = startBTC > 0.00000001 ? ((netChange / startBTC) * 100).toFixed(1) : '—';
  const subtitle = (netChange >= 0 ? '+' : '') + netChange.toFixed(8) + ' BTC (' + (netChange >= 0 ? '+' : '') + netPct + '%)';
  const niceStep = (range, count) => { if(!range||range<=0) return 0.01; const rough=range/count; const mag=Math.pow(10,Math.floor(Math.log10(rough))); const norm=rough/mag; const nice=norm<=1.5?1:norm<=3?2:norm<=7?5:10; return nice*mag; };

  const renderSVG = (isExp) => {
    const W = isExp?960:480, H = isExp?400:180, PL = isExp?64:58, PR = isExp?20:16, PT = isExp?12:8, PB = isExp?36:32;
    const iW = W-PL-PR, iH = H-PT-PB;
    const barCount = positioned.length;
    const gap = iW * 0.08 / (barCount - 1 || 1);
    const barW = (iW - gap * (barCount - 1)) / barCount;
    const yScale = v => PT + iH - (v / maxVal) * iH;
    const step = niceStep(maxVal, isExp?8:4);
    const ticks = [];
    for(let v = 0; v <= maxVal + step * 0.01 && ticks.length < (isExp?16:12); v += step) ticks.push(+v.toPrecision(10));
    const fontSize = isExp ? 11 : 9;
    const valFontSize = isExp ? 10 : 8;
    const rx = isExp ? 4 : 3;
    return (
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:'block',overflow:'visible'}}
        role="img" aria-label={`BTC Flow Waterfall — ${subtitle}`}
        onMouseLeave={() => setHover(null)}>
        {ticks.map(v => (
          <React.Fragment key={v}>
            <line x1={PL} x2={W-PR} y1={yScale(v)} y2={yScale(v)} stroke="var(--border-color)" strokeWidth="0.5" strokeDasharray="3,3"/>
            <text x={PL-6} y={yScale(v)+3} textAnchor="end" fontSize={fontSize} fill="var(--text-tertiary)" fontFamily="JetBrains Mono">{v.toFixed(v>=0.01?2:4)}</text>
          </React.Fragment>
        ))}
        {positioned.map((bar, i) => {
          const x = PL + i * (barW + gap);
          const yTop = yScale(bar.top);
          const yBot = yScale(bar.bottom);
          const barH = Math.max(yBot - yTop, 1);
          return (
            <React.Fragment key={bar.key}>
              <rect x={x} y={yTop} width={barW} height={barH} rx={rx} fill={bar.color} opacity={hover===i?1:0.85}
                onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)} style={{cursor:'default'}}/>
              {i < positioned.length - 1 && (
                <line x1={x + barW} x2={x + barW + gap} y1={yScale(bar.isTotal ? bar.top : (bar.direction > 0 ? bar.top : bar.bottom))} y2={yScale(bar.isTotal ? bar.top : (bar.direction > 0 ? bar.top : bar.bottom))}
                  stroke="var(--text-tertiary)" strokeWidth="1" strokeDasharray="3,2" opacity="0.5"/>
              )}
              <text x={x + barW/2} y={H - PB + (isExp?18:14)} textAnchor="middle" fontSize={fontSize} fill="var(--text-secondary)" fontFamily="JetBrains Mono">{bar.label}</text>
              <text x={x + barW/2} y={yTop - (isExp?6:4)} textAnchor="middle" fontSize={valFontSize} fill="var(--text-tertiary)" fontFamily="JetBrains Mono">
                {bar.isTotal ? bar.value.toFixed(isExp?8:4) : (bar.direction > 0 ? '+' : '-') + bar.value.toFixed(isExp?8:4)}
              </text>
            </React.Fragment>
          );
        })}
      </svg>
    );
  };

  const renderTooltip = () => hover !== null ? (
    <div style={{position:'fixed',left:mouse.x+12,top:mouse.y-10,background:'var(--bg-primary)',border:'1px solid var(--border-color)',borderRadius:8,padding:'.375rem .625rem',fontSize:'.75rem',fontFamily:'JetBrains Mono',pointerEvents:'none',zIndex:9999,boxShadow:'0 4px 12px rgba(0,0,0,.15)'}}>
      <div style={{fontWeight:600,color:positioned[hover].color}}>{positioned[hover].label}</div>
      <div style={{color:'var(--text-primary)'}}>{positioned[hover].value.toFixed(8)} BTC</div>
      {btcPrice > 0 && <div style={{color:'var(--text-secondary)'}}>${Math.round(positioned[hover].value * btcPrice).toLocaleString()}</div>}
    </div>
  ) : null;

  return (
    <div className="card" style={sampleData?{opacity:.7}:{}}>
      <div className="card-header" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between'}}>
        <div>
          <div style={{display:'flex',alignItems:'center',gap:'.5rem',flexWrap:'wrap'}}>
            <div className="card-title">BTC Flow Waterfall</div>
            {scopeLabel && <span className="scope-badge">{scopeLabel}</span>}
          </div>
          <div style={{fontSize:'.8125rem',color:netChange>=0?'#16a34a':'#dc2626',fontFamily:'JetBrains Mono'}}>{subtitle}</div>
        </div>
        {sampleData && <span className="sample-badge">Sample</span>}
        {!sampleData && <button onClick={()=>{setHover(null);setExpanded(true);}} title="Expand chart" aria-label="Expand chart"
          style={{background:'none',border:'none',cursor:'pointer',padding:'6px',color:'var(--text-tertiary)',flexShrink:0,marginTop:'2px'}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
          </svg>
        </button>}
      </div>
      <div className="card-body" style={{paddingTop:'.25rem',paddingBottom:'.5rem'}} onMouseMove={handleMove}>
        {renderSVG(false)}
        {!expanded && renderTooltip()}
      </div>
      {expanded && (
        <ExpandedChartOverlay onClose={()=>{setExpanded(false);setHover(null);}}>
          {(titleId)=>(<>
            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',padding:'1.25rem 1.5rem .5rem'}}>
              <div>
                <div style={{display:'flex',alignItems:'center',gap:'.5rem',flexWrap:'wrap'}}>
                  <div id={titleId} style={{fontSize:'1.125rem',fontWeight:700,color:'var(--text-primary)'}}>BTC Flow Waterfall</div>
                  {scopeLabel && <span className="scope-badge">{scopeLabel}</span>}
                </div>
                <div style={{fontSize:'.875rem',color:netChange>=0?'#16a34a':'#dc2626',fontFamily:'JetBrains Mono'}}>{subtitle}</div>
              </div>
              <button type="button" onClick={()=>{setExpanded(false);setHover(null);}} title="Close" aria-label="Close expanded chart"
                style={{background:'none',border:'none',cursor:'pointer',padding:'4px',color:'var(--text-secondary)',fontSize:'1.25rem',lineHeight:1}}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
              </button>
            </div>
            <div style={{padding:'0 1.5rem 1.25rem'}} onMouseMove={handleMove}>
              {renderSVG(true)}
              {renderTooltip()}
            </div>
          </>)}
        </ExpandedChartOverlay>
      )}
    </div>
  );
}

function PieChart({ segments, totalBTC, btcPrice }) {
  const [hover, setHover] = React.useState(null);
  const [mouse, setMouse] = React.useState({x:0,y:0});
  const R = 90, SIZE = R * 2 + 4, CENTER = SIZE / 2;
  const handleMove = useThrottledCallback((e) => setMouse({x:e.clientX,y:e.clientY}), 32);
  // Build pie wedge paths
  let angle = -Math.PI / 2;
  const wedges = segments.map((seg, i) => {
    const sweep = seg.pct * 2 * Math.PI;
    const x1 = CENTER + R * Math.cos(angle);
    const y1 = CENTER + R * Math.sin(angle);
    const x2 = CENTER + R * Math.cos(angle + sweep);
    const y2 = CENTER + R * Math.sin(angle + sweep);
    const largeArc = sweep > Math.PI ? 1 : 0;
    const d = `M${CENTER},${CENTER} L${x1},${y1} A${R},${R} 0 ${largeArc} 1 ${x2},${y2} Z`;
    angle += sweep;
    return { ...seg, d, idx: i };
  });
  return (
    <div className="donut-chart-container" onMouseMove={handleMove}>
      <div className="donut-chart-wrap" style={{width:SIZE,height:SIZE}}>
        <svg viewBox={`0 0 ${SIZE} ${SIZE}`} width={SIZE} height={SIZE}
          role="img" aria-label={`Holdings by wallet: ${segments.map(s=>`${s.name} ${fmtBTC(s.btc)} ${btcUnit()}`).join(', ')}`}>
          {wedges.map((w,i) => (
            <path key={w.name} d={w.d} fill={w.color}
              className="donut-segment"
              style={{opacity:hover!==null&&hover!==i?.4:1}}
              onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)}
            />
          ))}
        </svg>
      </div>
      <div className="donut-legend">
        {segments.map((seg,i) => (
          <div key={seg.name} className="donut-legend-item"
            onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)}
            style={{fontWeight:hover===i?600:'normal'}}>
            <span className="donut-legend-dot" style={{background:seg.color}} />
            {seg.name}
          </div>
        ))}
      </div>
      <div className="pie-total" style={{textAlign:'center',fontFamily:'JetBrains Mono,monospace',fontWeight:700,fontSize:'1rem',color:'var(--bitcoin-orange)'}}>
        {fmtBTC(totalBTC)} {btcUnit()}
      </div>
      {hover !== null && segments[hover] && ReactDOM.createPortal(
        <div className="donut-tooltip" style={{left:mouse.x+12,top:mouse.y-10}}>
          <div className="dt-name">{segments[hover].name}</div>
          <div className="dt-type">{segments[hover].type}</div>
          <div className="dt-row"><span className="dt-label">{btcUnit()}</span><span className="dt-value">{fmtBTC(segments[hover].amount)}</span></div>
          {btcPrice && <div className="dt-row"><span className="dt-label">USD</span><span className="dt-value">{fmtUSD(segments[hover].amount*btcPrice)}</span></div>}
          <div className="dt-row"><span className="dt-label">Share</span><span className="dt-value dt-pct">{(segments[hover].pct*100).toFixed(1)}%</span></div>
        </div>,
        document.body
      )}
    </div>
  );
}

function InfoTip({ text, position }) {
  const [show, setShow] = React.useState(false);
  const ref = React.useRef(null);
  const [pos, setPos] = React.useState('bottom');
  React.useEffect(() => {
    if(show && ref.current && !position) {
      const r = ref.current.getBoundingClientRect();
      setPos(r.top < 80 ? 'bottom' : 'top');
    }
  }, [show, position]);
  // The trigger is a real <button>, not a styled <span>: it was previously mouse-only, so
  // keyboard and touch users could not read any of these explanations — including the
  // "holdings only include active wallets" note that explains a genuinely confusing number.
  const tipId = React.useMemo(() => 'infotip-' + Math.random().toString(36).slice(2,9), []);
  return (
    <span ref={ref} style={{position:'relative',display:'inline-flex',lineHeight:0,flexShrink:0}}
      onMouseEnter={()=>setShow(true)} onMouseLeave={()=>setShow(false)}>
      <button
        type="button"
        aria-label="More information"
        aria-describedby={show ? tipId : undefined}
        aria-expanded={show}
        onFocus={()=>setShow(true)}
        onBlur={()=>setShow(false)}
        onClick={(e)=>{ e.preventDefault(); setShow(s=>!s); }}
        onKeyDown={(e)=>{ if(e.key==='Escape' && show) { e.stopPropagation(); setShow(false); } }}
        style={{background:'none',border:'none',padding:0,margin:0,lineHeight:0,color:'var(--text-tertiary)',cursor:'help',display:'inline-flex'}}
      >
        {Icon.Info({width:14,height:14})}
      </button>
      {show && <div id={tipId} role="tooltip" style={{
        position:'absolute',left:'50%',transform:'translateX(-50%)',
        [(position||pos)==='top'?'bottom':'top']:'calc(100% + 6px)',
        background:'var(--bg-secondary)',color:'var(--text-secondary)',
        fontSize:'.75rem',lineHeight:'1.4',padding:'.5rem .625rem',borderRadius:'8px',
        border:'1px solid var(--border-color)',boxShadow:'0 4px 12px rgba(0,0,0,.15)',
        width:'max-content',maxWidth:'220px',zIndex:10,pointerEvents:'none',
        whiteSpace:'normal',fontWeight:400,
      }}>{text}</div>}
    </span>
  );
}

function SVGChart({ data, dataKey, title, subtitle, color, formatY, formatTooltip, fillGradient, refLine, refLineColor, refLineLabel, chartType, overlay, lines, publicData, sampleData, scopeLabel }) {
  const [tooltip, setTooltip] = React.useState(null);
  const [expanded, setExpanded] = React.useState(false);
  const svgRef = React.useRef(null);
  const expandedSvgRef = React.useRef(null);
  const isBar = chartType === 'bar';
  const hasOverlay = overlay && overlay.data && overlay.data.length > 0;
  const overlayGetValueColor = hasOverlay && typeof overlay.getValueColor === 'function'
    ? overlay.getValueColor
    : () => overlay?.color;
  const overlayLegendColor = hasOverlay && typeof overlay.getLegendColor === 'function'
    ? overlay.getLegendColor()
    : overlay?.color;
  const W=480, H=180, PL=58, PR=hasOverlay?52:16, PT=8, PB=32;
  const iW=W-PL-PR, iH=H-PT-PB;

  const hasLines = lines && lines.length > 0;
  const vals = data.map(d=>d[dataKey]);
  // Include line values in Y scale
  let minV = isBar ? 0 : Math.min(...vals);
  let maxV = Math.max(...vals);
  if(hasLines) {
    lines.forEach(ln => {
      data.forEach(d => { if(d[ln.dataKey]!=null) { minV=Math.min(minV,d[ln.dataKey]); maxV=Math.max(maxV,d[ln.dataKey]); } });
    });
  }

  // include refLine in Y scale if present
  const yMin = refLine!=null ? Math.min(minV, refLine-(Math.abs(refLine)*0.03||maxV*0.03)) : minV;
  const yMax = refLine!=null ? Math.max(maxV, refLine+(Math.abs(refLine)*0.03||maxV*0.03)) : maxV;
  const yRange = yMax-yMin || 1;

  // Nice tick step helper
  const niceStep = (range, count) => {
    if(!range || !isFinite(range) || range<=0) return 1;
    const rough = range / count;
    if(!rough || !isFinite(rough) || rough<=0) return 1;
    const mag = Math.pow(10, Math.floor(Math.log10(rough)));
    const norm = rough / mag;
    const nice = norm<=1.5?1:norm<=3?2:norm<=7?5:10;
    return nice * mag;
  };

  // Time-based X scale. Memoized because it allocates a Date per data point — the price/MA
  // chart carries ~4,000 of them, and every throttled tooltip frame re-rendered this component.
  // Noon-LOCAL is load-bearing for the tick labels; don't switch this to UTC parsing.
  const timestamps = React.useMemo(() => data.map(d=>new Date(d.date+'T12:00:00').getTime()), [data]);
  const tMin = timestamps[0], tMax = timestamps[timestamps.length-1];
  const tRange = tMax - tMin || 1;
  const xScale = i => PL + ((timestamps[i]-tMin)/tRange)*iW;
  const yScale = v => PT + iH - ((v-yMin)/yRange)*iH;

  // Overlay scales
  const oTimestamps = React.useMemo(
    () => hasOverlay ? overlay.data.map(d=>new Date(d.date+'T12:00:00').getTime()) : [],
    [hasOverlay, overlay?.data]
  );
  const oVals = hasOverlay ? overlay.data.map(d=>d[overlay.dataKey]) : [];
  const overlayRefLines = hasOverlay && Array.isArray(overlay.refLines) ? overlay.refLines : [];
  const overlayRefVals = overlayRefLines.map(ln => ln.value).filter(v => Number.isFinite(v));
  const oMin = hasOverlay ? Math.min(...oVals, ...overlayRefVals) : 0;
  const oMax = hasOverlay ? Math.max(...oVals, ...overlayRefVals) : 1;
  const oRange = oMax-oMin || 1;
  const oXScale = i => hasOverlay ? PL + ((oTimestamps[i]-tMin)/tRange)*iW : 0;
  const oYScale = v => PT + iH - ((v-oMin)/oRange)*iH;
  const oStep = hasOverlay ? niceStep(oRange, 4) : 1;
  const oTickStart = hasOverlay ? Math.ceil(oMin / oStep) * oStep : 0;
  const oTicks = [];
  if(hasOverlay) { for(let v=oTickStart; v<=oMax+oStep*0.01 && oTicks.length<12; v+=oStep) oTicks.push(+v.toPrecision(10)); }

  // Memoized: these build a path string per data point, and setTooltip re-renders this whole
  // component on every throttled hover frame. Rebuilding a 4,000-point path twice per frame is
  // the cost users actually feel when moving the pointer across the price chart.
  const { pathD, areaD, oPathD } = React.useMemo(() => {
    const p = !isBar ? data.map((d,i)=>`${i===0?'M':'L'}${xScale(i).toFixed(1)},${yScale(d[dataKey]).toFixed(1)}`).join(' ') : '';
    return {
      pathD: p,
      areaD: !isBar ? p+` L${xScale(data.length-1).toFixed(1)},${(PT+iH).toFixed(1)} L${xScale(0).toFixed(1)},${(PT+iH).toFixed(1)} Z` : '',
      oPathD: hasOverlay ? overlay.data.map((d,i)=>`${i===0?'M':'L'}${oXScale(i).toFixed(1)},${oYScale(d[overlay.dataKey]).toFixed(1)}`).join(' ') : '',
    };
  }, [data, dataKey, isBar, hasOverlay, overlay?.data, overlay?.dataKey,
      timestamps, oTimestamps, yMin, yRange, oMin, oRange, iW, iH, PL, PT]);
  const buildOverlaySegments = (xsFn, ysFn) => {
    if(!hasOverlay || typeof overlay.getValueColor !== 'function' || overlay.data.length < 2) return [];
    const segments = [];
    const refLines = Array.isArray(overlay.refLines) ? overlay.refLines : [];
    const thresholds = refLines.map(r => r.value).filter(v => Number.isFinite(v)).sort((a,b) => a - b);
    for(let i=1;i<overlay.data.length;i++) {
      const prevVal = overlay.data[i-1]?.[overlay.dataKey];
      const currVal = overlay.data[i]?.[overlay.dataKey];
      if(prevVal == null || currVal == null) continue;
      const x1 = xsFn(i-1), y1 = ysFn(prevVal), x2 = xsFn(i), y2 = ysFn(currVal);
      // Find threshold crossings between prevVal and currVal
      const crossings = [];
      thresholds.forEach(th => {
        if((prevVal < th && currVal > th) || (prevVal > th && currVal < th)) {
          const t = (th - prevVal) / (currVal - prevVal);
          crossings.push({ t, val: th });
        }
      });
      crossings.sort((a,b) => a.t - b.t);
      if(!crossings.length) {
        segments.push({ d: `M${x1.toFixed(1)},${y1.toFixed(1)} L${x2.toFixed(1)},${y2.toFixed(1)}`, color: overlayGetValueColor(currVal) || overlay.color });
      } else {
        let lastX = x1, lastY = y1, lastVal = prevVal;
        crossings.forEach(cr => {
          const mx = x1 + (x2 - x1) * cr.t, my = y1 + (y2 - y1) * cr.t;
          const midVal = (lastVal + cr.val) / 2;
          segments.push({ d: `M${lastX.toFixed(1)},${lastY.toFixed(1)} L${mx.toFixed(1)},${my.toFixed(1)}`, color: overlayGetValueColor(midVal) || overlay.color });
          lastX = mx; lastY = my; lastVal = cr.val;
        });
        segments.push({ d: `M${lastX.toFixed(1)},${lastY.toFixed(1)} L${x2.toFixed(1)},${y2.toFixed(1)}`, color: overlayGetValueColor(currVal) || overlay.color });
      }
    }
    return segments;
  };
  // Threshold-segmented overlay (RSI colouring) — one entry per data point pair, so memoized
  // for the same reason as the paths above.
  const oSegments = React.useMemo(() => buildOverlaySegments(oXScale, oYScale),
    [hasOverlay, overlay?.data, overlay?.dataKey, overlay?.refLines, overlay?.color,
     timestamps, oTimestamps, tMin, tRange, oMin, oRange, iW, iH, PL, PT]);

  // Additional same-scale lines
  const buildLinePath = (ln, xsFn, ysFn) => {
    let started = false;
    return data.map((d,i) => {
      if(d[ln.dataKey]==null) return '';
      const cmd = started ? 'L' : 'M';
      started = true;
      return `${cmd}${xsFn(i).toFixed(1)},${ysFn(d[ln.dataKey]).toFixed(1)}`;
    }).join(' ');
  };
  const linePaths = React.useMemo(
    () => hasLines ? lines.map(ln => buildLinePath(ln, xScale, yScale)) : [],
    [hasLines, lines, data, timestamps, yMin, yRange, iW, iH, PL, PT]
  );

  // Bar dimensions
  const barW = isBar && data.length > 1 ? Math.max(2, Math.min(12, (iW / data.length) * 0.5)) : 10;

  // Y axis ticks
  const yStep = niceStep(yRange, 4);
  const yTickStart = Math.ceil(yMin / yStep) * yStep;
  const yTicks = [];
  for(let v=yTickStart; v<=yMax+yStep*0.01 && yTicks.length<12; v+=yStep) yTicks.push(+v.toPrecision(10));
  if(!yTicks.length) yTicks.push(yMin, yMax);
  // For a line chart, interpolating tick timestamps across the range is fine — the line is
  // continuous, so any date is a meaningful position. For a BAR chart it is not: bars sit at
  // discrete positions, and an interpolated timestamp lands between them, so the label ends up
  // naming a period that has no bar there. On the monthly chart that read as bars being shifted
  // into the neighbouring month. Bars therefore tick on real data points only.
  const buildTimeTicks = (count, width, leftPad, scaleFn) => {
    if(count <= 1 || !isFinite(tRange) || tRange <= 0) {
      return [{ x:leftPad + width/2, t:tMin, label: data[0]?.label }];
    }
    if(isBar && data.length) {
      const wanted = Math.min(count, data.length);
      const step = data.length <= wanted ? 1 : (data.length - 1) / (wanted - 1);
      const idxs = wanted === 1 ? [0]
        : Array.from({ length: wanted }, (_, k) => Math.round(k * step));
      const seen = new Set();
      return idxs.filter(i => !seen.has(i) && seen.add(i)).map(i => ({
        x: scaleFn ? scaleFn(i) : leftPad + ((timestamps[i]-tMin)/tRange) * width,
        t: timestamps[i],
        label: data[i]?.label,
      }));
    }
    return Array.from({ length: count }, (_, idx) => {
      const pct = idx / (count - 1);
      return {
        x: leftPad + pct * width,
        t: tMin + pct * tRange,
      };
    });
  };
  const xTicks = buildTimeTicks(isBar ? 4 : 3, iW, PL, xScale);

  const gradId = 'grad_'+dataKey.replace(/[^a-z]/g,'');

  const handleMouseMove = useThrottledCallback((e) => {
    if(!svgRef.current) return;
    const rect = svgRef.current.getBoundingClientRect();
    const scaleX = W / rect.width;
    const mx = (e.clientX - rect.left) * scaleX;
    const hoverT = tMin + ((mx-PL)/iW)*tRange;
    let closest = 0, closestDist = Infinity;
    for(let i=0;i<timestamps.length;i++) {
      const dist = Math.abs(timestamps[i]-hoverT);
      if(dist<closestDist) { closestDist=dist; closest=i; }
    }
    const d = data[closest];
    // Find closest overlay point
    let oVal = null;
    if(hasOverlay) {
      let oc=0, od=Infinity;
      for(let i=0;i<oTimestamps.length;i++) {
        const dist = Math.abs(oTimestamps[i]-timestamps[closest]);
        if(dist<od) { od=dist; oc=i; }
      }
      oVal = overlay.data[oc]?.[overlay.dataKey] ?? null;
    }
    const lineVals = hasLines ? lines.map(ln => d[ln.dataKey] ?? null) : [];
    setTooltip({ x: xScale(closest), y: yScale(d[dataKey]), val: d[dataKey], date: d.date, label: d.label, oVal, lineVals, isExpanded: false });
  }, 32);

  const fmtTickDate = input => {
    const dt = typeof input === 'number' ? new Date(input) : new Date(input+'T12:00:00');
    const options = tRange < 1000 * 60 * 60 * 24 * 120
      ? { month:'short', day:'numeric' }
      : { month:'short', year:'2-digit' };
    return dt.toLocaleDateString('en-US', options);
  };

  // Expanded chart dimensions
  const EW=960, EH=400, EPL=64, EPR=hasOverlay?58:20, EPT=12, EPB=36;
  const eIW=EW-EPL-EPR, eIH=EH-EPT-EPB;
  const exScale = i => EPL + ((timestamps[i]-tMin)/tRange)*eIW;
  const eyScale = v => EPT + eIH - ((v-yMin)/yRange)*eIH;
  const eoXScale = i => hasOverlay ? EPL + ((oTimestamps[i]-tMin)/tRange)*eIW : 0;
  const eoYScale = v => EPT + eIH - ((v-oMin)/oRange)*eIH;
  const eBarW = isBar && data.length > 1 ? Math.max(3, Math.min(18, (eIW / data.length) * 0.5)) : 12;
  const eGradId = 'egrad_'+dataKey.replace(/[^a-z]/g,'');
  // All of the expanded-chart geometry used to be computed unconditionally — including the
  // 4,000-point path strings and the threshold-segmented overlay — even while the chart was
  // collapsed, across every chart on the dashboard, on every tooltip frame. Now it's built only
  // when actually expanded. The scale functions above stay outside: they're O(1) and the
  // expanded mouse handler needs them.
  const expandedGeom = React.useMemo(() => {
    if(!expanded) return null;
    const ePathD = !isBar ? data.map((d,i)=>`${i===0?'M':'L'}${exScale(i).toFixed(1)},${eyScale(d[dataKey]).toFixed(1)}`).join(' ') : '';
    const eAreaD = !isBar ? ePathD+` L${exScale(data.length-1).toFixed(1)},${(EPT+eIH).toFixed(1)} L${exScale(0).toFixed(1)},${(EPT+eIH).toFixed(1)} Z` : '';
    const eoPathD = hasOverlay ? overlay.data.map((d,i)=>`${i===0?'M':'L'}${eoXScale(i).toFixed(1)},${eoYScale(d[overlay.dataKey]).toFixed(1)}`).join(' ') : '';
    const eyStep = niceStep(yRange, 8);
    const eyTickStart = Math.ceil(yMin / eyStep) * eyStep;
    const eyTicks = [];
    for(let v=eyTickStart; v<=yMax+eyStep*0.01 && eyTicks.length<16; v+=eyStep) eyTicks.push(+v.toPrecision(10));
    const eoStep = hasOverlay ? niceStep(oRange, 8) : 1;
    const eoTickStart = hasOverlay ? Math.ceil(oMin / eoStep) * eoStep : 0;
    const eoTicks = [];
    if(hasOverlay) { for(let v=eoTickStart; v<=oMax+eoStep*0.01 && eoTicks.length<16; v+=eoStep) eoTicks.push(+v.toPrecision(10)); }
    return {
      ePathD, eAreaD, eoPathD, eyTicks, eoTicks,
      eXTicks: buildTimeTicks(isBar ? 6 : 5, eIW, EPL, exScale),
      eoSegments: buildOverlaySegments(eoXScale, eoYScale),
      eLinePaths: hasLines ? lines.map(ln => buildLinePath(ln, exScale, eyScale)) : [],
    };
  }, [expanded, data, dataKey, isBar, hasOverlay, overlay?.data, overlay?.dataKey, overlay?.refLines,
      yMin, yMax, yRange, oMin, oMax, oRange, hasLines, lines, timestamps, oTimestamps]);
  const ePathD = expandedGeom?.ePathD ?? '';
  const eAreaD = expandedGeom?.eAreaD ?? '';
  const eoPathD = expandedGeom?.eoPathD ?? '';
  const eyTicks = expandedGeom?.eyTicks ?? [];
  const eoTicks = expandedGeom?.eoTicks ?? [];
  const eXTicks = expandedGeom?.eXTicks ?? [];
  const eoSegments = expandedGeom?.eoSegments ?? [];

  const handleExpandedMouseMove = useThrottledCallback((e) => {
    if(!expandedSvgRef.current) return;
    const rect = expandedSvgRef.current.getBoundingClientRect();
    const scaleX = EW / rect.width;
    const mx = (e.clientX - rect.left) * scaleX;
    const hoverT = tMin + ((mx-EPL)/eIW)*tRange;
    let closest = 0, closestDist = Infinity;
    for(let i=0;i<timestamps.length;i++) {
      const dist = Math.abs(timestamps[i]-hoverT);
      if(dist<closestDist) { closestDist=dist; closest=i; }
    }
    const d = data[closest];
    let oVal = null;
    if(hasOverlay) {
      let oc=0, od=Infinity;
      for(let i=0;i<oTimestamps.length;i++) {
        const dist = Math.abs(oTimestamps[i]-timestamps[closest]);
        if(dist<od) { od=dist; oc=i; }
      }
      oVal = overlay.data[oc]?.[overlay.dataKey] ?? null;
    }
    const lineVals = hasLines ? lines.map(ln => d[ln.dataKey] ?? null) : [];
    setTooltip({ x: exScale(closest), y: eyScale(d[dataKey]), val: d[dataKey], date: d.date, label: d.label, oVal, lineVals, isExpanded: true });
  }, 32);

  const eLinePaths = expandedGeom?.eLinePaths ?? [];

  const renderSVGContent = (isExp) => {
    const cW = isExp?EW:W, cH = isExp?EH:H, cPL = isExp?EPL:PL, cPR = isExp?EPR:PR, cPT = isExp?EPT:PT, cPB = isExp?EPB:PB;
    const cIW = isExp?eIW:iW, cIH = isExp?eIH:iH;
    const cXScale = isExp?exScale:xScale, cYScale = isExp?eyScale:yScale;
    const cOXScale = isExp?eoXScale:oXScale, cOYScale = isExp?eoYScale:oYScale;
    const cBarW = isExp?eBarW:barW;
    const cPathD = isExp?ePathD:pathD, cAreaD = isExp?eAreaD:areaD, cOPathD = isExp?eoPathD:oPathD;
    const cGradId = isExp?eGradId:gradId;
    const cLinePaths = isExp?eLinePaths:linePaths;
    const cYTicks = isExp?eyTicks:yTicks;
    const cOTicks = isExp?eoTicks:oTicks;
    const cXTicks = isExp?eXTicks:xTicks;
    const cOSegments = isExp?eoSegments:oSegments;
    const cRef = isExp?expandedSvgRef:svgRef;
    const cMouseMove = isExp?handleExpandedMouseMove:handleMouseMove;
    const strokeW = isExp?2.5:2;
    return (
      <svg ref={cRef} width="100%" viewBox={`0 0 ${cW} ${cH}`} style={{display:'block',overflow:'visible'}}
        role="img" aria-label={[title, subtitle].filter(Boolean).join(' — ')}
        onMouseMove={cMouseMove} onMouseLeave={()=>setTooltip(null)}>
        <defs>
          <linearGradient id={cGradId} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.18"/>
            <stop offset="100%" stopColor={color} stopOpacity="0"/>
          </linearGradient>
          <clipPath id={'clip_'+cGradId}><rect x={cPL} y={cPT} width={cIW} height={cIH}/></clipPath>
        </defs>
        {cYTicks.map((v,i)=>(
          <line key={i} x1={cPL} x2={cPL+cIW} y1={cYScale(v)} y2={cYScale(v)}
            stroke="var(--border-color)" strokeWidth="1" strokeDasharray="3 3"/>
        ))}
        {refLine!=null && (
          <>
            <line x1={cPL} x2={cPL+cIW} y1={cYScale(refLine)} y2={cYScale(refLine)}
              stroke={refLineColor} strokeWidth="1.5" strokeDasharray="5 4"/>
            <text x={cPL+cIW-(!hasOverlay?0:40)} y={cYScale(refLine)-6} textAnchor="end" fontSize={isExp?'11':'9'} fill={refLineColor}>{refLineLabel}</text>
          </>
        )}
        {hasOverlay && overlayRefLines.map((ln, i) => (
          <React.Fragment key={`overlay-ref-${i}`}>
            <line x1={cPL} x2={cPL+cIW} y1={cOYScale(ln.value)} y2={cOYScale(ln.value)}
              stroke={ln.color || overlay.color} strokeWidth="1" strokeDasharray="5 4" opacity="0.8"/>
            <text x={cPL+cIW-4} y={cOYScale(ln.value)-6} textAnchor="end" fontSize={isExp?'10':'9'} fill={ln.color || overlay.color}>
              {ln.label}
            </text>
          </React.Fragment>
        ))}
        {fillGradient && !isBar && <path d={cAreaD} fill={`url(#${cGradId})`} clipPath={`url(#clip_${cGradId})`}/>}
        {!isBar && <path d={cPathD} fill="none" stroke={color} strokeWidth={strokeW} strokeLinejoin="round" strokeLinecap="round"/>}
        {isBar && data.map((d,i) => {
          const x = cXScale(i) - cBarW/2;
          const barH = ((d[dataKey]-yMin)/yRange)*cIH;
          return <rect key={i} x={x} y={cPT+cIH-barH} width={cBarW} height={Math.max(0,barH)} fill={color} rx="1" opacity={tooltip && tooltip.isExpanded===!!isExp && Math.abs(cXScale(i)-tooltip.x)<cBarW ? 1 : 0.7}/>;
        })}
        {hasOverlay && (!cOSegments.length
          ? <path d={cOPathD} fill="none" stroke={overlay.color} strokeWidth={isExp?2:1.5} strokeDasharray="4 3" strokeLinejoin="round" opacity="0.7"/>
          : cOSegments.map((seg, i) => (
            <path key={`overlay-seg-${i}`} d={seg.d} fill="none" stroke={seg.color} strokeWidth={isExp?2:1.5} strokeDasharray="4 3" strokeLinejoin="round" opacity="0.85"/>
          ))
        )}
        {hasLines && lines.map((ln,li) => (
          <path key={'ln'+li} d={cLinePaths[li]} fill="none" stroke={ln.color} strokeWidth={isExp?2:1.5}
            strokeDasharray={ln.dashed?"6 4":undefined} strokeLinejoin="round" opacity="0.8"/>
        ))}
        {cYTicks.map((v,i)=>(
          <text key={i} x={cPL-6} y={cYScale(v)+4} textAnchor="end" fontSize={isExp?'11':'10'} fill="var(--text-tertiary)">
            {formatY(v)}
          </text>
        ))}
        {hasOverlay && cOTicks.map((v,i)=>(
          <text key={'o'+i} x={cPL+cIW+6} y={cOYScale(v)+4} textAnchor="start" fontSize={isExp?'10':'9'} fill={overlayLegendColor || overlay.color} opacity="0.7">
            {overlay.formatY(v)}
          </text>
        ))}
        {cXTicks.map((tick,i)=>(
          <text key={i} x={tick.x} y={cH-4} textAnchor="middle" fontSize={isExp?'11':'10'} fill="var(--text-tertiary)">
            {/* A bucketed point (e.g. a whole month) supplies its own label; only fall back to
                formatting the positioning date when there isn't one. */}
            {tick.label || fmtTickDate(tick.t)}
          </text>
        ))}
        {tooltip && tooltip.isExpanded===!!isExp && (
          <>
            <line x1={tooltip.x} x2={tooltip.x} y1={cPT} y2={cPT+cIH}
              stroke="var(--border-color)" strokeWidth="1"/>
            {!isBar && <circle cx={tooltip.x} cy={tooltip.y} r={isExp?5:4} fill={color} stroke="var(--bg-secondary)" strokeWidth="2"/>}
          </>
        )}
      </svg>
    );
  };

  const renderTooltipBox = () => tooltip ? (
    <div style={{
      marginTop:'.625rem',
      display:'flex',
      alignItems:'center',
      justifyContent:'space-between',
      gap:'.75rem',
      borderTop:'1px solid var(--border-color)',
      paddingTop:'.625rem',
      fontSize:'.8125rem',
    }}>
      <div style={{color:'var(--text-secondary)',fontSize:'.75rem',whiteSpace:'nowrap'}}>{tooltip.label || fmtDate(tooltip.date)}</div>
      <div style={{display:'flex',gap:'.75rem',textAlign:'right',flexWrap:'wrap',justifyContent:'flex-end'}}>
        <div style={{color:color,fontFamily:'JetBrains Mono',fontWeight:600}}>{formatTooltip(tooltip.val)}</div>
        {hasOverlay && tooltip.oVal !== null && <div style={{color:overlayGetValueColor(tooltip.oVal) || overlay.color,fontFamily:'JetBrains Mono',fontWeight:600,fontSize:'.75rem'}}>{overlay.formatTooltip(tooltip.oVal)}</div>}
        {hasLines && tooltip.lineVals && tooltip.lineVals.map((v,i) => v!=null ? (
          <div key={i} style={{color:lines[i].color,fontFamily:'JetBrains Mono',fontWeight:600,fontSize:'.75rem'}}>{lines[i].formatTooltip?lines[i].formatTooltip(v):formatTooltip(v)}</div>
        ) : null)}
      </div>
    </div>
  ) : null;

  const renderLegend = () => (hasOverlay || hasLines) ? (
    <div style={{display:'flex',gap:'1rem',justifyContent:'center',fontSize:'.6875rem',color:'var(--text-tertiary)',marginTop:'.25rem',flexWrap:'wrap'}}>
      <span style={{display:'flex',alignItems:'center',gap:'.25rem'}}><span style={{width:12,height:2,background:color,display:'inline-block',borderRadius:1}}/> {title}</span>
      {hasOverlay && <span style={{display:'flex',alignItems:'center',gap:'.25rem',color:overlayLegendColor || 'var(--text-tertiary)'}}><span style={{width:12,height:2,background:overlayLegendColor || overlay.color,display:'inline-block',borderRadius:1,borderTop:'1px dashed '+(overlayLegendColor || overlay.color)}}/> {overlay.label}</span>}
      {hasLines && lines.map((ln,i) => (
        <span key={i} style={{display:'flex',alignItems:'center',gap:'.25rem'}}><span style={{width:12,height:2,background:ln.color,display:'inline-block',borderRadius:1,...(ln.dashed?{borderTop:'1px dashed '+ln.color,background:'transparent'}:{})}}/> {ln.label}</span>
      ))}
    </div>
  ) : null;

  return (
    <div className={`card${publicData?' public-data':''}`} style={sampleData?{opacity:.7}:{}}>
      <div className="card-header" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between'}}>
        <div style={{minWidth:0,display:'flex',alignItems:'center',gap:'.5rem',flexWrap:'wrap'}}>
          <div>
            <div className="card-title">{title}</div>
            <div className="chart-subtitle" style={{fontSize:'.8125rem',color:'var(--text-secondary)',fontFamily:'JetBrains Mono'}}>{subtitle}</div>
          </div>
          {scopeLabel && <span className="scope-badge">{scopeLabel}</span>}
        </div>
        {sampleData ? <span className="sample-badge">Sample</span> : <button onClick={()=>{setTooltip(null);setExpanded(true);}} title="Expand chart" aria-label="Expand chart"
          style={{background:'none',border:'none',cursor:'pointer',padding:'6px',color:'var(--text-tertiary)',flexShrink:0,marginTop:'2px'}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
          </svg>
        </button>}
      </div>
      <div className="card-body" style={{paddingTop:'.25rem',paddingBottom:'.5rem'}}>
        {renderSVGContent(false)}
        {renderLegend()}
        {!tooltip?.isExpanded && renderTooltipBox()}
      </div>
      {expanded && (
        <ExpandedChartOverlay onClose={()=>{setExpanded(false);setTooltip(null);}} title={title}>
          {(titleId)=>(<>
            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',padding:'1.25rem 1.5rem .5rem'}}>
              <div>
                <div style={{display:'flex',alignItems:'center',gap:'.5rem',flexWrap:'wrap'}}>
                  <div id={titleId} style={{fontSize:'1.125rem',fontWeight:700,color:'var(--text-primary)'}}>{title}</div>
                  {scopeLabel && <span className="scope-badge">{scopeLabel}</span>}
                </div>
                <div className="chart-subtitle" style={{fontSize:'.875rem',color:'var(--text-secondary)',fontFamily:'JetBrains Mono'}}>{subtitle}</div>
              </div>
              <button type="button" onClick={()=>{setExpanded(false);setTooltip(null);}} title="Close" aria-label="Close expanded chart"
                style={{background:'none',border:'none',cursor:'pointer',padding:'4px',color:'var(--text-secondary)',fontSize:'1.25rem',lineHeight:1}}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
              </button>
            </div>
            <div style={{padding:'0 1.5rem 1.25rem'}}>
              {renderSVGContent(true)}
              {renderLegend()}
              {tooltip?.isExpanded && renderTooltipBox()}
            </div>
          </>)}
        </ExpandedChartOverlay>
      )}
    </div>
  );
}


// Records keys whose stored value was present but unreadable, so App can warn on mount.
const storageLoadIssues = [];
// Distinguishes "no data yet" from "data present but corrupt". The old behaviour swallowed
// the parse error and returned the defaults, which looked exactly like a fresh install —
// so a single bad write silently presented an empty portfolio. A corrupt blob is now
// quarantined under `<key>-corrupt` instead of being thrown away.
const loadStoredArray = (key, fallback) => {
  let raw = null;
  try { raw = localStorage.getItem(key); } catch { return fallback; }
  if(raw === null) return fallback;
  try {
    const parsed = JSON.parse(raw);
    if(!Array.isArray(parsed)) throw new Error('stored value is not an array');
    return parsed;
  } catch(e) {
    console.error('Stored data unreadable:', key, e);
    safeSetItem(key+'-corrupt', raw);
    storageLoadIssues.push(key);
    return []; // deliberately not `fallback` — never paper over real data with samples
  }
};
// Coerce, don't drop: a row with a non-string date would throw in .slice()/.localeCompare()
// and blank the whole app, but discarding the row would be data loss.
// Numeric fields arrive as numbers from hand-edited backups and other tools; the UI calls
// string methods on them (search used to crash on `amount.includes`).
const TX_STRING_FIELDS = ['amount','price','fee','totalUsd','wallet','wallet2','notes','txhash'];
const sanitizeStoredTransactions = list => list.map(tx => {
  if(!tx || typeof tx !== 'object') return { date:'', type:'Buy', amount:'' };
  let out = tx;
  if(typeof tx.date !== 'string') out = {...out, date: tx.date == null ? '' : String(tx.date)};
  for(const k of TX_STRING_FIELDS) {
    if(typeof out[k] === 'number' || typeof out[k] === 'boolean') {
      if(out === tx) out = {...tx};
      out[k] = String(out[k]);
    }
  }
  return out;
});

      // attempt can only fail the same way, and transport failures own their retry ladder.

    } finally {
      pushInFlightRef.current--;
      pushAgainRef.current = false;
    }

  }, []);
  const performDrivePushOnce = async (payload, opts) => {
    const expected = localStorage.getItem('btc-drive-seen-mtime') || '';
    if(retryTimerRef.current) { clearTimeout(retryTimerRef.current); retryTimerRef.current = null; }

      if(e && e.message === 'token_expired') {

        // marker stays set, and the UI must stop claiming it is connected.

        return;

        // torn down. That leaves btc-drive-seen-mtime stale, so our OWN write looks foreign on
        // the next attempt. Read the file back before crying conflict: if it already carries
        // this payload's stamp, the push succeeded and we just adopt the new revision.

        // leave btc-pending-push set, so the conflict is surfaced instead of resolved silently.

        pushAgainRef.current = false;
        retryAttemptRef.current = 0;
        setSyncState('error');
        showToast('⚠ Google Drive was changed on another device. Your edit is saved locally — open Settings → Cloud Sync to resolve.', 10000);
        return;
      }

      setSyncState('error');
      const attempt = retryAttemptRef.current;
      if(attempt < PUSH_RETRY_DELAYS.length && pendingPushRef.current) {

    // and the conflict dialog, which keys off that marker, could never fire for it.
    pendingPushRef.current = payload;

    // btc-last-modified is the COMMIT MARKER for the whole write, not just another key.

    // timestamp, and the next launch would push that stale data over the good Drive copy.
    const prev = {
      tx: localStorage.getItem('btc-tx-v2'),
      wallets: localStorage.getItem('btc-wallets'),

      safeSetItem('btc-last-modified', mod);
    } else {
      // Roll the data keys back to their last consistent state and leave the timestamp
      // alone, so the next launch sees local as older than Drive and pulls instead.
      try {
        if(prev.tx === null) localStorage.removeItem('btc-tx-v2'); else localStorage.setItem('btc-tx-v2', prev.tx);
        if(prev.wallets === null) localStorage.removeItem('btc-wallets'); else localStorage.setItem('btc-wallets', prev.wallets);
        if(prev.vault === null) localStorage.removeItem(VAULT_STORAGE_KEY); else localStorage.setItem(VAULT_STORAGE_KEY, prev.vault);

    // it back on next launch. The dangerous direction is stale local + new timestamp.
    // Auto-sync to Drive if connected

    queueDrivePush({ transactions: txs, wallets: wals, settings: settingsData, vault: vaultToStore, lastModified: mod });
  }, [vault, queueDrivePush]);

  // Put the recovery snapshot back. Saved with a FRESH timestamp on purpose: reusing the

  // back over the restore.
  const restorePreSyncSnapshot = () => {
    const snap = preSyncSnapshot;

    const txs = ensureTxIds(sanitizeStoredTransactions(snap.transactions));
    const wals = Array.isArray(snap.wallets) ? snap.wallets : [];
    setTransactions(txs);
    setWallets(wals);
    if(snap.settings && typeof snap.settings === 'object') {
      const normalized = normalizeSettings(snap.settings);
      settingsRef.current = normalized;
      setSettings(normalized);
      safeSetItem('btc-settings', JSON.stringify(normalized));
    }
    setVault(snap.vault || null);
    lockVault();
    save(txs, wals, { vault: snap.vault || null });
    localStorage.removeItem('btc-presync-backup');
    setSnapshotNonce(n => n+1);
    showToast(`Restored ${txs.length} transaction${txs.length===1?'':'s'} from the recovery snapshot`);
  };

  useEffect(() => {
    localStorage.setItem('btc-theme', theme);
    document.documentElement.setAttribute('data-theme', theme);
  }, [theme]);
  useEffect(() => {
    const onResize = () => setIsMobileViewport(window.innerWidth <= 768);
    onResize();
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  // replaceState, not `location.hash =`, so Back leaves the app instead of walking backwards
  // through every tab visited. replaceState doesn't fire hashchange, so the listener below
  // won't loop.
  useEffect(() => {
    if(location.hash.slice(1) === tab) return;
    history.replaceState(null, '', '#' + tab);
  }, [tab]);
  useEffect(() => {
    const onHash = () => {
      const hash = location.hash.slice(1);
      if (NAV_ITEMS.some(n => n.key === hash)) setTab(hash);
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  // Apply theme on mount
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
  }, []);

  // Fetch BTC price. `silent` suppresses the toast: the 60s poll must never nag, or an
  // offline user gets an error toast every single minute. Only user-initiated refreshes talk.
  const fetchPrice = useCallback(async ({ silent = false } = {}) => {
    setPriceLoading(true);
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 15000);
    try {
      const r = await fetch('https://api.coinbase.com/v2/prices/BTC-USD/spot', { signal: controller.signal });
      if(!r.ok) throw new Error('spot_price_http_' + r.status);
      const j = await r.json();
      const p = numOr(j?.data?.amount, null);
      if(p === null) throw new Error('spot_price_unparseable');
      const at = Date.now();
      setBtcPrice(p);
      setPriceUpdatedAt(at);
      safeSetItem('btc-last-spot', JSON.stringify({ price: p, at }));
      return p;
    } catch(e) {
      if(e?.name !== 'AbortError') console.warn('Spot price fetch failed:', e.message || e);
      if(!silent) showToast('Could not fetch live price');
      return null;
    }
    finally { clearTimeout(timeout); setPriceLoading(false); }
  }, []);

  useEffect(() => {
    // Unconditional on mount (a tab can start hidden), then silent + skipped while hidden.
    fetchPrice({ silent: true });
    const id = setInterval(() => {
      if(document.visibilityState === 'hidden') return;
      fetchPrice({ silent: true });
    }, 60000);
    // Catch up on return if the price went stale while the tab was in the background
    const onVisible = () => {
      if(document.visibilityState !== 'visible') return;
      if(Date.now() - (priceUpdatedAtRef.current || 0) > 60000) fetchPrice({ silent: true });
    };
    document.addEventListener('visibilitychange', onVisible);
    return () => { clearInterval(id); document.removeEventListener('visibilitychange', onVisible); };
  }, [fetchPrice]);
  useEffect(() => {
    let cancelled = false;
    const controller = new AbortController();
    const loadHistoricalPrices = async () => {
      setHistoricalPriceLoading(true);
      const today = dayKeyUTC(Date.now());
      const cached = (() => {
        try { return JSON.parse(localStorage.getItem(HISTORICAL_PRICE_CACHE_KEY)||'{}'); }
        catch { return {}; }
      })();
      // Without transactions, still fetch full BTC history so the MA chart can stay live.
      // Coinbase has no BTC-USD candles before its first one. The floor used to be 2014-01-01,
      // and the gap-filler back-filled those 18 months with the first real close, so 2014
      // transactions were valued at mid-2015 prices and the 200-week MA began on a flat,
      // fabricated stretch. Days before the floor are now simply absent, and fabricated
      // values left in older caches are dropped.
      for(const day of Object.keys(cached)) if(day < BTC_USD_FIRST_CANDLE_DAY) delete cached[day];
      const baseStart = firstTransactionDate || BTC_USD_FIRST_CANDLE_DAY;
      const maLookbackDate = addDaysUTC(baseStart, -1400);
      const dataStart = maLookbackDate < BTC_USD_FIRST_CANDLE_DAY ? BTC_USD_FIRST_CANDLE_DAY : maLookbackDate;
      const requiredDays = listDaysUTC(dataStart, today);
      const refreshStart = addDaysUTC(today, -2);
      const firstMissingDay = requiredDays.find(day => cached[day]===undefined);
      const fetchStart = firstMissingDay && firstMissingDay < refreshStart ? firstMissingDay : refreshStart > dataStart ? refreshStart : dataStart;

      // Retry only what's worth retrying: rate limits, server errors, network blips.
      const fetchWithRetry = async (url) => {
        let delay = 1000;
        for(let attempt = 0; attempt < 3; attempt++) {
          if(cancelled) throw new DOMException('cancelled', 'AbortError');
          try {
            const r = await fetch(url, { signal: controller.signal });
            if(r.ok) return r;
            if(r.status !== 429 && r.status < 500) throw new Error('http_' + r.status); // don't retry a real 4xx
            const retryAfter = parseFloat(r.headers.get('Retry-After'));
            const wait = Number.isFinite(retryAfter) ? retryAfter * 1000 : delay + Math.random() * 250;
            if(attempt === 2) throw new Error('http_' + r.status);
            await new Promise(res => setTimeout(res, wait));
            delay *= 2;
          } catch(e) {
            if(e?.name === 'AbortError') throw e;
            if(attempt === 2) throw e;
            await new Promise(res => setTimeout(res, delay + Math.random() * 250));
            delay *= 2;
          }
        }
        throw new Error('unreachable');
      };

      let merged = {...cached};
      let lastGoodDay = null;   // end of the contiguous run we actually fetched
      let partial = false;
      try {
        for(let cursor = fetchStart; cursor <= today; cursor = addDaysUTC(cursor, 300)) {
          const endExclusive = addDaysUTC(cursor, 300);
          const url = `https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=86400&start=${cursor}T00:00:00Z&end=${endExclusive}T00:00:00Z`;
          let r;
          try {
            r = await fetchWithRetry(url);
          } catch(e) {
            if(e?.name === 'AbortError') return;
            // Keep every window fetched so far instead of discarding the lot. The existing
            // firstMissingDay scan resumes from the hole on the next run.
            console.warn('Historical price window failed, keeping partial data:', e.message || e);
            partial = true;
            break;
          }
          const candles = await r.json();
          candles.forEach(row => {
            const [time,,,,close] = row;
            merged[dayKeyUTC(time*1000)] = close;
          });
          // The window ends the day BEFORE endExclusive. Recording endExclusive itself let the
          // gap-filler invent a price for a day never fetched — and, now looking present,
          // firstMissingDay never came back for it.
          const lastFetched = addDaysUTC(endExclusive, -1);
          lastGoodDay = lastFetched < today ? lastFetched : today;
        }
        if(cancelled) return;
        // Gap-fill ONLY the contiguous prefix. Forward-filling past the hole would make the
        // missing days look present, and firstMissingDay would never find them again.
        const fillEnd = partial ? (lastGoodDay || dataStart) : today;
        if(fillEnd > dataStart) merged = fillDailyPriceGaps(merged, dataStart, fillEnd);
        setHistoricalPrices(merged);
        safeSetItem(HISTORICAL_PRICE_CACHE_KEY, JSON.stringify(merged));
        if(partial) showToast('BTC price history is incomplete — will finish next time you open the app', 5000);
      } catch(e) {
        if(e?.name === 'AbortError' || cancelled) return;
        console.error('Historical price fetch failed:', e);
        showToast('Could not fetch BTC price history');
      } finally {
        if(!cancelled) setHistoricalPriceLoading(false);
      }
    };
    loadHistoricalPrices();
    return () => { cancelled = true; controller.abort(); };
    // transactions.length is deliberately NOT a dependency. It made every add and delete
    // re-run this whole effect — thousands of Date allocations, a network request, and a
    // ~100KB localStorage rewrite — to fetch data that hadn't changed. priceRefreshTick below
    // is the explicit daily refresh that replaces that accidental trigger.
  }, [firstTransactionDate, priceRefreshTick]);

  // Explicit refresh for historical prices: every 6 hours, and on returning to a tab that has
  // been idle longer than that. Without this, dropping transactions.length from the deps above
  // would mean the moving-average chart never picked up new days.
  useEffect(() => {
    const SIX_HOURS = 6 * 60 * 60 * 1000;
    const maybeRefresh = () => {
      if(Date.now() - lastPriceHistoryFetchRef.current < SIX_HOURS) return;
      lastPriceHistoryFetchRef.current = Date.now();
      setPriceRefreshTick(t => t + 1);
    };
    const id = setInterval(maybeRefresh, 30 * 60 * 1000);
    const onVisible = () => { if(document.visibilityState === 'visible') maybeRefresh(); };
    document.addEventListener('visibilitychange', onVisible);
    return () => { clearInterval(id); document.removeEventListener('visibilitychange', onVisible); };
  }, []);

  // ─── Google Drive Sync ────────────────────────────────────────────────────
  // The single place a Drive payload becomes local state + storage. This logic used to be
  // copy-pasted at four call sites, which meant four copies of every bug in it.
  const applyRemotePayload = useCallback((remote, { stash = false } = {}) => {
    if(!remote || typeof remote !== 'object') return false;
    const remoteTxs = Array.isArray(remote.transactions)
      ? ensureTxIds(sanitizeStoredTransactions(remote.transactions))
      : null;
    const remoteWals = Array.isArray(remote.wallets) ? remote.wallets : null;
    const hasVaultKey = Object.prototype.hasOwnProperty.call(remote, 'vault');
    if(!remoteTxs && !remoteWals && !hasVaultKey && !remote.settings) return false;
    if(stash) { stashPreSyncSnapshot(); setSnapshotNonce(n => n+1); }
    // An absent array means "this payload says nothing about transactions", so local is left
    // alone. Writing JSON.stringify(undefined) previously stored the literal string
    // "undefined", which threw on the next load and silently emptied the portfolio.
    // `stored` tracks whether every key landed. Same commit-marker rule as save(): a partial
    // write must not be stamped as if it were the remote revision, or the next edit would
    // push the stale leftovers over Drive believing they were current.
    let stored = true;
    if(remoteTxs) { setTransactions(remoteTxs); stored = safeSetItem('btc-tx-v2', JSON.stringify(remoteTxs)) && stored; }
    if(remoteWals) { setWallets(remoteWals); stored = safeSetItem('btc-wallets', JSON.stringify(remoteWals)) && stored; }
    if(hasVaultKey) {
      setVault(remote.vault || null);
      if(remote.vault) stored = safeSetItem(VAULT_STORAGE_KEY, JSON.stringify(remote.vault)) && stored;
      else localStorage.removeItem(VAULT_STORAGE_KEY);
      lockVault();
    }
    if(remote.settings) {
      const normalized = normalizeSettings(keepLocalViewSettings(remote.settings, settingsRef.current));
      settingsRef.current = normalized;
      setSettings(normalized);
      stored = safeSetItem('btc-settings', JSON.stringify(normalized)) && stored;
    }
    if(!stored) {
      // The screen shows the remote copy; storage may not. The local stamp and seen-revision
      // stay old so the next launch pulls again rather than trusting storage. The dirty
      // marker IS cleared — what was pending has been superseded by the copy now on screen,
      // and leaving it would make the next launch push the stale leftovers over Drive.
      pendingPushRef.current = null;
      localStorage.removeItem('btc-pending-push');
      showToast('⚠ Browser storage is full — the Google Drive copy is shown but could not be saved on this device. Export a backup, then clear space.', 10000);
      return true;
    }
    if(remote.lastModified) safeSetItem('btc-last-modified', remote.lastModified);
    // Record which Drive revision local now matches, and clear the dirty marker — whatever
    // was pending has just been superseded by the remote copy the user chose to accept.
    if(remote._driveModifiedTime) safeSetItem('btc-drive-seen-mtime', remote._driveModifiedTime);
    pendingPushRef.current = null;
    localStorage.removeItem('btc-pending-push');
    return true;
  }, [lockVault]);

  // Live mirrors so the sync helpers below can stay referentially stable (they're captured by
  // the mount-once auto-reconnect effect, which must not see first-render data).
  const transactionsRef = useRef(transactions); transactionsRef.current = transactions;
  const walletsRef = useRef(wallets); walletsRef.current = wallets;
  const vaultRef = useRef(vault); vaultRef.current = vault;

  // Another tab of this app committed a write. Without this, a second tab kept its stale
  // in-memory lists, and its next save overwrote localStorage — then pushed that over Drive
  // with no conflict, because both tabs share btc-drive-seen-mtime. The `storage` event only
  // fires in OTHER tabs, and btc-last-modified is the commit marker save() writes last, so
  // by the time it changes the data keys are complete.
  useEffect(() => {
    const onStorage = (e) => {
      if(e.storageArea !== localStorage) return;
      const dataChanged = e.key === 'btc-last-modified' || e.key === null;
      if(dataChanged) {
        setTransactions(ensureTxIds(sanitizeStoredTransactions(loadStoredArray('btc-tx-v2', []))));
        setWallets(loadStoredArray('btc-wallets', []));
        let storedVault = null;
        try { const s = localStorage.getItem(VAULT_STORAGE_KEY); storedVault = s ? JSON.parse(s) : null; } catch {}
        if(JSON.stringify(storedVault) !== JSON.stringify(vaultRef.current ?? null)) {
          setVault(storedVault);
          lockVault();
        }
        // This tab's queued payload predates what the other tab just wrote (which already
        // includes our earlier saves, since it was loaded from storage too). The writing tab
        // owns the push now; ours would only send older data.
        pendingPushRef.current = null;
        if(syncDebounce.current) { clearTimeout(syncDebounce.current); syncDebounce.current = null; }
        showToast('Updated with changes made in another tab');
      }
      if(dataChanged || e.key === 'btc-settings') {
        try {
          const s = localStorage.getItem('btc-settings');
          if(s) { const next = normalizeSettings(JSON.parse(s)); settingsRef.current = next; setSettings(next); }
        } catch {}
      }
    };
    window.addEventListener('storage', onStorage);
    return () => window.removeEventListener('storage', onStorage);
  }, [lockVault]);

  // Push local state up immediately (no debounce) and record the resulting Drive revision.
  // Passes no expectedModifiedTime: the caller has already decided local wins.
  const pushLocalToDrive = useCallback(async (successMessage) => {
    const settingsData = (() => { try { return JSON.parse(localStorage.getItem('btc-settings')||'{}'); } catch { return {}; } })();
    const mod = nextCommitStamp();
    await GDriveSync.push({
      transactions: transactionsRef.current,
      wallets: walletsRef.current,
      settings: settingsData,
      vault: vaultRef.current,
      lastModified: mod,
    });
    safeSetItem('btc-last-modified', mod);
    // This pushed the full current state, so anything still queued is superseded — and must
    // not fire later carrying an older stamp than the one just written.
    pendingPushRef.current = null;
    if(syncDebounce.current) { clearTimeout(syncDebounce.current); syncDebounce.current = null; }
    if(retryTimerRef.current) { clearTimeout(retryTimerRef.current); retryTimerRef.current = null; }
    localStorage.removeItem('btc-pending-push');
    if(successMessage) showToast(successMessage);
  }, []);

  // What actually differs between this device and Drive. The dialog used to report transaction
  // counts and nothing else, so a divergence confined to wallets, preferences, or the vault
  // rendered as "47 here, 47 on Drive" — a prompt that reads like a no-op while one side is
  // about to be discarded. A wallet added on the other device looked exactly like nothing.
  const describeSyncDifference = useCallback((remote) => {
    const rows = [];
    const localTxs = transactionsRef.current || [];
    const remoteTxs = Array.isArray(remote?.transactions) ? remote.transactions : [];
    if(localTxs.length !== remoteTxs.length) {
      rows.push({ label:'Transactions', local:String(localTxs.length), remote:String(remoteTxs.length) });
    }
    const localWals = walletsRef.current || [];
    const remoteWals = Array.isArray(remote?.wallets) ? remote.wallets : [];
    const nameOf = w => String(w?.name||'').trim();
    const localNames = new Set(localWals.map(nameOf).filter(Boolean));
    const remoteNames = new Set(remoteWals.map(nameOf).filter(Boolean));
    const onlyLocal = [...localNames].filter(n => !remoteNames.has(n));
    const onlyRemote = [...remoteNames].filter(n => !localNames.has(n));
    if(onlyLocal.length || onlyRemote.length || localWals.length !== remoteWals.length) {
      rows.push({
        label: 'Wallets',
        local: `${localWals.length}${onlyLocal.length ? ` — only here: ${onlyLocal.join(', ')}` : ''}`,
        remote: `${remoteWals.length}${onlyRemote.length ? ` — only on Drive: ${onlyRemote.join(', ')}` : ''}`,
      });
    }
    const localVault = !!vaultRef.current, remoteVault = !!remote?.vault;
    if(localVault !== remoteVault) {
      rows.push({ label:'Vault', local: localVault?'present':'none', remote: remoteVault?'present':'none' });
    }
    let settingsDiffer = false;
    try {
      const localSet = withoutViewSettings(normalizeSettings(JSON.parse(localStorage.getItem('btc-settings')||'{}')));
      const remoteSet = withoutViewSettings(normalizeSettings(remote?.settings || {}));
      settingsDiffer = stableStringify(localSet) !== stableStringify(remoteSet);
    } catch { settingsDiffer = true; }
    if(settingsDiffer) rows.push({ label:'Preferences', local:'differ', remote:'differ' });
    return rows;
  }, []);

  // Both sides changed independently. Make it the user's call instead of letting a clock
  // comparison silently discard one device's work.
  const resolveSyncConflict = useCallback((remote) => {
    setSyncState('error');
    const remoteWhen = remote.lastModified ? new Date(remote.lastModified).toLocaleString() : 'unknown time';
    const rows = describeSyncDifference(remote);
    const remoteTxCount = Array.isArray(remote.transactions) ? remote.transactions.length : 0;
    setConfirmDialog({
      title: 'Sync Conflict',
      message: `This device has changes that never reached Google Drive, and Drive was last written ${remoteWhen} from another device. Choose which copy to keep — a recovery snapshot of this device's data is saved either way, under Export → Backup & Restore.`,
      details: rows,
      detailsEmptyText: 'No differences detected between the two copies — either choice should be safe.',
      confirmLabel: 'Use Google Drive copy',
      cancelLabel: 'Keep this device',
      danger: true,
      confirmIcon: false,
      dismissible: false, // both buttons are real decisions; there is no safe dismiss
      onConfirm: () => {
        setConfirmDialog(null);
        applyRemotePayload(remote, { stash: true });
        setSyncState('synced');
        setLastSync(new Date());
        showToast(`Using the Google Drive copy — ${remoteTxCount} transactions. Your previous local data is recoverable under Export.`, 9000);
      },
      onCancel: async () => {
        setConfirmDialog(null);
        stashPreSyncSnapshot();
        setSnapshotNonce(n => n+1);
        setSyncState('syncing');
        try {
          const localTxCount = (transactionsRef.current||[]).length;
          await pushLocalToDrive(`Kept this device's ${localTxCount} transaction${localTxCount===1?'':'s'} and overwrote Google Drive`);
          setSyncState('synced');
          setLastSync(new Date());
        } catch { setSyncState('error'); showToast('Could not overwrite Google Drive'); }
      },
    });
  }, [applyRemotePayload, pushLocalToDrive, describeSyncDifference]);

  const preloadGsi = () => GDriveSync.loadScript();
  const handleSignIn = useCallback(async () => {
    try {
      const ready = await GDriveSync.init();
      if(!ready) { showToast('Google Sign-In failed to load'); return; }
      await GDriveSync.requestToken(true);
      setSyncState('syncing');
      // Get user info
      try {
        const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: { 'Authorization': 'Bearer ' + GDriveSync.accessToken }
        });
        const info = await r.json();
        setSyncUser({ email: info.email, name: info.name });
        localStorage.setItem('btc-sync-user', JSON.stringify({ email: info.email, name: info.name }));
      } catch(e) {}
      localStorage.setItem('btc-sync-enabled', 'true');
      // Pull from Drive
      const remote = await GDriveSync.pull();
      const localTxCount = transactions.length;
      const remoteTxCount = remote?.transactions?.length || 0;
      const localHasData = localTxCount > 0 || wallets.length > 0 || !!vault;
      const remoteHasData = !!remote && (remoteTxCount > 0 || (remote?.wallets?.length||0) > 0 || !!remote?.vault);

      if(remote && (Array.isArray(remote.transactions) || remote.vault)) {
        const localMod = localStorage.getItem('btc-last-modified') || '0';
        const remoteMod = remote.lastModified || '0';
        const localIsEmpty = !localHasData;
        const remoteIsEmpty = !remoteHasData;

        // Did this device have an unpushed edit, and has Drive moved on since we last saw it?
